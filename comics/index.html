<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Cave — Comic Book Vault</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171c; --panel:#1c2028; --panel2:#242a34;
  --ink:#f0ece4; --ink-dim:#b0a898; --ink-faint:#7a7268;
  --accent:#e8c840; --accent-soft:#f0d868;
  --red:#c04040; --red-soft:#d06060;
  --blue:#4088d0; --blue-soft:#60a0e0;
  --line:rgba(240,236,228,.12);
  --ok:#7da87b; --warn:#e8c840; --urgent:#c04040;
  --marvel:#e04040; --dc:#2060c0; --image:#f08020;
  --fire:#e8a020;
  --grail:#c9a227;
  --nm:#7da87b; --vf:#60a0e0; --fn:#e8c840; --vg:#d4842a; --gd:#c04040;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; min-height:100vh;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
.mono{font-family:"IBM Plex Mono",monospace}
.comic{font-family:"Bangers",cursive}
.tbd{color:var(--ink-faint); font-style:italic}

/* ---------- header ---------- */
header{
  padding:18px 16px 12px; border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
}
header h1{
  font-family:"Bangers",cursive; font-size:28px;
  letter-spacing:.04em; color:var(--accent);
}
header h1 em{font-style:normal; color:var(--red-soft)}
.book-count{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-faint)}

/* ---------- tab bar ---------- */
nav{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:var(--panel); border-top:1px solid var(--line);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; background:none; border:none; color:var(--ink-faint);
  font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em;
  text-transform:uppercase; padding:14px 4px 12px; cursor:pointer;
}
nav button.active{color:var(--ink)}
nav button.active span{border-bottom:2px solid var(--accent); padding-bottom:4px}
nav button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

/* ---------- controls ---------- */
.toolbar{padding:12px 16px; display:flex; gap:8px; flex-wrap:wrap}
.toolbar input[type=search]{
  flex:1 1 100%; background:var(--panel); border:1px solid var(--line); border-radius:4px;
  color:var(--ink); padding:9px 12px; font-size:15px;
}
.toolbar select{
  flex:1; background:var(--panel); border:1px solid var(--line); border-radius:4px;
  color:var(--ink-dim); padding:9px 8px; font-size:13px; min-width:0;
}
.toolbar .toggle-btn{
  flex:none; background:var(--panel); border:1px solid var(--line); border-radius:4px;
  color:var(--ink-dim); padding:9px 12px; font-size:12.5px; font-family:"IBM Plex Mono",monospace;
  cursor:pointer;
}
.toolbar .toggle-btn.on{color:var(--accent); border-color:var(--accent)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px;
}

/* ---------- filter bar ---------- */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0}
.filter-trigger{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;
  padding:5px 10px;border:1px solid var(--line);border-radius:14px;
  color:var(--ink-faint);cursor:pointer;white-space:nowrap;background:none;
  transition:all .15s;display:inline-flex;align-items:center;gap:4px;
}
.filter-trigger.active{color:var(--ink);border-color:var(--ink);background:rgba(255,255,255,.06)}
.filter-trigger .ft-badge{
  font-size:9px;background:var(--red);color:#fff;border-radius:6px;
  min-width:14px;height:14px;display:inline-flex;align-items:center;
  justify-content:center;padding:0 3px;
}

/* ---------- comic cards ---------- */
.list{padding:0 16px}
.list-heading{
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-faint); padding:14px 0 8px;
}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:6px;
  margin-bottom:12px; overflow:hidden; cursor:pointer;
}
.card-top{display:flex; gap:12px; padding:12px}
.thumb{
  width:64px; height:96px; flex:none; border-radius:3px; object-fit:cover;
  background:var(--panel2); border:1px solid var(--line);
}
.thumb.empty{
  display:flex; align-items:center; justify-content:center;
  font-family:"Bangers",cursive; font-size:28px; color:var(--ink-faint);
}
.card-info{flex:1; min-width:0}
.comic-title{
  font-family:"Bangers",cursive; font-size:19px; line-height:1.2;
  letter-spacing:.02em;
}
.comic-sub{font-size:12.5px; color:var(--ink-dim); margin-top:2px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
.chip{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.04em;
  padding:2px 7px; border:1px solid var(--line); border-radius:3px; color:var(--ink-dim);
}
.chip.issue{color:var(--accent); border-color:var(--accent); font-weight:600}
.chip.key{color:var(--warn); border-color:var(--warn)}
.chip.fire{color:var(--fire);border-color:var(--fire);text-shadow:0 0 6px rgba(232,160,32,.4)}
.chip.marvel{color:var(--marvel)}
.chip.dc{color:var(--dc)}
.chip.image{color:var(--image)}
.chip.grade-candidate{color:var(--grail);border-color:var(--grail)}
.chip.graded{color:var(--ok);border-color:var(--ok)}
.chip.condition{color:var(--ink-dim)}
.chip.condition.nm{color:var(--nm)} .chip.condition.vf{color:var(--vf)}
.chip.condition.fn{color:var(--fn)} .chip.condition.vg{color:var(--vg)}
.chip.condition.gd,.chip.condition.fr,.chip.condition.pr{color:var(--gd)}
.chip.box{color:var(--accent);border-color:var(--accent);font-weight:600}

/* drank/sold/gifted styling */
.card.sold{opacity:.45;filter:grayscale(.6)}
.card.gifted{opacity:.55;filter:sepia(.2)}

/* ---------- value band (the signature) ---------- */
.vband-wrap{padding:0 12px 11px}
.vband-labels{
  display:flex; justify-content:space-between;
  font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-faint);
  margin-bottom:4px;
}
.vband-status{text-transform:uppercase; letter-spacing:.08em}
.vband-status.no-data{color:var(--ink-faint)}
.vband-status.low{color:var(--ink-faint)}
.vband-status.moderate{color:var(--vf)}
.vband-status.strong{color:var(--accent)}
.vband-status.exceptional{color:var(--fire)}
.vband-status.slabbed{color:var(--ok)}
.vband{
  position:relative; height:6px; border-radius:3px; background:var(--panel2);
  overflow:visible;
}
.vband-fill{
  position:absolute; top:0; bottom:0; border-radius:3px;
  background:linear-gradient(90deg, var(--vf) 0%, var(--accent) 50%, var(--fire) 100%);
  opacity:.85;
}
.vband-marker{
  position:absolute; top:-3px; width:2px; height:12px; background:var(--ink);
  border-radius:1px;
}
.vband-marker.cost{background:var(--red-soft);opacity:.7}

/* ---------- empty state ---------- */
.empty-state{
  text-align:center; padding:56px 32px; color:var(--ink-dim);
}
.empty-state .comic{font-size:22px; margin-bottom:8px; color:var(--ink)}

/* ---------- forms ---------- */
.sheet{padding:16px}
.sheet h2{
  font-family:"Bangers",cursive; font-size:26px; margin-bottom:16px;
  letter-spacing:.03em;
}
.field{margin-bottom:14px}
.field label{
  display:block; font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); margin-bottom:5px;
}
.field input,.field select,.field textarea{
  width:100%; background:var(--panel); border:1px solid var(--line); border-radius:4px;
  color:var(--ink); padding:10px 12px; font-size:15px; font-family:inherit;
}
@keyframes needs-attention{
  0%,100%{border-color:var(--accent); box-shadow:0 0 0 0 rgba(232,200,64,.0)}
  50%{border-color:var(--accent); box-shadow:0 0 8px 2px rgba(232,200,64,.25)}
}
.field input.needs-att,.field select.needs-att,.field textarea.needs-att{
  animation:needs-attention 2s ease-in-out 3;
  border-color:var(--accent);
}
.field .att-dot{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--accent); margin-left:6px; vertical-align:middle;
}
.field textarea{min-height:64px; resize:vertical}
.field.checkrow{display:flex; align-items:center; gap:8px}
.field.checkrow input{width:auto}
.field.checkrow label{margin:0; text-transform:none; font-size:14px; color:var(--ink)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}

.photo-zone{
  border:1px dashed var(--ink-faint); border-radius:6px; padding:18px;
  text-align:center; color:var(--ink-dim); cursor:default; margin-bottom:14px;
  background:var(--panel);
}
.photo-zone img{max-width:120px; max-height:180px; border-radius:4px; display:block; margin:0 auto 10px}
.photo-btn{
  display:block; position:relative; padding:11px; margin:8px auto 0; max-width:280px;
  background:var(--panel2); border:1px solid var(--ink-faint); border-radius:5px;
  color:var(--ink); font-size:14px; cursor:pointer; text-align:center; overflow:hidden;
}
.photo-btn.ghost{background:none; color:var(--ink-dim); border-color:var(--line)}
.photo-btn input{
  position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:0;
}

.btn{
  display:block; width:100%; padding:13px; border-radius:5px; border:none;
  font-size:15px; font-weight:600; cursor:pointer; margin-bottom:10px;
}
.btn-primary{background:var(--accent); color:#14171c}
.btn-ghost{background:none; border:1px solid var(--line); color:var(--ink-dim)}
.btn-danger{background:none; border:1px solid var(--urgent); color:var(--urgent)}

/* ---------- detail view ---------- */
.detail-photo{width:100%; max-height:400px; object-fit:contain; background:var(--panel); border-radius:6px; margin-bottom:14px}
.detail-name{font-family:"Bangers",cursive; font-size:28px; line-height:1.15; letter-spacing:.03em}
.detail-sub{color:var(--ink-dim); margin:4px 0 14px}
.spec{
  display:grid; grid-template-columns:110px 1fr; gap:6px 14px;
  padding:14px 0; border-top:1px solid var(--line); font-size:14px;
}
.spec dt{font-family:"IBM Plex Mono",monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); padding-top:2px}
.spec dd{color:var(--ink)}

/* ---------- settings / sync ---------- */
.note{font-size:12.5px; color:var(--ink-faint); margin-top:5px; line-height:1.5}
.sync-status{
  font-family:"IBM Plex Mono",monospace; font-size:12px; padding:10px 12px;
  border:1px solid var(--line); border-radius:4px; color:var(--ink-dim);
  margin-bottom:14px; white-space:pre-wrap; word-break:break-word;
}
.section-rule{border:none; border-top:1px solid var(--line); margin:22px 0}

details.collapse{margin:18px 0}
details.collapse summary{
  font-family:"IBM Plex Mono",monospace; font-size:11px; text-transform:uppercase;
  letter-spacing:.08em; color:var(--ink-faint); cursor:pointer; padding:10px 0;
  list-style:none; display:flex; align-items:center; gap:6px;
}
details.collapse summary::-webkit-details-marker{display:none}
details.collapse summary::before{content:"▸"; font-size:10px; transition:transform .15s}
details.collapse[open] summary::before{transform:rotate(90deg)}
details.collapse .collapse-body{padding:12px 0 0}

.history-last{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  padding:6px 0; font-size:13px;
}
.history-list{list-style:none; padding:0; margin:0}
.history-list li{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;
}
.history-list li:last-child{border-bottom:none}
.hist-type{
  font-family:"IBM Plex Mono",monospace; font-size:10px; text-transform:uppercase;
  letter-spacing:.06em; padding:2px 6px; border-radius:3px; flex:none;
}
.hist-type.pull{background:rgba(125,168,123,.15); color:var(--ok)}
.hist-type.push{background:rgba(192,64,64,.15); color:var(--urgent)}
.hist-detail{color:var(--ink-dim); flex:1; min-width:0}
.hist-time{color:var(--ink-faint); font-size:11px; font-family:"IBM Plex Mono",monospace; flex:none; text-align:right}

.changelog{list-style:none; padding:0; margin:0}
.changelog li{padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; line-height:1.5}
.changelog li:last-child{border-bottom:none}
.cl-ver{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--accent); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:3px}
.cl-title{color:var(--ink); font-weight:600}
.cl-desc{color:var(--ink-dim); font-size:12.5px}

/* ---------- detail back & qty controls ---------- */
.back-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.back-row button{background:none;border:none;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:13px;cursor:pointer;padding:4px 0}
.back-row button:hover{color:var(--ink)}
.qty-row{display:flex;align-items:center;gap:12px;margin:14px 0}
.qty-btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;color:var(--ink);width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-btn:active{background:var(--accent);border-color:var(--accent);color:#14171c}
.qty-display{font-family:"IBM Plex Mono",monospace;font-size:18px;min-width:32px;text-align:center}
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat-pill{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:12px;color:var(--ink-dim)}
.stat-pill .n{color:var(--ink);font-weight:500}
.tab-badge{font-size:9px;background:var(--red);color:#fff;border-radius:8px;padding:1px 5px;margin-left:3px;vertical-align:top}
.toolbar select.sort{flex:1 1 100%;font-size:12px;color:var(--ink-faint)}

/* ---------- fire tier picker ---------- */
.fire-tier-picker{display:flex;gap:0;flex-wrap:wrap}
.fire-tier-btn{background:var(--panel);border:1px solid var(--line);color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:11px;padding:8px 10px;cursor:pointer;white-space:nowrap}
.fire-tier-btn:first-child{border-radius:4px 0 0 4px}
.fire-tier-btn:last-child{border-radius:0 4px 4px 0}
.fire-tier-btn.active{color:var(--fire);border-color:var(--fire);background:rgba(232,160,32,.1)}

/* ---------- condition picker ---------- */
.condition-picker{display:flex;gap:0;flex-wrap:wrap}
.condition-btn{background:var(--panel);border:1px solid var(--line);color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:11px;padding:8px 10px;cursor:pointer;white-space:nowrap}
.condition-btn:first-child{border-radius:4px 0 0 4px}
.condition-btn:last-child{border-radius:0 4px 4px 0}
.condition-btn.active{border-color:var(--ink);color:var(--ink);background:rgba(255,255,255,.08)}

/* ---------- grading value box ---------- */
.grade-box{
  border:1px solid var(--grail);border-radius:6px;padding:14px;
  margin:14px 0;background:rgba(201,162,39,.06);
}
.grade-box h3{font-family:"IBM Plex Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--grail);margin-bottom:10px}
.grade-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:14px}
.grade-row .label{color:var(--ink-dim);font-size:12px}
.grade-row .val{font-family:"IBM Plex Mono",monospace;font-weight:500}
.grade-row .val.up{color:var(--ok)} .grade-row .val.down{color:var(--red)}

/* ---------- stats ---------- */
.stat-section-label{
  font-family:"IBM Plex Mono",monospace; font-size:11px; text-transform:uppercase;
  letter-spacing:.1em; color:var(--ink-faint); padding:20px 0 10px;
}
.bar-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.bar-label{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-dim);min-width:60px;text-align:right}
.bar-track{flex:1;height:12px;background:var(--panel2);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .3s}
.bar-val{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-dim);min-width:28px}

/* ---------- value ticker ---------- */
.ticker-item{
  display:flex;align-items:center;gap:12px;padding:12px;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.ticker-item:last-child{border-bottom:none}
.ticker-name{flex:1;min-width:0}
.ticker-title{font-family:"Bangers",cursive;font-size:15px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker-sub{font-size:11px;color:var(--ink-dim)}
.ticker-val{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:13px}
.ticker-change{font-size:11px}
.ticker-change.up{color:var(--ok)} .ticker-change.down{color:var(--red)}

/* ---------- inline price ---------- */
.inline-price{display:flex;align-items:center;gap:8px}
.inline-price input{background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:6px 10px;font-size:14px;width:140px}
.inline-price button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;color:var(--ink-dim);padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.inline-price button:active{background:var(--accent);color:#14171c}

/* ---------- shelf chips ---------- */
.shelf-bar{display:flex;gap:4px;overflow-x:auto;padding:2px 0;-webkit-overflow-scrolling:touch}
.shelf-chip{
  font-family:"IBM Plex Mono",monospace;font-size:11px;padding:4px 8px;
  border:1px solid var(--line);border-radius:10px;color:var(--ink-faint);
  cursor:pointer;white-space:nowrap;background:none;flex:none;
}
.shelf-chip.active{color:var(--accent);border-color:var(--accent);background:rgba(232,200,64,.08)}
.shelf-chip .sc-count{font-size:9px;opacity:.6;margin-left:2px}
</style>
</head>
<body>
<header>
  <h1 class="comic">The <em>Cave</em></h1>
  <span class="book-count mono" id="count"></span>
</header>
<div id="view"></div>
<nav>
  <button data-tab="collection" class="active"><span>Collection</span></button>
  <button data-tab="hot"><span>🔥 Hot</span></button>
  <button data-tab="add"><span>+ Add</span></button>
  <button data-tab="stats"><span>Stats</span></button>
  <button data-tab="value"><span>📈 Value</span></button>
  <button data-tab="sync"><span>Sync</span></button>
</nav>

<script>
/* ================= state ================= */
const LS_COMICS = "cave.comics.v1";
const LS_CFG    = "cave.comics.config.v1";
const LS_HIST   = "cave.comics.synchistory.v1";
let comics = JSON.parse(localStorage.getItem(LS_COMICS) || "[]");
let cfg    = JSON.parse(localStorage.getItem(LS_CFG)   || "{}");
let tab = "collection";
let editingId = null;
let detailId = null;
let collectionScrollY = 0;
let searchQ = "", pubFilter = "", sortBy = "title", collectionView = "cave";
let filters = {fire:false, key:false, graded:false, gradeCandidate:false, raw:false};
let boxFilters = new Set();
let valueSort = "change-desc";

/* ---- IndexedDB photo store (avoids localStorage quota) ---- */
const IDB_NAME = "cave-comics-photos";
const IDB_STORE = "photos";
let _idb = null;
function openPhotoDB(){
  if(_idb) return Promise.resolve(_idb);
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(IDB_STORE);
    req.onsuccess = ()=>{ _idb = req.result; resolve(_idb); };
    req.onerror = ()=> reject(req.error);
  });
}
async function savePhoto(id, dataUrl){
  const db = await openPhotoDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(dataUrl, id);
    tx.oncomplete = resolve; tx.onerror = ()=> reject(tx.error);
  });
}
async function getPhoto(id){
  const db = await openPhotoDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(id);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);
  });
}
async function deletePhoto(id){
  const db = await openPhotoDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = resolve; tx.onerror = ()=> reject(tx.error);
  });
}

/* normalise AI publisher strings to match PUBLISHERS select options */
function normalisePub(raw){
  if(!raw) return "";
  const s = raw.trim();
  const lo = s.toLowerCase().replace(/[^a-z0-9! ]/g,"");
  const map = {
    "marvel":"Marvel","marvel comics":"Marvel","marvel entertainment":"Marvel",
    "dc":"DC","dc comics":"DC","detective comics":"DC",
    "image":"Image","image comics":"Image",
    "dark horse":"Dark Horse","dark horse comics":"Dark Horse",
    "idw":"IDW","idw publishing":"IDW",
    "boom":"Boom!","boom studios":"Boom!","boom! studios":"Boom!",
    "valiant":"Valiant","valiant comics":"Valiant","valiant entertainment":"Valiant",
  };
  if(map[lo]) return map[lo];
  /* partial match — e.g. "Marvel" inside "Marvel Comics Group" */
  for(const p of PUBLISHERS){ if(lo.includes(p.toLowerCase().replace(/[^a-z0-9! ]/g,""))) return p; }
  return s; /* return original if no match — user can pick manually */
}

/* ================= helpers ================= */
function fireLevel(c){ const f = c.fire; if(f === true) return 1; return parseInt(f)||0; }
function isFire(c){ return fireLevel(c) > 0; }
function fireEmoji(c){ return "🔥".repeat(fireLevel(c)); }
function fireLabel(c){ return ["","Notable","Key Issue","Grail"][fireLevel(c)]||""; }
function isKey(c){ return !!(c.keyStatus); }
function isGraded(c){ return !!c.graded; }
function isGradeCandidate(c){ return !!c.gradeCandidate; }
function qtyOf(c){ const q = parseInt(c.qty); return isNaN(q) ? 1 : q; }
function isSold(c){ return qtyOf(c) <= 0 && !!c.soldDate; }
function isGifted(c){ return qtyOf(c) <= 0 && !!c.giftedTo; }
function isGone(c){ return qtyOf(c) <= 0; }

function conditionClass(c){
  const cond = (c.condition||"").toUpperCase();
  return CONDITION_COLOURS[cond] || "";
}

function parsePrice(p){
  if(!p) return null;
  const m = p.match(/\$(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : null;
}

function fmtPrice(p){
  if(!p) return "—";
  return p;
}

function getSource(c){

}

function pubClass(c){
  const p = (c.publisher||"").toLowerCase();
  if(p.includes("marvel")) return "marvel";
  if(p.includes("dc")) return "dc";

}

/* estimate era from year */
function guessEra(year){
  const y = parseInt(year);
  if(!y) return "";
  if(y <= 1956) return "Golden";
  if(y <= 1970) return "Silver";
  if(y <= 1985) return "Bronze";
  if(y <= 1991) return "Copper";
  return "Modern";
}

/* grading ROI: how much value would grading add? */
function gradingROI(c){
  const raw = parsePrice(c.marketValue) || parsePrice(c.price);
  const graded = parsePrice(c.gradedValue);
  if(!raw || !graded) return null;
  const cost = 50; /* approximate grading cost CAD */
  const gain = graded - raw - cost;
  return {raw, graded, cost, gain, pct: Math.round((gain/raw)*100)};
}

/* ================= value band (raw → graded spectrum) ================= */
function gradeROIStatus(c){
  if(isGraded(c)){
    const grade = parseFloat(c.grade)||0;
    return {cls:"slabbed", label:`Slabbed ${c.gradingCompany||"CGC"} ${grade}`};
  }
  const roi = gradingROI(c);
  if(!roi) {
    const raw = parsePrice(c.marketValue) || parsePrice(c.price);
    if(raw) return {cls:"no-data", label:"$" + raw.toLocaleString() + " raw"};
    return null; /* no data at all */
  }
  if(roi.gain >= 500) return {cls:"exceptional", label:`Grade ROI +$${roi.gain.toLocaleString()} (+${roi.pct}%)`};
  if(roi.gain >= 200) return {cls:"strong", label:`Grade ROI +$${roi.gain.toLocaleString()} (+${roi.pct}%)`};
  if(roi.gain >= 50)  return {cls:"moderate", label:`Grade ROI +$${roi.gain.toLocaleString()}`};
  if(roi.gain > 0)    return {cls:"low", label:`Grade ROI +$${roi.gain.toLocaleString()}`};
  return {cls:"low", label:"Grading not worth it"};
}

function valueBandHTML(c){
  if(isGone(c)) return "";
  const raw = parsePrice(c.marketValue) || parsePrice(c.price);
  const graded = parsePrice(c.gradedValue);
  if(!raw && !graded) return "";

  const st = gradeROIStatus(c);
  if(!st) return "";

  /* if graded (slabbed), show a simple single-value bar */
  if(isGraded(c)){
    return `<div class="vband-wrap">
      <div class="vband-labels">
        <span>🏅 ${esc((c.gradingCompany||"CGC")+" "+String(c.grade||""))}</span>
        <span class="vband-status slabbed">${raw ? "$"+raw.toLocaleString() : ""}</span>
        <span></span>
      </div>
      <div class="vband"><div class="vband-fill" style="left:0;right:0;background:var(--ok);opacity:.5"></div></div>
    </div>`;
  }

  /* raw only, no graded estimate */
  if(!graded){
    return `<div class="vband-wrap">
      <div class="vband-labels">
        <span>$${raw.toLocaleString()}</span>
        <span class="vband-status no-data">Raw · no graded est.</span>
        <span>?</span>
      </div>
      <div class="vband"><div class="vband-fill" style="left:0;width:30%;background:var(--vf);opacity:.4"></div></div>
    </div>`;
  }

  /* full band: raw → graded with grading cost marker */
  const cost = 50;
  const costPos = Math.min((raw + cost) / graded, 1); /* break-even point */

  return `<div class="vband-wrap">
    <div class="vband-labels">
      <span>$${raw.toLocaleString()} raw</span>
      <span class="vband-status ${st.cls}">${esc(st.label)}</span>
      <span>$${graded.toLocaleString()} graded</span>
    </div>
    <div class="vband">
      <div class="vband-fill" style="left:0;right:0"></div>
      <div class="vband-marker cost" style="left:calc(${(costPos*100).toFixed(1)}% - 1px)" title="Break-even after ~$${cost} grading cost"></div>
    </div>
  </div>`;
}

/* ================= images ================= */
function resizeImage(file){
  return new Promise((resolve,reject)=>{
    const blobUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const MAX = 600; /* smaller than 800 — saves ~40% memory on mobile */
      let {width:w, height:h} = img;
      if(w > MAX || h > MAX){ const r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      const ctx = c.getContext("2d");
      ctx.drawImage(img,0,0,w,h);
      const dataUrl = c.toDataURL("image/jpeg", 0.72);
      /* free memory: revoke blob, zero canvas, drop references */
      URL.revokeObjectURL(blobUrl);
      c.width = 0; c.height = 0;
      img.src = "";
      resolve(dataUrl);
    };
    img.onerror = (e) => { URL.revokeObjectURL(blobUrl); reject(e); };
    img.src = blobUrl;
  });
}

function imgToBase64(imgEl){

  c.width = imgEl.naturalWidth; c.height = imgEl.naturalHeight;

/* ================= filter count helpers ================= */
function filterCounts(baseItems){
  return {
    fire: baseItems.filter(c => isFire(c)).length,
    key: baseItems.filter(c => isKey(c)).length,
    graded: baseItems.filter(c => isGraded(c)).length,
    gradeCandidate: baseItems.filter(c => isGradeCandidate(c)).length,
    raw: baseItems.filter(c => !isGraded(c)).length,
  };
}
function boxCounts(baseItems){
  const counts = {};
  baseItems.forEach(c => {
    const loc = (c.location||"").trim();
    if(loc && loc.length <= 3){
      counts[loc.toUpperCase()] = (counts[loc.toUpperCase()]||0) + 1;
    }
  });
  return counts;
}

  if(filters.gradeCandidate) items = items.filter(isGradeCandidate);
  if(filters.raw) items = items.filter(c => !isGraded(c));
  if(boxFilters.size) items = items.filter(c => boxFilters.has((c.location||"").trim().toUpperCase()));

  /* sort */
  if(sortBy === "title") items.sort((a,b) => (a.title||"").localeCompare(b.title||"") || (a.issueNumber||"").localeCompare(b.issueNumber||"",undefined,{numeric:true}));
  else if(sortBy === "publisher") items.sort((a,b) => (a.publisher||"").localeCompare(b.publisher||"") || (a.title||"").localeCompare(b.title||""));
  else if(sortBy === "year-desc") items.sort((a,b) => (parseInt(b.year)||0) - (parseInt(a.year)||0));
  else if(sortBy === "year-asc") items.sort((a,b) => (parseInt(a.year)||0) - (parseInt(b.year)||0));
  else if(sortBy === "added") items.sort((a,b) => (b.added||"").localeCompare(a.added||""));
  else if(sortBy === "value") items.sort((a,b) => (parsePrice(b.marketValue)||parsePrice(b.price)||0) - (parsePrice(a.marketValue)||parsePrice(a.price)||0));

  const listEl = document.getElementById("card-list");
  if(!listEl) return;
  listEl.innerHTML = items.length === 0
    ? `<div class="empty-state"><div class="comic">No matches</div></div>`
    : items.map(c => cardHTML(c)).join("");
  document.querySelectorAll(".card").forEach(card => {
    card.onclick = ()=>{
      collectionScrollY = window.scrollY;
      detailId = card.dataset.id;
      tab = "detail";
      history.pushState({tab:"detail", id:detailId}, "");
      render(); window.scrollTo(0,0);
    };
  });
}

function cardHTML(c){
  const src = imgSrc(c);
  const fl = fireLevel(c);
  const gone = isGone(c);
  const sold = isSold(c);
  const gifted = isGifted(c);
  const cardClass = sold ? "card sold" : (gifted ? "card gifted" : "card");
  const condCls = conditionClass(c);

  let chips = [];
  if(c.issueNumber) chips.push(`<span class="chip issue">#${esc(c.issueNumber)}</span>`);
  if(fl) chips.push(`<span class="chip fire">${fireEmoji(c)} ${esc(fireLabel(c))}</span>`);
  if(isKey(c)) chips.push(`<span class="chip key">🔑 Key</span>`);
  if(isGraded(c)) chips.push(`<span class="chip graded">🏅 ${esc((c.gradingCompany||"CGC"))} ${esc(String(c.grade||""))}</span>`);
  else if(c.condition) chips.push(`<span class="chip condition ${condCls}">${esc(c.condition)}</span>`);
  if(isGradeCandidate(c)) chips.push(`<span class="chip grade-candidate">💎 Grade</span>`);
  if(c.location) chips.push(`<span class="chip box">${esc(c.location)}</span>`);
  if(sold) chips.push(`<span class="chip" style="color:var(--ok)">Sold</span>`);
  if(gifted) chips.push(`<span class="chip" style="color:var(--rose)">🎁 Gift</span>`);

  const pc = pubClass(c);
  const roiChip = valueBandChipHTML(c);

  return `<div class="card ${gone ? (sold ? "sold" : "gifted") : ""}" data-id="${esc(c.id)}">
    <div class="card-top">
      ${src
        ? `<img class="thumb" src="${esc(src)}" alt="" loading="lazy">`
        : `<div class="thumb empty">?</div>`}
      <div class="card-info">
        <div class="comic-title${pc?" "+pc:""}" style="${pc?`color:${PUB_COLOURS[c.publisher]||"var(--ink)"}`:""}">${esc(c.title||"Unknown")}</div>
        <div class="comic-sub">${esc([c.publisher, c.year, c.era].filter(Boolean).join(" · "))}${qtyOf(c)>1?` · ×${qtyOf(c)}`:""}</div>
        <div class="chips">${chips.join("")}${roiChip}</div>
      </div>
    </div>
    ${gone?"":valueBandHTML(c)}
  </div>`;
}

      if(fullMode){
        const fields = ["publisher","title","issueNumber","year","era","condition","variant","coverArtist","writer","characters","keyStatus","notes"];

        fields.forEach(f => { if(rec[f] && !c[f]){ c[f] = rec[f]; filled++; } });

        setTimeout(()=> render(), 1500);
      } else {
        let updates = [];
        if(rec.marketValue){ c.marketValue = rec.marketValue; updates.push("market: " + rec.marketValue); }
        if(rec.gradedValue){ c.gradedValue = rec.gradedValue; updates.push("graded: " + rec.gradedValue); }
        if(rec.gradeCandidate !== undefined){ c.gradeCandidate = rec.gradeCandidate; if(rec.gradeCandidate) updates.push("💎 grade candidate"); }

        saveComics();
        stEl.textContent = updates.length ? "✓ Updated: " + updates.join(" · ") : "✓ Values checked — no changes.";
        setTimeout(()=> render(), 1500);
      }
    }catch(e){ stEl.textContent = "✗ " + e.message; }
  };

  /* qty controls */
  document.getElementById("qty-minus").onclick = ()=>{
    const prev = qtyOf(c);

/* ================= Gemini AI ================= */
const GEMINI_MODELS = ["gemini-3.5-flash","gemini-2.5-flash","gemini-3.1-flash-lite-preview"];
async function callGemini(body, key, statusEl){
  for(let m = 0; m < GEMINI_MODELS.length; m++){
    const model = GEMINI_MODELS[m];
    for(let attempt = 0; attempt < 3; attempt++){
      const r = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,
        {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}
      );
      if(r.ok) return {r, model};
      if(r.status === 429 || r.status === 503){
        const wait = (attempt + 1) * 2;
        if(statusEl) statusEl.textContent = `Model ${model} busy — retry ${attempt+1}/3 in ${wait}s…`;
        await new Promise(ok => setTimeout(ok, wait * 1000));
        continue;
      }
      if(r.status === 404 && m < GEMINI_MODELS.length - 1) break;
      throw new Error("Gemini " + r.status + ": " + (await r.text()).slice(0,140));
    }
  }
  throw new Error("All models busy — try again in a minute.");
}

const AI_PROMPT = `You are a comic book expert and price guide assistant. Read this comic book cover photo and return ONLY a JSON object (no markdown fences, no prose) with these fields — all strings unless noted:
publisher, title (the series title, not the publisher), issueNumber (just the number), variant (cover variant description if any, empty string if standard cover), year (4-digit publication year), era (one of: Golden, Silver, Bronze, Copper, Modern), condition (estimate from the photo — one of: NM, VF, FN, VG, GD, FR, PR), coverArtist (cover artist if recognisable), writer (if known from the issue), characters (major characters featured, comma-separated),
keyStatus (what makes this a key issue if applicable — e.g. "First appearance of Venom", "Death of Superman", empty string if not a key issue),
fire (integer 0-3: 0 = regular issue, 1 = notable/sought-after cover or minor key, 2 = major key issue — significant first appearances, deaths, or events, 3 = grail — legendary books like Amazing Fantasy 15, Action Comics 1, Detective Comics 27, Incredible Hulk 181, Giant-Size X-Men 1. Be conservative: most comics are 0),
price (estimated raw market value in CANADIAN DOLLARS, formatted like '~$XX CAD (est.)' — research-grade estimate based on title, issue significance, and typical market prices for the estimated condition),
marketValue (same as price — current raw market value estimate),
gradedValue (estimated value IF graded at the condition you estimated, in CAD — e.g. a VF book graded CGC 8.0 might be worth 2-3x raw. Format: '~$XX CAD (est.)'),
gradeCandidate (boolean — true if the grading ROI seems worthwhile: the graded value minus ~$50 CAD grading cost exceeds the raw value by a meaningful margin),
gradeCandidateReason (one sentence explaining why or why not it's worth grading),
notes (brief notes about the issue — print run details, significance, notable features).
Use empty strings for anything unreadable. Be accurate on key issue status — this is critical for valuation.`;

const VALUE_PROMPT = `You are a comic book pricing expert. For this comic: {{DESC}}
Return ONLY a JSON object (no markdown fences) with:
marketValue (current raw market value in CANADIAN DOLLARS, formatted like '~$XX CAD (est.)'),
gradedValue (estimated value if professionally graded at the stated or likely condition, in CAD),
gradeCandidate (boolean — is grading ROI worthwhile after ~$50 CAD grading cost?),
gradeCandidateReason (one sentence on grading recommendation),
keyStatus (key issue status if any — first appearances, deaths, etc. Empty string if not a key).
Base on current market data, recent sales, and guide prices. Be research-grade accurate.`;

      <button type="button" class="photo-btn" id="trim-sq" style="display:none; border-color:var(--ink-dim); color:var(--ink-dim)">✂️ Trim to cover shape</button>
      <button type="button" class="photo-btn" id="identify" style="border-color:var(--accent); color:var(--accent)">✨ Identify from cover</button>
      <div class="sync-status" id="id-status" style="display:none; margin-top:8px"></div>
    </div>

    <div class="row2">
      <div class="field"><label>Publisher</label>
        <select id="f-pub">
          <option value="">— select —</option>
          ${PUBLISHERS.map(p=>`<option value="${esc(p)}"${(c.publisher||"")===p?" selected":""}>${esc(p)}</option>`).join("")}
        </select>
      </div>
      <div class="field"><label>Year</label><input id="f-year" value="${esc(c.year||"")}" placeholder="e.g. 1988" inputmode="numeric"></div>
    </div>

    <div class="field"><label>Title</label><input id="f-title" value="${esc(c.title||"")}" placeholder="e.g. The Amazing Spider-Man"></div>

    <div class="row3">
      <div class="field"><label>Issue #</label><input id="f-issue" value="${esc(c.issueNumber||"")}" placeholder="300" inputmode="numeric"></div>
      <div class="field"><label>Variant</label><input id="f-variant" value="${esc(c.variant||"")}" placeholder="e.g. 1:25"></div>
      <div class="field"><label>Era</label>
        <select id="f-era">
          <option value="">—</option>
          ${ERAS.map(e=>`<option value="${esc(e)}"${(c.era||"")===e?" selected":""}>${esc(e)}</option>`).join("")}
        </select>
      </div>
    </div>

    <div class="field">
      <label>Condition (raw estimate)</label>
      <div class="condition-picker">
        ${CONDITIONS.map(cd => `<button class="condition-btn${(c.condition||"")=== cd?" active":""}" data-cond="${esc(cd)}">${esc(cd)}</button>`).join("")}
      </div>
    </div>

    <div class="field.checkrow" style="display:flex;align-items:center;gap:8px;margin:14px 0">
      <input type="checkbox" id="f-graded" ${c.graded?"checked":""}>
      <label for="f-graded" style="font-size:14px;color:var(--ink)">Professionally graded (slabbed)</label>
    </div>
    <div id="graded-fields" style="display:${c.graded?"block":"none"}">
      <div class="row2">
        <div class="field"><label>Grading company</label>
          <select id="f-gc">
            <option value="CGC"${(c.gradingCompany||"CGC")==="CGC"?" selected":""}>CGC</option>
            <option value="CBCS"${c.gradingCompany==="CBCS"?" selected":""}>CBCS</option>
            <option value="PGX"${c.gradingCompany==="PGX"?" selected":""}>PGX</option>
          </select>
        </div>
        <div class="field"><label>Grade</label><input id="f-grade" value="${esc(c.grade||"")}" placeholder="e.g. 9.6" inputmode="decimal"></div>
      </div>
    </div>

    <div class="field"><label>Key issue status</label><input id="f-key" value="${esc(c.keyStatus||"")}" placeholder="e.g. First appearance of Venom"></div>

    <div class="field">
      <label>Fire tier</label>
      <div class="fire-tier-picker">
        <button class="fire-tier-btn${fireLevel(c)===0?" active":""}" data-fl="0">None</button>
        <button class="fire-tier-btn${fireLevel(c)===1?" active":""}" data-fl="1">🔥 Notable</button>
        <button class="fire-tier-btn${fireLevel(c)===2?" active":""}" data-fl="2">🔥🔥 Key</button>
        <button class="fire-tier-btn${fireLevel(c)===3?" active":""}" data-fl="3">🔥🔥🔥 Grail</button>
      </div>
    </div>

    <div class="row2">
      <div class="field"><label>Cover artist</label><input id="f-artist" value="${esc(c.coverArtist||"")}"></div>
      <div class="field"><label>Writer</label><input id="f-writer" value="${esc(c.writer||"")}"></div>
    </div>

    <div class="field"><label>Characters</label><input id="f-chars" value="${esc(c.characters||"")}" placeholder="Spider-Man, Venom"></div>

    <div class="row2">
      <div class="field"><label>Price paid</label><input id="f-price" value="${esc(c.price||"")}" placeholder="$25"></div>
      <div class="field"><label>Source</label>
        <select id="f-source-quick">
          <option value="">— quick pick —</option>
          <option value="LCS">Local comic shop</option>
          <option value="eBay">eBay</option>
          <option value="Convention">Convention</option>
          <option value="Online">Online retailer</option>
          <option value="Gift">Gift</option>
          <option value="Inherited">Inherited</option>
        </select>
        <input id="f-source" value="${esc(c.source||"")}" placeholder="Where purchased" style="margin-top:6px">
      </div>
    </div>

    <div class="row2">
      <div class="field"><label>Box / location</label><input id="f-location" value="${esc(c.location||"")}" placeholder="e.g. A1"></div>
      <div class="field"><label>Qty</label><input id="f-qty" value="${qtyOf(c)}" inputmode="numeric"></div>
    </div>

    <div class="field"><label>Notes</label><textarea id="f-notes" rows="3">${esc(c.notes||"")}</textarea></div>

    <button class="btn btn-primary" id="save">${editingId ? "Update" : "Add to collection"}</button>
    ${editingId ? `<button class="btn btn-ghost" id="cancel">Cancel</button>` : ""}
  </div>`;

  /* condition picker */
  let selectedCondition = c.condition || "";
  document.querySelectorAll(".condition-btn").forEach(btn => {
    btn.onclick = ()=>{
      selectedCondition = btn.dataset.cond;
      document.querySelectorAll(".condition-btn").forEach(b => b.classList.toggle("active", b.dataset.cond === selectedCondition));
    };
  });

  /* fire tier picker */
  let selectedFire = fireLevel(c);
  document.querySelectorAll(".fire-tier-btn").forEach(btn => {
    btn.onclick = ()=>{
      selectedFire = parseInt(btn.dataset.fl);
      document.querySelectorAll(".fire-tier-btn").forEach(b => b.classList.toggle("active", parseInt(b.dataset.fl) === selectedFire));
    };
  });

  /* graded checkbox toggle */
  document.getElementById("f-graded").onchange = (e) => {
    document.getElementById("graded-fields").style.display = e.target.checked ? "block" : "none";
  };

  /* source quick pick */
  document.getElementById("f-source-quick").onchange = (e) => {
    if(e.target.value){
      document.getElementById("f-source").value = e.target.value;
      e.target.selectedIndex = 0;
    }
  };

  /* year → era auto-fill */
  document.getElementById("f-year").addEventListener("blur", ()=>{
    const yearVal = document.getElementById("f-year").value.trim();
    const eraEl = document.getElementById("f-era");
    if(yearVal && !eraEl.value){
      const guess = guessEra(yearVal);
      if(guess) eraEl.value = guess;
    }
  });

  /* load pending photo from IndexedDB if editing */
  if(editingId && !pendingImage){
    loadPhoto(c).then(data=>{
      if(!data) return;
      pendingImage = data;
      const pv = document.getElementById("pv");
      if(pv && !pv.src){ pv.src = data; pv.style.display = "block"; }
    });
  }

  /* photo handlers */
  const showTrimBtn = () => {
    const tb = document.getElementById("trim-sq");
    if(tb && pendingImage) tb.style.display = "block";
  };
  const handlePhoto = async (file) => {
    if(!file) return;
    pendingImage = await resizeImage(file);
    const pv = document.getElementById("pv");
    pv.src = pendingImage; pv.style.display = "block";
    showTrimBtn();
  };
  document.getElementById("cam").onchange = (e) => handlePhoto(e.target.files[0]);
  document.getElementById("gal").onchange = (e) => handlePhoto(e.target.files[0]);
  if(pendingImage) showTrimBtn(); /* show trim for pre-loaded edit photo */

  /* trim to comic cover shape — centre-crops to 2:3 aspect ratio (standard comic proportions) */
  document.getElementById("trim-sq").onclick = () => {
    if(!pendingImage) return;
    const img = new Image();
    img.onload = () => {
      const RATIO = 2 / 3; /* width:height — standard comic cover */
      let cw, ch;
      if(img.width / img.height > RATIO){
        /* image is wider than 2:3 — crop width */
        ch = img.height; cw = Math.round(ch * RATIO);
      } else {
        /* image is taller than 2:3 — crop height */
        cw = img.width; ch = Math.round(cw / RATIO);
      }
      const sx = Math.round((img.width - cw) / 2);
      const sy = Math.round((img.height - ch) / 2);
      const c = document.createElement("canvas");
      c.width = cw; c.height = ch;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, sx, sy, cw, ch, 0, 0, cw, ch);
      pendingImage = c.toDataURL("image/jpeg", 0.72);
      c.width = 0; c.height = 0; /* free canvas memory */
      img.src = "";
      const pv = document.getElementById("pv");
      pv.src = pendingImage;
      document.getElementById("trim-sq").style.display = "none"; /* hide after trim */
    };
    img.src = pendingImage;
  };

  /* identify */
  document.getElementById("identify").onclick = async () => {
    const stEl = document.getElementById("id-status");
    stEl.style.display = "block";
    if(!cfg.gkey){ stEl.textContent = "Add a Gemini API key in Sync → Settings first."; return; }
    if(!pendingImage){ stEl.textContent = "Take or choose a cover photo first."; return; }
    stEl.textContent = "Identifying comic from cover…";
    try{
      const b64 = pendingImage.split(",")[1];
      const body = {contents:[{parts:[{inline_data:{mime_type:"image/jpeg",data:b64}},{text:AI_PROMPT}]}]};
      const {r} = await callGemini(body, cfg.gkey, stEl);
      const j = await r.json();
      const text = ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
      const rec = JSON.parse(text.replace(/```json|```/g,"").trim());

      /* check for duplicates */
      const dupe = comics.find(x =>
        x.id !== (editingId||"") &&
        (x.publisher||"").toLowerCase() === (rec.publisher||"").toLowerCase() &&
        (x.title||"").toLowerCase() === (rec.title||"").toLowerCase() &&
        (x.issueNumber||"") === (rec.issueNumber||"")
      );
      if(dupe){
        stEl.innerHTML = `⚠️ Possible duplicate: <b>${esc(dupe.title)} #${esc(dupe.issueNumber)}</b> already in collection (×${qtyOf(dupe)}).<br>
          <button class="btn btn-ghost" id="dupe-add" style="margin-top:8px;border-color:var(--ok);color:var(--ok)">Add another copy (+1)</button>`;
        document.getElementById("dupe-add").onclick = ()=>{
          dupe.qty = (qtyOf(dupe)) + 1; saveComics();
          stEl.textContent = `✓ Added copy — now ×${qtyOf(dupe)}.`;
        };
      }

      /* fill form fields */
      const fieldMap = {
        title:"f-title", issueNumber:"f-issue", variant:"f-variant",
        year:"f-year", coverArtist:"f-artist", writer:"f-writer", characters:"f-chars",
        keyStatus:"f-key", price:"f-price", notes:"f-notes"
      };
      let filled = 0;
      /* publisher needs normalisation — AI returns "Marvel Comics" but select has "Marvel" */
      if(rec.publisher){
        const pubEl = document.getElementById("f-pub");
        if(pubEl && !pubEl.value){
          pubEl.value = normalisePub(rec.publisher);
          if(pubEl.value){ pubEl.classList.add("needs-att"); filled++; }
        }
      }
      Object.entries(fieldMap).forEach(([k,elId]) => {
        if(rec[k]){
          const el = document.getElementById(elId);
          if(el && !el.value){
            el.value = rec[k];
            el.classList.add("needs-att");
            filled++;
          }
        }
      });
      if(rec.era){
        const eraEl = document.getElementById("f-era");
        if(eraEl && !eraEl.value){ eraEl.value = rec.era; filled++; }
      }
      if(rec.condition){
        selectedCondition = rec.condition;
        document.querySelectorAll(".condition-btn").forEach(b => b.classList.toggle("active", b.dataset.cond === selectedCondition));
        filled++;
      }
      if(rec.fire !== undefined){
        selectedFire = parseInt(rec.fire)||0;
        document.querySelectorAll(".fire-tier-btn").forEach(b => b.classList.toggle("active", parseInt(b.dataset.fl) === selectedFire));
      }

      /* stash AI-only fields that have no form input — merged into comic on save */
      if(rec.marketValue) pendingAiFields.marketValue = rec.marketValue;
      if(rec.gradedValue) pendingAiFields.gradedValue = rec.gradedValue;
      if(rec.gradeCandidate !== undefined) pendingAiFields.gradeCandidate = !!rec.gradeCandidate;
      if(rec.gradeCandidateReason) pendingAiFields.gradeCandidateReason = rec.gradeCandidateReason;
      pendingAiFields.lastValueCheck = new Date().toISOString().slice(0,10);

      const _fl = parseInt(rec.fire)||0;
      if(!dupe){
        stEl.textContent = "✓ Identified: " + [rec.publisher, rec.title, rec.issueNumber?"#"+rec.issueNumber:""].filter(Boolean).join(" ") + (_fl ? " " + "🔥".repeat(_fl) : "") + ` — filled ${filled} fields.`;
      }
    }catch(e){
      stEl.textContent = "✗ " + e.message;
    }
  };

  /* save */
  document.getElementById("save").onclick = async ()=>{
    const data = {
      publisher: document.getElementById("f-pub").value,
      title: document.getElementById("f-title").value.trim(),
      issueNumber: document.getElementById("f-issue").value.trim(),
      variant: document.getElementById("f-variant").value.trim(),
      year: document.getElementById("f-year").value.trim(),
      era: document.getElementById("f-era").value,
      condition: selectedCondition,
      graded: document.getElementById("f-graded").checked,
      gradingCompany: document.getElementById("f-graded").checked ? document.getElementById("f-gc").value : null,
      grade: document.getElementById("f-graded").checked ? document.getElementById("f-grade").value.trim() : null,
      keyStatus: document.getElementById("f-key").value.trim(),
      fire: selectedFire,
      coverArtist: document.getElementById("f-artist").value.trim(),
      writer: document.getElementById("f-writer").value.trim(),
      characters: document.getElementById("f-chars").value.trim(),
      price: document.getElementById("f-price").value.trim(),
      source: document.getElementById("f-source").value.trim(),
      location: document.getElementById("f-location").value.trim(),
      qty: parseInt(document.getElementById("f-qty").value) || 1,
      notes: document.getElementById("f-notes").value.trim(),
    };

    /* merge AI-only fields (marketValue, gradedValue, gradeCandidate, etc.) */
    Object.assign(data, pendingAiFields);
    pendingAiFields = {};

    try {
      if(editingId){
        const existing = comics.find(x=>x.id===editingId);
        if(existing) Object.assign(existing, data);
        if(pendingImage && pendingImage !== existing._photoUrl){
          await savePhoto(existing.id, pendingImage).catch(()=>{});
          existing._photoUrl = pendingImage;
          existing.imageDirty = true;
        }
        pendingImage = null; /* free memory */
        saveComics();
        editingId = null;
        tab = "detail"; detailId = existing.id; render();
      } else {
        const newComic = {
          id: uid(),
          added: new Date().toISOString().slice(0,10),
          ...data
        };
        if(pendingImage){
          await savePhoto(newComic.id, pendingImage).catch(()=>{});
          newComic._photoUrl = pendingImage;
          newComic.imageDirty = true;
        }
        pendingImage = null; /* free memory */
        comics.push(newComic);
        saveComics();
        detailId = newComic.id; tab = "detail";
        history.pushState({tab:"detail", id:detailId}, "");
        render(); window.scrollTo(0,0);
      }
    } catch(e) {
      console.error("Save error:", e);
      /* still navigate even if photo storage failed */
      saveComics();
      tab = "collection"; render();
    }
  };

  /* cancel edit */
  const cancelBtn = document.getElementById("cancel");
  if(cancelBtn) cancelBtn.onclick = ()=>{
    editingId = null; tab = "detail"; render();
  };
}

/* ================= stats page ================= */
function renderStats(){
  const inCave = comics.filter(c=>!isGone(c));
  const totalT = inCave.length;
  const totalB = inCave.reduce((n,c)=>n+(qtyOf(c)),0);
  const sold = comics.filter(isSold).length;
  const gifted = comics.filter(isGifted).length;
  const graded = inCave.filter(isGraded).length;
  const keys = inCave.filter(isKey).length;

  /* value estimate */
  let totalVal = 0, priced = 0;
  inCave.forEach(c=>{
    const v = parsePrice(c.marketValue) || parsePrice(c.price);
    if(v){ totalVal += v * qtyOf(c); priced++; }
  });
  const valStr = totalVal ? `~$${Math.round(totalVal).toLocaleString()} CAD` : "—";

  /* fire counts */
  const fire3 = inCave.filter(c=>fireLevel(c)===3).length;
  const fire2 = inCave.filter(c=>fireLevel(c)===2).length;
  const fire1 = inCave.filter(c=>fireLevel(c)===1).length;
  const gc = inCave.filter(isGradeCandidate).length;

  /* by publisher */
  const byPub = {};
  inCave.forEach(c=>{ const p = c.publisher||"Other"; byPub[p] = (byPub[p]||0) + qtyOf(c); });
  const pubSorted = Object.entries(byPub).sort((a,b)=>b[1]-a[1]);
  const maxPub = Math.max(...pubSorted.map(s=>s[1]),1);
  const pubHTML = pubSorted.map(([label,cnt])=>{
    const pct = Math.round((cnt/maxPub)*100);
    const colour = PUB_COLOURS[label]||"var(--ink-dim)";
    return `<div class="bar-row">
      <span class="bar-label" style="width:80px">${esc(label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${colour}"></div></div>
      <span class="bar-val">${cnt}</span>
    </div>`;
  }).join("");

  /* by era */
  const byEra = {};
  inCave.forEach(c=>{ const e = c.era||guessEra(c.year)||"Unknown"; byEra[e] = (byEra[e]||0) + qtyOf(c); });
  const eraOrder = ["Golden","Silver","Bronze","Copper","Modern","Unknown"];
  const eraColours = {Golden:"var(--accent)",Silver:"#b0b8c0",Bronze:"#c09060",Copper:"var(--red-soft)",Modern:"var(--blue-soft)",Unknown:"var(--ink-faint)"};
  const eraSorted = eraOrder.filter(e=>byEra[e]).map(e=>({era:e,count:byEra[e]}));
  const maxEra = Math.max(...eraSorted.map(e=>e.count),1);
  const eraHTML = eraSorted.map(e=>{
    const pct = Math.round((e.count/maxEra)*100);
    return `<div class="bar-row">
      <span class="bar-label" style="width:60px">${esc(e.era)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${eraColours[e.era]||"var(--ink-faint)"}"></div></div>
      <span class="bar-val">${e.count}</span>
    </div>`;
  }).join("");

  /* by decade */
  const byDecade = {};
  inCave.forEach(c=>{
    if(c.year){
      const d = Math.floor(parseInt(c.year)/10)*10;
      if(d) byDecade[d+"s"] = (byDecade[d+"s"]||0) + qtyOf(c);
    }
  });
  const decades = Object.keys(byDecade).sort();
  const maxDec = Math.max(...Object.values(byDecade),1);
  const decHTML = decades.map(d=>{
    const pct = Math.round((byDecade[d]/maxDec)*100);
    return `<div class="bar-row">
      <span class="bar-label">${esc(d)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--blue-soft)"></div></div>
      <span class="bar-val">${byDecade[d]}</span>
    </div>`;
  }).join("");

  /* price distribution */
  const priceBuckets = {"$0–10":0,"$10–25":0,"$25–50":0,"$50–100":0,"$100–500":0,"$500+":0};
  const bucketColours = ["var(--ok)","var(--blue-soft)","var(--accent)","var(--red-soft)","var(--fire)","var(--grail)"];
  inCave.forEach(c=>{
    const p = parsePrice(c.marketValue) || parsePrice(c.price);
    if(p){
      const qty = qtyOf(c);
      if(p<10) priceBuckets["$0–10"]+=qty;
      else if(p<25) priceBuckets["$10–25"]+=qty;
      else if(p<50) priceBuckets["$25–50"]+=qty;
      else if(p<100) priceBuckets["$50–100"]+=qty;
      else if(p<500) priceBuckets["$100–500"]+=qty;
      else priceBuckets["$500+"]+=qty;
    }
  });
  const maxPrice = Math.max(...Object.values(priceBuckets),1);
  const priceHTML = Object.entries(priceBuckets).map(([label,cnt],i)=>{
    const pct = Math.round((cnt/maxPrice)*100);
    return `<div class="bar-row">
      <span class="bar-label">${esc(label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${bucketColours[i]}"></div></div>
      <span class="bar-val">${cnt}</span>
    </div>`;
  }).join("");

  /* condition breakdown */
  const byCond = {};
  inCave.filter(c=>!isGraded(c)).forEach(c=>{
    const cond = c.condition||"Unknown";
    byCond[cond] = (byCond[cond]||0) + qtyOf(c);
  });
  const condOrder = [...CONDITIONS, "Unknown"];
  const condColours = {NM:"var(--nm)",VF:"var(--vf)",FN:"var(--fn)",VG:"var(--vg)",GD:"var(--gd)",FR:"var(--gd)",PR:"var(--gd)",Unknown:"var(--ink-faint)"};
  const condSorted = condOrder.filter(c=>byCond[c]);
  const maxCond = Math.max(...condSorted.map(c=>byCond[c]),1);
  const condHTML = condSorted.map(c=>{
    const pct = Math.round((byCond[c]/maxCond)*100);
    return `<div class="bar-row">
      <span class="bar-label">${esc(c)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${condColours[c]||"var(--ink-faint)"}"></div></div>
      <span class="bar-val">${byCond[c]}</span>
    </div>`;
  }).join("");

  /* random picker */
  const pickable = inCave.filter(c => isFire(c) || isKey(c));

  view.innerHTML = `<div class="sheet">
    <h2 class="comic">Collection Stats</h2>

    <div class="stats-row" style="justify-content:center;gap:12px">
      <span class="stat-pill"><span class="n">${totalT}</span> titles</span>
      <span class="stat-pill"><span class="n">${totalB}</span> books</span>
      <span class="stat-pill" style="border-color:var(--accent)"><span class="n" style="color:var(--accent)">${valStr}</span></span>
    </div>
    <div class="stats-row" style="justify-content:center;gap:12px;margin-top:4px">
      ${fire3?`<span class="stat-pill" style="border-color:var(--fire)"><span class="n" style="color:var(--fire)">🔥🔥🔥 ${fire3}</span> grails</span>`:""}
      ${fire2?`<span class="stat-pill" style="border-color:var(--fire)"><span class="n" style="color:var(--fire)">🔥🔥 ${fire2}</span> keys</span>`:""}
      ${fire1?`<span class="stat-pill" style="border-color:var(--fire)"><span class="n" style="color:var(--fire)">🔥 ${fire1}</span> notable</span>`:""}
      ${keys?`<span class="stat-pill" style="border-color:var(--warn)"><span class="n" style="color:var(--warn)">🔑 ${keys}</span> key issues</span>`:""}
      ${gc?`<span class="stat-pill" style="border-color:var(--grail)"><span class="n" style="color:var(--grail)">💎 ${gc}</span> grade candidates</span>`:""}
    </div>
    <div class="stats-row" style="justify-content:center;gap:12px;margin-top:4px">
      ${graded?`<span class="stat-pill" style="border-color:var(--ok)"><span class="n" style="color:var(--ok)">🏅 ${graded}</span> graded</span>`:""}

/* ================= value / appreciation tab ================= */
function renderValue(){
  const inCave = comics.filter(c=>!isGone(c));

  /* totals */
  let totalAcq = 0, totalMarket = 0, totalGradedVal = 0;
  inCave.forEach(c=>{
    const acq = parsePrice(c.price);
    const mkt = parsePrice(c.marketValue);
    const gv = parsePrice(c.gradedValue);
    if(acq) totalAcq += acq * qtyOf(c);
    if(mkt) totalMarket += mkt * qtyOf(c);
    if(gv) totalGradedVal += gv * qtyOf(c);
  });

  const overallPct = totalAcq > 0 ? Math.round(((totalMarket - totalAcq)/totalAcq)*100) : null;

  /* grade candidates with ROI */
  const candidates = inCave
    .filter(c => isGradeCandidate(c) || (parsePrice(c.gradedValue) && !isGraded(c)))
    .map(c => ({comic:c, roi:gradingROI(c)}))
    .filter(x => x.roi)
    .sort((a,b) => b.roi.gain - a.roi.gain);

  /* ticker items */
  let tickerItems = inCave.map(c => {
    const acq = parsePrice(c.price);
    const mkt = parsePrice(c.marketValue);
    const change = (acq && mkt) ? Math.round(((mkt-acq)/acq)*100) : null;
    return {comic:c, acq, mkt, change};
  }).filter(x => x.mkt);

  /* sort ticker */
  if(valueSort === "change-desc") tickerItems.sort((a,b) => (b.change||0)-(a.change||0));
  else if(valueSort === "change-asc") tickerItems.sort((a,b) => (a.change||0)-(b.change||0));
  else if(valueSort === "name") tickerItems.sort((a,b) => (a.comic.title||"").localeCompare(b.comic.title||""));
  else if(valueSort === "value-desc") tickerItems.sort((a,b) => (b.mkt||0)-(a.mkt||0));

  const tickerHTML = tickerItems.map(({comic:c, acq, mkt, change}) => {
    const chgClass = change !== null ? (change >= 0 ? "up" : "down") : "";
    const chgStr = change !== null ? `${change >= 0 ? "▲" : "▼"} ${Math.abs(change)}%` : "";
    return `<div class="ticker-item" data-id="${esc(c.id)}">
      <div class="ticker-name">
        <div class="ticker-title">${isFire(c)?fireEmoji(c)+" ":""}${esc(c.title||"")}${c.issueNumber ? " #"+esc(c.issueNumber) : ""}</div>
        <div class="ticker-sub">${esc(c.publisher||"")} · ${esc(c.year||"")}</div>
      </div>
      <div class="ticker-val">
        <div>$${mkt.toLocaleString()}</div>
        <div class="ticker-change ${chgClass}">${chgStr}</div>
      </div>
    </div>`;
  }).join("");

  view.innerHTML = `<div class="sheet">
    <h2 class="comic">📈 Collection Value</h2>

    <div class="stats-row" style="justify-content:center;gap:12px">
      <span class="stat-pill"><span class="n">$${Math.round(totalAcq).toLocaleString()}</span> cost</span>
      <span class="stat-pill" style="border-color:var(--accent)"><span class="n" style="color:var(--accent)">$${Math.round(totalMarket).toLocaleString()}</span> value</span>
      ${overallPct !== null ? `<span class="stat-pill" style="border-color:${overallPct>=0?"var(--ok)":"var(--red)"}"><span class="n" style="color:${overallPct>=0?"var(--ok)":"var(--red)"}">${overallPct>=0?"▲":"▼"} ${Math.abs(overallPct)}%</span></span>` : ""}
    </div>
    ${totalGradedVal ? `<div class="stats-row" style="justify-content:center;gap:12px;margin-top:4px">
      <span class="stat-pill" style="border-color:var(--grail)"><span class="n" style="color:var(--grail)">$${Math.round(totalGradedVal).toLocaleString()}</span> if all graded</span>
    </div>` : ""}

    <div style="margin:16px 0">
      <button class="btn btn-ghost" id="recheck-all" style="border-color:var(--accent);color:var(--accent)">✨ Update all market values (AI)</button>
      <div class="note">Uses Gemini to estimate current values for all books. ~1 book/sec.</div>
      <div class="sync-status" id="recheck-all-st" style="display:none"></div>
    </div>

    ${candidates.length ? `
    <div class="stat-section-label">💎 Top grading candidates</div>
    ${candidates.slice(0,10).map(({comic:c, roi}) => `
      <div class="ticker-item" data-id="${esc(c.id)}">
        <div class="ticker-name">
          <div class="ticker-title">${esc(c.title||"")} #${esc(c.issueNumber||"")}</div>
          <div class="ticker-sub">${esc(c.condition||"")} → graded · ${esc(c.publisher||"")}</div>
        </div>
        <div class="ticker-val">
          <div class="ticker-change ${roi.gain>=0?"up":"down"}">+$${roi.gain}</div>
          <div style="font-size:10px;color:var(--ink-faint)">$${roi.raw} → $${roi.graded}</div>
        </div>
      </div>
    `).join("")}` : ""}

    <div class="stat-section-label" style="display:flex;justify-content:space-between;align-items:center">
      Value ticker
      <select id="val-sort" style="background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--ink-dim);padding:4px 8px;font-size:11px;font-family:'IBM Plex Mono',monospace">
        <option value="change-desc"${valueSort==="change-desc"?" selected":""}>Gainers ↓</option>
        <option value="change-asc"${valueSort==="change-asc"?" selected":""}>Losers ↓</option>
        <option value="value-desc"${valueSort==="value-desc"?" selected":""}>Total value ↓</option>
        <option value="name"${valueSort==="name"?" selected":""}>A–Z</option>
      </select>
    </div>
    <div id="ticker-list">
      ${tickerHTML || `<div class="note">No priced books yet. Add prices or run the AI value check.</div>`}
    </div>
  </div>`;

  /* sort handler */
  const sortEl = document.getElementById("val-sort");
  if(sortEl) sortEl.onchange = ()=>{ valueSort = sortEl.value; renderValue(); };

  /* ticker item clicks */
  document.querySelectorAll(".ticker-item").forEach(el => {
    el.style.cursor = "pointer";
    el.onclick = ()=>{
      detailId = el.dataset.id; tab = "detail";
      history.pushState({tab:"detail", id:detailId}, "");
      render(); window.scrollTo(0,0);
    };
  });

  /* bulk value recheck */
  let recheckAbort = false;
  const recheckBtn = document.getElementById("recheck-all");
  if(recheckBtn) recheckBtn.onclick = async ()=>{
    const rst = document.getElementById("recheck-all-st");
    rst.style.display = "block";
    if(!cfg.gkey){ rst.textContent = "Add a Gemini API key in Settings first."; return; }
    recheckAbort = false;
    recheckBtn.textContent = "⏹ Stop"; recheckBtn.onclick = ()=>{ recheckAbort = true; };
    let updated = 0;
    for(let i = 0; i < comics.length; i++){
      if(recheckAbort){ rst.textContent = `Stopped. Updated ${updated}/${i} books checked.`; break; }
      const c = comics[i];
      if(isGone(c)) continue;
      const desc = [c.publisher, c.title, c.issueNumber?"#"+c.issueNumber:"", c.year, c.condition].filter(Boolean).join(", ");
      if(!desc) continue;
      rst.textContent = `Checking ${i+1}/${comics.length}: ${c.title||""} #${c.issueNumber||""}…`;
      try{
        const prompt = VALUE_PROMPT.replace("{{DESC}}", desc);
        const body = {contents:[{parts:[{text:prompt}]}]};
        const {r} = await callGemini(body, cfg.gkey, rst);
        const j = await r.json();
        const text = ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
        const rec = JSON.parse(text.replace(/```json|```/g,"").trim());
        if(rec.marketValue){ c.marketValue = rec.marketValue; updated++; }
        if(rec.gradedValue) c.gradedValue = rec.gradedValue;
        if(rec.gradeCandidate !== undefined) c.gradeCandidate = rec.gradeCandidate;
        if(rec.gradeCandidateReason) c.gradeCandidateReason = rec.gradeCandidateReason;
        if(rec.keyStatus && !c.keyStatus) c.keyStatus = rec.keyStatus;
        c.lastValueCheck = new Date().toISOString().slice(0,10);
        saveComics();
      }catch(e){
        rst.textContent = `Error on ${c.title||""}: ${e.message}. Continuing…`;
        await new Promise(ok => setTimeout(ok, 1000));
      }
    }
    if(!recheckAbort) rst.textContent = `✓ Done. Updated ${updated} of ${comics.filter(c=>!isGone(c)).length} books.`;
    recheckBtn.textContent = "✨ Update all market values (AI)";
    recheckBtn.onclick = arguments.callee;
    renderValue();
  };
}

/* ================= GitHub sync ================= */
async function ghPut(path, contentB64, message){
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
  const existing = await fetch(url, {headers:{"Authorization":`Bearer ${cfg.token}`,"Accept":"application/vnd.github.v3+json"}});
  let sha;
  if(existing.ok){ sha = (await existing.json()).sha; }
  const body = {message, content:contentB64};
  if(sha) body.sha = sha;
  if(cfg.branch && cfg.branch !== "main") body.branch = cfg.branch;
  const r = await fetch(url, {
    method:"PUT",
    headers:{"Authorization":`Bearer ${cfg.token}`,"Accept":"application/vnd.github.v3+json","Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  if(!r.ok) throw new Error(`GitHub ${r.status}: ${(await r.text()).slice(0,120)}`);
}
function b64EncodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}

async function pushAll(statusEl){
  if(!cfg.owner||!cfg.repo||!cfg.token) throw new Error("Fill in owner, repo, and token first.");
  /* find comics with dirty photos in IndexedDB */
  const dirtyIds = await allPhotoKeys();
  const dirty = comics.filter(c => dirtyIds.includes(c.id) && c.imageDirty !== false);
  let i=0;
  for(const c of dirty){
    i++;
    statusEl.textContent = `Uploading cover ${i}/${dirty.length}…`;
    const photoData = await getPhoto(c.id);
    if(!photoData) continue;
    const path = `comics/images/${c.id}.jpg`;
    const b64 = photoData.split(",")[1];
    await ghPut(path, b64, `Add cover ${c.title||""} #${c.issueNumber||""}`.trim());
    c.imagePath = `images/${c.id}.jpg`; c.imageDirty = false;
    /* clean up IndexedDB now that photo is on GitHub */
    await deletePhoto(c.id);
    delete c._photoUrl;
  }
  statusEl.textContent = "Writing comics.json…";
  const clean = comics.map(({_photoUrl, imageDirty, ...rest})=>rest);
  await ghPut("comics/data/comics.json", b64EncodeUnicode(JSON.stringify(clean,null,2)), `Update collection (${clean.length} comics)`);
  saveComics();
  cfg.lastSync = new Date().toLocaleString(); saveCfg();
  logSync("push", `${clean.length} comics, ${dirty.length} cover${dirty.length!==1?"s":""}`);
  statusEl.textContent = `✓ Synced ${clean.length} comics at ${cfg.lastSync}`;
}
async function pullAll(statusEl){
  if(!cfg.owner||!cfg.repo) throw new Error("Fill in owner and repo first.");
  statusEl.textContent = "Fetching comics.json…";
  const url = `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch||"main"}/comics/data/comics.json?t=${Date.now()}`;
  const r = await fetch(url);
  if(!r.ok) throw new Error("Could not read comics/data/comics.json ("+r.status+"). Has the collection been pushed yet?");
  const remote = await r.json();
  if(!Array.isArray(remote)) throw new Error("comics.json is not a list.");
  if(comics.length && !confirm(`Replace the ${comics.length} local comics with ${remote.length} from GitHub?`)){
    statusEl.textContent = "Pull cancelled."; return;
  }
  comics = remote; saveComics();
  cfg.lastSync = new Date().toLocaleString(); saveCfg();
  logSync("pull", `${comics.length} comics loaded`);
  statusEl.textContent = `✓ Loaded ${comics.length} comics from GitHub.`;
  render();
}

  lastValueCheck:"2026-08-17",

  giftedTo:null,
  imagePath:null
}];
if(!localStorage.getItem(LS_COMICS)) { comics = SEED; saveComics(); }

function setTab(t, restoreScroll){
  tab = t;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===t));
  /* push tab state so camera return doesn't lose Add tab */
  if(t === "add") history.replaceState({tab:"add"}, "");
  render();
  if(restoreScroll !== undefined) window.scrollTo(0, restoreScroll);
  else window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click", ()=>{
  editingId = null;
  pendingImage = null; pendingAiFields = {}; /* free memory when leaving Add tab */
  setTab(b.dataset.tab);
}));

/* browser back/forward */
window.addEventListener("popstate", (e)=>{
  if(e.state && e.state.tab==="detail"){
    detailId = e.state.id; tab="detail"; render(); window.scrollTo(0,0);
  } else if(e.state && e.state.tab){
    tab = e.state.tab; render();
  } else {
    tab="collection"; setTab("collection", collectionScrollY);
  }
});
/* save/restore state when iOS kills + restores the page (camera, low memory) */
window.addEventListener("pagehide", ()=>{
  sessionStorage.setItem("cave.comics.tab", tab);
  if(editingId) sessionStorage.setItem("cave.comics.editing", editingId);
  if(detailId) sessionStorage.setItem("cave.comics.detail", detailId);
});
(function restoreState(){
  const savedTab = sessionStorage.getItem("cave.comics.tab");
  if(savedTab && savedTab !== "collection"){
    tab = savedTab;
    editingId = sessionStorage.getItem("cave.comics.editing") || null;
    detailId = sessionStorage.getItem("cave.comics.detail") || null;
    sessionStorage.removeItem("cave.comics.tab");
    sessionStorage.removeItem("cave.comics.editing");
    sessionStorage.removeItem("cave.comics.detail");
  }
})();

(async ()=>{
  /* migrate any base64 photos from localStorage → IndexedDB (one-time) */
  await migratePhotos().catch(()=>{});
  render();
  if(!comics.length && cfg.owner && cfg.repo){
    try{
      const r = await fetch(`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch||"main"}/comics/data/comics.json?t=${Date.now()}`);
      if(r.ok){ comics = await r.json(); saveComics(); render(); }
    }catch(e){}
  }
})();
</script>
