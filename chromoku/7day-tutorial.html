<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f7f7f8">
    <title>Chromoku — 7-Day Tutorial</title>
    <style>
        :root {
            --bg: #f7f7f8;
            --panel: #fff;
            --panel2: #eeeef2;
            --ink: #17172b;
            --ink-dim: #63637a;
            --ink-faint: #9c9caf;
            --line: rgba(0,0,0,.10);
            --line-2: rgba(0,0,0,.18);
            --cell: #fff;
            --board: rgba(0,0,0,.14);
            --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
            --teal: #17a2b8;
            --orange: #fd7e14;
            --ok: #7da87b;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #14141f;
                --panel: #1e1e2e;
                --panel2: #282838;
                --ink: #ececf4;
                --ink-dim: #9a9ab2;
                --ink-faint: #63637a;
                --line: rgba(255,255,255,.11);
                --line-2: rgba(255,255,255,.20);
                --cell: #252537;
                --board: rgba(255,255,255,.16);
                --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 12px 12px;
        }

        header {
            width: 100%;
            max-width: 460px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 14px;
        }

        h1 {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .sub {
            font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 10px;
            color: var(--ink-faint);
            text-align: center;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .day-info {
            width: 100%;
            max-width: 460px;
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .day-badge {
            background: var(--panel2);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-dim);
        }

        .day-badge .num {
            color: var(--ink);
            font-weight: 800;
        }

        .mechanic-label {
            background: var(--panel2);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink-dim);
        }

        .game-container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .stats {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .stat {
            text-align: center;
            background: var(--panel2);
            padding: 8px 14px;
            border-radius: 8px;
            flex: 0 1 auto;
        }

        .stat-label {
            font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 9px;
            color: var(--ink-faint);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        .board-wrap {
            width: 100%;
            max-width: min(86vw, 360px);
        }

        .board {
            display: grid;
            gap: 12px;
            aspect-ratio: 1;
            padding: 12px;
            background: var(--board);
            border-radius: 18px;
        }

        .board.size-5 {
            grid-template-columns: repeat(5, 1fr);
        }

        .board.size-7 {
            grid-template-columns: repeat(7, 1fr);
        }

        .cell {
            position: relative;
            background: var(--cell);
            border-radius: 8px;
            aspect-ratio: 1;
            cursor: pointer;
            transition: background 0.12s, box-shadow 0.12s;
            box-shadow: var(--shadow);
        }

        .cell:hover {
            background: var(--panel2);
        }

        .cell.selected {
            box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--teal);
        }

        .fill {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            background: var(--c);
            transition: background 0.12s;
        }

        .cell.given .fill {
            border-radius: 2px;
        }

        /* Colour swatches */
        .palette {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .swatch {
            flex: 0 0 auto;
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: var(--c);
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s;
            box-shadow: var(--shadow);
            border: none;
            padding: 0;
        }

        .swatch:active {
            transform: scale(0.93);
        }

        .swatch.on {
            box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--c);
            transform: scale(1.06);
        }

        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        button {
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 10px;
            background: var(--ink);
            color: var(--bg);
            border: none;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        button:hover {
            opacity: 0.85;
        }

        button.secondary {
            background: var(--panel2);
            color: var(--ink-dim);
        }

        button.secondary:hover {
            background: var(--panel);
            color: var(--ink);
        }

        .day-selector {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .day-btn {
            font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 12px;
            background: var(--panel2);
            color: var(--ink-dim);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .day-btn:hover:not(:disabled) {
            background: var(--panel);
            color: var(--ink);
        }

        .day-btn.active {
            background: var(--ink);
            color: var(--bg);
        }

        .day-btn.completed {
            background: var(--ok);
            color: white;
        }

        .day-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .message {
            text-align: center;
            font-size: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            background: var(--panel2);
            color: var(--ink);
            display: none;
            width: 100%;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: var(--ok);
            color: white;
        }

        /* Modal */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .overlay.show {
            display: flex;
        }

        .modal {
            background: var(--panel);
            border-radius: 18px;
            padding: 24px 22px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal h2 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .modal-text {
            font-size: 13px;
            color: var(--ink-dim);
            line-height: 1.55;
            margin-bottom: 16px;
        }

        .modal button {
            width: 100%;
            margin-top: 8px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 18px;
            }

            .stat {
                flex: 1;
                min-width: 80px;
            }

            button {
                font-size: 12px;
                padding: 9px 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Chromoku</h1>
        <p class="sub">7-Day Tutorial</p>
    </header>

    <div class="day-info">
        <div class="day-badge">Day <span class="num" id="currentDay">1</span> of 7</div>
        <div class="mechanic-label" id="mechanicLabel">Learn Basics</div>
    </div>

    <div class="game-container">
        <div id="message" class="message"></div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Moves</div>
                <div class="stat-value"><span id="moves">0</span>/<span id="maxMoves">10</span></div>
            </div>
            <div class="stat">
                <div class="stat-label">Filled</div>
                <div class="stat-value"><span id="matchPercent">0</span>%</div>
            </div>
        </div>

        <div class="board-wrap">
            <div class="board size-5" id="gameBoard"></div>
        </div>

        <div class="palette" id="palette"></div>

        <div class="controls">
            <button onclick="newGame()">New Puzzle</button>
            <button class="secondary" onclick="showTutorial()">How to Play</button>
        </div>

        <div class="day-selector" id="daySelector"></div>
    </div>

    <!-- Tutorial Modal -->
    <div class="overlay" id="tutorialOverlay">
        <div class="modal">
            <h2 id="tutorialTitle">Day 1: Basics</h2>
            <div class="modal-text" id="tutorialText">Tap a colour swatch, then tap cells to fill them.</div>
            <div class="modal-text" style="font-size: 12px; color: var(--ink-faint);" id="tutorialHint"></div>
            <button onclick="closeTutorial()">Got it</button>
        </div>
    </div>

    <script>
        const DAYS = [
            {
                day: 1,
                title: "Basics",
                mechanic: "Learn Basics",
                size: 5,
                colors: 2,
                maxMoves: 10,
                hint: "Tap a colour, then tap cells to fill them. Make all cells the same colour.",
                tutorialText: "Welcome to Chromoku! Tap a colour swatch at the bottom, then tap cells to fill them. Your goal is to make all cells the same colour within your move limit."
            },
            {
                day: 2,
                title: "Three Colours",
                mechanic: "Strategic Thinking",
                size: 5,
                colors: 3,
                maxMoves: 15,
                hint: "With three colours, plan your moves. Which colour order gets you there fastest?",
                tutorialText: "Now there are three colours! This requires more strategy. Think ahead: which sequence of colours will reach the goal?"
            },
            {
                day: 3,
                title: "Patterns",
                mechanic: "Pattern Recognition",
                size: 5,
                colors: 3,
                maxMoves: 20,
                hint: "Look for colour patterns. Which cells cluster together?",
                tutorialText: "Patterns matter. Some colour layouts are trickier than others. Look for clusters and adjacencies."
            },
            {
                day: 4,
                title: "Complexity",
                mechanic: "Harder Puzzles",
                size: 5,
                colors: 4,
                maxMoves: 25,
                hint: "Four colours make this trickier. Think several moves ahead.",
                tutorialText: "Things get harder. Four colours means more combinations to consider.",
                disabled: true
            },
            {
                day: 5,
                title: "Large Grids",
                mechanic: "Bigger Boards",
                size: 7,
                colors: 4,
                maxMoves: 30,
                hint: "Larger grids change the strategy. Corners vs edges matter more.",
                tutorialText: "This puzzle is bigger (7×7). Larger boards need different thinking.",
                disabled: true
            },
            {
                day: 6,
                title: "Many Colours",
                mechanic: "Mastering Variety",
                size: 7,
                colors: 5,
                maxMoves: 40,
                hint: "Five colours on a 7×7 grid. Advanced strategy required.",
                tutorialText: "Five colours and a large grid. This is where expert play shines.",
                disabled: true
            },
            {
                day: 7,
                title: "Mastery",
                mechanic: "Master Challenge",
                size: 7,
                colors: 5,
                maxMoves: 45,
                hint: "The ultimate challenge. Use everything you've learned.",
                tutorialText: "Your final test. Combine everything: strategy, pattern recognition, and speed.",
                disabled: true
            }
        ];

        let currentDayIndex = 0;
        let gameBoard = [];
        let selectedColor = null;
        let moves = 0;
        let puzzleSolved = false;

        const colorMap = {
            0: { name: "Teal", hex: "#17a2b8", var: "--teal" },
            1: { name: "Orange", hex: "#fd7e14", var: "--orange" },
            2: { name: "Green", hex: "#28a745", var: "--ok" },
            3: { name: "Purple", hex: "#6f42c1", var: "--purple" },
            4: { name: "Red", hex: "#dc3545", var: "--red" }
        };

        function getCurrentDay() {
            return DAYS[currentDayIndex];
        }

        function initGame() {
            const day = getCurrentDay();
            moves = 0;
            selectedColor = null;
            puzzleSolved = false;

            gameBoard = [];
            for (let i = 0; i < day.size * day.size; i++) {
                gameBoard.push(Math.floor(Math.random() * day.colors));
            }

            renderBoard();
            renderPalette();
            updateStats();
            updateDaySelector();

            if (currentDayIndex === 0) {
                setTimeout(showTutorial, 500);
            }
        }

        function renderBoard() {
            const day = getCurrentDay();
            const boardEl = document.getElementById('gameBoard');
            boardEl.innerHTML = '';
            boardEl.className = `board size-${day.size}`;

            gameBoard.forEach((colorIdx, idx) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const fill = document.createElement('div');
                fill.className = 'fill';
                fill.style.setProperty('--c', colorMap[colorIdx].hex);
                cell.appendChild(fill);
                cell.onclick = () => fillCell(idx);
                boardEl.appendChild(cell);
            });
        }

        function renderPalette() {
            const day = getCurrentDay();
            const paletteEl = document.getElementById('palette');
            paletteEl.innerHTML = '';

            for (let i = 0; i < day.colors; i++) {
                const swatch = document.createElement('button');
                swatch.className = 'swatch';
                swatch.style.setProperty('--c', colorMap[i].hex);
                if (selectedColor === i) swatch.classList.add('on');
                swatch.onclick = () => selectColor(i);
                paletteEl.appendChild(swatch);
            }
        }

        function selectColor(idx) {
            if (puzzleSolved || getCurrentDay().disabled) return;
            selectedColor = selectedColor === idx ? null : idx;
            renderPalette();
        }

        function fillCell(idx) {
            if (selectedColor === null || puzzleSolved || getCurrentDay().disabled) return;
            if (gameBoard[idx] === selectedColor) return;

            gameBoard[idx] = selectedColor;
            moves++;
            renderBoard();
            updateStats();
            checkWin();
        }

        function updateStats() {
            const day = getCurrentDay();
            const filledCount = gameBoard.filter(c => c === gameBoard[0]).length;
            const fillPercent = Math.round((filledCount / gameBoard.length) * 100);

            document.getElementById('moves').textContent = moves;
            document.getElementById('maxMoves').textContent = day.maxMoves;
            document.getElementById('matchPercent').textContent = fillPercent;
        }

        function checkWin() {
            const day = getCurrentDay();
            const allSame = gameBoard.every(c => c === gameBoard[0]);

            if (allSame && moves <= day.maxMoves) {
                puzzleSolved = true;
                showMessage(`🎉 Day ${day.day} Complete! (${moves} moves)`, 'success');
            } else if (moves >= day.maxMoves) {
                showMessage(`Out of moves. Try again?`, 'fail');
            }
        }

        function showMessage(text, type = '') {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = `message show ${type}`;
            setTimeout(() => msgEl.classList.remove('show'), 3000);
        }

        function newGame() {
            initGame();
            showMessage('New puzzle!');
        }

        function showTutorial() {
            const day = getCurrentDay();
            document.getElementById('tutorialTitle').textContent = `Day ${day.day}: ${day.title}`;
            document.getElementById('tutorialText').textContent = day.tutorialText;
            document.getElementById('tutorialHint').textContent = day.mechanic;
            document.getElementById('tutorialOverlay').classList.add('show');
        }

        function closeTutorial() {
            document.getElementById('tutorialOverlay').classList.remove('show');
        }

        function updateDaySelector() {
            const selector = document.getElementById('daySelector');
            selector.innerHTML = '';

            DAYS.forEach((day, idx) => {
                const btn = document.createElement('button');
                btn.className = 'day-btn';
                btn.textContent = `Day ${day.day}`;

                if (idx < currentDayIndex) btn.classList.add('completed');
                if (idx === currentDayIndex) btn.classList.add('active');
                if (day.disabled) btn.disabled = true;

                btn.onclick = () => {
                    if (!day.disabled) {
                        currentDayIndex = idx;
                        document.getElementById('currentDay').textContent = day.day;
                        document.getElementById('mechanicLabel').textContent = day.mechanic;
                        initGame();
                    }
                };

                selector.appendChild(btn);
            });
        }

        window.addEventListener('load', initGame);
    </script>
</body>
</html>
