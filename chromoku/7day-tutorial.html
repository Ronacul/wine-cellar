<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f7f8">
<title>Chromoku 7-Day Tutorial</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<meta name="description" content="Learn Chromoku in 7 days — one puzzle per day.">
<style>
/* ================= tokens ================= */
:root{
  --bg:#f7f7f8; --panel:#fff; --panel2:#eeeef2;
  --ink:#17172b; --ink-dim:#63637a; --ink-faint:#9c9caf;
  --line:rgba(0,0,0,.10); --line-2:rgba(0,0,0,.18);
  --cell:#fff; --cell-given:#e9e9f0; --board:rgba(0,0,0,.14);
  --ring:#17172b; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --error:#e74c3c;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14141f; --panel:#1e1e2e; --panel2:#282838;
    --ink:#ececf4; --ink-dim:#9a9ab2; --ink-faint:#63637a;
    --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.20);
    --cell:#252537; --cell-given:#32324a; --board:rgba(255,255,255,.16);
    --ring:#ececf4; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#14141f; --panel:#1e1e2e; --panel2:#282838;
  --ink:#ececf4; --ink-dim:#9a9ab2; --ink-faint:#63637a;
  --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.20);
  --cell:#252537; --cell-given:#32324a; --board:rgba(255,255,255,.16);
  --ring:#ececf4; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink)}
.app{
  min-height:100vh; width:100%;
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  display:flex; flex-direction:column; align-items:center;
  padding:calc(var(--safe-t) + 8px) 12px calc(var(--safe-b) + 12px);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ================= header ================= */
header{
  width:100%; max-width:460px; display:grid;
  grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
  padding-bottom:10px; border-bottom:1px solid var(--line); margin-bottom:14px;
}
.hdr-l{display:flex;gap:2px}
.hdr-r{display:flex;gap:2px;justify-content:flex-end;align-items:center}
h1{
  font-size:19px; font-weight:800; letter-spacing:-.03em; text-align:center;
  line-height:1.1;
}
.sub{
  font-family:var(--mono); font-size:10px; color:var(--ink-faint);
  text-align:center; letter-spacing:.06em; text-transform:uppercase; margin-top:2px;
}
.icon-btn{
  width:34px; height:34px; border-radius:9px; font-size:15px; color:var(--ink-dim);
  display:grid; place-items:center; transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--panel2); color:var(--ink)}
.icon-btn[disabled]{opacity:.35; cursor:default}
.icon-btn[disabled]:hover{background:transparent; color:var(--ink-dim)}

/* ================= progress bar ================= */
.progress-bar{
  width:100%; max-width:460px; display:flex; gap:4px; margin-bottom:12px;
}
.progress-step{
  flex:1; height:4px; border-radius:2px; background:var(--line);
  transition:background .3s;
}
.progress-step.done{background:#c9a227}
.progress-step.current{background:var(--ink); animation:pulse-progress .8s infinite alternate}
.progress-step.upcoming{background:var(--line-2)}
@keyframes pulse-progress{from{opacity:1}to{opacity:.6}}

/* ================= board ================= */
.play{
  flex:1; width:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:26px;
}
.board-wrap{width:100%; max-width:min(86vw,360px)}
.board{
  display:grid; gap:var(--bgap,12px); aspect-ratio:1; padding:var(--bgap,12px);
  background:var(--board); border-radius:18px;
}
.box{display:grid; gap:var(--cgap,4px)}
.cell{
  position:relative; background:var(--cell); border-radius:var(--crad,8px);
  transition:background .12s;
}
.cell:not(.given){cursor:pointer}
.cell:not(.given):hover{background:var(--panel2)}
.fill{position:absolute; inset:0; border-radius:12px; background:var(--c)}
.fill.pat{box-shadow:inset 0 0 0 1.5px var(--line-2)}
.cell.given{background:var(--cell-given)}
.cell.given .fill{border-radius:2px}
.board.done .fill{border-radius:2px; transition:border-radius .25s}
.board.dbl .fill{
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  mask-composite:exclude;
  padding:22%;
}
.dot{
  position:absolute; inset:22%; border-radius:6px; background:var(--c);
  box-shadow:0 0 0 2px rgba(0,0,0,.28),0 0 0 3.5px var(--cell-given);
}
.board.dbl .dot{
  inset:26%; border-radius:3px;
  box-shadow:none;
}
.dot.given{border-radius:0}
.board.done .dot{border-radius:0; transition:border-radius .25s}

/* ================= palette ================= */
.palette{display:flex; flex-direction:column; gap:26px; align-items:stretch;
  width:100%; max-width:min(86vw,360px)}
.palette.tight{gap:10px}
.prow{display:flex; gap:clamp(5px,1.5vw,8px); align-items:center; flex-wrap:nowrap}
.prow.wrap{gap:clamp(4px,1.2vw,7px)}
.swatch.spacer{background:none; box-shadow:none; visibility:hidden; pointer-events:none}
.swatch.inner{background:transparent; border-radius:7px; box-shadow:var(--shadow)}
.swatch.inner::after{content:""; position:absolute; inset:26%; border-radius:3px;
  background:var(--c)}
.swatch.donut{
  border-radius:4px;
  -webkit-mask:
    linear-gradient(#000 0 0) center/46% 46% no-repeat,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:
    linear-gradient(#000 0 0) center/46% 46% no-repeat,
    linear-gradient(#000 0 0);
  mask-composite:exclude;
}
.swatch.inner{border-radius:4px}
.palette.dbl-pal{gap:6px}
.palette.dbl-pal .prow,
.palette.dbl-pal .prow.wrap{gap:clamp(3px,0.8vw,5px)}
.swatch.inner.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--c); transform:scale(1.06); z-index:1}
.swatch{
  flex:1 1 0; min-width:0; aspect-ratio:1; border-radius:14px; background:var(--c);
  position:relative; transition:transform .12s, box-shadow .12s;
  box-shadow:var(--shadow); overflow:visible;
}
.swatch::after{content:""; position:absolute; inset:-6px; z-index:1}
.swatch:active{transform:scale(.93)}
.swatch.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--c); transform:scale(1.06); z-index:1}
.swatch.done{opacity:.35; transform:scale(.82); transition:opacity .2s, transform .2s}
.swatch.shaped{background:transparent; box-shadow:none}
.swatch.shaped::before{content:""; position:absolute; inset:0; background:var(--c);
  clip-path:var(--clip); border-radius:3px}
.swatch.shaped.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--c)}
.swatch.shaped.done::before{opacity:.35}
.swatch .k{
  position:absolute; bottom:-17px; left:0; right:0; text-align:center;
  font-family:var(--mono); font-size:9px; color:var(--ink-faint);
}
.swatch .cnt{
  position:absolute; top:-6px; right:-6px; min-width:18px; height:18px;
  padding:0 4px; border-radius:9px; background:var(--panel);
  color:var(--ink); font-family:var(--sans); font-size:11px; font-weight:700;
  line-height:18px; text-align:center; box-shadow:var(--shadow);
  font-variant-numeric:tabular-nums; pointer-events:none;
}
.swatch.done .cnt{display:none}
.swatch.pat{box-shadow:var(--shadow),inset 0 0 0 1.5px var(--line-2)}
.swatch.pat.on{box-shadow:inset 0 0 0 1.5px var(--line-2),0 0 0 3px var(--bg),0 0 0 6px var(--ink); transform:scale(1.06); z-index:1}
.swatch.erase{
  background:var(--panel); border:1.5px solid var(--line-2); color:var(--ink-dim);
  display:grid; place-items:center; font-size:19px;
}

/* ================= modal ================= */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50;
  display:grid; place-items:center; padding:20px;
  animation:fade .18s ease-out;
}
.overlay.hide{display:none}
.modal{
  background:var(--panel); border-radius:18px; padding:24px 22px;
  width:100%; max-width:360px; box-shadow:0 20px 60px rgba(0,0,0,.28);
  max-height:86vh; overflow-y:auto;
}
.modal h2{font-size:20px; font-weight:800; letter-spacing:-.02em; margin-bottom:4px}
.modal .lede{font-size:13px; color:var(--ink-dim); line-height:1.5; margin-bottom:16px}
.modal ul{list-style:none; display:flex; flex-direction:column; gap:9px; margin-bottom:18px}
.modal li{font-size:13.5px; line-height:1.45; display:flex; gap:9px; align-items:flex-start}
.modal li b{font-weight:600}
.bullet{
  flex:0 0 6px; width:6px; height:6px; border-radius:2px; margin-top:6px; background:var(--ink-faint);
}
.btn{
  width:100%; padding:13px; border-radius:11px; font-size:14px; font-weight:700;
  background:var(--ink); color:var(--bg); transition:opacity .15s;
}
.btn:hover{opacity:.85}
.btn.ghost{background:var(--panel2); color:var(--ink); margin-top:8px}
.exp-icon{font-size:48px; margin-bottom:8px}
.exp-body{
  font-size:14px; line-height:1.55; color:var(--ink-dim);
  text-align:left; margin:12px 0 20px; padding:0 4px;
}
.confetti{position:fixed; inset:0; pointer-events:none; z-index:1000}

/* ================= toast ================= */
.toast{
  position:fixed; left:50%; bottom:calc(var(--safe-b) + 28px); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); font-size:13px; font-weight:600;
  padding:10px 20px; border-radius:10px; z-index:60; animation:fade .15s ease-out;
}
.toast.hide{display:none}

/* ================= animation ================= */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:.3}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes wave{0%,100%{transform:scale(1)}45%{transform:scale(1.16)}}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}50%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
@keyframes pulse-swatch{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes arrow-bounce{0%,100%{opacity:.4;transform:translate(-8px,-8px)}50%{opacity:1;transform:translate(0,0)}}
@media (prefers-reduced-motion:no-preference){
  .fill.new,.dot.new{animation:pop .22s cubic-bezier(.34,1.4,.64,1)}
  .cell.bad{animation:shake .3s}
  .cell.bad .fill{box-shadow:inset 0 0 0 3px var(--error)}
  .cell.won{animation:wave .5s ease-in-out}
}
@media (prefers-reduced-motion:reduce){
  .cell.bad .fill{box-shadow:inset 0 0 0 3px var(--error)}
}

.board.done .cell .fill,.board.done .cell .dot{opacity:1!important}
.board.sharp .cell:not(.given) .fill{border-radius:2px}
.board.sharp .cell:not(.given) .dot{border-radius:0}

/* ================= first-move tutorial ================= */
.cell.tutorial-glow{animation:pulse-glow 1.8s infinite}
.swatch.tutorial-pulse{animation:pulse-swatch 1.4s infinite; position:relative}
.tutorial-badge{
  position:absolute; top:-8px; right:-8px;
  background:var(--ring); color:var(--bg);
  border-radius:50%; width:24px; height:24px;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; z-index:10;
}

@media (min-width:520px){
  .board-wrap{max-width:400px}
  .palette{max-width:400px}
  h1{font-size:21px}
}
</style>

<div class="app">
<header>
  <div class="hdr-l">
    <button class="icon-btn" id="btnInfo" aria-label="About today">?</button>
    <button class="icon-btn" id="btnUndo" aria-label="Undo" disabled>↶</button>
  </div>
  <div>
    <h1>Chromoku</h1>
    <div class="sub" id="sub">Day 1 · 4×4 Sudoku</div>
  </div>
  <div class="hdr-r">
    <button class="icon-btn" id="btnHint" aria-label="Book (hint)">📖</button>
    <button class="icon-btn" id="btnReset" aria-label="Reset">↻</button>
  </div>
</header>

<div class="progress-bar" id="progressBar"></div>

<div class="play">
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="palette pal-pad" id="palette"></div>
</div>

<div class="overlay hide" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast hide" id="toast"></div>
</div>

<script>
"use strict";

/* ================= Tutorial metadata ================= */

const TUTORIAL_DAYS = [
  {
    day: 1,
    title: "4×4 Sudoku",
    icon: "🟨",
    givens: 12,
    n: 4,
    boxless: false,
    easyFirst: true,
    description: "Learn the basics: fill a 4×4 grid with 4 colours.",
    tutorial: {
      title: "Welcome to Chromoku!",
      body: "<b>Goal:</b> fill the grid so each row, column, and 2×2 box has all 4 colours exactly once.<br><br>" +
            "<b>How to play:</b> Tap a colour, then tap an empty cell to place it. Tap again to clear.",
      diagram: '<div style="margin:12px 0;padding:12px;background:var(--panel2);border-radius:8px;font-size:12px;text-align:center;line-height:1.6">' +

    }
  },

    day: 2,
    title: "4×4 Latin",
    icon: "🟧",
    givens: 12,
    n: 4,
    boxless: true,
    easyFirst: true,
    description: "No boxes — just rows and columns.",
    tutorial: {
      title: "Latin Mode",
      body: "<b>New rule:</b> No boxes now, just rows and columns.<br><br>" +
            "Each colour appears exactly once per row and per column.",
      diagram: '<div style="margin:12px 0;padding:12px;background:var(--panel2);border-radius:8px;font-size:12px;text-align:center;line-height:1.6">' +
               '✓ Each colour once per row & column<br>' +
               '✗ Boxes don\'t matter' +
               '</div>'
    }
  },
  {
    day: 3,
    title: "6×6 Sudoku",
    icon: "🟩",
    givens: 24,
    n: 6,
    boxless: false,
    easyFirst: true,
    description: "A bigger board with 6 colours and 3×2 boxes.",
    tutorial: {
      title: "Going Bigger",
      body: "<b>Now:</b> 6×6 grid with 6 colours.<br><br>" +
            "Boxes are 3 wide × 2 tall. Same rules: rows, columns, and boxes must each have all 6 colours.",
      diagram: '<div style="margin:12px 0;padding:12px;background:var(--panel2);border-radius:8px;font-size:12px;text-align:center;line-height:1.6">' +
               '3 wide × 2 tall boxes<br>' +
               '(instead of 2×2)' +
               '</div>'
    }
  },
  {
    day: 4,
    title: "6×6 Symbols",
    icon: "🟪",
    givens: 22,
    n: 6,
    boxless: false,
    easyFirst: true,
    description: "Same puzzle, different marks — try shapes instead of colours.",
    tutorial: {
      title: "Shape Marks",
      body: "<b>Same rules,</b> but marks are shapes instead of colours.<br><br>" +
            "Squares, circles, triangles — one per row/column/box, just like colours.",
      diagram: '<div style="margin:12px 0;padding:12px;background:var(--panel2);border-radius:8px;font-size:12px;text-align:center;line-height:1.6">' +
               '🟪 ⭕ 🔺 ◀️ ⬛ 🔷<br>' +
               'Each shape unique per row, column, box' +

    }
  },
  {
    day: 5,
    title: "4×4 Double",
    icon: "🍩",
    givens: 12,
    n: 4,
    boxless: false,
    double: true,
    easyFirst: true,
    description: "Two puzzles on one board — outer and inner layers.",
    tutorial: {
      title: "Double Layering",
      body: "<b>Two independent puzzles</b> on the same board: outer squares (big coloured areas) and inner squares (small dots).<br><br>" +
            "Top palette = outer; bottom palette = inner.",
      diagram: '<div style="margin:12px 0;padding:12px;background:var(--panel2);border-radius:8px;font-size:12px;text-align:center;line-height:1.6">' +
               '🟪 Big squares (outer Sudoku)<br>' +
               '🟩 Small dots (inner Sudoku)<br>' +
               'Completely separate puzzles' +
               '</div>'
    }
  },
  {
    day: 6,
    title: "9×9 Sudoku",
    icon: "⬜",
    givens: 50,
    n: 9,
    boxless: false,
    easyFirst: true,
    description: "The classic puzzle — 9×9 with 9 colours and 3×3 boxes.",
    tutorial: {
      title: "The Classic",
      body: "<b>Full 9×9 grid</b> with 9 colours and 3×3 boxes.<br><br>" +
            "Same rules, deeper logic: rows, columns, and boxes must each have all 9 colours.",
      diagram: '<div style="margin:12px 0;padding:12px;background:var(--panel2);border-radius:8px;font-size:12px;text-align:center;line-height:1.6">' +
               '9 rows × 9 columns<br>' +
               '9 boxes (3×3 each)<br>' +
               '9 colours' +
               '</div>'
    }
  },
  {
    day: 7,
    title: "10×10 Latin",
    icon: "🟥",
    givens: 50,
    n: 10,
    boxless: true,
    easyFirst: true,
    description: "The mastery puzzle — 10×10 with no boxes. Uniqueness only in rows and columns.",
    tutorial: {
      title: "Mastery",
      body: "<b>Final challenge:</b> 10×10 Latin grid with 10 colours, no boxes.<br><br>" +
            "Only rows and columns matter. You're ready for the full game after this.",
      diagram: '<div style="margin:12px 0;padding:12px;background:var(--panel2);border-radius:8px;font-size:12px;text-align:center;line-height:1.6">' +
               '10 rows × 10 columns<br>' +
               '10 colours<br>' +
               'No boxes' +
               '</div>'
    }
  },
];

/* ================= colour palette (Kelly's 22) ================= */

const HUES = [
  { hex:"#c10020", label:"Red"       },
  { hex:"#007d34", label:"Green"     },
  { hex:"#00538a", label:"Blue"      },
  { hex:"#f4c800", label:"Yellow"    },
  { hex:"#ff6800", label:"Orange"    },
  { hex:"#803e75", label:"Purple"    },
  { hex:"#a6bdd7", label:"Ice"       },
  { hex:"#232c16", label:"Dark Olive" },
  { hex:"#593315", label:"Brown"     },
  { hex:"#ffb300", label:"Gold"      },
];

const SHAPES = [
  { label:"Square",    clip:"inset(2%)" },
  { label:"Circle",    clip:"circle(50%)" },
  { label:"Triangle",  clip:"polygon(50% 4%,96% 96%,4% 96%)" },
  { label:"Diamond",   clip:"polygon(50% 2%,98% 50%,50% 98%,2% 50%)" },
  { label:"Star",      clip:"polygon(50% 2%,61% 37%,98% 37%,68% 59%,79% 95%,50% 73%,21% 95%,32% 59%,2% 37%,39% 37%)" },
  { label:"Pentagon",  clip:"polygon(50% 2%,98% 38%,79% 96%,21% 96%,2% 38%)" },
  { label:"Hexagon",   clip:"polygon(25% 3%,75% 3%,98% 50%,75% 97%,25% 97%,2% 50%)" },
  { label:"Cross",     clip:"polygon(34% 2%,66% 2%,66% 34%,98% 34%,98% 66%,66% 66%,66% 98%,34% 98%,34% 66%,2% 66%,2% 34%,34% 34%)" },
  { label:"Down",      clip:"polygon(4% 4%,96% 4%,50% 96%)" },
  { label:"Chevron",   clip:"polygon(4% 4%,50% 4%,96% 50%,50% 96%,4% 96%,42% 50%)" },
];

/* ================= PRNG ================= */

function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffled(arr, rng){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ================= puzzle engine ================= */

function boxDims(n, rotate){
  const h = Math.floor(Math.sqrt(n));
  for (let bh = h; bh >= 1; bh--) if (n % bh === 0) {
    const dims = { bh, bw: n / bh };
    return rotate && dims.bh !== dims.bw ? { bh: dims.bw, bw: dims.bh } : dims;
  }
  return { bh:1, bw:n };
}

function legal(grid, n, idx, val, boxless){
  const { bw, bh } = boxDims(n);
  const r = Math.floor(idx / n), c = idx % n;
  for (let i = 0; i < n; i++){
    if (i !== c && grid[r * n + i] === val) return false;
    if (i !== r && grid[i * n + c] === val) return false;
  }
  if (boxless) return true;
  const r0 = Math.floor(r / bh) * bh, c0 = Math.floor(c / bw) * bw;
  for (let rr = r0; rr < r0 + bh; rr++)
    for (let cc = c0; cc < c0 + bw; cc++)
      if ((rr !== r || cc !== c) && grid[rr * n + cc] === val) return false;
  return true;
}

function randomSolvedGrid(n, rng, boxless){
  const g = new Array(n * n).fill(null);
  (function rec(){
    const i = g.indexOf(null);
    if (i === -1) return true;
    for (const v of shuffled([...Array(n).keys()], rng)){
      if (legal(g, n, i, v, boxless)){
        g[i] = v;
        if (rec()) return true;
        g[i] = null;
      }
    }
    return false;
  })();
  return g;
}

function countSolutions(grid, n, cap, boxless){
  const { bw, bh } = boxDims(n), FULL = (1 << n) - 1, per = n / bw;
  const g = grid.slice();
  const rows = new Array(n).fill(0), cols = new Array(n).fill(0), box = new Array(n).fill(0);
  const bi = new Int32Array(n * n);
  for (let i = 0; i < n * n; i++) bi[i] = ((((i / n) | 0) / bh) | 0) * per + (((i % n) / bw) | 0);
  for (let i = 0; i < n * n; i++){
    const v = g[i];
    if (v !== null && v !== undefined){
      const b = 1 << v;
      rows[(i / n) | 0] |= b; cols[i % n] |= b; if (!boxless) box[bi[i]] |= b;
    }
  }
  let found = 0;
  (function rec(){
    if (found >= cap) return;
    let best = -1, bestMask = 0, bestCnt = n + 1;
    for (let i = 0; i < n * n; i++){
      if (g[i] !== null && g[i] !== undefined) continue;
      const avail = FULL & ~(rows[(i / n) | 0] | cols[i % n] | (boxless ? 0 : box[bi[i]]));
      if (avail === 0) return;
      let cnt = 0, x = avail;
      while (x){ x &= x - 1; cnt++; }
      if (cnt < bestCnt){ bestCnt = cnt; best = i; bestMask = avail; if (cnt === 1) break; }
    }
    if (best === -1){ found++; return; }
    const r = (best / n) | 0, c = best % n, b = bi[best];
    let mask = bestMask;
    while (mask){
      const bit = mask & -mask; mask ^= bit;
      g[best] = 31 - Math.clz32(bit);
      rows[r] |= bit; cols[c] |= bit; if (!boxless) box[b] |= bit;
      rec();
      rows[r] &= ~bit; cols[c] &= ~bit; if (!boxless) box[b] &= ~bit; g[best] = null;
      if (found >= cap) return;
    }
  })();
  return found;
}

function removalOrder(n, rng, boxless){
  if (boxless) return shuffled([...Array(n * n).keys()], rng);
  const { bw, bh } = boxDims(n), per = n / bw, buckets = [];
  for (let b = 0; b < n; b++){
    const r0 = ((b / per) | 0) * bh, c0 = (b % per) * bw, cells = [];
    for (let r = r0; r < r0 + bh; r++)
      for (let c = c0; c < c0 + bw; c++) cells.push(r * n + c);
    buckets.push(shuffled(cells, rng));
  }
  const order = [];
  for (let k = 0; k < n; k++)
    for (const b of shuffled([...Array(n).keys()], rng))
      if (buckets[b][k] !== undefined) order.push(buckets[b][k]);
  return order;
}

function generatePuzzle(seed, n, givens, boxless){
  const rng = mulberry32(seed);
  const solution = randomSolvedGrid(n, rng, boxless);
  const puzzle = solution.slice();
  const target = n * n - givens;
  let removed = 0;

  for (const i of removalOrder(n, rng, boxless)){
    if (removed >= target) break;
    const keep = puzzle[i];
    puzzle[i] = null;
    if (countSolutions(puzzle, n, 2, boxless) === 1) removed++;
    else puzzle[i] = keep;
  }
  return { solution, puzzle, givens:puzzle.map(v => v !== null) };
}

/* ================= first-move cascade calculation ================= */

function countFilledAfterMove(puzzle, solution, n, idx, val, boxless){
  const test = puzzle.slice();
  test[idx] = val;

  // Simulate a simple constraint-propagation: count filled cells
  let count = 0;
  for (let i = 0; i < n * n; i++) {
    if (test[i] !== null && test[i] !== undefined) count++;
  }

  // Check if this move would cascade (count cells that have only 1 legal value)
  const { bw, bh } = boxDims(n);
  for (let i = 0; i < n * n; i++){
    if (test[i] !== null && test[i] !== undefined) continue;
    let possibleCount = 0;
    for (let v = 0; v < n; v++){
      if (legal(test, n, i, v, boxless)){
        possibleCount++;
      }
    }
    // Count forced cells
    if (possibleCount === 1) count += 0.5;
  }
  return count;
}

function findBestFirstMove(puzzle, solution, n, boxless){
  // Find which (cell, value) pair fills the most puzzle
  let bestCell = -1, bestVal = -1, bestScore = -1;

  for (let i = 0; i < n * n; i++){
    if (puzzle[i] !== null && puzzle[i] !== undefined) continue;
    for (let v = 0; v < n; v++){
      if (!legal(puzzle, n, i, v, boxless)) continue;
      const score = countFilledAfterMove(puzzle, solution, n, i, v, boxless);
      if (score > bestScore){
        bestScore = score;
        bestCell = i;
        bestVal = v;
      }
    }
  }

  return { cell: bestCell, value: bestVal, score: bestScore };
}

const state = {

  dbl: false,
  layers: [],
  sel: null,
  erase: false,

  firstMoveLayer: 0,
  moveCount: 0,
};

const LS_TUTORIAL = "chromoku.tutorial.v1";
const LS_VERSION = "chromoku.tutorial.version";

function loadProgress(){
  try {
    const p = JSON.parse(localStorage.getItem(LS_TUTORIAL) || "{}");
    return p || {};
  } catch {
    return {};
  }
}

function saveProgress(){
  const p = loadProgress();
  p["day" + state.day] = { done: state.done, moves: state.moveCount };
  try {
    localStorage.setItem(LS_TUTORIAL, JSON.stringify(p));
  } catch {}
}

function clearTutorialIfFresh(){
  const version = localStorage.getItem(LS_VERSION);
  if (version !== "3") {
    try {
      localStorage.removeItem(LS_TUTORIAL);
      localStorage.setItem(LS_VERSION, "3");
    } catch {}
  }
}

function hasSeenPuzzle(){
  const p = loadProgress();
  return p["day" + state.day] && p["day" + state.day].done;
}

function startFirstMoveGuide(){
  if (hasSeenPuzzle() || state.showingFirstMoveGuide) return;
  state.showingFirstMoveGuide = true;

  const meta = TUTORIAL_DAYS[state.day - 1];
  if (meta && meta.easyFirst){
    const layer = state.firstMoveLayer || 0;
    const best = findBestFirstMove(state.layers[layer].grid, state.layers[layer].solution, state.n, state.boxless);
    if (best.cell >= 0 && best.value >= 0){
      state.firstMoveTarget = { ...best, layer };
      animateFirstMove();
    }
  }
}

function stopFirstMoveGuide(){
  state.showingFirstMoveGuide = false;
  removeFirstMoveAnimations();
}

function animateFirstMove(){
  if (!state.showingFirstMoveGuide || !state.firstMoveTarget) return;

  const cellIdx = state.firstMoveTarget.cell;
  const val = state.firstMoveTarget.value;
  const layer = state.firstMoveTarget.layer || 0;

  const cellEl = document.querySelector('[data-i="' + cellIdx + '"]');
  // For double puzzles, select swatch with data-layer attribute
  const swatchEl = state.dbl
    ? document.querySelector('[data-c="' + val + '"][data-layer="' + layer + '"]')
    : document.querySelector('[data-c="' + val + '"]');

  if (cellEl && swatchEl) {
    cellEl.classList.add("tutorial-glow");
    swatchEl.classList.add("tutorial-pulse");
  }
}

function removeFirstMoveAnimations(){
  document.querySelectorAll(".tutorial-glow").forEach(el => el.classList.remove("tutorial-glow"));
  document.querySelectorAll(".tutorial-pulse").forEach(el => el.classList.remove("tutorial-pulse"));
}

function checkFirstMoveComplete(cellIdx, val){
  if (!state.showingFirstMoveGuide || !state.firstMoveTarget) return false;
  if (cellIdx === state.firstMoveTarget.cell && val === state.firstMoveTarget.value){
    const isDouble = state.dbl && state.firstMoveLayer < 1;

    if (isDouble){
      // For double puzzles: complete outer, then show inner
      state.firstMoveLayer = 1;
      removeFirstMoveAnimations();
      fireConfetti(40);
      openModal(
        '<h2 style="text-align:center">🍩 Outer layer done!</h2>' +
        '<p class="lede" style="text-align:center">Now try the inner layer (small dots)...</p>' +
        '<button class="btn" id="mGo">Tap inner swatch</button>'
      );
      document.getElementById("mGo").onclick = () => {
        closeModal();
        setTimeout(() => startFirstMoveGuide(), 300);
      };
      return true;
    } else {
      // Single layer: complete
      stopFirstMoveGuide();
      fireConfetti();
      openModal(
        '<h2 style="text-align:center">🎉 You got it!</h2>' +
        '<p class="lede" style="text-align:center">One move, and look what happened. Keep placing colours to solve the puzzle!</p>' +
        '<button class="btn" id="mGo">Continue</button>'
      );
      document.getElementById("mGo").onclick = closeModal;
      return true;
    }
  }
  return false;
}

/* ================= game setup ================= */

function loadDay(dayNum){
  state.day = dayNum;
  const meta = TUTORIAL_DAYS[dayNum - 1];
  if (!meta) return;

  state.n = meta.n;
  state.boxless = meta.boxless;
  state.dbl = meta.double || false;
  state.done = false;
  state.sel = null;
  state.erase = false;
  state.history = [];
  state.showingFirstMoveGuide = false;
  state.firstMoveTarget = null;
  state.firstMoveLayer = 0;
  state.moveCount = 0;

  // Generate puzzle with fixed seed
  const seed = dayNum * 12345;

  if (state.dbl){
    // For double puzzles, generate two independent layers
    const p1 = generatePuzzle(seed, state.n, meta.givens, state.boxless);
    const p2 = generatePuzzle(seed + 1, state.n, meta.givens, state.boxless);
    state.layers = [
      {
        grid: p1.puzzle.slice(),
        solution: p1.solution.slice(),
        givens: p1.givens.slice(),
      },
      {
        grid: p2.puzzle.slice(),
        solution: p2.solution.slice(),
        givens: p2.givens.slice(),
      }
    ];
  } else {
    const p = generatePuzzle(seed, state.n, meta.givens, state.boxless);
    state.layers = [{
      grid: p.puzzle.slice(),
      solution: p.solution.slice(),
      givens: p.givens.slice(),
    }];
  }

  render();
  paintUndo();
  showTutorialIfNeeded();
}

function showTutorialIfNeeded(){
  const p = loadProgress();
  const meta = TUTORIAL_DAYS[state.day - 1];
  if (meta && !p["day" + state.day]){
    showTutorial(meta);
    state.showedTutorial = true;
  }
}

function showTutorial(meta){
  openModal(
    '<div style="text-align:center; margin-bottom:16px; font-size:48px">' + meta.icon + '</div>' +
    '<h2>' + meta.tutorial.title + '</h2>' +
    '<p class="lede">' + meta.tutorial.body + '</p>' +
    (meta.tutorial.diagram ? meta.tutorial.diagram : '') +

function showBook(){

  openModal(

    '<p class="lede">' + meta.description + '</p>' +

/* ================= conflict detection ================= */

function conflictsAt(L, idx){
  const n = state.n, g = state.layers[L].grid, v = g[idx];
  const out = new Set();
  if (v === null || v === undefined) return out;
  const { bw, bh } = boxDims(n);
  const r = Math.floor(idx / n), c = idx % n;
  for (let i = 0; i < n; i++){
    if (i !== c && g[r * n + i] === v) out.add(r * n + i);
    if (i !== r && g[i * n + c] === v) out.add(i * n + c);
  }
  if (!state.boxless){
    const r0 = Math.floor(r / bh) * bh, c0 = Math.floor(c / bw) * bw;
    for (let rr = r0; rr < r0 + bh; rr++)
      for (let cc = c0; cc < c0 + bw; cc++){
        const j = rr * n + cc;
        if (j !== idx && g[j] === v) out.add(j);
      }
  }
  if (out.size) out.add(idx);
  return out;
}

function isSolved(){
  for (let L = 0; L < state.layers.length; L++){
    const g = state.layers[L].grid;
    if (g.some(v => v === null || v === undefined)) return false;
    for (let i = 0; i < g.length; i++) if (conflictsAt(L, i).size) return false;
  }
  return true;
}

/* ================= rendering ================= */

function getMarks(n, isInner){
  const meta = TUTORIAL_DAYS[state.day - 1];
  if (meta && meta.day === 4){
    // Day 4 uses shapes
    return SHAPES.slice(0, n).map((sh, i) => ({
      hex: (HUES[i] && HUES[i].hex) || "var(--ink)",
      clip: sh.clip,
      label: sh.label,
    }));
  }
  return HUES.slice(0, n);
}

function renderBoard(){
  const n = state.n;
  const { bw, bh } = boxDims(n);
  const boxesPerRow = state.boxless ? n : n / bw, boxRows = state.boxless ? n : n / bh;
  let html = "";

  if (state.boxless){
    for (let i = 0; i < n * n; i++){
      let inner = "";
      for (let L = 0; L < state.layers.length; L++){
        const v = state.layers[L].grid[i];
        if (v !== null && v !== undefined){
          const mark = getMarks(n, L > 0)[v];
          const st = mark.clip
            ? "--c:" + mark.hex + ";clip-path:" + mark.clip + ";border-radius:3px"
            : "--c:" + mark.hex;
          if (L === 0){
            inner = '<div class="fill" style="' + st + '"></div>';
          } else {
            inner += '<div class="dot" style="' + st + '"></div>';
          }
        }
      }
      html += '<div class="cell' + (state.layers[0].givens[i] ? " given" : "")
            + '" data-i="' + i + '">' + inner + "</div>";
    }
  } else {
    for (let b = 0; b < n; b++){
      const r0 = Math.floor(b / boxesPerRow) * bh, c0 = (b % boxesPerRow) * bw;
      let inner = "";
      for (let r = r0; r < r0 + bh; r++){
        for (let c = c0; c < c0 + bw; c++){
          const i = r * n + c;
          let cellInner = "";
          for (let L = 0; L < state.layers.length; L++){
            const v = state.layers[L].grid[i];
            if (v !== null && v !== undefined){
              const mark = getMarks(n, L > 0)[v];
              const st = mark.clip
                ? "--c:" + mark.hex + ";clip-path:" + mark.clip + ";border-radius:3px"
                : "--c:" + mark.hex;
              if (L === 0){
                cellInner = '<div class="fill" style="' + st + '"></div>';
              } else {
                cellInner += '<div class="dot" style="' + st + '"></div>';
              }
            }
          }
          inner += '<div class="cell' + (state.layers[0].givens[i] ? " given" : "")
                 + '" data-i="' + i + '">' + cellInner + "</div>";
        }
      }
      html += '<div class="box" style="grid-template-columns:repeat(' + bw + ',1fr);'
            + 'grid-template-rows:repeat(' + bh + ',1fr)">' + inner + "</div>";
    }
  }

  const board = document.getElementById("board");
  const sc = n <= 4 ? [12, 4, 8] : n <= 9 ? [11, 2, 5] : [7, 1, 3];
  board.style.setProperty("--bgap", sc[0] + "px");
  board.style.setProperty("--cgap", sc[1] + "px");
  board.style.setProperty("--crad", sc[2] + "px");
  board.style.gridTemplateColumns = "repeat(" + boxesPerRow + ",1fr)";
  board.style.gridTemplateRows = "repeat(" + boxRows + ",1fr)";
  board.classList.remove("done");
  if (state.dbl) board.classList.add("dbl"); else board.classList.remove("dbl");
  board.innerHTML = html;
  board.querySelectorAll("[data-i]").forEach(el => {
    el.onclick = () => onCell(parseInt(el.dataset.i, 10));
  });
  if (state.done) markWon();
}

function renderPalette(){
  const marks = getMarks(state.n);
  const counts = new Array(state.n).fill(0);
  for (const v of state.layers[0].grid) if (v !== null && v !== undefined) counts[v]++;

  let html = "";

  if (state.dbl){
    // Outer layer
    let outerHtml = '<label style="font-size:11px;color:var(--ink-faint);font-weight:600;margin-bottom:4px;display:block">🍩 Big Squares (Outer)</label>';
    const swatches1 = marks.map((c, i) => {
      const placed = counts[i];
      const done = placed >= state.n;
      const remaining = Math.max(0, state.n - placed);
      const shaped = !!c.clip && state.day !== 1;
      return '<button class="swatch donut' + (done ? " done" : "")
        + (state.sel && state.sel.layer === 0 && state.sel.colour === i ? " on" : "")
        + (shaped ? " shaped" : "")
        + '" data-c="' + i + '" data-layer="0" style="' + (c.clip ? "--c:" + c.hex + ";--clip:" + c.clip : "--c:" + c.hex)
        + '" aria-label="' + c.label + (remaining > 0 ? ", " + remaining + " remaining" : ", done") + '">'
        + (remaining > 0 ? '<span class="cnt">' + remaining + "</span>" : "")
        + (state.n <= 4 ? '<span class="k">' + (i + 1) + "</span>" : "")
        + "</button>";
    });
    const perRow = Math.ceil(swatches1.length / 1);
    for (let k = 0; k < swatches1.length; k += perRow)
      outerHtml += '<div class="prow">' + swatches1.slice(k, k + perRow).join("") + "</div>";

    // Inner layer
    let innerHtml = '<label style="font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:8px;margin-bottom:4px;display:block">🎯 Small Dots (Inner)</label>';
    const counts2 = new Array(state.n).fill(0);
    for (const v of state.layers[1].grid) if (v !== null && v !== undefined) counts2[v]++;
    const swatches2 = marks.map((c, i) => {
      const placed = counts2[i];
      const done = placed >= state.n;
      const remaining = Math.max(0, state.n - placed);
      const shaped = !!c.clip && state.day !== 1;
      return '<button class="swatch inner' + (done ? " done" : "")
        + (state.sel && state.sel.layer === 1 && state.sel.colour === i ? " on" : "")
        + (shaped ? " shaped" : "")
        + '" data-c="' + i + '" data-layer="1" style="' + (c.clip ? "--c:" + c.hex + ";--clip:" + c.clip : "--c:" + c.hex)
        + '" aria-label="' + c.label + (remaining > 0 ? ", " + remaining + " remaining" : ", done") + '">'
        + (remaining > 0 ? '<span class="cnt">' + remaining + "</span>" : "")
        + (state.n <= 4 ? '<span class="k">' + (i + 1) + "</span>" : "")
        + "</button>";
    });
    for (let k = 0; k < swatches2.length; k += perRow)
      innerHtml += '<div class="prow">' + swatches2.slice(k, k + perRow).join("") + "</div>";

    const p = document.getElementById("palette");
    p.className = "palette pal-pad dbl-pal";
    p.innerHTML = outerHtml + innerHtml;
  } else {
    const swatches = marks.map((c, i) => {
      const placed = counts[i];
      const done = placed >= state.n;
      const remaining = Math.max(0, state.n - placed);
      const shaped = !!c.clip && state.day !== 1;
      return '<button class="swatch' + (done ? " done" : "")
        + (state.sel && state.sel.colour === i ? " on" : "")
        + (shaped ? " shaped" : "")
        + '" data-c="' + i + '" style="' + (c.clip ? "--c:" + c.hex + ";--clip:" + c.clip : "--c:" + c.hex)
        + '" aria-label="' + c.label + (remaining > 0 ? ", " + remaining + " remaining" : ", done") + '">'
        + (remaining > 0 ? '<span class="cnt">' + remaining + "</span>" : "")
        + (state.n <= 4 ? '<span class="k">' + (i + 1) + "</span>" : "")
        + "</button>";
    });
    const nRows = state.n > 4 ? 2 : 1;
    const perRow = Math.ceil(swatches.length / nRows);
    for (let k = 0; k < swatches.length; k += perRow)
      html += '<div class="prow' + (state.n > 4 ? " wrap" : "") + '">'
            + swatches.slice(k, k + perRow).join("") + "</div>";

    const p = document.getElementById("palette");
    p.className = "palette pal-pad" + (state.n > 4 ? " tight" : "");
    p.innerHTML = html;
  }

  const allSwatches = state.dbl
    ? document.querySelectorAll('[data-c][data-layer]')
    : document.querySelectorAll('[data-c]');
  allSwatches.forEach(b => {
    b.onclick = () => {
      const layer = state.dbl ? +b.dataset.layer : 0;
      const i = +b.dataset.c;
      const same = state.sel && state.sel.layer === layer && state.sel.colour === i;
      state.sel = same ? null : { layer, colour: i };
      state.erase = false;
      renderPalette();
    };
  });
}

function renderSub(){
  const meta = TUTORIAL_DAYS[state.day - 1];

function renderProgressBar(){

function paintCell(i){
  const el = document.querySelector('[data-i="' + i + '"]');
  if (!el) return;
  let inner = "";
  for (let L = 0; L < state.layers.length; L++){
    const v = state.layers[L].grid[i];
    if (v !== null && v !== undefined){
      const mark = getMarks(state.n, L > 0)[v];
      const st = mark.clip
        ? "--c:" + mark.hex + ";clip-path:" + mark.clip + ";border-radius:3px"
        : "--c:" + mark.hex;
      if (L === 0){
        inner = '<div class="fill" style="' + st + '"></div>';
      } else {
        inner += '<div class="dot" style="' + st + '"></div>';
      }
    }
  }
  el.innerHTML = inner;
}

function markWon(){
  const n = state.n;
  document.getElementById("board").classList.add("done");
  document.querySelectorAll("[data-i]").forEach(el => {
    const i = +el.dataset.i, r = Math.floor(i / n), c = i % n;
    el.style.animationDelay = ((r + c) * 70) + "ms";
    el.classList.add("won");
  });
}

function flashConflicts(set){
  set.forEach(i => {
    const el = document.querySelector('[data-i="' + i + '"]');
    if (!el) return;
    el.classList.add("bad");
    setTimeout(() => el.classList.remove("bad"), 620);
  });
}

function paintUndo(){
  const b = document.getElementById("btnUndo");
  if (b) b.disabled = state.done || state.history.length === 0;
}

/* ================= interaction ================= */

function placeColour(L, i, val){
  const prev = state.layers[L].grid[i];
  if (prev !== val) {
    state.history.push({ L, i, prev });
    state.moveCount++;
  }
  state.layers[L].grid[i] = val;
  paintCell(i);
  renderPalette();
  stopFirstMoveGuide();

  if (val !== null){
    const bad = conflictsAt(L, i);
    if (bad.size) flashConflicts(bad);
  }

  // Check if this was the first-move target for easy puzzles
  if (L === 0 && state.showingFirstMoveGuide && state.firstMoveTarget){
    if (checkFirstMoveComplete(i, val)){
      return;
    }
  }

  if (isSolved()) win();
}

function onCell(i){
  if (state.done) return;

  if (state.erase){
    for (let L = 0; L < state.layers.length; L++){
      const prev = state.layers[L].grid[i];
      if (!state.layers[L].givens[i] && prev !== null){
        state.history.push({ L, i, prev });
        state.layers[L].grid[i] = null;
        state.moveCount++;
      }
    }
    paintCell(i);
    renderPalette();
    return;
  }

  if (state.sel === null){ toast("Pick a colour first"); return; }
  const L = state.sel.layer;
  if (state.layers[L].givens[i]) return;
  placeColour(L, i, state.layers[L].grid[i] === state.sel.colour ? null : state.sel.colour);
}

function undo(){
  if (state.done || !state.history.length) return;
  const move = state.history.pop();
  state.layers[move.L].grid[move.i] = move.prev;
  paintCell(move.i);
  renderPalette();
  paintUndo();
}

function resetDay(){
  const meta = TUTORIAL_DAYS[state.day - 1];
  if (meta){
    const seed = state.day * 12345;
    if (state.dbl){
      const p1 = generatePuzzle(seed, state.n, meta.givens, state.boxless);
      const p2 = generatePuzzle(seed + 1, state.n, meta.givens, state.boxless);
      state.layers[0].grid = p1.puzzle.slice();
      state.layers[1].grid = p2.puzzle.slice();
    } else {
      const p = generatePuzzle(seed, state.n, meta.givens, state.boxless);
      state.layers[0].grid = p.puzzle.slice();
    }
    state.done = false;
    state.sel = null;
    state.history = [];
    state.moveCount = 0;
    state.showingFirstMoveGuide = false;
    state.firstMoveTarget = null;
    render();
    startFirstMoveGuide();
  }
}

/* ================= win ================= */

function win(){
  state.done = true;
  stopFirstMoveGuide();
  saveProgress();
  setTimeout(() => {
    fireConfetti();
    const p = loadProgress();
    const nextDay = state.day + 1;
    const nextMeta = nextDay <= 7 ? TUTORIAL_DAYS[nextDay - 1] : null;
    const nextTitle = nextMeta ? nextMeta.title : null;
    const currentMeta = TUTORIAL_DAYS[state.day - 1];
    openModal(
      '<h2>' + currentMeta.title + ' complete!</h2>' +
      '<p class="lede">Solved in ' + state.moveCount + ' move' + (state.moveCount === 1 ? '' : 's') + '</p>' +
      '<p class="lede">' +
        (nextDay <= 7
          ? 'Ready for <b>' + nextTitle + '</b>?'
          : 'You\'ve completed the tutorial! Ready for the <b>full game</b>?') +
      '</p>' +
      (nextDay <= 7
        ? '<button class="btn" id="mNext">Start ' + nextTitle + '</button>' +
          '<button class="btn ghost" id="mReview">Practice again</button>'
        : '<button class="btn" id="mPlay">Play full Chromoku</button>') +
      '<button class="btn ghost" id="mDone">Later</button>'
    );
    if (nextDay <= 7){
      document.getElementById("mNext").onclick = () => { closeModal(); loadDay(nextDay); };
      document.getElementById("mReview").onclick = closeModal;
    } else {
      document.getElementById("mPlay").onclick = () => { window.location.href = "index.html"; };
    }
    document.getElementById("mDone").onclick = closeModal;
  }, 1100);
}

/* ================= confetti ================= */

function fireConfetti(){
  const cvs = document.createElement("canvas");
  cvs.className = "confetti";
  cvs.width = window.innerWidth;
  cvs.height = window.innerHeight;
  document.body.appendChild(cvs);
  const ctx = cvs.getContext("2d");
  const colours = HUES.slice(0, Math.min(9, HUES.length)).map(h => h.hex);
  const N = 120;
  const particles = [];
  for (let i = 0; i < N; i++){
    particles.push({
      x: cvs.width * 0.5 + (Math.random() - 0.5) * cvs.width * 0.4,
      y: cvs.height * 0.45,
      vx: (Math.random() - 0.5) * 12,
      vy: -Math.random() * 14 - 4,
      w: 4 + Math.random() * 6,
      h: 3 + Math.random() * 4,
      rot: Math.random() * Math.PI * 2,
      rv: (Math.random() - 0.5) * 0.3,
      col: colours[Math.floor(Math.random() * colours.length)],
      grav: 0.18 + Math.random() * 0.06,
      life: 1,
    });
  }
  let raf;
  function tick(){
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    let alive = false;
    for (const p of particles){
      p.x += p.vx; p.y += p.vy;
      p.vy += p.grav;
      p.vx *= 0.99;
      p.rot += p.rv;
      p.life -= 0.006;
      if (p.life <= 0 || p.y > cvs.height + 20) continue;
      alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (alive) raf = requestAnimationFrame(tick);
    else cvs.remove();
  }
  raf = requestAnimationFrame(tick);
  setTimeout(() => { cancelAnimationFrame(raf); cvs.remove(); }, 4000);
}

/* ================= modal ================= */

function openModal(html){
  const modal = document.getElementById("modal");
  modal.innerHTML = html;
  document.getElementById("overlay").classList.remove("hide");
}

function closeModal(){
  document.getElementById("overlay").classList.add("hide");
}

function toast(text){
  const el = document.getElementById("toast");
  el.textContent = text;
  el.classList.remove("hide");
  setTimeout(() => el.classList.add("hide"), 2000);
}

/* ================= keyboard ================= */

document.addEventListener("keydown", e => {
  if (!document.getElementById("overlay").classList.contains("hide")){
    if (e.key === "Escape") closeModal();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){
    e.preventDefault();
    undo();
    return;
  }
  const k = parseInt(e.key, 10);
  if (k >= 1 && k <= Math.min(state.n, 9)){
    state.sel = { layer: 0, colour: k - 1 };
    state.erase = false;
    renderPalette();
  }
  else if (e.key === "Backspace" || e.key === "Delete"){
    state.erase = true;
    state.sel = null;
    renderPalette();
  }
});

/* ================= ui events ================= */

document.getElementById("btnInfo").onclick = () => {
  const meta = TUTORIAL_DAYS[state.day - 1];
  if (meta) showTutorial(meta.tutorial || meta);
};

document.getElementById("btnUndo").onclick = undo;

document.getElementById("btnHint").onclick = showBook;

document.getElementById("btnReset").onclick = () => {
  const meta = TUTORIAL_DAYS[state.day - 1];
  const title = meta ? meta.title : "puzzle";
  openModal(
    '<h2>Reset ' + title + '?</h2>' +
    '<p class="lede">Clear all your placements and start over.</p>' +
    '<button class="btn" id="mYes">Yes, reset</button>' +
    '<button class="btn ghost" id="mNo">Cancel</button>'
  );
  document.getElementById("mYes").onclick = () => { closeModal(); resetDay(); };
  document.getElementById("mNo").onclick = closeModal;
};

/* ================= init ================= */

clearTutorialIfFresh();
loadDay(1);
</script>
