  // Attribute is data-th, not data-theme: the latter also matches <html>.
  const seg = (opts, cur) => '<div class="seg">' + opts.map(o =>
    '<button class="' + (o[0] === cur ? "on" : "") + '" data-th="' + o[0] + '">'
    + o[1] + "</button>").join("") + "</div>";

  // Only offer sets that can actually produce enough marks for this grid.
  const usable = Object.entries(MARKSETS).filter(([id]) => setFits(id, state.n));
  const palOpts = usable.map(([id, s]) => {
    const prev = s.build(Math.min(4, state.n)).map(mk =>
      '<i style="' + (mk.kind === "pattern"
        // Match exact tile size — some patterns use non-default bgS/bgP.
        ? "background-color:var(--panel2);background-image:" + mk.bg
          + ";background-size:" + (mk.bgS||TILE)
          + (mk.bgP ? ";background-position:" + mk.bgP : "")
          + ";box-shadow:inset 0 0 0 1px var(--line-2)"
        : "background:" + mk.hex)
      + (mk.clip ? ";clip-path:" + mk.clip : "") + '"></i>').join("");
    return '<button class="' + (id === activePalette ? "on" : "") + '" data-pal="' + id + '">'
      + s.name + '<span class="pal-prev">' + prev + "</span></button>";
  }).join("");

  openModal(
    "<h2>Settings</h2>"
    + '<p class="lede">Patterns work without relying on colour vision.</p>'
    + '<div class="fld">Marks</div><div class="seg">' + palOpts + "</div>"
    + '<div class="fld">Theme</div>'
    + seg([["auto","Auto"],["light","Light"],["dark","Dark"]], theme)
    + '<div class="fld" style="margin-top:4px">Gameplay</div>'
    + '<div class="toggle-row">'
    + '<div><div class="toggle-lbl">Fade completed</div>'
    + '<div class="toggle-desc">Dim rows, columns and boxes when filled</div></div>'
    + '<button class="toggle-sw' + (load(LS_FADE, true) ? " on" : "") + '" id="togFade" aria-label="Fade completed units"></button>'
    + '</div>'
    + '<div class="toggle-row">'
    + '<div><div class="toggle-lbl">Rounded marks</div>'
    + '<div class="toggle-desc">Your guesses have rounded corners</div></div>'
    + '<button class="toggle-sw' + (load(LS_ROUND, true) ? " on" : "") + '" id="togRound" aria-label="Rounded mark corners"></button>'
    + '</div>'
    + '<div class="toggle-row">'
    + '<div><div class="toggle-lbl">Admin tools</div>'
    + '<div class="toggle-desc">Level jump, date pin, progress reset</div></div>'
    + '<button class="toggle-sw' + (adminMode ? " on" : "") + '" id="togAdmin" aria-label="Admin tools"></button>'
    + '</div>'
    + (adminMode
        ? '<div class="fld">Debug — puzzle date</div>'
          + '<div class="dbg"><input type="date" id="dbgDate" value="' + dayToISO(state.day) + '">'
          + '<button id="dbgToday">Today</button></div>'
          + '<p class="lede" style="margin-top:-8px">Puzzle #' + state.day
          + (load(LS_DAY, null) !== null ? " · pinned" : " · live") + "</p>"
          + '<div class="fld">Debug — jump to level</div>'
          + '<div class="dbg"><input type="number" id="dbgLevel" min="1" max="500" value="'
          + progress().level + '"><button id="dbgGo">Go</button>'
          + '<button id="dbgReset">Reset</button></div>'
          + '<p class="lede" style="margin-top:-8px">Reset clears levels, stars and lives; the daily is not affected.</p>'
        : "")
    + '<button class="btn ghost" id="copyStats">Copy my stats</button>' 
    + '<button class="btn" onclick="closeModal()">Done</button>'
  );

  const m = document.getElementById("modal");
  m.querySelectorAll("[data-pal]").forEach(b => {
    b.onclick = () => {
      activePalette = b.dataset.pal; save(LS_PAL, activePalette);
      buildMarks(); render(); showSettings();
    };
  });
  m.querySelectorAll("[data-th]").forEach(b => {
    b.onclick = () => { save(LS_THEME, b.dataset.th); applyTheme(); showSettings(); };
  });
  m.querySelector("#togFade").onclick = () => {
    save(LS_FADE, !load(LS_FADE, true));
    paintCompletedUnits();
    showSettings();
  };
  m.querySelector("#togRound").onclick = () => {
    save(LS_ROUND, !load(LS_ROUND, true));
    applySharp();
    showSettings();
  };
  m.querySelector("#copyStats").onclick = copyStats;
  m.querySelector("#togAdmin").onclick = () => {
    adminMode = !adminMode;
    try { localStorage.setItem(LS_ADMIN, adminMode ? "1" : "0"); } catch {}
    if (adminMode) document.documentElement.classList.add("dev");
    else document.documentElement.classList.remove("dev");
    showSettings();
  };
  if (adminMode) m.querySelector("#dbgDate").onchange = e => {
    const d = isoToDay(e.target.value);
    if (!isFinite(d)) return;
    save(LS_DAY, d); state.day = d;
    loadPuzzle(state.size, state.diff); showSettings();
  };
  if (adminMode) m.querySelector("#dbgToday").onclick = () => {
    try { localStorage.removeItem(LS_DAY); } catch {}
    state.day = dayNumber();
    loadPuzzle(state.size, state.diff); showSettings();
  };
  if (adminMode) m.querySelector("#dbgGo").onclick = () => {
    const n = Math.max(1, Math.min(500, parseInt(m.querySelector("#dbgLevel").value, 10) || 1));
    closeModal(); loadLevel(n);
  };
  if (adminMode) m.querySelector("#dbgReset").onclick = () => {
    try { localStorage.removeItem(LS_PROG); } catch {}
    toast("Progress reset");
    closeModal();
    if (state.mode === "levels") loadLevel(1);
    else render();
  };
}

// ── Logo button — short press = help, long press (≥500ms) = about/admin ──

  var btn = document.getElementById("btnLogo");
  btn.innerHTML = makeLogo(40, 10);
  var _t = null;
  btn.addEventListener("pointerdown", function(){
    _t = setTimeout(function(){ _t = null; showAbout(); }, 500);
  });
  btn.addEventListener("pointerup", function(){
    if (_t){ clearTimeout(_t); _t = null; showHelp(); }
  });
  btn.addEventListener("pointerleave", function(){
    if (_t){ clearTimeout(_t); _t = null; }
  });
  btn.addEventListener("contextmenu", function(e){ e.preventDefault(); });
})();
document.getElementById("btnUndo").onclick  = undo;
document.getElementById("btnStats").onclick = showStats;
document.getElementById("btnHint").onclick  = showHintModal;
document.getElementById("btnReset").onclick = confirmReset;
document.getElementById("btnMark").onclick  = () => state.bookmark ? openMarkModal() : setBookmark();
document.getElementById("btnNew").onclick = () => loadPuzzle(state.size, state.diff, true);
document.getElementById("btnQuit").onclick = confirmQuit;
document.getElementById("btnSettings").onclick = showSettings;

// Initialize adds badge and update it
updateAddsBadge();

// Launch tutorial on first play
// NOTE: Disabled mixing tutorial level with daily puzzle initialization.
// Tutorial is still available via "Replay tutorial" button in help modal.
// Showing the tutorial via loadLevel() before loading the daily puzzle
// was causing state mode conflicts and blank board on first load.
// Players see the help modal instead, which explains the rules and offers
// tutorial access.
//if (!hasSeenTutorial() && !state.lvl){
//  loadLevel(0);
//  markTutorialSeen();
//}

if (adminMode) document.documentElement.classList.add("dev");

// An uncaught error used to leave a blank page with no way back. Show a panel
// with an escape hatch instead.
window.addEventListener("error", e => showCrash(e.message));
window.addEventListener("unhandledrejection", e => showCrash(String(e.reason)));
let crashed = false;
function showCrash(msg){
  if (crashed) return;
  crashed = true;
  const el = document.createElement("div");
  el.className = "crash";
  el.innerHTML = "<h2>Something broke</h2>"
    + '<p class="lede">Sorry. Your progress is still saved.</p>'
    + '<pre>' + String(msg).slice(0, 200).replace(/</g, "&lt;") + "</pre>"
    + '<button class="btn" id="crashReload">Reload</button>'
    + '<button class="btn ghost" id="crashReset">Reset this puzzle</button>';
  document.body.appendChild(el);
  el.querySelector("#crashReload").onclick = () => location.reload();
  el.querySelector("#crashReset").onclick = () => {
    try { localStorage.removeItem(LS_DAILY); } catch {}
    location.reload();
  };
}


applyTheme();
activePalette = MARKSETS[load(LS_PAL, "classic")] ? load(LS_PAL, "classic") : "classic";
state.latin = load(LS_LATIN, false);
state.dbl = load(LS_DBL, false);
state.scramble = load(LS_SCRAMBLE, false);
state.day = dayNumber();

// Migrate legacy LS_LAST (old tier ID like "nine") → new size + diff
(function migrateLast(){
  const last = load(LS_LAST, null);
  if (last && LEGACY_SLOTS[last]){
    const parts = LEGACY_SLOTS[last].split("-");
    save(LS_SIZE, parts[0]);
    save(LS_LAST, parts.slice(1).join("-"));
  }
  // Also migrate stats best-time keys
  const st = load(LS_STATS, null);
  if (st && !st._mig){
    for (const [old, nk] of Object.entries(LEGACY_SLOTS)){
      if (st.best[old] && !st.best[nk]) st.best[nk] = st.best[old];
    }
    st._mig = true; save(LS_STATS, st);
  }
})();

// Initialize daily mode or update to daily if tutorial was loaded
// Note: must call enterDaily() to ensure state.mode is reset to "daily"
// after the tutorial level may have set it to "levels"
enterDaily();
if (!load(LS_HELP, false)) showHelp();

window.CHROMOKU = { state, DIFFS, SIZES, DIFFICULTIES, CURR_SIZES, CURR_DIFFS,
                    MARKSETS, buildLevel, levelConfig,
                    rateDifficulty, parSeconds, generosity, WORLDS, TUNE, generatePuzzle, countSolutions,
                    randomSolvedGrid, boxDims, mulberry32, nakedPairs, hiddenPairs,
                    loadPuzzle, loadDifficulty, loadLevel, placeColour, onCell, undo,
                    setBookmark, restoreBookmark, renderShareBadge,
                    revealCell, freezeClock, addTime, showHintModal,
                    paintCompletedUnits, applySharp, shareAsImage,
                    rotatedMarkSet, buildMarks, emojiFor,
                    render, winLevel, enterDaily,
                    fireConfetti, shareChallenge, showProgression,
                    poolRemaining, powerPool,
                    showExplainers, seenMechanics, markMechanicSeen,
                    confirmQuit,
                    get activePalette(){ return activePalette; },
                    set activePalette(v){ activePalette = v; } };
