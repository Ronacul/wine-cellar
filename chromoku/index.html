<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f7f8">
<title>Chromoku</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<meta name="description" content="A daily colour-logic puzzle. No numbers.">
<style>
/* ================= tokens ================= */
:root{
  --bg:#f7f7f8; --panel:#fff; --panel2:#eeeef2;
  --ink:#17172b; --ink-dim:#63637a; --ink-faint:#9c9caf;
  --line:rgba(0,0,0,.10); --line-2:rgba(0,0,0,.18);
  --cell:#fff; --cell-given:#e9e9f0; --board:rgba(0,0,0,.14);
  --ring:#17172b; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --error:#e74c3c;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14141f; --panel:#1e1e2e; --panel2:#282838;
    --ink:#ececf4; --ink-dim:#9a9ab2; --ink-faint:#63637a;
    --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.20);
    --cell:#252537; --cell-given:#32324a; --board:rgba(255,255,255,.16);
    --ring:#ececf4; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#14141f; --panel:#1e1e2e; --panel2:#282838;
  --ink:#ececf4; --ink-dim:#9a9ab2; --ink-faint:#63637a;
  --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.20);
  --cell:#252537; --cell-given:#32324a; --board:rgba(255,255,255,.16);
  --ring:#ececf4; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink)}
.app{
  min-height:100vh; width:100%;
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  display:flex; flex-direction:column; align-items:center;
  padding:calc(var(--safe-t) + 8px) 12px calc(var(--safe-b) + 12px);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ================= header ================= */
header{
  width:100%; max-width:460px; display:grid;
  grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
  padding-bottom:10px; border-bottom:1px solid var(--line); margin-bottom:14px;
}
.hdr-l{display:flex;gap:2px}
.hdr-r{display:flex;gap:2px;justify-content:flex-end;align-items:center}
h1{
  font-size:19px; font-weight:800; letter-spacing:-.03em; text-align:center;
  line-height:1.1;
}
.sub{
  font-family:var(--mono); font-size:10px; color:var(--ink-faint);
  text-align:center; letter-spacing:.06em; text-transform:uppercase; margin-top:2px;
}
.icon-btn{
  width:34px; height:34px; border-radius:9px; font-size:15px; color:var(--ink-dim);
  display:grid; place-items:center; transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--panel2); color:var(--ink)}
.icon-btn[disabled]{opacity:.35; cursor:default}
.icon-btn[disabled]:hover{background:transparent; color:var(--ink-dim)}
.timer{
  font-family:var(--mono); font-size:14px; font-variant-numeric:tabular-nums;
  color:var(--ink-dim); min-width:44px; text-align:right;
}
/* In levels the clock is the stakes — make it impossible to miss. */
.timer.lvl{font-size:20px; font-weight:700; color:var(--ink); min-width:56px}
.timer.lvl.warn{color:#d4842a}
.timer.lvl.danger{color:var(--error); animation:pulse-clock .6s infinite alternate}
@keyframes pulse-clock{from{opacity:1} to{opacity:.45}}

/* ================= difficulty ================= */
.diffs{
  display:flex; gap:4px; background:var(--panel2); padding:3px;
  border-radius:11px; max-width:100%; overflow-x:auto; scrollbar-width:none;
}
.diffs::-webkit-scrollbar{display:none}
.tiers{display:flex; flex-direction:column; gap:4px; align-items:center; max-width:100%}
.axis-row{display:flex; gap:8px; align-items:center; max-width:100%}
/* Layering is its own axis, so it sits outside the size ladder rather than
   pretending to be one more step along it. */
.dbl{
  flex:0 0 auto; font-size:12px; font-weight:600; padding:9px 13px; border-radius:11px;
  background:var(--panel2); color:var(--ink-dim); white-space:nowrap;
  transition:background .15s,color .15s;
}
.dbl.on{background:var(--ink); color:var(--bg)}
.diff{flex:0 0 auto}
.diff{
  font-size:12px; font-weight:600; padding:6px 14px; border-radius:8px; white-space:nowrap;
  color:var(--ink-dim); transition:background .15s,color .15s;
}
.diff.on{background:var(--panel); color:var(--ink); box-shadow:var(--shadow)}
.diff .tick{opacity:.55; font-size:10px}

/* ================= level mode ================= */
.levelbar{
  flex:1; display:flex; align-items:center; gap:10px; min-width:0;
  background:var(--panel2); border-radius:11px; padding:7px 9px;
}
.lvl-c{flex:1; display:flex; flex-direction:column; line-height:1.15}
.lvl-c b{font-size:14px; font-weight:700; white-space:nowrap}
/* A peek borrows the next world's mechanic, so it says whose. */
.pk{font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  background:var(--ink); color:var(--bg); border-radius:5px; padding:2px 5px; vertical-align:2px}
.lvl-sub{
  font-family:var(--mono); font-size:9.5px; color:var(--ink-faint); white-space:nowrap;
  text-transform:uppercase; letter-spacing:.06em; margin-top:2px;
}
.hearts{display:flex; gap:2px; font-size:13px; color:var(--ink-faint)}
.hearts .on{color:var(--error)}
.hearts.big{justify-content:center; font-size:26px; gap:5px; margin-bottom:16px}
/* Countdown to next heart; hidden when full via empty textContent. */
.regen{
  font-family:var(--mono); font-size:9.5px; color:var(--ink-faint);
  margin-left:5px; letter-spacing:.02em; font-variant-numeric:tabular-nums;
}
/* Stage path — ten dots under the level heading. Peek is a diamond, boss
   a star; earned steps carry a small star badge, current step glows. */
.path{
  display:flex; gap:3px; align-items:center; margin-top:4px;
  font-family:var(--mono); font-size:11px; color:var(--ink-faint); line-height:1;
}
.path .st{
  position:relative; padding:1px 2px; opacity:.5;
  transition:opacity .15s, color .15s;
}
.path .st.here{opacity:1; color:var(--ink); font-size:14px}
.path .st.done{opacity:.85; color:var(--ok, #7da87b)}
.path .st.boss{color:#c9a227}      /* honey/gold for boss */
.path .st.peek{color:var(--ink-dim)}
.path .st.here.boss{color:#c9a227}
.path .stg{
  position:absolute; top:-6px; right:-4px; font-size:6.5px; color:#c9a227;
  letter-spacing:-1px;
}
.path .pips{
  display:block; text-align:center; font-size:5px; line-height:1;
  margin-top:-2px; letter-spacing:1px; color:currentColor; opacity:.7;
}
/* The clock is the only way to lose, so it gets a bar rather than just digits. */
.tbarwrap{
  width:100%; max-width:400px; height:5px; border-radius:3px;
  background:var(--panel2); overflow:hidden; margin-top:-16px;
}
.tbar-fill{
  height:100%; width:100%; border-radius:3px; background:var(--ink-dim);
  transition:width .25s linear, background .3s;
}
.tbar-fill.warn{background:#d4842a}
.tbar-fill.danger{background:var(--error)}
.timer.warn{color:#d4842a}
.timer.danger{color:var(--error); font-weight:600}
/* Power-up bar — always visible during levels, not buried in a modal. */
.powerups{
  display:flex; gap:6px; justify-content:center; width:100%; max-width:400px;
  margin-top:-8px; margin-bottom:2px;
}
.pu{
  display:flex; align-items:center; gap:4px; padding:4px 10px;
  border-radius:9px; background:var(--panel2); font-family:var(--mono);
  font-size:12px; color:var(--ink-dim); transition:transform .1s, background .15s;
  cursor:pointer; user-select:none; border:1px solid transparent;
}
.pu:active{transform:scale(.92)}
.pu[disabled]{opacity:.3; pointer-events:none}
.pu .pu-icon{font-size:16px; line-height:1}
.pu .pu-n{font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink)}
.pu:hover{background:var(--panel); border-color:var(--line)}
/* Streak chip — shown next to the subtitle when the player has a streak going. */
.streak-chip{
  display:inline-flex; align-items:center; gap:2px;
  font-family:var(--mono); font-size:10px; font-weight:700;
  color:#e8a020; letter-spacing:.04em; vertical-align:1px;
}
/* Near-miss vignette — creeps in as the clock runs low during levels. */
.vignette{
  position:fixed; inset:0; pointer-events:none; z-index:900;
  box-shadow:inset 0 0 80px rgba(231,76,60,0); transition:box-shadow 1s;
}
.vignette.warn{box-shadow:inset 0 0 60px rgba(231,76,60,.12)}
.vignette.danger{box-shadow:inset 0 0 80px rgba(231,76,60,.28)}
/* Camera shake on life loss */
@keyframes shake{
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)}
  40%{transform:translateX(5px)} 60%{transform:translateX(-4px)}
  80%{transform:translateX(3px)}
}
.shake{animation:shake .4s ease-out}
/* Confetti canvas — overlays the board on win */
.confetti{position:fixed; inset:0; pointer-events:none; z-index:1000}
/* Challenge banner — shown when playing someone's challenge */
.challenge-bar{
  display:flex; align-items:center; gap:8px; justify-content:center;
  padding:6px 14px; border-radius:9px; background:var(--panel2);
  font-family:var(--mono); font-size:11px; color:var(--ink-dim);
  width:100%; max-width:400px; margin-bottom:4px;
}
.challenge-bar .ghost-time{font-weight:700; color:var(--ink)}
/* Progression interstitial */
.prog-stage{
  display:flex; gap:4px; justify-content:center; margin:12px 0;
  font-size:22px;
}
.prog-stage .st{opacity:.35; transition:opacity .3s}
.prog-stage .st.done{opacity:1}
.prog-stage .st.current{opacity:1; transform:scale(1.25)}
.prog-unlock{
  text-align:center; font-family:var(--mono); font-size:12px;
  color:#c9a227; margin:8px 0; letter-spacing:.04em;
}
/* Mechanic explainer modal */
.explainer{text-align:center}
.exp-icon{font-size:48px; margin-bottom:8px}
.exp-body{
  font-size:14px; line-height:1.55; color:var(--ink-dim);
  text-align:left; margin:12px 0 20px; padding:0 4px;
}
.stars-big{
  text-align:center; font-size:34px; letter-spacing:6px; margin:2px 0 16px;
  color:var(--line-2);
}
.stars-big .on{color:#f1c40f}
.crash{
  position:fixed; inset:0; z-index:99; background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column; justify-content:center; gap:10px;
  padding:28px; font-family:var(--sans);
}
.crash pre{
  font-family:var(--mono); font-size:11px; color:var(--ink-dim);
  background:var(--panel2); padding:10px; border-radius:8px;
  white-space:pre-wrap; margin-bottom:8px;
}

/* ================= ad banner mockup ================= */
.ad-banner{
  width:100%; max-width:400px; display:flex; align-items:center; gap:8px;
  background:var(--panel2); border-radius:10px; padding:8px 12px;
  font-size:12px; border:1px solid var(--line);
}
.ad-label{
  font-family:var(--mono); font-size:9px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-faint); border:1px solid var(--line);
  border-radius:4px; padding:2px 5px; white-space:nowrap; flex:0 0 auto;
}
.ad-copy{flex:1; color:var(--ink-dim); line-height:1.3}
.ad-cta{
  font-size:11px; font-weight:700; color:var(--ink);
  background:var(--panel); border-radius:7px; padding:5px 10px;
  white-space:nowrap; flex:0 0 auto; border:1px solid var(--line);
}

/* ================= board ================= */
.play{
  flex:1; width:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:clamp(10px,3.5vw,22px);
}
.board-wrap{width:100%; max-width:min(84vw,340px)}

/* Tighten header and layout on short screens (e.g. iPhone SE) */
@media (max-height:680px){
  .app{ padding-top:calc(var(--safe-t) + 4px); padding-bottom:calc(var(--safe-b) + 6px) }
  header{ padding-bottom:6px; margin-bottom:8px }
  .play{ gap:clamp(6px,2.5vw,14px) }
  .board-wrap{ max-width:min(80vw,300px) }
  .pal-pad{ padding-bottom:10px }
}
/* Gap between boxes is 3x the gap inside them — that ratio is the only thing
   making the four 2x2 boxes legible, so it has to stay exaggerated. */
.board{
  display:grid; gap:var(--bgap,12px); aspect-ratio:1; padding:var(--bgap,12px);
  background:var(--board); border-radius:18px;
}
.box{display:grid; gap:var(--cgap,4px)}
.cell{
  position:relative; background:var(--cell); border-radius:var(--crad,8px);
  transition:background .12s;
}
.cell:not(.given){cursor:pointer}
.cell:not(.given):hover{background:var(--panel2)}

/* Both givens and your placements now fill their cell edge-to-edge — the
   corner shape is what tells them apart. Placements are rounded; givens are
   near-square. That's a stronger cue in Double than the old size difference,
   which stacked (small outer + smaller inner) and made guessed cells feel
   half-committed. */
.fill{position:absolute; inset:0; border-radius:12px; background:var(--c)}
/* Pattern marks bring their own ground and image via inline style; the outline
   keeps a light pattern from dissolving into a light empty cell. */
.fill.pat{box-shadow:inset 0 0 0 1.5px var(--line-2)}
.cell.given{background:var(--cell-given)}
.cell.given .fill{border-radius:2px}
/* On completion every square locks to the given look, so the finished board
   reads as one clean block of colour. */
.board.done .fill{border-radius:2px; transition:border-radius .25s}

/* Donut: on Double boards every outer mark always shows its square hole —
   the cell background peeks through. When an inner mark is placed it fills
   the gap; otherwise the hole stays empty. */
.board.dbl .fill{
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  mask-composite:exclude;
  padding:22%;
}

/* Inner layer — the "donut hole": a filled square smaller than the cutout
   so the donut frame reads clearly around it. */
.dot{
  position:absolute; inset:22%; border-radius:6px; background:var(--c);
  box-shadow:0 0 0 2px rgba(0,0,0,.28),0 0 0 3.5px var(--cell-given);
}
.board.dbl .dot{
  inset:26%; border-radius:3px;
  box-shadow:none;
}
.dot.given{border-radius:0}
.board.done .dot{border-radius:0; transition:border-radius .25s}

/* ================= palette ================= */
/* Palette matches the board width so swatches scale with the puzzle. */
.palette{display:flex; flex-direction:column; gap:26px; align-items:stretch;
  width:100%; max-width:min(86vw,360px)}
/* No number labels past 4 marks, so rows can sit closer. */
.palette.tight{gap:10px}
/* Prow fills the palette width; swatches flex to divide it evenly. */
.prow{display:flex; gap:clamp(5px,1.5vw,8px); align-items:center; flex-wrap:nowrap}
/* Past four marks we split into separate prow divs via JS (no CSS wrap needed). */
.prow.wrap{gap:clamp(4px,1.2vw,7px)}
/* Holds the eraser column open on the inner row. Needs the compound selector to
   outrank .swatch's own background and shadow. */
.swatch.spacer{background:none; box-shadow:none; visibility:hidden; pointer-events:none}
/* Inner-layer swatches — the "donut hole": a small filled square. */
.swatch.inner{background:transparent; border-radius:7px; box-shadow:var(--shadow)}
.swatch.inner::after{content:""; position:absolute; inset:26%; border-radius:3px;
  background:var(--c)}
/* Outer-layer swatches in Double mode — the "donut": square with a square hole.
   Uses mask-size instead of padding so % doesn't resolve against the prow width.
   Nearly square corners + thick frame so it reads as a square donut at small sizes. */
.swatch.donut{
  border-radius:4px;
  -webkit-mask:
    linear-gradient(#000 0 0) center/46% 46% no-repeat,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:
    linear-gradient(#000 0 0) center/46% 46% no-repeat,
    linear-gradient(#000 0 0);
  mask-composite:exclude;
}
.swatch.inner{border-radius:4px}
/* Double mode — tighter gaps since two layers share the palette.
   Swatches still flex:1 from the base rule; the gap reduction is enough. */
.palette.dbl-pal{gap:6px}
.palette.dbl-pal .prow,
.palette.dbl-pal .prow.wrap{gap:clamp(3px,0.8vw,5px)}
/* Selection ring uses the swatch's own colour so the eye tracks by hue, not
   by a neutral outline that gets lost against similar palette backgrounds. */
.swatch.inner.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--c); transform:scale(1.06); z-index:1}
.swatch{
  flex:1 1 0; min-width:0; aspect-ratio:1; border-radius:14px; background:var(--c);
  position:relative; transition:transform .12s, box-shadow .12s;
  box-shadow:var(--shadow); overflow:visible;
}
/* Expand touch target beyond the visual swatch — fat-finger insurance. */
.swatch::after{content:""; position:absolute; inset:-6px; z-index:1}
.swatch:active{transform:scale(.93)}
.swatch.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--c); transform:scale(1.06); z-index:1}
/* Completed marks recede so the player can scan for what's still needed. */
.swatch.done{opacity:.35; transform:scale(.82); transition:opacity .2s, transform .2s}
/* Shape swatches: the clip-path sits on a ::before pseudo so the .cnt badge
   (positioned outside the shape boundary) is not clipped away. */
.swatch.shaped{background:transparent; box-shadow:none}
.swatch.shaped::before{content:""; position:absolute; inset:0; background:var(--c);
  clip-path:var(--clip); border-radius:3px}
.swatch.shaped.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--c)}
.swatch.shaped.done::before{opacity:.35}
/* Tutorial hint flash */
.cell.hint-flash { animation: hint-flash 0.6s ease-out; }
@keyframes hint-flash {
  0% { box-shadow: inset 0 0 0 3px #ffeb3b, 0 0 8px #ffeb3b; }
  100% { box-shadow: inset 0 0 0 3px transparent, 0 0 0px transparent; }
}
/* Scramble mode: Stroop-style interference — colours get random shape
   clip-paths, shapes get random colours. Applied via inline styles in
   scrambleStyle() so no extra class is needed on the .fill div. */
.swatch .k{
  position:absolute; bottom:-17px; left:0; right:0; text-align:center;
  font-family:var(--mono); font-size:9px; color:var(--ink-faint);
}
.swatch.inner .k { display:none; }
/* Remaining-count badge: how many of this mark still need to land on the
   board. Sits over the top-right of the swatch, ink on a light plaque so it
   reads over any hue / shape / pattern. Hidden at zero (the .done fade
   already says "not this one"). */
.swatch .cnt{
  position:absolute; top:-6px; right:-6px; min-width:18px; height:18px;
  padding:0 4px; border-radius:9px; background:var(--panel);
  color:var(--ink); font-family:var(--sans); font-size:11px; font-weight:700;
  line-height:18px; text-align:center; box-shadow:var(--shadow);
  font-variant-numeric:tabular-nums; pointer-events:none;
}
.swatch.done .cnt{display:none}
.swatch.pat{box-shadow:var(--shadow),inset 0 0 0 1.5px var(--line-2)}
.swatch.pat.on{box-shadow:inset 0 0 0 1.5px var(--line-2),0 0 0 3px var(--bg),0 0 0 6px var(--ink); transform:scale(1.06); z-index:1}
.swatch.erase{
  background:var(--panel); border:1.5px solid var(--line-2); color:var(--ink-dim);
  display:grid; place-items:center; font-size:19px;
}
/* settings */
.seg{display:flex; gap:4px; background:var(--panel2); padding:3px; border-radius:10px; margin-bottom:16px}
.seg button{flex:1; font-size:12px; font-weight:600; padding:8px 4px; border-radius:7px; color:var(--ink-dim); min-width:0; overflow:hidden}
.seg button.on{background:var(--panel); color:var(--ink); box-shadow:var(--shadow)}
@media(max-width:480px){
  .seg{display:flex; flex-wrap:wrap; gap:6px}
  .seg button{flex:0 1 calc(50% - 3px); font-size:11px; padding:6px 4px}
  .pal-prev{display:none}
}
@media(max-width:320px){
  .seg button{flex:0 1 100%; text-align:left}
}
.dbg{display:flex; gap:6px; margin-bottom:14px}
/* Development tools, hidden unless ?dev=1 */
.dev-only{display:none}
html.dev .dev-only{display:grid}
.dbg input{
  flex:1; font-family:var(--mono); font-size:12px; padding:8px 10px; border-radius:8px;
  border:1px solid var(--line-2); background:var(--panel2); color:var(--ink);
}
.dbg button{
  font-size:12px; font-weight:600; padding:8px 12px; border-radius:8px;
  background:var(--panel2); color:var(--ink-dim);
}
.fld{font-size:9.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.07em; margin-bottom:6px}
.pal-prev{display:flex; gap:5px; justify-content:center; margin-top:6px}
.pal-prev i{width:21px; height:21px; border-radius:5px; display:block}
.pal-pad{padding-bottom:20px}
/* Toggle row — label + switch on one line */
.toggle-row{
  display:flex; justify-content:space-between; align-items:center;

  transition:background .2s; flex:0 0 44px; cursor:pointer;
}
.toggle-sw::after{
  content:""; position:absolute; top:2px; left:2px; width:20px; height:20px;
  border-radius:10px; background:var(--ink-dim); transition:transform .2s, background .2s;
}
.toggle-sw.on{background:var(--ink)}
.toggle-sw.on::after{transform:translateX(18px); background:var(--bg)}

/* ================= modal ================= */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50;
  display:grid; place-items:center; padding:20px;
  animation:fade .18s ease-out;
}
.overlay.hide{display:none}
.modal{
  background:var(--panel); border-radius:18px; padding:24px 22px;
  width:100%; max-width:360px; box-shadow:0 20px 60px rgba(0,0,0,.28);
  max-height:86vh; overflow-y:auto;
}
.modal h2{font-size:20px; font-weight:800; letter-spacing:-.02em; margin-bottom:4px}

.btn{

/* ================= toast ================= */
.toast{
  position:fixed; left:50%; bottom:calc(var(--safe-b) + 28px); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); font-size:13px; font-weight:600;
  padding:10px 20px; border-radius:10px; z-index:60; animation:fade .15s ease-out;
}
.toast.hide{display:none}

/* ================= animation ================= */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:.3}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes wave{0%,100%{transform:scale(1)}45%{transform:scale(1.16)}}
@media (prefers-reduced-motion:no-preference){
  .fill.new,.dot.new{animation:pop .22s cubic-bezier(.34,1.4,.64,1)}
  .cell.bad{animation:shake .3s}
  .cell.bad .fill{box-shadow:inset 0 0 0 3px var(--error)}
  .cell.won{animation:wave .5s ease-in-out}
}
@media (prefers-reduced-motion:reduce){
  .cell.bad .fill{box-shadow:inset 0 0 0 3px var(--error)}
}

/* ================= completion fade ================= */
/* Cells belonging to a completed unit (row/col/box) recede so the player's
   eye moves to what still needs work.  Per-layer classes let Double mode
   fade the outer fill while the inner dot stays bright, or vice versa. */
.board.fade-done .cell.unit-done-0 .fill{opacity:.32; transition:opacity .35s}
.board.fade-done .cell.unit-done-1 .dot{opacity:.32; transition:opacity .35s}
/* Single-layer shorthand — unit-done without a suffix. */
.board.fade-done .cell.unit-done .fill{opacity:.32; transition:opacity .35s}
/* On win the whole board lights back up. */
.board.done .cell .fill,.board.done .cell .dot{opacity:1!important}

/* ================= sharp marks (no rounded corners on guesses) ================= */
.board.sharp .cell:not(.given) .fill{border-radius:2px}
.board.sharp .cell:not(.given) .dot{border-radius:0}

<script>
"use strict";

/* ================= config ================= */

const SHARE_NAME = "Chromoku";
const EPOCH = Date.UTC(2026, 7, 15);          // 15 Aug 2026 = puzzle #1

// Every colour reference routes through here so palette unlocks are additive
// later. `emoji` is indexed by layer: squares for the outer grid, circles for
// the inner one, so a shared result stays readable as two separate puzzles.
// A mark is anything four-way distinguishable — colour is just one choice.
// Pattern sets are monochrome, so they stay playable with any colour vision.
const TILE = "12px 12px";  // more negative space than 9x9

// Primitive pools. A mark set combines these to produce however many
// distinguishable marks a grid size needs — 4, 9, 16, whatever comes next.
// Spread around the hue wheel so no two neighbours share a family.
// First 4 are the primaries (4×4 boards). First 9 are the core set (9×9).
// 10–16 fill the gaps for larger grids where shapes carry the real load.
const HUES = [
  // Kelly's 22 Colours of Maximum Contrast (1965, NBS) — first 9 core, 10–16 need refinement
  { hex:"#c10020", emoji:["🟥","🟥"], label:"Red"       },   //  1 — vivid red
  { hex:"#007d34", emoji:["🟩","🟩"], label:"Green"     },   //  2 — vivid green
  { hex:"#00538a", emoji:["🟦","🟦"], label:"Blue"      },   //  3 — strong blue
  { hex:"#f4c800", emoji:["🟨","🟨"], label:"Yellow"    },   //  4 — greenish yellow
  { hex:"#ff6800", emoji:["🟧","🟧"], label:"Orange"    },   //  5 — vivid orange
  { hex:"#803e75", emoji:["🟪","🟪"], label:"Purple"    },   //  6 — strong purple
  { hex:"#a6bdd7", emoji:["⬜","⬜"], label:"Ice"       },   //  7 — very light blue
  { hex:"#232c16", emoji:["⬛","⬛"], label:"Dark Olive" },   //  8 — dark olive green
  { hex:"#593315", emoji:["🟫","🟫"], label:"Brown"     },   //  9 — deep yellowish brown
  { hex:"#ffb300", emoji:["🟨","🟨"], label:"Gold"      },   // 10 — vivid yellow (TODO: refine 10–16)
  { hex:"#cea262", emoji:["🟫","🟫"], label:"Sand"      },   // 11 — grayish yellow
  { hex:"#817066", emoji:["⬜","⬜"], label:"Stone"     },   // 12 — medium grey
  { hex:"#f6768e", emoji:["🟥","🟥"], label:"Rose"      },   // 13 — purplish pink
  { hex:"#ff7a5c", emoji:["🟧","🟧"], label:"Salmon"    },   // 14 — yellowish pink
  { hex:"#53377a", emoji:["🟪","🟪"], label:"Violet"    },   // 15 — strong violet
  { hex:"#ff8e00", emoji:["🟧","🟧"], label:"Amber"     },   // 16 — orange yellow
];

// Shapes each get a distinct hue from HUES for visual variety, but the
// rule is still shape-based — a red square never sits next to a blue square,
// so a colour-only reader and a shape-only reader both solve. Colour is
// redundant with shape here, not a second independent dimension.
const SHAPES = [
  { label:"Square",    glyph:"■", clip:"inset(2%)" },
  { label:"Circle",    glyph:"●", clip:"circle(50%)" },
  { label:"Triangle",  glyph:"▲", clip:"polygon(50% 4%,96% 96%,4% 96%)" },
  { label:"Diamond",   glyph:"◆", clip:"polygon(50% 2%,98% 50%,50% 98%,2% 50%)" },
  { label:"Star",      glyph:"★", clip:"polygon(50% 2%,61% 37%,98% 37%,68% 59%,79% 95%,50% 73%,21% 95%,32% 59%,2% 37%,39% 37%)" },
  { label:"Pentagon",  glyph:"⬟", clip:"polygon(50% 2%,98% 38%,79% 96%,21% 96%,2% 38%)" },
  { label:"Hexagon",   glyph:"⬢", clip:"polygon(25% 3%,75% 3%,98% 50%,75% 97%,25% 97%,2% 50%)" },
  { label:"Cross",     glyph:"✚", clip:"polygon(34% 2%,66% 2%,66% 34%,98% 34%,98% 66%,66% 66%,66% 98%,34% 98%,34% 66%,2% 66%,2% 34%,34% 34%)" },
  { label:"Down",      glyph:"▼", clip:"polygon(4% 4%,96% 4%,50% 96%)" },
  { label:"Chevron",   glyph:"➤", clip:"polygon(4% 4%,50% 4%,96% 50%,50% 96%,4% 96%,42% 50%)" },
  { label:"Trapezoid", glyph:"▰", clip:"polygon(22% 8%,78% 8%,98% 92%,2% 92%)" },
  { label:"Rhomboid",  glyph:"▱", clip:"polygon(26% 6%,98% 6%,74% 94%,2% 94%)" },
  { label:"Octagon",   glyph:"⯃", clip:"polygon(32% 2%,68% 2%,98% 32%,98% 68%,68% 98%,32% 98%,2% 68%,2% 32%)" },
  { label:"Bowtie",    glyph:"⧗", clip:"polygon(6% 4%,94% 4%,6% 96%,94% 96%)" },
  { label:"Arrow",     glyph:"➔", clip:"polygon(2% 34%,60% 34%,60% 8%,98% 50%,60% 92%,60% 66%,2% 66%)" },
  { label:"Half",      glyph:"◗", clip:"polygon(50% 2%,98% 2%,98% 98%,50% 98%)" },
];

// 16 patterns ranked by the mark picker (picker.html). Each varies TILE size/
// position when the default 12px 12px doesn't suit — bgS and bgP are optional
// overrides consumed by markStyle / swatchStyle.  #17172b → var(--ink) so they
// respect dark mode.  Rank order matters: first 4 appear in 4×4, first 9 in 9×9.
const WEAVES = [
  // Rank 1 — 4×4+
  { label:"Diag-back", glyph:"▧",
    bg:"repeating-linear-gradient(-45deg,var(--ink) 0 3px,transparent 3px 9px)" },
  // Rank 2 — 4×4+
  { label:"Diagonals", glyph:"▨",
    bg:"repeating-linear-gradient(45deg,var(--ink) 0 3px,transparent 3px 9px)" },
  // Rank 3 — 4×4+
  { label:"Bars Half", glyph:"▤",
    bg:"repeating-linear-gradient(0deg,var(--ink) 0 6px,transparent 6px 12px)" },
  // Rank 4 — 4×4+
  { label:"Columns Half", glyph:"▥",
    bg:"repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 12px)" },
  // Rank 5 — 6×6+
  { label:"Dots Large", glyph:"⠿",
    bg:"radial-gradient(var(--ink) 3px,transparent 3.5px)" },
  // Rank 6 — 6×6+
  { label:"Rings Wide", glyph:"◍",
    bg:"radial-gradient(circle,transparent 2.5px,var(--ink) 2.8px,var(--ink) 3.8px,transparent 4.1px)",
    bgS:"16px 16px" },
  // Rank 7 — 9×9+
  { label:"Checker", glyph:"▦",
    bg:"linear-gradient(45deg,var(--ink) 25%,transparent 25%),"
     + "linear-gradient(-45deg,var(--ink) 25%,transparent 25%),"
     + "linear-gradient(45deg,transparent 75%,var(--ink) 75%),"
     + "linear-gradient(-45deg,transparent 75%,var(--ink) 75%)",
    bgP:"0 0,0 6px,6px -6px,-6px 0px" },
  // Rank 8 — 9×9+
  { label:"Zigzag H", glyph:"⚡",
    bg:"linear-gradient(135deg,var(--ink) 25%,transparent 25%),"
     + "linear-gradient(225deg,var(--ink) 25%,transparent 25%),"
     + "linear-gradient(315deg,var(--ink) 25%,transparent 25%),"
     + "linear-gradient(45deg,var(--ink) 25%,transparent 25%)",
    bgS:"16px 8px", bgP:"-8px 0,-8px 0,0 0,0 0" },
  // Rank 9 — 9×9+
  { label:"Diag-grid", glyph:"▩",
    bg:"repeating-linear-gradient(45deg,var(--ink) 0 1.2px,transparent 1.2px 7.8px),"
     + "repeating-linear-gradient(-45deg,var(--ink) 0 1.2px,transparent 1.2px 7.8px)" },
  // Rank 10 — 10×10+
  { label:"H+V Bold", glyph:"▦",
    bg:"repeating-linear-gradient(0deg,var(--ink) 0 4px,transparent 4px 8px),"
     + "repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 8px)" },
  // Rank 11 — 16×16
  { label:"H+V Fine", glyph:"▦",
    bg:"repeating-linear-gradient(0deg,var(--ink) 0 1.2px,transparent 1.2px 10.8px),"
     + "repeating-linear-gradient(90deg,var(--ink) 0 1.2px,transparent 1.2px 10.8px)" },
  // Rank 12 — 16×16
  { label:"Diags Bold", glyph:"▨",
    bg:"repeating-linear-gradient(45deg,var(--ink) 0 5px,transparent 5px 7px)" },
  // Rank 13 — 16×16
  { label:"Diag-back Bold", glyph:"▧",
    bg:"repeating-linear-gradient(-45deg,var(--ink) 0 5px,transparent 5px 7px)" },
  // Rank 14 — 16×16
  { label:"Bars Bold", glyph:"▬",
    bg:"repeating-linear-gradient(0deg,var(--ink) 0 5px,transparent 5px 7px)" },
  // Rank 15 — 16×16
  { label:"Columns Bold", glyph:"▥",
    bg:"repeating-linear-gradient(90deg,var(--ink) 0 5px,transparent 5px 7px)" },
  // Rank 16 — 16×16
  { label:"Dots Offset", glyph:"⠄",
    bg:"radial-gradient(var(--ink) 1.5px,transparent 2px),"
     + "radial-gradient(var(--ink) 1.5px,transparent 2px)",
    bgS:"8px 8px", bgP:"0 0,4px 4px" },
];

// ── Quilt logo ─────────────────────────────────────────────────────────────
// 10 colours hand-picked from the owner's physical quilt (Aug 2026).
// The 10×10 Double-grid layout replicates the quilt pattern cell-by-cell.
// Each cell: [outer_idx, inner_idx] into QUILT_PAL.
const QUILT_PAL = [
  "#c10020", // 0 Red
  "#ffb300", // 1 Amber
  "#f6768e", // 2 Salmon/Pink
  "#040404", // 3 Black
  "#0d2a5c", // 4 Dark Navy
  "#18c49e", // 5 Bright Teal
  "#0c97e2", // 6 Cerulean Blue
  "#216b57", // 7 Dark Forest Green
  "#d7c1e8", // 8 Light Lavender
  "#9f1d8a", // 9 Deep Purple
];
const LOGO_GRID = [
  [[3,3],[5,7],[6,4],[7,1],[8,0],[0,9],[4,2],[9,5],[1,6],[2,8]],
  [[4,1],[6,6],[0,7],[8,4],[7,3],[9,0],[0,5],[5,2],[3,8],[1,9]],
  [[0,2],[4,3],[8,8],[1,7],[9,4],[7,6],[5,0],[2,1],[6,9],[3,5]],
  [[2,0],[0,1],[4,6],[9,9],[3,7],[5,4],[7,8],[1,3],[8,5],[6,2]],
  [[7,9],[1,0],[0,3],[4,8],[5,5],[6,7],[2,4],[3,6],[9,8],[8,1]],
  [[1,4],[7,5],[3,0],[0,6],[4,9],[2,2],[8,7],[6,8],[5,1],[9,3]],
  [[9,7],[3,4],[7,2],[6,0],[0,8],[4,5],[1,1],[8,9],[2,3],[5,6]],
  [[6,5],[8,2],[9,1],[5,3],[2,6],[1,8],[3,9],[7,7],[4,4],[0,0]],
  [[8,6],[9,8],[5,9],[2,5],[1,2],[3,1],[6,3],[4,0],[0,7],[7,4]],
  [[5,8],[2,9],[1,5],[3,2],[6,1],[8,3],[9,6],[0,4],[7,0],[4,7]],
];
// Generate logo SVG — n×n crop of the quilt grid at px×px pixels.
function makeLogo(px, n){
  n = n || 10;
  var st = px/n, pad = st*0.07, cell = st-pad*2, ip = st*0.22;
  var rx = Math.max(0.6, st*0.1);
  var s = '<svg width="'+px+'" height="'+px+'" viewBox="0 0 '+px+' '+px+'"'
        + ' xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
  s += '<rect width="'+px+'" height="'+px+'" fill="#050505"/>';
  for (var r=0; r<n; r++){
    for (var c=0; c<n; c++){
      var oi=LOGO_GRID[r][c][0], ii=LOGO_GRID[r][c][1];
      var x=(c*st+pad).toFixed(2), y=(r*st+pad).toFixed(2);
      var cs=cell.toFixed(2), is=(cell-ip*2).toFixed(2);
      var xi=(c*st+pad+ip).toFixed(2), yi=(r*st+pad+ip).toFixed(2);
      s += '<rect x="'+x+'" y="'+y+'" width="'+cs+'" height="'+cs
         + '" fill="'+QUILT_PAL[oi]+'" rx="'+rx.toFixed(2)+'"/>';
      s += '<rect x="'+xi+'" y="'+yi+'" width="'+is+'" height="'+is
         + '" fill="'+QUILT_PAL[ii]+'" rx="'+(rx*0.4).toFixed(2)+'"/>';
    }
  }
  return s + '</svg>';
}
// ───────────────────────────────────────────────────────────────────────────

// Every set varies along exactly ONE dimension — all colours, all shapes, or
// all patterns. Crossing two dimensions (a red triangle beside a blue triangle
// beside a red circle) makes the board much harder to read than it is to solve.
// A set returns null when it cannot produce n marks; the picker then hides it.
const MARKSETS = {
  classic: { name:"Colour", build(n){
    if (n > HUES.length) return null;

  shapes: { name:"Shapes", build(n){

  ink: { name:"Patterns", build(n){

let activePalette = "classic";

const MARK_ROTATION_EARLY = ["classic", "shapes"];

// Scramble mode: Stroop-style interference. Colours get misleading shapes;
// shapes get misleading colours. The decoy is deterministic per cell so the
// board stays consistent on re-render, but the decoy is always different
// from the real value so every cell lies.
function scrambleDecoy(i, v, n){
  const seed = state.day * 31 + state.n * 7;
  let d = ((i * 17 + seed) * 13 + 37) % n;
  if (d === v) d = (d + 1) % n;

    // Shape is truth; colour is noise
    const fakeIdx = scrambleDecoy(i, v, Math.min(state.n, HUES.length));
    const fakeHex = HUES[fakeIdx].hex;
    const clip = m.clip ? ";clip-path:" + m.clip + ";border-radius:3px" : "";

  const fakeIdx = scrambleDecoy(i, v, Math.min(state.n, SHAPES.length));

// Box dimensions for a given grid size. 4→2x2, 6→3x2, 9→3x3.
function boxDims(n, rotate){
  const h = Math.floor(Math.sqrt(n));
  for (let bh = h; bh >= 1; bh--) if (n % bh === 0) {
    const dims = { bh, bw: n / bh };
    return rotate && dims.bh !== dims.bw ? { bh: dims.bw, bw: dims.bh } : dims;
  }
  return { bh:1, bw:n };
}

/* ================= prng ================= */

function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rng){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ================= puzzle engine (size-agnostic) ================= */

// A random solved grid, built by filling an empty board with randomised value
// order. Reaches the *entire* space of valid grids for any n — 288 for 4x4.
// (Shuffling rows/columns of one canonical grid looks equivalent but is not:
// it only ever reaches one of the three orbits, i.e. a third of the space.)
function randomSolvedGrid(n, rng, boxless, rotate){
  const g = new Array(n * n).fill(null);
  (function rec(){
    const i = g.indexOf(null);
    if (i === -1) return true;
    for (const v of shuffled([...Array(n).keys()], rng)){
      if (legal(g, n, i, v, boxless, rotate)){
        g[i] = v;
        if (rec()) return true;
        g[i] = null;
      }
    }
    return false;
  })();
  return g;
}

function legal(grid, n, idx, val, boxless, rotate){
  const { bw, bh } = boxDims(n, rotate);
  const r = Math.floor(idx / n), c = idx % n;
  for (let i = 0; i < n; i++){
    if (i !== c && grid[r * n + i] === val) return false;
    if (i !== r && grid[i * n + c] === val) return false;
  }
  if (boxless) return true;            // Latin: rows and columns only
  const r0 = Math.floor(r / bh) * bh, c0 = Math.floor(c / bw) * bw;
  for (let rr = r0; rr < r0 + bh; rr++)
    for (let cc = c0; cc < c0 + bw; cc++)
      if ((rr !== r || cc !== c) && grid[rr * n + cc] === val) return false;
  return true;
}

// Bitmask solver that always branches on the most-constrained cell. Same
// contract as the naive version, but the pruning is what makes big grids
// possible at all: 9x9 at 25 givens goes from ~7.6s to ~4ms.
function countSolutions(grid, n, cap, boxless, rotate){
  const { bw, bh } = boxDims(n, rotate), FULL = (1 << n) - 1, per = n / bw;
  const g = grid.slice();
  const rows = new Array(n).fill(0), cols = new Array(n).fill(0), box = new Array(n).fill(0);
  const bi = new Int32Array(n * n);
  for (let i = 0; i < n * n; i++) bi[i] = ((((i / n) | 0) / bh) | 0) * per + (((i % n) / bw) | 0);
  for (let i = 0; i < n * n; i++){
    const v = g[i];
    if (v !== null && v !== undefined){
      const b = 1 << v;
      rows[(i / n) | 0] |= b; cols[i % n] |= b; if (!boxless) box[bi[i]] |= b;
    }
  }
  let found = 0;
  (function rec(){
    if (found >= cap) return;
    let best = -1, bestMask = 0, bestCnt = n + 1;
    for (let i = 0; i < n * n; i++){
      if (g[i] !== null && g[i] !== undefined) continue;
      const avail = FULL & ~(rows[(i / n) | 0] | cols[i % n] | (boxless ? 0 : box[bi[i]]));
      if (avail === 0) return;                 // dead end, prune the whole branch
      let cnt = 0, x = avail;
      while (x){ x &= x - 1; cnt++; }
      if (cnt < bestCnt){ bestCnt = cnt; best = i; bestMask = avail; if (cnt === 1) break; }
    }
    if (best === -1){ found++; return; }       // no empties left — a solution
    const r = (best / n) | 0, c = best % n, b = bi[best];
    let mask = bestMask;
    while (mask){
      const bit = mask & -mask; mask ^= bit;
      g[best] = 31 - Math.clz32(bit);
      rows[r] |= bit; cols[c] |= bit; if (!boxless) box[b] |= bit;
      rec();
      rows[r] &= ~bit; cols[c] &= ~bit; if (!boxless) box[b] &= ~bit; g[best] = null;
      if (found >= cap) return;
    }
  })();
  return found;
}


// Cells to try removing, round-robined across boxes so the givens that survive
// stay spread over the board instead of clumping into a few boxes.
function removalOrder(n, rng, boxless, rotate){
  // No boxes to balance across, so a plain shuffle is the right order.
  if (boxless) return shuffled([...Array(n * n).keys()], rng);
  const { bw, bh } = boxDims(n, rotate), per = n / bw, buckets = [];
  for (let b = 0; b < n; b++){
    const r0 = ((b / per) | 0) * bh, c0 = (b % per) * bw, cells = [];
    for (let r = r0; r < r0 + bh; r++)
      for (let c = c0; c < c0 + bw; c++) cells.push(r * n + c);
    buckets.push(shuffled(cells, rng));
  }
  const order = [];
  for (let k = 0; k < n; k++)
    for (const b of shuffled([...Array(n).keys()], rng))
      if (buckets[b][k] !== undefined) order.push(buckets[b][k]);
  return order;
}

// Carve down from a solved board, keeping any removal that leaves the puzzle
// uniquely solvable and undoing the rest. Uniqueness therefore holds at every
// step — an ambiguous puzzle is an unwinnable puzzle, so it is never optional.
// Carving down beats carving out at random: it does one solve per cell instead
// of retrying whole hopeless boards, which is the difference between 4ms and
// several seconds once the grid is bigger than 4x4.
function generatePuzzle(seed, n, givens, boxless, rotate){
  const rng = mulberry32(seed);
  const solution = randomSolvedGrid(n, rng, boxless, rotate);
  const puzzle = solution.slice();
  const target = n * n - givens;
  let removed = 0;

  for (const i of removalOrder(n, rng, boxless, rotate)){
    if (removed >= target) break;
    const keep = puzzle[i];
    puzzle[i] = null;
    if (countSolutions(puzzle, n, 2, boxless, rotate) === 1) removed++;
    else puzzle[i] = keep;               // that removal made it ambiguous
  }
  // May finish with more givens than asked if the board resists further
  // removal; that is a harmless floor, never an unsolvable board.
  return { solution, puzzle, givens:puzzle.map(v => v !== null) };
}

/* ================= difficulty rater ================= */

// The units a value must be unique within: rows, columns, and boxes unless the
// ruleset has none.
function unitsOf(n, boxless, rotate){
  const U = [];
  for (let r = 0; r < n; r++) U.push(Array.from({ length:n }, (_, c) => r * n + c));
  for (let c = 0; c < n; c++) U.push(Array.from({ length:n }, (_, r) => r * n + c));
  if (!boxless){
    const { bw, bh } = boxDims(n, rotate), per = n / bw;
    for (let b = 0; b < n; b++){
      const r0 = ((b / per) | 0) * bh, c0 = (b % per) * bw, cells = [];
      for (let r = r0; r < r0 + bh; r++)
        for (let c = c0; c < c0 + bw; c++) cells.push(r * n + c);
      U.push(cells);
    }
  }
  return U;
}

// How hard a puzzle actually is, measured by the cheapest technique that
// cracks it. Given count is only a proxy for this, and a poor one: at 4x4,
// puzzles with 8, 6 and 4 givens are all solvable by the very first technique.
//
//   T0  naked single  — a cell with one candidate left
//   T1  hidden single — a value with only one home in a unit
//   T2  locked candidates — a value confined to one row/column within a box,
//                           eliminating it elsewhere in that line (boxes only)
//   T3  none of the above suffice; the solver would have to guess
//
// `stalls` counts how often the cheaper techniques ran dry, which separates a
// puzzle needing one clever step from one needing many.
function rateDifficulty(puzzle, n, boxless, rotate){
  const U = unitsOf(n, boxless, rotate), FULL = (1 << n) - 1;
  const g = puzzle.slice();
  const cellUnits = Array.from({ length:n * n }, () => []);
  U.forEach(u => u.forEach(i => cellUnits[i].push(u)));

  const empty = i => g[i] === null || g[i] === undefined;
  const candidates = () => g.map((v, i) => {
    if (!empty(i)) return 0;
    let used = 0;
    for (const u of cellUnits[i]) for (const j of u) if (!empty(j)) used |= 1 << g[j];
    return FULL & ~used;
  });

  let tier = 0, stalls = 0;
  for (;;){
    const cand = candidates();

    let moved = false;
    for (let i = 0; i < n * n; i++){                       // T0
      if (!empty(i)) continue;
      const c = cand[i];
      if (c === 0) return { tier:3, stalls:stalls + 1, solved:false };
      if ((c & (c - 1)) === 0){ g[i] = 31 - Math.clz32(c); moved = true; }
    }
    if (moved) continue;

    for (const u of U){                                    // T1
      for (let v = 0; v < n && !moved; v++){
        const bit = 1 << v;
        let spot = -1, count = 0, placed = false;
        for (const i of u){
          if (g[i] === v){ placed = true; break; }
          if (empty(i) && (cand[i] & bit)){ count++; spot = i; }
        }
        if (!placed && count === 1){ g[spot] = v; moved = true; tier = Math.max(tier, 1); }
      }
      if (moved) break;
    }
    if (moved) continue;

    // Naked and hidden pairs work without boxes, so Latin puzzles can now
    // rate above T1. This is the technique that was missing.
    if (nakedPairs(g, cand, n, U)){                        // T2
      tier = Math.max(tier, 2);
      stalls++;
      continue;
    }
    if (hiddenPairs(g, cand, n, U)){                       // T2
      tier = Math.max(tier, 2);
      stalls++;
      continue;
    }

    if (!boxless && lockedCandidates(g, cand, n, U, FULL, rotate)){ // T2
      tier = Math.max(tier, 2);
      stalls++;
      continue;
    }

    if (g.every(v => v !== null && v !== undefined)) return { tier, stalls, solved:true };
    return { tier:3, stalls:stalls + 1, solved:false };     // T3
  }
}

// Locked candidates: inside one box a value may only sit in a single row or
// column. That does not place anything by itself, but it rules the value out
// of the rest of that line, which often unblocks a single. Returns true if it
// managed to place something after the elimination.
function lockedCandidates(g, cand, n, U, FULL, rotate){
  const { bw, bh } = boxDims(n, rotate), per = n / bw;
  const empty = i => g[i] === null || g[i] === undefined;

  for (let b = 0; b < n; b++){
    const r0 = ((b / per) | 0) * bh, c0 = (b % per) * bw;
    for (let v = 0; v < n; v++){
      const bit = 1 << v, rows = new Set(), cols = new Set();
      let any = false, already = false;
      for (let r = r0; r < r0 + bh; r++)
        for (let c = c0; c < c0 + bw; c++){
          const i = r * n + c;
          if (g[i] === v) already = true;
          if (empty(i) && (cand[i] & bit)){ rows.add(r); cols.add(c); any = true; }
        }
      if (already || !any) continue;

      // Confined to one line -> eliminate from the rest of that line, then see
      // whether any cell is down to a single candidate.
      const sweep = (cells) => {
        for (const i of cells){
          const r = (i / n) | 0, c = i % n;
          if (r >= r0 && r < r0 + bh && c >= c0 && c < c0 + bw) continue;  // inside the box
          if (!empty(i)) continue;
          cand[i] &= ~bit;
          if (cand[i] && (cand[i] & (cand[i] - 1)) === 0){
            g[i] = 31 - Math.clz32(cand[i]);
            return true;
          }
        }
        return false;
      };
      if (rows.size === 1){
        const r = [...rows][0];
        if (sweep(Array.from({ length:n }, (_, c) => r * n + c))) return true;
      }
      if (cols.size === 1){
        const c = [...cols][0];
        if (sweep(Array.from({ length:n }, (_, r) => r * n + c))) return true;
      }
    }
  }
  return false;
}

// Naked pairs: two cells in a unit that share the exact same two candidates.
// Eliminating those two values from all other cells in the unit often unblocks
// singles. Works for both Sudoku and Latin rulesets — no boxes needed.
function nakedPairs(g, cand, n, U){
  const empty = i => g[i] === null || g[i] === undefined;
  let progress = false;
  for (const u of U){
    const twos = [];
    for (const i of u){
      if (!empty(i)) continue;
      const c = cand[i];
      if (!c) continue;
      // Exactly two bits set?
      if (c && (c & (c - 1)) !== 0){
        let tmp = c, bits = 0;
        while (tmp){ tmp &= tmp - 1; bits++; }
        if (bits === 2) twos.push({ i, c });
      }
    }
    for (let a = 0; a < twos.length; a++){
      for (let b = a + 1; b < twos.length; b++){
        if (twos[a].c !== twos[b].c) continue;
        const mask = twos[a].c;
        for (const i of u){
          if (i === twos[a].i || i === twos[b].i || !empty(i)) continue;
          if (cand[i] & mask){
            cand[i] &= ~mask;
            progress = true;
            if (cand[i] && (cand[i] & (cand[i] - 1)) === 0){
              g[i] = 31 - Math.clz32(cand[i]);
            }
          }
        }
      }
    }
  }
  return progress;
}

// Hidden pairs: two values that both appear as candidates in exactly the same
// two cells of a unit and nowhere else. Those cells can only be those two
// values — everything else is eliminated from them.
function hiddenPairs(g, cand, n, U){
  const empty = i => g[i] === null || g[i] === undefined;
  let progress = false;
  for (const u of U){
    for (let v1 = 0; v1 < n; v1++){
      const b1 = 1 << v1;
      const cells1 = [];
      let placed1 = false;
      for (const i of u){
        if (g[i] === v1){ placed1 = true; break; }
        if (empty(i) && (cand[i] & b1)) cells1.push(i);
      }
      if (placed1 || cells1.length !== 2) continue;
      for (let v2 = v1 + 1; v2 < n; v2++){
        const b2 = 1 << v2;
        const cells2 = [];
        let placed2 = false;
        for (const i of u){
          if (g[i] === v2){ placed2 = true; break; }
          if (empty(i) && (cand[i] & b2)) cells2.push(i);
        }
        if (placed2 || cells2.length !== 2) continue;
        if (cells1[0] === cells2[0] && cells1[1] === cells2[1]){
          const mask = b1 | b2;
          for (const i of [cells1[0], cells1[1]]){
            if (cand[i] & ~mask){
              cand[i] = mask;
              progress = true;
            }
          }
        }
      }
    }
  }
  return progress;
}

// ---- tuning block ----------------------------------------------------------
// These are estimates until real play data exists. Everything about how the
// ladder feels is in these six numbers; change them here and nowhere else.
const TUNE = {
  // Per-technique seconds-per-cell. T0 placements are quick reads; T1 requires
  // scanning a whole unit for the sole remaining home; T2 (pairs / locked
  // candidates) demands real pattern recognition; T3 is trial-and-error.
  secPerCell: [0.80, 1.40, 2.20, 3.00],   // indexed by rater tier
  secPerCellSize: 0.04,   // extra seconds per cell for each step up in n
  // With naked/hidden pairs the rater now reaches T2 for Latin puzzles. The
  // remaining factor accounts for the perceptual load of a constraintless
  // grid: no box boundaries to anchor the eye.
  latinFactor: 1.15,
  generosityFloor: 1.25,  // time limit never drops below this multiple of par
  generositySpan: 1.35,   // extra generosity at level 1, decaying away
  generosityDecayBlocks: 14,  // blocks of ten for that extra to fall by 1/e
  peekRelief: 0.35,       // preview levels get a kinder clock, being tasters
  // Per-size par tweaks in seconds. The linear per-cell model is monotone in
  // n, so 4x4 cannot be tighter and 6x6 looser at the same time via the base
  // coefficients alone; this is the escape hatch.
  sizeParTweak: { 4: -1.5, 5: -0.5, 6: 1.0, 7: 0.5 },
};

const worldOf = level => Math.min(WORLDS.length, Math.floor((level - 1) / LEVELS_PER_WORLD) + 1);
const stageOf = level => Math.floor(((level - 1) % LEVELS_PER_WORLD) / LEVELS_PER_STAGE) + 1;
const stepOf  = level => ((level - 1) % LEVELS_PER_STAGE) + 1;

// A level's configuration is a pure function of its number, so level N is the
// same puzzle for everyone and no table has to be maintained.
function levelConfig(level){
  // Tutorial levels (0-6) use special configs
  if (isTutorialLevel(level)){
    const cfg = TUTORIAL_CONFIGS[level];
    return { ...cfg, givens:cfg.givens, level, world:0, stage:0, step:0, peek:false,
             boss:false, theme:{ name:"Tutorial", tint:"#f5a623" },
             peekOf:null, markSet:cfg.markSet || null };
  }

  const w = worldOf(level), stage = stageOf(level), step = stepOf(level);
  const world = WORLDS[w - 1];
  const pool = world.pool;

  // The ramp says which config each stage uses. Two steps break the pattern:
  // step 10 is a boss borrowing the next entry from this world, and step 5 is a
  // peek at the *next* world's easiest entry — a brief, deliberately gentle
  // taste of a mechanic the player has not unlocked yet, so the ladder advertises
  // what is coming instead of asking for faith.
  const base = world.ramp[stage - 1];
  const ahead = WORLDS[w];                       // the world after this one
  const peek = step === PEEK_STEP && !!(ahead && ahead.preview);
  const cfg = peek
    ? ahead.preview
    : pool[step === LEVELS_PER_STAGE ? Math.min(pool.length - 1, base + 1) : base];

  // Trimming givens only changes difficulty where the grid is big enough to
  // hold reasoning depth; below 9x9 it just means more typing. A peek keeps its
  // full complement — it is meant to intrigue, not to punish.
  const trim = !peek && cfg.n >= 9 ? Math.floor((step - 1) / 3) : 0;
  const givens = Math.max(cfg.givens - trim, Math.ceil(cfg.n * cfg.n * 0.25));

  return { ...cfg, givens, level, world:w, stage, step, peek,
           boss:step === LEVELS_PER_STAGE, theme:world,
           peekOf: peek ? WORLDS[w].name : null,
           markSet: cfg.markSet || null };
}

const levelSeed = level => level * 7919 + 13;

// Work estimate, in seconds. Difficulty at small sizes cannot come from the
// puzzle, so it has to come from the clock — this is what the clock is set by.
function parSeconds(cfg, tier){
  const cells = (cfg.n * cfg.n - cfg.givens) * cfg.layers;
  const perCell = TUNE.secPerCell[Math.min(tier, 3)] + TUNE.secPerCellSize * cfg.n;
  const work = cells * perCell * (cfg.boxless ? TUNE.latinFactor : 1);
  return Math.max(1, work + (TUNE.sizeParTweak[cfg.n] || 0));
}

// Generosity decays across the run, and each stage opens with a little relief
// that fades over its ten levels — a sawtooth rather than a grind.
// The clock tightens in visible steps every ten levels rather than sliding
// imperceptibly each level, so "the timer got tighter" is an event a player can
// notice. Peek levels get their relief on top.
function generosity(level, peek){
  const block = Math.floor((level - 1) / LEVELS_PER_STAGE);
  const base = TUNE.generosityFloor
             + TUNE.generositySpan * Math.exp(-block / TUNE.generosityDecayBlocks);
  return base + (peek ? TUNE.peekRelief : 0);
}

// Everything needed to play a level: the puzzle, its measured difficulty, and
// the clock it has to be beaten against.
function buildLevel(level){
  const cfg = levelConfig(level);

  // Prefer a puzzle that plain logic can finish. A tier-3 board is uniquely
  // solvable but only by guessing, which reads as unfair rather than hard, so
  // try a few alternative seeds before settling for one.
  let layers = [], rated = [], tier = 3;
  for (let attempt = 0; attempt < 6; attempt++){
    const cand = [], cr = [];
    for (let L = 0; L < cfg.layers; L++){
      const p = generatePuzzle(levelSeed(level) + attempt * 104729 + L * 7919,
                               cfg.n, cfg.givens, cfg.boxless, cfg.boxRotate);
      cand.push(p);
      cr.push(rateDifficulty(p.puzzle, cfg.n, cfg.boxless, cfg.boxRotate));
    }
    const t = Math.max(...cr.map(r => r.tier));
    if (attempt === 0 || t < tier){ layers = cand; rated = cr; tier = t; }
    if (tier < 3) break;
  }
  const stalls = rated.reduce((s, r) => s + r.stalls, 0);

  const par = parSeconds(cfg, tier);
  return { cfg, layers, tier, stalls, par, limit: par * generosity(level, cfg.peek) };
}

const LIVES_MAX = 5, LIVES_REGEN_MS = 20 * 60 * 1000;

const blankProgress = () => ({ level:1, lives:LIVES_MAX, livesAt:Date.now(), stars:{}, best:{} });

// Lives refill on a clock, so the count has to be recomputed from a timestamp
// rather than ticked — otherwise closing the tab pauses the regeneration.
function progress(){
  const p = load(LS_PROG, null) || blankProgress();
  if (p.lives >= LIVES_MAX){ p.lives = LIVES_MAX; p.livesAt = Date.now(); return p; }
  const gained = Math.floor((Date.now() - p.livesAt) / LIVES_REGEN_MS);
  if (gained > 0){
    p.lives = Math.min(LIVES_MAX, p.lives + gained);
    p.livesAt = p.lives >= LIVES_MAX ? Date.now() : p.livesAt + gained * LIVES_REGEN_MS;
  }
  return p;
}
const saveProgress2 = p => save(LS_PROG, p);
const nextLifeMs = p => p.lives >= LIVES_MAX ? 0 : LIVES_REGEN_MS - (Date.now() - p.livesAt);

const state = {
  n:4, size:"s4", diff:"easy", day:0,
  layers:[],               // [{ grid, solution, givens }] — one per overlaid puzzle
  sel:null,                // { layer, colour } or null
  erase:false,
  mode:"daily",            // "daily" | "levels"
  lvl:null,                // active level record from buildLevel()
  limitMs:0,               // countdown budget for the active level
  latin:false,             // ruleset axis: no boxes, rows and columns only
  dbl:false,               // layering axis: applies to whichever tier is selected
  scramble:false,           // Stroop axis: cross colours/shapes to mislead the eye

  elapsed:0, since:null,   // timestamp-based, so the clock never drifts
