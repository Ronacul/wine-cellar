/* ================= persistence ================= */

// Safari in private browsing rejects writes outright. Rather than silently
// losing every game, fall back to an in-memory store and say so once.
let memStore = null;                    // null until storage is known to be broken
function storageBroken(){
  if (memStore) return;
  memStore = new Map();
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i); memStore.set(k, localStorage.getItem(k));
    }
  } catch {}
  setTimeout(() => toast("Progress won't be saved in private browsing"), 900);
}
function load(key, fallback){
  try {
    const raw = memStore ? memStore.get(key) : localStorage.getItem(key);
    const v = JSON.parse(raw === undefined ? null : raw);
    return v === null ? fallback : v;
  } catch { return fallback; }
}
function save(key, val){
  const raw = JSON.stringify(val);
  if (memStore){ memStore.set(key, raw); return; }
  try { localStorage.setItem(key, raw); }
  catch { storageBroken(); memStore.set(key, raw); }
}
const blankStats = () => ({ played:0, streak:0, maxStreak:0, lastWinDay:null, best:{} });

function loadDaily(){
  const d = load(LS_DAILY, null);
  if (!d || d.day !== state.day) return { day:state.day };
  // One-time migration: old single-axis tier IDs → new composite IDs
  if (!d._mig){
    for (const [old, nk] of Object.entries(LEGACY_SLOTS)){
      if (d[old] && !d[nk])           { d[nk]         = d[old]; }
      if (d[old+"-x2"] && !d[nk+"-x2"]) { d[nk+"-x2"] = d[old+"-x2"]; }
    }
    d._mig = true; save(LS_DAILY, d);
  }
  return d;
}
function saveProgress(){
  if (state.practice) return;   // practice never enters the daily record
  const d = loadDaily();
  d[slot(state.size, state.diff, state.dbl)] = {
    layers:state.layers,
    elapsed:elapsedMs(), done:state.done, mistakes:state.mistakes,
    // Bookmark survives reload alongside the board — the guess rescue is
    // most valuable after a break, not just within a single session.
    bookmark:state.bookmark,
    hints:state.hints,
  };
  save(LS_DAILY, d);
}

/* ================= timer ================= */

const elapsedMs = () => state.elapsed + (state.since ? Date.now() - state.since : 0);
function startTimer(){
  if (!state.since && !state.done){
    state.since = Date.now(); state.started = true;
    const qb = document.getElementById("btnQuit");
    if (qb) qb.style.display = "";
  }
}
function stopTimer(){
  if (state.since){ state.elapsed += Date.now() - state.since; state.since = null; }
}
function fmtTime(ms){
  const s = Math.floor(ms / 1000);
  const mm = Math.floor(s / 60), ss = s % 60;
  return mm + ":" + String(ss).padStart(2, "0");
}
// tickTimer both drives the game clock and updates the heart-regen chip. The
// chip needs to tick even when the game timer isn't running (before the first
// placement, on the win screen, in the out-of-lives modal), so the interval
// always fires.
setInterval(tickTimer, 250);
function tickTimer(){
  updateRegenChip();
  const el = document.getElementById("timer");
  const frozen = state.frozenUntil > Date.now();
  if (state.mode !== "levels"){
    el.textContent = fmtTime(elapsedMs());
    el.className = "timer" + (frozen ? " frozen" : "");
    return;
  }

  const left = Math.max(0, state.limitMs - elapsedMs());
  el.textContent = fmtTime(left);
  el.className = "timer lvl" + (frozen ? " frozen" : left < 10000 ? " danger" : left < 30000 ? " warn" : "");

  const bar = document.getElementById("tbar");
  if (bar){
    const frac = state.limitMs ? left / state.limitMs : 1;
    bar.style.width = (frac * 100).toFixed(2) + "%";
    bar.className = "tbar-fill" + (frozen ? "" : frac < 0.12 ? " danger" : frac < 0.34 ? " warn" : "");
  }
  // Near-miss tension: vignette + haptic
  const vig = document.getElementById("vignette");
  if (vig && !frozen && state.started && !state.done){
    vig.className = "vignette" + (left < 10000 ? " danger" : left < 30000 ? " warn" : "");
    if (left < 5000 && left > 0 && Math.floor(left / 250) % 4 === 0){
      try { navigator.vibrate && navigator.vibrate(30); } catch {}
    }
  } else if (vig){
    vig.className = "vignette";
  }
  if (left <= 0 && !state.done && state.started && !frozen) failLevel();
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopTimer(); saveProgress(); }
  else if (state.started && !state.done) startTimer();
});

/* ================= game setup ================= */

const dayToISO = d => new Date(EPOCH + (d - 1) * 86400000).toISOString().slice(0, 10);
const isoToDay = iso => Math.floor((Date.parse(iso + "T00:00:00Z") - EPOCH) / 86400000) + 1;

function dayNumber(){
  const pinned = load(LS_DAY, null);
  if (pinned !== null) return pinned;
  const now = new Date();
  const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((today - EPOCH) / 86400000) + 1;
}

// Two-axis loader: picks a size + difficulty, generates or restores the puzzle.
// `fresh` re-rolls from a random seed instead of loading today's puzzle.
function loadPuzzle(sizeId, diffId, fresh){
  stopTimer();
  state.practice = !!fresh;

  const sizes = CURR_SIZES();
  const sObj = sizes.find(s => s.id === sizeId) || sizes[0];
  state.size = sObj.id;
  state.n    = sObj.n;

  const diffs = CURR_DIFFS(sObj.n);
  const dObj  = diffs.find(d => d.id === diffId) || diffs[0];
  state.diff  = dObj.id;

  buildMarks();               // mark count follows grid size

  const saved = fresh ? null : loadDaily()[slot(state.size, state.diff, state.dbl)];
  if (saved && saved.layers){
    state.layers = saved.layers.map(L => ({
      grid:L.grid.slice(), solution:L.solution.slice(), givens:L.givens.slice(),
    }));
    state.elapsed = saved.elapsed || 0;
    state.mistakes = saved.mistakes || 0;
    state.done = !!saved.done;
    state.started = state.elapsed > 0;
    state.hints = saved.hints || { reveals:0, freezes:0, adds:0 };
    state.bookmark = saved.bookmark
      ? { layers:saved.bookmark.layers.map(g => g.slice()) }
      : null;
  } else {
    const si = sizes.indexOf(sObj), di = diffs.indexOf(dObj);
    const base = fresh ? ((Math.random() * 1e9) | 0)
                       : state.day * 1000 + (state.latin ? 500 : 0)
                         + si * 10 + di * 2 + (state.dbl ? 1 : 0);
    state.layers = [];
    for (let L = 0; L < layerCount(); L++){
      const p = generatePuzzle(base + L * 7919, sObj.n, dObj.givens, state.latin);
      state.layers.push({ grid:p.puzzle.slice(), solution:p.solution.slice(), givens:p.givens.slice() });
    }
    state.elapsed = 0; state.mistakes = 0; state.done = false; state.started = false;
    state.bookmark = null;
    state.hints = { reveals:0, freezes:0, adds:0 };
  }
  state.since = null; state.sel = null; state.erase = false;
  state.history = []; state.frozenUntil = 0;
  if (!fresh){ save(LS_SIZE, state.size); save(LS_LAST, state.diff); }
  render();
  tickTimer();
  paintUndo(); paintMark();
}

// Backward-compat wrapper — used by loadLevel's toggles and any surviving callers
function loadDifficulty(id, fresh){
  // id may be old-style ("easy","nine") or new composite ("s4-easy")
  if (LEGACY_SLOTS[id]){
    const c = LEGACY_SLOTS[id].split("-");
    return loadPuzzle(c[0], c.slice(1).join("-"), fresh);
  }
  // Try as composite
  const dash = id.indexOf("-");
  if (dash > 0) return loadPuzzle(id.slice(0, dash), id.slice(dash+1), fresh);
  // Assume it's a bare diffId for the current size
  loadPuzzle(state.size, id, fresh);
}

// Loads level n into the same board machinery the daily uses, so rendering,
// interaction and win detection are shared rather than duplicated.
function loadLevel(n){
  stopTimer();
  const p = progress();
  const lv = buildLevel(n);

  // Check for new mechanics — show explainer pages before the board appears.
  const mechs = newMechanics(lv.cfg);
  if (mechs.length){
    showExplainers(mechs, () => loadLevel(n));
    return;
  }

  state.mode = "levels";
  state.lvl = lv;
  state.n = lv.cfg.n;
  state.latin = lv.cfg.boxless;
  state.dbl = lv.cfg.layers > 1;
  state.practice = true;          // levels keep their own record, not the daily one
  // A preview can advertise a mark set as well as a rule; restore the player's
  // own choice as soon as the level ends.
  // Rotation drives mark set for levels; explicit peek markSet still wins.
  activePalette = lv.cfg.markSet && MARKSETS[lv.cfg.markSet]
    ? lv.cfg.markSet
    : rotatedMarkSet(n, lv.cfg.n);
  buildMarks();

  state.layers = lv.layers.map(x => ({
    grid:x.puzzle.slice(), solution:x.solution.slice(), givens:x.givens.slice(),
  }));
  state.limitMs = lv.limit * 1000;
  state.elapsed = 0; state.since = null; state.started = false;
  state.mistakes = 0; state.done = false; state.sel = null; state.erase = false;
  state.history = []; state.bookmark = null;
  state.hints = { reveals:0, freezes:0, adds:0 }; state.frozenUntil = 0;

  // Don't overwrite the player's highest-level progress when replaying tutorial.
  // Tutorial replay uses levels 0–6; we only advance, never regress.
  saveProgress2(Object.assign(p, { level: isTutorialLevel(n) ? p.level : n }));
  render();
  tickTimer();
  paintUndo(); paintMark();
}

function enterDaily(){
  state.mode = "daily"; state.lvl = null; state.practice = false;
  state.latin = load(LS_LATIN, false); state.dbl = load(LS_DBL, false);
  const defSize = CURR_SIZES()[0].id;
  const sizeId = load(LS_SIZE, defSize);
  const diffId = load(LS_LAST, "easy");
  loadPuzzle(sizeId, diffId);
}

/* ================= conflicts ================= */

function conflictsAt(L, idx){
  const n = state.n, g = state.layers[L].grid, v = g[idx];
  const out = new Set();
  if (v === null || v === undefined) return out;
  const rotate = !!(state.lvl && state.lvl.cfg.boxRotate);
  const { bw, bh } = boxDims(n, rotate);
  const r = Math.floor(idx / n), c = idx % n;
  for (let i = 0; i < n; i++){
    if (i !== c && g[r * n + i] === v) out.add(r * n + i);
    if (i !== r && g[i * n + c] === v) out.add(i * n + c);
  }
  if (!state.latin){
    const r0 = Math.floor(r / bh) * bh, c0 = Math.floor(c / bw) * bw;
    for (let rr = r0; rr < r0 + bh; rr++)
      for (let cc = c0; cc < c0 + bw; cc++){
        const j = rr * n + cc;
        if (j !== idx && g[j] === v) out.add(j);
      }
  }
  if (out.size) out.add(idx);
  return out;
}

// Every layer complete with no violations. Checked against the rules rather
// than the stored solution, so the win condition is self-contained.
function isSolved(){
  for (let L = 0; L < state.layers.length; L++){
    const g = state.layers[L].grid;
    if (g.some(v => v === null || v === undefined)) return false;
    for (let i = 0; i < g.length; i++) if (conflictsAt(L, i).size) return false;
  }
  return true;
}

/* ================= rendering ================= */

function render(){
  if (state.mode === "levels") renderLevelBar();
  else { renderSizes(); renderDiffs(); }
  renderBoard(); renderPalette(); renderSub();
  paintCompletedUnits();
  applySharp();
  renderChallengeBar();
  // Show the ✕ quit button whenever the player is inside a puzzle —
  // hidden on the welcome/help screen or once the puzzle is solved.
  const qb = document.getElementById("btnQuit");
  if (qb) qb.style.display = (state.started || state.elapsed > 0) && !state.done ? "" : "none";
  // Banner ad mockup — visible only in level mode
  const ab = document.getElementById("adBanner");
  if (ab) ab.style.display = state.mode === "levels" ? "" : "none";
}

const heartsHTML = p => Array.from({ length:LIVES_MAX }, (_, i) =>
  '<span class="' + (i < p.lives ? "on" : "") + '">♥</span>').join("");

// The stage path is a 10-dot strip: current step is bright, past steps
// muted-with-check, future steps faint. Peek gets a diamond, boss a star.
// Each dot carries pip marks (1–3) matching the rater's tier so the boss
// visibly reads as heavier than a mid-stage step.
const PATH_ICONS = { peek: "◈", boss: "★", dot: "●" };
function stepMarker(step){
  if (step === LEVELS_PER_STAGE) return PATH_ICONS.boss;
  if (step === PEEK_STEP) return PATH_ICONS.peek;
  return PATH_ICONS.dot;
}
function renderStagePath(cfg){
  // Pre-compute the ten steps of this stage. levelConfig is cheap; buildLevel
  // is not — the rater takes real time — so precompute lazily and cache by
  // stage.  We just need config-time info (peek/boss/step) here; the pip
  // count comes from a lightweight par estimator, not the full rater.
  const baseLevel = (cfg.world - 1) * LEVELS_PER_WORLD + (cfg.stage - 1) * LEVELS_PER_STAGE;
  const p = progress();
  let html = '<div class="path" aria-label="Stage progress">';
  for (let step = 1; step <= LEVELS_PER_STAGE; step++){
    const L = baseLevel + step;
    const st = p.stars[String(L)] || 0;
    const state = step === cfg.step ? "here"
                : L < p.level          ? "done"
                : "todo";
    const cls = "st " + state + (step === LEVELS_PER_STAGE ? " boss"
                                 : step === PEEK_STEP ? " peek" : "");
    // Pip count reflects how demanding this step is *within* the stage:
    // step 10 (boss) is heaviest, step 5 (peek) uses the next-world entry
    // and reads as a taster. Everything else is 1 pip.
    const pips = step === LEVELS_PER_STAGE ? 3 : step === PEEK_STEP ? 2 : 1;
    html += '<span class="' + cls + '" data-step="' + step + '">'
          + stepMarker(step)
          + (st ? '<span class="stg">' + "★".repeat(st) + "</span>" : "")
          + '<span class="pips">' + "•".repeat(pips) + "</span>"
          + "</span>";
  }
  return html + "</div>";
}
// Ticks alongside the game clock so the "next heart in" chip is live rather
// than a snapshot. Cheap to touch a single innerText per 250ms.
function updateRegenChip(){
  const el = document.getElementById("regen");
  if (!el) return;
  const p = progress();
  if (p.lives >= LIVES_MAX){ el.textContent = ""; return; }
  el.textContent = "+" + fmtTime(nextLifeMs(p));
  const modalEl = document.getElementById("outLivesIn");
  if (modalEl){
    const ms = nextLifeMs(p);
    modalEl.textContent = ms > 0 ? fmtTime(ms) : "ready";
  }
}

function renderLevelBar(){
  // Hide the size row in level mode — levels pick their own config
  const sr = document.getElementById("sizeRow");
  if (sr) sr.style.display = "none";
  const lv = state.lvl, p = progress();
  const stars = p.stars[String(lv.cfg.level)] || 0;
  const c = lv.cfg;
  const rotTag = c.boxRotate ? " ⤾" : "";   // rotated-box marker
  const tag = c.n + "×" + c.n + (c.boxless ? " Latin" : "") + rotTag
            + (c.layers > 1 ? " ×2" : "");
  document.getElementById("diffs").outerHTML =
    '<div class="levelbar" id="diffs">'
    + '<div class="lvl-l"><button class="icon-btn" id="lvBack" aria-label="Back to daily">←</button></div>'
    + '<div class="lvl-c"><b>Level ' + c.level
    + (c.peek ? ' <span class="pk">' + (c.peekOf || "ahead") + "</span>" : "") + "</b>"
    + '<span class="lvl-sub">' + (c.peek ? "Preview" : c.theme.name) + " · " + tag
    + (c.boss ? " · boss" : "") + "</span>"
    + renderStagePath(lv.cfg) + "</div>"
    + '<div class="hearts">' + heartsHTML(p)
    + '<span class="regen" id="regen"></span></div>'
    + "</div>";
  const tw = document.getElementById("tbarwrap");
  if (tw) tw.style.display = "";
  document.getElementById("lvBack").onclick = confirmQuitLevel;
  renderPowerups();
  // The axis toggles belong to the daily; a level chooses its own config.
  for (const id of ["latinToggle", "dblToggle", "scrambleToggle", "lvlToggle"]){
    const b = document.getElementById(id);
    if (b) b.style.display = "none";
  }
  const box = document.getElementById("diffs");
  if (box) box.dataset.stars = stars;
}

function renderSub(){
  const sObj = sizeOf(state.size);
  const dObj = diffOf2(state.diff, state.n);
  const sub = document.getElementById("sub");

  let base;
  if (state.mode === "levels"){
    const cfg = state.lvl.cfg;
    const gridLabel = cfg.n + "×" + cfg.n;
    const ruleLabel = cfg.boxless ? "Latin" : "Sudoku";
    const markLabel = cfg.markSet
      ? MARKSETS[cfg.markSet].name
      : (cfg.level > 50 ? "All marks" : "Colors & Shapes");
    const layerLabel = cfg.layers > 1 ? " · Double" : "";

    base = "Stage " + cfg.stage + " · step " + cfg.step
         + " · " + gridLabel + " · " + ruleLabel
         + " · " + markLabel + layerLabel;
  } else {
    base = (state.practice ? "Practice" : "#" + state.day) + " · "
      + (state.latin ? "Latin " : "") + sObj.label + " " + dObj.label
      + (state.dbl ? " · Double" : "")
      + (state.scramble ? " · Scramble" : "");
  }

  // Streak chip — visible at a glance, not buried in the win modal
  const st = load(LS_STATS, blankStats());
  if (st.streak > 1 && state.mode !== "levels"){
    sub.innerHTML = base + ' <span class="streak-chip">🔥' + st.streak + '</span>';
  } else {
    sub.textContent = base;
  }
}

function renderSizes(){
  const daily = loadDaily();
  const sizes = CURR_SIZES();
  const el = document.getElementById("sizes");
  if (!el) return;
  el.innerHTML = sizes.map(s => {
    // A size is "done" if all its difficulties are done for today
    const ds = CURR_DIFFS(s.n);
    const allDone = ds.every(d => {
      const rec = daily[slot(s.id, d.id, state.dbl)];
      return rec && rec.done;
    });
    return '<button class="diff' + (s.id === state.size ? " on" : "") + '" data-size="' + s.id + '">'
      + s.label + (allDone ? ' <span class="tick">✓</span>' : "") + "</button>";
  }).join("");
  document.querySelectorAll("[data-size]").forEach(b => {
    b.onclick = () => {
      if (b.dataset.size !== state.size){
        const ns = sizes.find(s => s.id === b.dataset.size) || sizes[0];
        const nd = CURR_DIFFS(ns.n);
        const dId = nd.find(d => d.id === state.diff) ? state.diff : nd[0].id;
        loadPuzzle(b.dataset.size, dId);
      }
    };
  });
  // Show size row in daily mode
  const sr = document.getElementById("sizeRow");
  if (sr) sr.style.display = "";
}

function renderDiffs(){
  const daily = loadDaily();
  const diffs = CURR_DIFFS(state.n);
  document.getElementById("diffs").innerHTML = diffs.map(d => {
    const rec = daily[slot(state.size, d.id, state.dbl)];
    const done = rec && rec.done;
    return '<button class="diff' + (d.id === state.diff ? " on" : "") + '" data-diff="' + d.id + '">'
      + d.label + (done ? ' <span class="tick">✓</span>' : "") + "</button>";
  }).join("");
  for (const id of ["latinToggle", "dblToggle", "scrambleToggle", "lvlToggle"]){
    const b = document.getElementById(id);
    if (b) b.style.display = "";
  }
  const lb = document.getElementById("lvlToggle");
  if (lb) lb.onclick = () => loadLevel(progress().level);
  const tw = document.getElementById("tbarwrap");
  if (tw) tw.style.display = "none";
  const pu = document.getElementById("powerups");
  if (pu) pu.style.display = "none";
  const lt = document.getElementById("latinToggle");
  lt.className = "dbl" + (state.latin ? " on" : "");
  lt.textContent = state.latin ? "Latin ✓" : "Latin";
  lt.onclick = () => {
    const goingOn = !state.latin;
    state.latin = goingOn; save(LS_LATIN, state.latin);
    const sizes = CURR_SIZES();
    const go = () => loadPuzzle(sizes[0].id, CURR_DIFFS(sizes[0].n)[0].id);
    if (goingOn && !seenMechanics().has("latin")){ showExplainers(["latin"], go); }
    else go();
  };
  const t = document.getElementById("dblToggle");
  t.className = "dbl" + (state.dbl ? " on" : "");
  t.textContent = state.dbl ? "Double ✓" : "Double";
  t.onclick = () => {
    const goingOn = !state.dbl;
    state.dbl = goingOn; save(LS_DBL, state.dbl);
    const go = () => loadPuzzle(state.size, state.diff);
    if (goingOn && !seenMechanics().has("double")){ showExplainers(["double"], go); }
    else go();
  };
  const st = document.getElementById("scrambleToggle");
  st.className = "dbl" + (state.scramble ? " on" : "");
  st.textContent = state.scramble ? "Scramble ✓" : "Scramble";
  st.onclick = () => {
    const goingOn = !state.scramble;
    state.scramble = goingOn; save(LS_SCRAMBLE, state.scramble);
    const go = () => loadPuzzle(state.size, state.diff);
    if (goingOn && !seenMechanics().has("scramble")){ showExplainers(["scramble"], go); }
    else go();
  };
  document.querySelectorAll("[data-diff]").forEach(b => {
    b.onclick = () => { if (b.dataset.diff !== state.diff) loadPuzzle(state.size, b.dataset.diff); };
  });
}

// Nested grid: an outer grid of boxes, each an inner grid of cells. Gives clean
// box separation at any n without border bookkeeping.
function renderBoard(){
  const n = state.n;
  const rotate = !!(state.lvl && state.lvl.cfg.boxRotate);
  const { bw, bh } = boxDims(n, rotate);
  const boxesPerRow = state.latin ? n : n / bw, boxRows = state.latin ? n : n / bh;
  let html = "";

  // Latin has no boxes, so the board is one flat grid of cells.
  if (state.latin){
    for (let i = 0; i < n * n; i++){
      const r = cellInner(i, -1);
      html += '<div class="cell' + (state.layers[0].givens[i] ? " given" : "")
            + (r.hasDot ? " has-dot" : "")
            + '" data-i="' + i + '">' + r.html + "</div>";
    }
  } else

  for (let b = 0; b < n; b++){
    const r0 = Math.floor(b / boxesPerRow) * bh, c0 = (b % boxesPerRow) * bw;
    let inner = "";
    for (let r = r0; r < r0 + bh; r++){
      for (let c = c0; c < c0 + bw; c++){
        const i = r * n + c;
        const ci = cellInner(i);
        inner += '<div class="cell' + (state.layers[0].givens[i] ? " given" : "")
               + (ci.hasDot ? " has-dot" : "")
               + '" data-i="' + i + '">' + ci.html + "</div>";
      }
    }
    html += '<div class="box" style="grid-template-columns:repeat(' + bw + ',1fr);'
          + 'grid-template-rows:repeat(' + bh + ',1fr)">' + inner + "</div>";
  }

  const board = document.getElementById("board");
  // Gaps shrink as the grid grows, or a 16x16 would be all gutter and no cell.
  const sc = n <= 4 ? [12, 4, 8] : n <= 9 ? [11, 2, 5] : [7, 1, 3];
  board.style.setProperty("--bgap", sc[0] + "px");
  board.style.setProperty("--cgap", sc[1] + "px");
  board.style.setProperty("--crad", sc[2] + "px");
  board.style.gridTemplateColumns = "repeat(" + boxesPerRow + ",1fr)";
  board.style.gridTemplateRows = "repeat(" + boxRows + ",1fr)";
  board.classList.remove("done");
  board.classList.toggle("dbl", state.layers.length > 1);
  board.innerHTML = html;
  board.querySelectorAll("[data-i]").forEach(el => {
    el.onclick = () => onCell(parseInt(el.dataset.i, 10));
  });
  if (state.done) markWon();
}

// Layer 0 fills the square itself; each further layer draws a mark inside it.
// `animate` is the layer index that was just placed, or -1.
function cellInner(i, animate){
  let out = "";
  let hasDot = false;
  const v0 = state.layers[0].grid[i];
  if (v0 !== null && v0 !== undefined){
    const useScramble = state.scramble && activePalette !== "ink";
    const st = useScramble ? scrambleStyle(i, v0) : styleFor(0, v0);
    out += '<div class="fill' + (isPattern() ? " pat" : "") + (animate === 0 ? " new" : "")
         + '" style="' + st + '"></div>';
  }
  for (let L = 1; L < state.layers.length; L++){
    const v = state.layers[L].grid[i];
    if (v === null || v === undefined) continue;
    hasDot = true;
    out += '<div class="dot' + (state.layers[L].givens[i] ? " given" : "")
         + (animate === L ? " new" : "") + '" style="' + styleFor(L, v) + '"></div>';
  }
  return { html:out, hasDot };
}

// One row of swatches per layer. Which row you pick from decides which layer
// you are placing into — no mode toggle to forget about.
function renderPalette(){
  const cols = palette();
  const sel = state.sel;
  // A mark is 'done' when it's placed n times on its layer — the palette
  // shouldn't leave the player scanning back to count.
  const counts = state.layers.map(L => {
    const c = new Array(state.n).fill(0);
    for (const v of L.grid) if (v !== null && v !== undefined) c[v]++;
    return c;
  });
  let rows = "";
  for (let L = 0; L < state.layers.length; L++){
    const marks = L > 0 ? innerMarks() : cols;
    const swatches = marks.map((c, i) => {
      const placed = counts[L][i];
      const done = placed >= state.n;
      const remaining = Math.max(0, state.n - placed);
      // aria-label carries the count too, so a screen reader hears
      // "Red, 3 remaining" rather than just "Red".
      const aria = c.label + (L > 0 ? " (inner)" : "")
                 + (remaining > 0 ? ", " + remaining + " remaining" : ", done");
      const shaped = L === 0 && c.clip && c.kind !== "pattern";
      const donut = L === 0 && state.layers.length > 1 && !shaped;
      return '<button class="swatch' + (L > 0 ? " inner" : (isPattern() ? " pat" : ""))
        + (shaped ? " shaped" : "")
        + (donut ? " donut" : "")
        + (done ? " done" : "")
        + (sel && sel.layer === L && sel.colour === i ? " on" : "")
        + '" data-l="' + L + '" data-c="' + i + '" style="' + swatchStyleFor(L, i)
        + '" aria-label="' + aria + '">'
        + (remaining > 0 ? '<span class="cnt">' + remaining + "</span>" : "")
        + (L === 0 && state.n <= 4 ? '<span class="k">' + (i + 1) + "</span>" : "")
        + "</button>";
    });
    // No eraser swatch — tapping the same colour on a cell clears it.
    // 9+ marks split into two rows for bigger, more tappable swatches.
    const isDbl = state.layers.length > 1;
    const nRows = isDbl ? 1 : (state.n > 4 ? 2 : 1);
    const perRow = Math.ceil(swatches.length / nRows);
    for (let k = 0; k < swatches.length; k += perRow)
      rows += '<div class="prow' + (state.n > 4 ? " wrap" : "") + '">'
            + swatches.slice(k, k + perRow).join("") + "</div>";
  }
  const p = document.getElementById("palette");
  p.className = "palette pal-pad" + (state.n > 4 ? " tight" : "")
    + (state.layers.length > 1 ? " dbl-pal" : "");
  p.innerHTML = rows;
  p.querySelectorAll("[data-c]").forEach(b => {
    const isDone = b.classList.contains("done");
    b.disabled = isDone;
    b.onclick = () => {
      if (isDone) { toast("All " + b.getAttribute("aria-label").split(",")[0].toLowerCase() + " placed"); return; }
      const L = +b.dataset.l, i = +b.dataset.c;
      const same = sel && sel.layer === L && sel.colour === i;
      state.sel = same ? null : { layer:L, colour:i };
      state.erase = false;
      renderPalette();
    };
  });
  // Erase mode still reachable via Backspace/Delete key — no swatch needed.
}

function cellEl(i){ return document.querySelector('[data-i="' + i + '"]'); }

function paintCell(i, animate){
  const el = cellEl(i); if (!el) return;
  const r = cellInner(i, animate);
  el.innerHTML = r.html;
  el.classList.toggle("has-dot", r.hasDot);
}

function flashConflicts(set){
  set.forEach(i => {
    const el = cellEl(i); if (!el) return;
    el.classList.add("bad");
    setTimeout(() => el.classList.remove("bad"), 620);
  });
}

function markWon(){
  const n = state.n;
  document.getElementById("board").classList.add("done");
  document.querySelectorAll("[data-i]").forEach(el => {
    const i = +el.dataset.i, r = Math.floor(i / n), c = i % n;
    el.style.animationDelay = ((r + c) * 70) + "ms";
    el.classList.add("won");
  });
}

/* ================= interaction ================= */

// Every mutation goes through pushHistory so undo restores what was there,
// including a null (empty) — same-colour-tap-to-clear round-trips through here.
function pushHistory(entries){
  if (!entries.length) return;
  state.history.push({ entries });
  if (state.history.length > HISTORY_MAX) state.history.shift();
  paintUndo();
}

// Single chokepoint for every placement — a lives system or ad gate attaches here.
function placeColour(L, i, val){
  const prev = state.layers[L].grid[i];
  if (prev !== val) pushHistory([{ L, i, prev }]);
  state.layers[L].grid[i] = val;
  startTimer();
  paintCell(i, val !== null ? L : -1);
  renderPalette();      // keeps the 'done' fade in step with the last placement
  paintCompletedUnits();

  if (val !== null){
    const bad = conflictsAt(L, i);
    if (bad.size){ state.mistakes++; flashConflicts(bad); }
  }
  saveProgress();

  if (isSolved()) win();
}

/* ================= RESET & ADD TIME ================= */
function confirmReset(){
  pauseTimer();
  openModal(
    '<h2>Reset puzzle?</h2>'
    + '<p class="lede">Start over from the beginning?</p>'
    + '<button class="btn" id="mReset">Reset</button>'
    + '<button class="btn ghost" id="mKeep">Keep playing</button>'
  );
  document.getElementById("mReset").onclick = () => { closeModal(); resetPuzzle(); };
  document.getElementById("mKeep").onclick = () => { closeModal(); resumeTimer(); };
}

function resetPuzzle(){
  // Clear all player marks, keep givens
  state.layers.forEach(L => {
    for (let i = 0; i < L.grid.length; i++){
      if (!L.givens[i]) L.grid[i] = null;
    }
  });
  state.history = [];
  state.mistakes = 0;
  state.bookmark = null;
  renderBoard();
  renderPalette();
  paintCompletedUnits();
  paintMark();
  paintUndo();
  saveProgress();
  resumeTimer();
  toast("Puzzle reset");
}

function onCell(i){
  if (state.done) return;

  if (state.erase){
    // Clears every unlocked layer in the square, so one tap undoes the square.
    // The whole sweep is captured as one undo entry — restoring one tap.
    const entries = [];
    state.layers.forEach((L, li) => {
      if (!L.givens[i] && L.grid[i] !== null){
        entries.push({ L:li, i, prev:L.grid[i] });
        L.grid[i] = null;
      }
    });
    if (entries.length){
      pushHistory(entries);
      paintCell(i, -1);
      renderPalette();
      paintCompletedUnits();
      saveProgress();
    }
    return;
  }

  if (state.sel === null){ toast("Pick a " + markNoun() + " first"); return; }
  const { layer, colour } = state.sel;
  if (state.layers[layer].givens[i]) return;
  placeColour(layer, i, state.layers[layer].grid[i] === colour ? null : colour);
}

// Not routed through placeColour: an undo shouldn't count mistakes, shouldn't
// flash conflicts, and shouldn't trigger a win check.
function undo(){
  if (state.done || !state.history.length) return;
  const move = state.history.pop();
  for (const { L, i, prev } of move.entries) state.layers[L].grid[i] = prev;
  for (const { i } of move.entries) paintCell(i, -1);
  renderPalette();
  paintCompletedUnits();
  saveProgress();
  paintUndo();
}

function paintUndo(){
  const b = document.getElementById("btnUndo");
  if (b) b.disabled = state.done || state.history.length === 0;
}

// --------------- completion fade ---------------
// After each placement, tag cells belonging to fully-filled, conflict-free
// units so CSS can dim them.  In Double mode, outer (layer 0) and inner
// (layer 1) are tracked independently — a row may be complete on the outer
// fill while the inner dot is still missing.
function paintCompletedUnits(){
  const board = document.getElementById("board");
  if (!board) return;
  const fadePref = load(LS_FADE, true);
  board.classList.toggle("fade-done", fadePref);

  const n = state.n;
  const rotate = !!(state.lvl && state.lvl.cfg.boxRotate);
  const U = unitsOf(n, state.latin, rotate);

  // For each layer, find which cells belong to at least one complete unit.
  const done = state.layers.map(() => new Set());
  for (let L = 0; L < state.layers.length; L++){
    const g = state.layers[L].grid;
    for (const u of U){
      // A unit is complete when every cell has a value and no conflicts exist.
      if (u.some(i => g[i] === null || g[i] === undefined)) continue;
      let clean = true;
      for (const i of u){
        if (conflictsAt(L, i).size){ clean = false; break; }
      }
      if (clean) for (const i of u) done[L].add(i);
    }
  }

  const multi = state.layers.length > 1;
  board.querySelectorAll("[data-i]").forEach(el => {
    const i = +el.dataset.i;
    if (multi){
      el.classList.toggle("unit-done-0", done[0].has(i));
      el.classList.toggle("unit-done-1", done.length > 1 && done[1].has(i));
      el.classList.remove("unit-done");
    } else {
      el.classList.toggle("unit-done", done[0].has(i));
      el.classList.remove("unit-done-0", "unit-done-1");
    }
  });
}

// --------------- sharp / rounded marks ---------------
function applySharp(){

// Bookmark: single slot, board-state only. Clock and mistakes deliberately
// don't rewind — this is a wrong-guess rescue, not a do-over.
function setBookmark(){
  state.bookmark = { layers:state.layers.map(L => L.grid.slice()) };
  paintMark();
  saveProgress();
  toast("Bookmark saved — tap again to return.");
}

function restoreBookmark(){
  if (!state.bookmark || state.done) return;
  state.bookmark.layers.forEach((g, L) => { state.layers[L].grid = g.slice(); });
  state.history = [];
  renderBoard();
  renderPalette();
  paintCompletedUnits();
  applySharp();
  saveProgress();
  paintUndo();
}

function clearBookmark(){
  state.bookmark = null;
  paintMark();
  saveProgress();
}

function paintMark(){
  const b = document.getElementById("btnMark");
  if (!b) return;

document.addEventListener("keydown", e => {
  if (!document.getElementById("overlay").classList.contains("hide")){
    if (e.key === "Escape") closeModal();
    return;
  }
  // Ctrl/Cmd+Z beats the digit handler — the modifier check has to run first.
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){
    e.preventDefault(); undo(); return;
  }
  // 1-4 pick outer colours; hold Shift for the inner layer.
  const k = parseInt(e.key === "!" ? 1 : e.key === "@" ? 2 : e.key === "#" ? 3 : e.key === "$" ? 4 : e.key, 10);
  if (k >= 1 && k <= Math.min(state.n, 9)){
    const layer = e.shiftKey && state.layers.length > 1 ? 1 : 0;
    state.sel = { layer, colour:k - 1 };
    state.erase = false; renderPalette();
  }
  else if (e.key === "Backspace" || e.key === "Delete"){ state.erase = true; state.sel = null; renderPalette(); }
});

function win(){
  stopTimer();
  state.done = true;
  saveProgress();
  tickTimer();          // freeze the header on the final time, not the last tick
  paintUndo();          // grey the undo — the solved board isn't unwindable
  // Clear vignette on win too
  const vig = document.getElementById("vignette");
  if (vig) vig.className = "vignette";

  if (state.mode === "levels"){ winLevel(); return; }
  if (state.practice){ markWon(); setTimeout(showWin, 1100); return; }

  const st = load(LS_STATS, blankStats());
  st.played++;
  if (st.lastWinDay !== state.day){
    st.streak = st.lastWinDay === state.day - 1 ? st.streak + 1 : 1;
    st.lastWinDay = state.day;
    st.maxStreak = Math.max(st.maxStreak, st.streak);
  }
  const secs = Math.floor(elapsedMs() / 1000);
  const bk = compositeId(state.size, state.diff);
  if (!st.best[bk] || secs < st.best[bk]) st.best[bk] = secs;
  save(LS_STATS, st);
  recordLeaderboard();

  markWon();
  renderDiffs();
  setTimeout(showWin, 1100);
}

// Stars reward beating par, so there is a reason to replay a cleared level.
// Each hint used reduces the ceiling by one — three hints caps you at one star.
function starsFor(secs, par){
  const raw = secs <= par ? 3 : secs <= par * 1.4 ? 2 : 1;
  const hintsUsed = state.hints.reveals + state.hints.freezes + state.hints.adds;
  return Math.max(1, raw - hintsUsed);
}

function winLevel(){
  const lv = state.lvl, secs = Math.round(elapsedMs() / 1000);
  const st = starsFor(secs, lv.par);
  const p = progress();
  const key = String(lv.cfg.level);
  p.stars[key] = Math.max(p.stars[key] || 0, st);
  if (!p.best[key] || secs < p.best[key]) p.best[key] = secs;
  p.level = Math.max(p.level, lv.cfg.level + 1);
  saveProgress2(p);

  markWon();
  setTimeout(() => {
    fireConfetti();
    const hintsUsed = totalHints();
    openModal(
      "<h2>Level " + lv.cfg.level + " cleared</h2>"
      + '<p class="lede">' + lv.cfg.theme.name + " · stage " + lv.cfg.stage
      + (lv.cfg.boss ? " · boss" : "")
      + (hintsUsed ? ' · 💡×' + hintsUsed : '') + "</p>"
      + '<div class="stars-big">' + [1,2,3].map(i =>
          '<span class="' + (i <= st ? "on" : "") + '">★</span>').join("") + "</div>"
      + '<div class="badge-wrap" id="badgeWrap"></div>'
      + '<div class="stats">'
      + '<div class="stat"><div class="n">' + fmtTime(secs * 1000) + '</div><div class="l">Your time</div></div>'
      + '<div class="stat"><div class="n">' + fmtTime(lv.par * 1000) + '</div><div class="l">Par</div></div>'
      + '<div class="stat"><div class="n">' + progress().lives + '</div><div class="l">Lives</div></div>'
      + "</div>"
      + '<button class="btn" id="shareBtn">Share badge</button>'
      + '<button class="btn ghost" id="mNext">Next level</button>'
      + '<button class="btn ghost" id="mRetry">Replay</button>'
      + '<button class="btn ghost" id="mStop">Done for now</button>'
    );
    try {
      const badge = renderShareBadge();
      document.getElementById("badgeWrap").appendChild(badge);
    } catch { /* canvas unavailable */ }
    document.getElementById("shareBtn").onclick = shareAsImage;
    document.getElementById("mNext").onclick = () => showProgression(lv.cfg.level + 1);
    document.getElementById("mRetry").onclick = () => { closeModal(); loadLevel(lv.cfg.level); };
    document.getElementById("mStop").onclick = () => { closeModal(); enterDaily(); };
  }, 1100);
}

// Failure is the clock, never a mistake — conflicts stay advisory, which keeps
// the puzzle forgiving while still giving the run something to lose.
function failLevel(){
  stopTimer();
  state.done = true;
  // Clear vignette
  const vig = document.getElementById("vignette");
  if (vig) vig.className = "vignette";
  const p = progress();
  p.lives = Math.max(0, p.lives - 1);
  if (p.lives === LIVES_MAX - 1 && !p.livesAt) p.livesAt = Date.now();
  if (p.lives < LIVES_MAX) p.livesAt = p.livesAt || Date.now();
  saveProgress2(p);
  renderLevelBar();
  // Camera shake on life loss
  const board = document.getElementById("board");
  board.classList.add("shake");
  try { navigator.vibrate && navigator.vibrate([50, 30, 50]); } catch {}
  setTimeout(() => board.classList.remove("shake"), 500);

  const out = p.lives <= 0;
  const addTimeAvailable = state.hints.adds < HINT_LIMITS.adds;

  openModal(
    "<h2>Out of time</h2>"
    + '<p class="lede">Level ' + state.lvl.cfg.level + " · par was "
    + fmtTime(state.lvl.par * 1000) + ".</p>"

    + (out
        ? '<p class="lede">No lives left. One returns in <b id="outLivesIn">'
          + fmtTime(nextLifeMs(p)) + "</b>.</p>"
          + (addTimeAvailable
              ? '<button class="btn" id="mAddTime">⏰ Add ' + ADD_SECS + 's</button>'
                + '<button class="btn ghost" id="mWatchAd">📺 Watch ad for +30s</button>'
              : "")
          + '<button class="btn ghost" id="mBack">Back to daily</button>'
        : '<button class="btn" id="mRetry">Try again</button>'
          + (addTimeAvailable
              ? '<button class="btn ghost" id="mAddTime">⏰ Add ' + ADD_SECS + 's</button>'
              : "")
          + '<button class="btn ghost" id="mBack">Back to daily</button>')
  );

  const r = document.getElementById("mRetry");
  if (r) r.onclick = () => { closeModal(); loadLevel(state.lvl.cfg.level); };

  const addBtn = document.getElementById("mAddTime");
  if (addBtn) {
    addBtn.onclick = () => {
      if (state.hints.adds >= HINT_LIMITS.adds) { toast("No adds left"); return; }
      closeModal();
      showAddTimeModal();
    };
  }

  const adBtn = document.getElementById("mWatchAd");
  if (adBtn) {
    adBtn.onclick = () => {
      // TODO: Integrate with ad network (Google AdMob, etc)
      closeModal();
      state.frozenUntil = 0;
      startTimer();
      saveProgress();
      toast("⏰ +30s from ad");
    };
  }

  document.getElementById("mBack").onclick = () => { closeModal(); enterDaily(); };
}

/* ================= confetti ================= */

// Lightweight particle burst — fires on win. Canvas cleans itself up after the
// last particle falls offscreen. Colour pulled from the game's own HUES palette.
function fireConfetti(){
  const cvs = document.createElement("canvas");
  cvs.className = "confetti";
  cvs.width = window.innerWidth;  cvs.height = window.innerHeight;
  document.body.appendChild(cvs);
  const ctx = cvs.getContext("2d");
  const colours = HUES.slice(0, Math.min(9, HUES.length)).map(h => h.hex);
  const N = 120;
  const particles = [];
  for (let i = 0; i < N; i++){
    particles.push({
      x: cvs.width * 0.5 + (Math.random() - 0.5) * cvs.width * 0.4,
      y: cvs.height * 0.45,
      vx: (Math.random() - 0.5) * 12,
      vy: -Math.random() * 14 - 4,
      w: 4 + Math.random() * 6,
      h: 3 + Math.random() * 4,
      rot: Math.random() * Math.PI * 2,
      rv: (Math.random() - 0.5) * 0.3,
      col: colours[Math.floor(Math.random() * colours.length)],
      grav: 0.18 + Math.random() * 0.06,
      life: 1,
    });
  }
  let raf;
  function tick(){
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    let alive = false;
    for (const p of particles){
      p.x += p.vx; p.y += p.vy;
      p.vy += p.grav;
      p.vx *= 0.99;
      p.rot += p.rv;
      p.life -= 0.006;
      if (p.life <= 0 || p.y > cvs.height + 20) continue;
      alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (alive) raf = requestAnimationFrame(tick);
    else cvs.remove();
  }
  raf = requestAnimationFrame(tick);
  // Safety net: remove canvas after 4s even if particles linger
  setTimeout(() => { cancelAnimationFrame(raf); cvs.remove(); }, 4000);
}

/* ================= share ================= */

function emojiGrid(L){
  const n = state.n, g = state.layers[L].grid;
  let out = "";
  for (let r = 0; r < n; r++){
    for (let c = 0; c < n; c++) out += emojiFor(L, g[r * n + c]);
    if (r < n - 1) out += "\n";
  }
  return out;
}

// Share text shows emoji hints — row counts of unique colours — without spoiling
// the actual solution. Teases the grid's shape, keeps copy small.
function spoilerFreeGrid(){
  const n = state.n, g = state.layers[0].grid;
  const rows = [];
  for (let r = 0; r < n; r++){
    const counts = {};
    for (let c = 0; c < n; c++){
      const v = g[r * n + c];
      if (v !== null && v !== undefined) counts[v] = (counts[v] || 0) + 1;
    }
    // One emoji per unique colour used in this row, capped at n
    const uniq = Object.keys(counts).length;
    rows.push(uniq === n ? "✅" : "🟩".repeat(uniq) + "⬜".repeat(n - uniq));
  }
  return rows.join("\n");
}

function shareText(){
  const mods = (state.dbl ? " · Double" : "") + (state.scramble ? " · Scramble" : "");
  const st = load(LS_STATS, blankStats());
  const streakLine = st.streak > 1 ? "🔥 " + st.streak + " day streak\n" : "";
  return SHARE_NAME + " #" + state.day + " · " + sizeOf(state.size).label + " " + diffOf2(state.diff, state.n).label + mods + " ✨\n"
       + "⏱️ " + fmtTime(elapsedMs()) + "\n"
       + streakLine + "\n"
       + spoilerFreeGrid() + "\n";
}

const copyShare = () => copyText(shareText());

// URL format: ?challenge=<day>-<sizeId>-<diffId>-<seconds>
// A friend shares a link; the recipient sees a ghost time to beat.
function buildChallengeURL(){
  const secs = Math.floor(elapsedMs() / 1000);
  const base = location.href.split("?")[0].split("#")[0];
  return base + "?challenge=" + state.day + "-" + state.size + "-" + state.diff + "-" + secs;
}

function getChallengeTime(){
  const q = new URLSearchParams(location.search).get("challenge");
  if (!q) return null;
  const parts = q.split("-");
  if (parts.length < 4) return null;
  const day = parseInt(parts[0], 10);
  const secs = parseInt(parts[parts.length - 1], 10);
  // Only valid if it matches today's puzzle
  if (day !== dayNumber() || isNaN(secs)) return null;
  return secs;
}

function shareChallenge(){
  const url = buildChallengeURL();
  const text = "⚡ Beat my Chromoku time!\n"
    + SHARE_NAME + " #" + state.day + " · " + fmtTime(elapsedMs()) + "\n"
    + url;
  copyText(text);
}

// Show the ghost time bar if a challenge is active
function renderChallengeBar(){
  let bar = document.getElementById("challengeBar");
  const t = getChallengeTime();
  if (!t){
    if (bar) bar.remove();
    return;
  }
  if (!bar){
    bar = document.createElement("div");
    bar.id = "challengeBar";
    bar.className = "challenge-bar";
    const wrap = document.querySelector(".play");
    if (wrap) wrap.insertBefore(bar, wrap.firstChild);
  }
  bar.innerHTML = '⚡ Challenge: beat <span class="ghost-time">' + fmtTime(t * 1000) + '</span>';
}

// Tracks which mechanics the player has seen an explainer for. Each mechanic
// key (e.g. "latin", "double", "scramble", "boxRotate") is stored on first
// encounter — the explainer fires once and never again.
const MECHANIC_EXPLAINERS = {
  latin: {
    title:"Latin mode",
    icon:"🔲",
    body:"No boxes — just rows and columns.<br>"
       + "Each colour must appear <b>exactly once</b> in every row and column.<br>"
       + "It's simpler in concept but trickier in practice — you lose the box constraint that normally narrows things down.",
  },
  double: {
    title:"Double layering",
    icon:"🍩",
    body:"Two puzzles on one board.<br>"
       + "The <b>outer squares</b> (donuts) are one Sudoku. The <b>inner squares</b> (donut holes) are a second, independent Sudoku.<br>"
       + "Tap the outer palette row to place outers, the inner row for inners. Both layers follow the same rules.",
  },
  scramble: {
    title:"Scramble mode",
    icon:"🌀",
    body:"Colours shift position on the palette when placed.<br>"
       + "The same colour still means the same value — it just moves around to keep you on your toes.<br>"
       + "Trust the board, not the palette order.",
  },
  boxRotate: {
    title:"Rotated boxes",
    icon:"⤾",
    body:"The box shape is flipped — tall becomes wide.<br>"
       + "A 6×6 normally has 3-wide × 2-tall boxes. With rotation it's 2-wide × 3-tall.<br>"
       + "Same rules, different spatial reasoning.",
  },
};

function seenMechanics(){
  return new Set(load(LS_SEEN, []));
}
function markMechanicSeen(id){
  const s = seenMechanics();
  s.add(id);
  save(LS_SEEN, [...s]);
}

// Returns a list of mechanic IDs the player hasn't seen yet that apply to
// the given level config.
function newMechanics(cfg){
  const seen = seenMechanics();
  const out = [];
  if (cfg.boxless && !seen.has("latin")) out.push("latin");
  if (cfg.layers > 1 && !seen.has("double")) out.push("double");
  if (cfg.boxRotate && !seen.has("boxRotate")) out.push("boxRotate");
  // Scramble is a daily-mode toggle, not a level config — but the preview
  // config can flag it, or the player can encounter it first in daily mode.
  return out;
}

// Show a one-screen explainer for one or more mechanics, then call `next`.
// Multiple explainers chain left-to-right; when the last "Got it" is tapped
// the callback fires.
function showExplainers(ids, next){
  if (!ids.length){ next(); return; }
  const id = ids[0];
  const ex = MECHANIC_EXPLAINERS[id];
  if (!ex){ markMechanicSeen(id); showExplainers(ids.slice(1), next); return; }
  openModal(
    '<div class="explainer">'
    + '<div class="exp-icon">' + ex.icon + '</div>'
    + '<h2>' + ex.title + '</h2>'
    + '<p class="exp-body">' + ex.body + '</p>'
    + '<button class="btn" id="mExpOk">Got it</button>'
    + '</div>'
  );
  document.getElementById("mExpOk").onclick = () => {
    markMechanicSeen(id);
    closeModal();
    showExplainers(ids.slice(1), next);
  };
}

// Brief screen between levels showing the player's journey through the stage.
function showProgression(nextLevel){
  const cfg = levelConfig(nextLevel);
  const prevStage = nextLevel > 1 ? levelConfig(nextLevel - 1).stage : 0;
  const step = cfg.step;
  const theme = cfg.theme || WORLDS[cfg.world - 1];
  const isNewWorld = nextLevel > 1 && cfg.world !== levelConfig(nextLevel - 1).world;
  const isNewStage = nextLevel > 1 && cfg.stage !== prevStage;

  // Build the step pips for this stage
  let pips = '<div class="prog-stage">';
  for (let s = 1; s <= LEVELS_PER_STAGE; s++){
    const cls = s < step ? "st done" : s === step ? "st current" : "st";
    pips += '<span class="' + cls + '">' + (s < step ? "✦" : s === step ? "◆" : "◇") + '</span>';
  }
  pips += '</div>';

  let unlock = '';
  if (isNewWorld){
    unlock = '<div class="prog-unlock">🔓 ' + theme.name + ' unlocked — ' + theme.unlock + '</div>';
  } else if (isNewStage){
    unlock = '<div class="prog-unlock">Stage ' + cfg.stage + ' of ' + theme.name + '</div>';
  }

  openModal(
    '<h2 style="color:' + theme.tint + '">' + theme.name + '</h2>'
    + '<p class="lede">Stage ' + cfg.stage + ' · step ' + step + '</p>'
    + pips
    + unlock
    + '<button class="btn" id="mGo">Play</button>'
    + '<button class="btn ghost" id="mBack2">Done for now</button>'
  );
  document.getElementById("mGo").onclick = () => { closeModal(); loadLevel(nextLevel); };
  document.getElementById("mBack2").onclick = () => { closeModal(); enterDaily(); };

  // Add "View level data" button
  const m = document.getElementById("modal");
  const dataBtn = document.createElement("button");
  dataBtn.className = "btn ghost";
  dataBtn.textContent = "📊 Level data";
  dataBtn.onclick = () => { closeModal(); showLevelTable(cfg.world); };
  m.appendChild(dataBtn);
}

function showLevelTable(world){
  const worlds = [1,2,3,4,5];
  const w = world || 1;

  let html = '<h2>Level Data</h2><p class="lede">All mechanics, givens, times per level</p>';
  html += '<div style="display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap">';
  for (const wo of worlds){
    const isActive = wo === w;
    html += '<button class="diff' + (isActive ? ' on' : '') + '" data-world="' + wo + '">'
          + WORLDS[wo-1].name + '</button>';
  }
  html += '</div>';

  // Build table for selected world
  html += '<div style="overflow-x:auto; max-height:60vh; border:1px solid var(--line-2); border-radius:8px">';
  html += '<table style="width:100%; font-size:11px; border-collapse:collapse">'
        + '<thead style="position:sticky; top:0; background:var(--panel2)">'
        + '<tr><th style="padding:6px; text-align:left; border-bottom:1px solid var(--line-2)">Lvl</th>'
        + '<th style="padding:6px; text-align:left; border-bottom:1px solid var(--line-2)">Grid</th>'
        + '<th style="padding:6px; text-align:left; border-bottom:1px solid var(--line-2)">Rules</th>'
        + '<th style="padding:6px; text-align:left; border-bottom:1px solid var(--line-2)">Marks</th>'
        + '<th style="padding:6px; text-align:left; border-bottom:1px solid var(--line-2)">Givens</th>'
        + '<th style="padding:6px; text-align:left; border-bottom:1px solid var(--line-2)">Par</th>'
        + '<th style="padding:6px; text-align:left; border-bottom:1px solid var(--line-2)">Limit</th>'
        + '</tr></thead><tbody>';

  const baseLevel = (w - 1) * LEVELS_PER_WORLD + 1;
  const maxLevel = baseLevel + LEVELS_PER_WORLD - 1;

  for (let L = baseLevel; L <= maxLevel; L++){
    const cfg = levelConfig(L);
    const gridLabel = cfg.n + "×" + cfg.n;
    const ruleLabel = cfg.boxless ? "Latin" : "Sudoku";
    const markLabel = cfg.markSet ? MARKSETS[cfg.markSet].name : "Rotates";
    const layerLabel = cfg.layers > 1 ? "·D" : "";
    const par = parSeconds(cfg, 2);  // Use tier 2 for par estimate
    const limit = Math.round(par * generosity(L, cfg.peek));

    html += '<tr><td style="padding:6px; border-bottom:1px solid var(--line);">' + L + '</td>'
          + '<td style="padding:6px; border-bottom:1px solid var(--line);">' + gridLabel + '</td>'
          + '<td style="padding:6px; border-bottom:1px solid var(--line);">' + ruleLabel + '</td>'
          + '<td style="padding:6px; border-bottom:1px solid var(--line);">' + markLabel + layerLabel + '</td>'
          + '<td style="padding:6px; border-bottom:1px solid var(--line);">' + cfg.givens + '</td>'
          + '<td style="padding:6px; border-bottom:1px solid var(--line);">' + fmtTime(par * 1000) + '</td>'
          + '<td style="padding:6px; border-bottom:1px solid var(--line);">' + fmtTime(limit * 1000) + '</td></tr>';
  }

  html += '</tbody></table></div>';
  html += '<button class="btn ghost" style="margin-top:12px" onclick="closeModal()">Done</button>';

  openModal(html);

  // World buttons
  document.querySelectorAll('[data-world]').forEach(b => {
    b.onclick = () => showLevelTable(parseInt(b.dataset.world));
  });
}

// Lightweight "leaderboard" — stores the player's own best times per puzzle
// config. No server needed; the share/challenge flow lets friends compare.
const LS_BOARD = "chromoku.board.v1";

function recordLeaderboard(){
  if (state.mode === "levels" || state.practice) return;
  const key = state.day + "-" + compositeId(state.size, state.diff);
  const secs = Math.floor(elapsedMs() / 1000);
  const board = load(LS_BOARD, {});
  if (!board[key] || secs < board[key].secs){
    board[key] = { secs, day:state.day, size:state.size, diff:state.diff, ts:Date.now() };
  }
  // Keep only last 30 days of entries to avoid unbounded growth
  const cutoff = dayNumber() - 30;
  for (const k of Object.keys(board)){
    if (board[k].day < cutoff) delete board[k];
  }
  save(LS_BOARD, board);
}

function leaderboardHTML(){
  const board = load(LS_BOARD, {});
  const today = dayNumber();
  const entries = Object.values(board)
    .filter(e => e.day >= today - 7)
    .sort((a, b) => b.day - a.day || a.secs - b.secs);
  if (!entries.length) return '';
  let html = '<div class="lb-section"><h3 style="margin:12px 0 6px; font-size:13px; color:var(--ink-dim)">Recent bests</h3>';
  for (const e of entries.slice(0, 5)){
    const dayLabel = e.day === today ? "Today" : (today - e.day) + "d ago";
    html += '<div style="display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; padding:2px 0; color:var(--ink-dim)">'
      + '<span>' + dayLabel + ' · ' + sizeOf(e.size).label + ' ' + diffOf2(e.diff, sizeOf(e.size).n).label + '</span>'
      + '<span style="font-weight:700; color:var(--ink)">' + fmtTime(e.secs * 1000) + '</span></div>';
  }
  html += '</div>';
  return html;
}

async function copyText(text){
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied!");
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Copied!"); }
    catch { toast("Copy failed"); }
    ta.remove();
  }
}

/* ================= hints ================= */

// "Sell helpers, not lives." Three tools the player can reach for; each one
// dents the star rating so there is a reason not to, but never blocks progress.
const HINT_LIMITS = { reveals:3, freezes:2, adds:2 };
const FREEZE_SECS = 15;
const ADD_SECS = 30;

// Regenerating power-up pool — global across levels, stored in progress.
// Pool recharges one unit every POOL_REGEN_MIN minutes, capped at POOL_MAX.
const POOL_MAX = 7;
const POOL_REGEN_MIN = 20;  // one charge every 20 min

function powerPool(){
  const p = progress();
  if (p.pool === undefined){ p.pool = POOL_MAX; p.poolAt = null; }
  // Regen elapsed charges
  if (p.pool < POOL_MAX && p.poolAt){
    const elapsed = Date.now() - p.poolAt;
    const regen = Math.floor(elapsed / (POOL_REGEN_MIN * 60 * 1000));
    if (regen > 0){
      p.pool = Math.min(POOL_MAX, p.pool + regen);
      p.poolAt = p.pool >= POOL_MAX ? null : p.poolAt + regen * POOL_REGEN_MIN * 60 * 1000;
      saveProgress2(p);
    }
  }
  return p;
}

function usePoolCharge(){
  const p = powerPool();
  if (p.pool <= 0) return false;
  p.pool--;
  if (!p.poolAt) p.poolAt = Date.now();
  saveProgress2(p);
  return true;
}

function poolRemaining(){ return powerPool().pool; }

function nextPoolRegenMs(){
  const p = powerPool();
  if (p.pool >= POOL_MAX || !p.poolAt) return 0;
  const elapsed = Date.now() - p.poolAt;
  const cycleMs = POOL_REGEN_MIN * 60 * 1000;
  return cycleMs - (elapsed % cycleMs);
}

function totalHints(){ return state.hints.reveals + state.hints.freezes + state.hints.adds; }

// Power-ups: always visible during levels so the player can fire them
// without opening a modal. The hint modal still exists for daily mode
// (where only Reveal applies) and as a fallback info panel.
function renderPowerups(){
  const el = document.getElementById("powerups");
  if (!el) return;
  if (state.mode !== "levels" || state.done){
    el.style.display = "none"; return;
  }
  el.style.display = "";
  const revLeft = HINT_LIMITS.reveals - state.hints.reveals;
  const frzLeft = HINT_LIMITS.freezes - state.hints.freezes;
  const addLeft = HINT_LIMITS.adds - state.hints.adds;
  const pool = poolRemaining();
  const noPool = pool <= 0;
  const revDis = revLeft <= 0 || noPool;
  const frzDis = frzLeft <= 0 || noPool;
  const addDis = addLeft <= 0 || noPool;
  // Pool indicator
  const regenMs = nextPoolRegenMs();
  const regenStr = noPool && regenMs > 0
    ? ' <span style="font-size:9px;color:var(--ink-dim)">⚡' + Math.ceil(regenMs / 60000) + 'm</span>' : '';
  el.innerHTML =
    '<span style="font-size:9px;color:var(--ink-dim);font-family:var(--mono)">⚡' + pool + '/' + POOL_MAX + regenStr + '</span> '
    + '<button class="pu" id="puReveal"' + (revDis ? " disabled" : "") + '>'
    + '<span class="pu-icon">💡</span><span class="pu-n">' + revLeft + '</span></button>'
    + '<button class="pu" id="puFreeze"' + (frzDis ? " disabled" : "") + '>'
    + '<span class="pu-icon">⏸</span><span class="pu-n">' + frzLeft + '</span></button>'
    + '<button class="pu" id="puAdd"' + (addDis ? " disabled" : "") + '>'
    + '<span class="pu-icon">⏰</span><span class="pu-n">' + addLeft + '</span></button>';
  const pR = document.getElementById("puReveal");
  if (pR) pR.onclick = () => { revealCell(); renderPowerups(); };
  const pF = document.getElementById("puFreeze");
  if (pF) pF.onclick = () => { freezeClock(); renderPowerups(); };
  const pA = document.getElementById("puAdd");
  if (pA) pA.onclick = () => { addTime(); renderPowerups(); };
}

// Quitting a timed level costs a life — warn first.
function confirmQuitLevel(){
  if (state.done){ enterDaily(); return; }
  openModal(
    '<h2>Quit level?</h2>'
    + '<p class="lede">You\'ll lose a life.</p>'
    + '<div class="hearts big">' + heartsHTML(progress()) + '</div>'
    + '<button class="btn" id="mQuit" style="background:var(--error)">Quit</button>'
    + '<button class="btn ghost" id="mStay">Keep playing</button>'
  );
  document.getElementById("mQuit").onclick = () => {
    closeModal();
    const p = progress();
    p.lives = Math.max(0, p.lives - 1);
    if (p.lives < LIVES_MAX) p.livesAt = p.livesAt || Date.now();
    saveProgress2(p);
    enterDaily();
  };
  document.getElementById("mStay").onclick = closeModal;
}

// Generic quit — delegates to the right flow based on mode. Daily puzzles
// just go back to the picker; level quits cost a life (via confirmQuitLevel).
function confirmQuit(){
  if (state.done) { enterDaily(); return; }
  if (state.mode === "levels") { confirmQuitLevel(); return; }
  // Daily / practice: abandon the current puzzle and return to the picker.
  openModal(
    '<h2>Quit puzzle?</h2>'
    + '<p class="lede">Your progress on this one will be saved.</p>'
    + '<button class="btn" id="mQuit">Quit</button>'
    + '<button class="btn ghost" id="mStay">Keep playing</button>'
  );
  document.getElementById("mQuit").onclick = () => {
    closeModal(); stopTimer(); enterDaily();
  };
  document.getElementById("mStay").onclick = closeModal;
}

function showHintModal(){

  const isLvl = state.mode === "levels";
  const revLeft = HINT_LIMITS.reveals - state.hints.reveals;
  const frzLeft = HINT_LIMITS.freezes - state.hints.freezes;

  const penalty = totalHints() > 0
    ? '<p class="lede" style="color:var(--error)">Hints used: ' + totalHints()
      + (isLvl ? ' · max stars reduced' : '') + '</p>' : '';

  openModal(

    + '<p class="lede">Helpers, not cheats — but each one lowers your star ceiling.</p>'
    + penalty
    + '<div class="hint-opts">'
    + '<button class="hint-opt" id="hReveal"' + (revLeft <= 0 ? ' disabled' : '') + '>'
    + '<span class="h-icon">💡</span><div class="h-body">'
    + '<div class="h-title">Reveal a cell</div>'
    + '<div class="h-desc">Fills one random empty cell with the correct ' + markNoun() + '.</div></div>'
    + '<span class="h-count">' + revLeft + '/' + HINT_LIMITS.reveals + '</span></button>'
    + (isLvl
      ? '<button class="hint-opt" id="hFreeze"' + (frzLeft <= 0 ? ' disabled' : '') + '>'
      + '<span class="h-icon">⏸</span><div class="h-body">'
      + '<div class="h-title">Freeze clock</div>'
      + '<div class="h-desc">Pauses the countdown for ' + FREEZE_SECS + ' seconds.</div></div>'
      + '<span class="h-count">' + frzLeft + '/' + HINT_LIMITS.freezes + '</span></button>'
      + '<button class="hint-opt" id="hAdd"' + (addLeft <= 0 ? ' disabled' : '') + '>'
      + '<span class="h-icon">⏰</span><div class="h-body">'
      + '<div class="h-title">Add time</div>'
      + '<div class="h-desc">Adds ' + ADD_SECS + ' seconds to your remaining time.</div></div>'
      + '<span class="h-count">' + addLeft + '/' + HINT_LIMITS.adds + '</span></button>'
      : '')
    + '</div>'
    + '<button class="btn ghost" onclick="closeModal()">Cancel</button>'
  );
  const hR = document.getElementById("hReveal");
  if (hR) hR.onclick = () => { closeModal(); revealCell(); };
  const hF = document.getElementById("hFreeze");
  if (hF) hF.onclick = () => { closeModal(); freezeClock(); };
  const hA = document.getElementById("hAdd");
  if (hA) hA.onclick = () => { closeModal(); addTime(); };
}

function revealCell(){
  if (state.done) return;
  if (state.hints.reveals >= HINT_LIMITS.reveals){ toast("No reveals left"); return; }
  if (state.mode === "levels" && poolRemaining() <= 0){ toast("Power-up pool empty — recharges over time"); return; }
  // Collect all empty, non-given cells across all layers
  const empties = [];
  for (let L = 0; L < state.layers.length; L++)
    for (let i = 0; i < state.n * state.n; i++)
      if (!state.layers[L].givens[i] && (state.layers[L].grid[i] === null || state.layers[L].grid[i] === undefined))
        empties.push({ L, i });
  if (!empties.length){ toast("Board is full"); return; }
  const pick = empties[Math.floor(Math.random() * empties.length)];
  state.hints.reveals++;
  if (state.mode === "levels") usePoolCharge();
  state.layers[pick.L].givens[pick.i] = true;   // lock it like a given
  placeColour(pick.L, pick.i, state.layers[pick.L].solution[pick.i]);
  // Glow effect
  const el = cellEl(pick.i);
  if (el){ el.classList.add("revealed"); setTimeout(() => el.classList.remove("revealed"), 900); }
  toast("Cell revealed · " + (HINT_LIMITS.reveals - state.hints.reveals) + " left");
}

function freezeClock(){
  if (state.done || state.mode !== "levels") return;
  if (state.hints.freezes >= HINT_LIMITS.freezes){ toast("No freezes left"); return; }
  if (poolRemaining() <= 0){ toast("Power-up pool empty — recharges over time"); return; }
  state.hints.freezes++;
  usePoolCharge();
  // Mechanically: stop the timer for FREEZE_SECS, then restart it.
  stopTimer();
  state.frozenUntil = Date.now() + FREEZE_SECS * 1000;
  toast("⏸ Clock frozen for " + FREEZE_SECS + "s");
  saveProgress();
  setTimeout(() => {
    state.frozenUntil = 0;
    if (!state.done && state.started) startTimer();
    toast("Clock resumed");
  }, FREEZE_SECS * 1000);
}

function addTime(){
  if (state.done || state.mode !== "levels") return;
  if (state.hints.adds >= HINT_LIMITS.adds){ toast("No time adds left"); return; }
  if (poolRemaining() <= 0){ toast("Power-up pool empty — recharges over time"); return; }
  state.hints.adds++;
  usePoolCharge();
  state.limitMs += ADD_SECS * 1000;
  updateAddsBadge();
  toast("⏰ +" + ADD_SECS + "s · " + (HINT_LIMITS.adds - state.hints.adds) + " left");
  saveProgress();
}

// Update the adds badge in header showing remaining adds
function updateAddsBadge(){
  const badge = document.getElementById("addsRemaining");
  if (!badge || !state.hints) return;
  const remaining = Math.max(0, HINT_LIMITS.adds - state.hints.adds);
  badge.textContent = remaining;
  badge.style.opacity = remaining === 0 ? "0.4" : "1";
}

/* ================= share badge (canvas) ================= */

// Parse a CSS clip-path polygon/circle/inset into a canvas path.
function drawClipPath(ctx, clip, x, y, sz){
  ctx.beginPath();
  const polyMatch = clip.match(/polygon\((.+)\)/);
  if (polyMatch){
    const pts = polyMatch[1].split(",").map(p => {
      const [px, py] = p.trim().split(/\s+/);
      return [x + parseFloat(px) / 100 * sz, y + parseFloat(py) / 100 * sz];
    });
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
    ctx.closePath();
    return;
  }
  const circMatch = clip.match(/circle\((\d+)%\)/);
  if (circMatch){
    const r = parseFloat(circMatch[1]) / 100 * sz / 2;
    ctx.arc(x + sz / 2, y + sz / 2, r, 0, Math.PI * 2);
    return;
  }
  // Fallback: inset or unknown → full rect
  ctx.roundRect(x, y, sz, sz, 3);
}

// Draw pattern marks on the badge canvas. Indices match the WEAVES rank order.
function drawBadgePattern(ctx, idx, x, y, sz, ink, cellBg, rad){
  ctx.fillStyle = cellBg;
  ctx.beginPath(); ctx.roundRect(x, y, sz, sz, rad); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, sz, sz, rad); ctx.clip();
  ctx.strokeStyle = ink; ctx.fillStyle = ink;
  const g = sz <= 24 ? 5 : 7;   // tile gap for stroke patterns
  const patterns = [
    /*  0 Diag-back Med    */ () => { ctx.lineWidth=1.5; for(let d=-sz;d<sz*2;d+=g){ ctx.moveTo(x+d,y); ctx.lineTo(x+d+sz,y+sz); }},
    /*  1 Diagonals Med    */ () => { ctx.lineWidth=1.5; for(let d=-sz;d<sz*2;d+=g){ ctx.moveTo(x+d,y); ctx.lineTo(x+d-sz,y+sz); }},
    /*  2 Bars Half        */ () => { ctx.lineWidth=g*0.6; for(let d=g*0.3;d<sz;d+=g){ ctx.moveTo(x,y+d); ctx.lineTo(x+sz,y+d); }},
    /*  3 Columns Half     */ () => { ctx.lineWidth=g*0.6; for(let d=g*0.3;d<sz;d+=g){ ctx.moveTo(x+d,y); ctx.lineTo(x+d,y+sz); }},
    /*  4 Dots Large       */ () => { const r=sz<=24?1.8:2.5; for(let dy=g/2;dy<sz;dy+=g) for(let dx=g/2;dx<sz;dx+=g){ ctx.beginPath(); ctx.arc(x+dx,y+dy,r,0,Math.PI*2); ctx.fill(); }},
    /*  5 Rings Wide       */ () => { const r=sz<=24?2:3; ctx.lineWidth=1; for(let dy=g;dy<sz;dy+=g) for(let dx=g;dx<sz;dx+=g){ ctx.beginPath(); ctx.arc(x+dx,y+dy,r,0,Math.PI*2); ctx.stroke(); }},
    /*  6 Checker Med      */ () => { const h=g/2; for(let dy=0;dy<sz;dy+=g) for(let dx=0;dx<sz;dx+=g){ if(((dx/g+dy/g)%2)===0){ ctx.fillRect(x+dx,y+dy,h,h); ctx.fillRect(x+dx+h,y+dy+h,h,h); }}},
    /*  7 Zigzag H         */ () => { ctx.lineWidth=1.5; const zh=sz<=24?4:6; for(let dy=zh/2;dy<sz;dy+=zh){ let dir=1; for(let dx=0;dx<sz;dx+=zh/2){ const ny=dy+zh/2*dir; ctx.moveTo(x+dx,y+dy); ctx.lineTo(x+dx+zh/2,y+ny); dir=-dir; }}},
    /*  8 Diag-grid Fine   */ () => { ctx.lineWidth=0.8; for(let d=-sz;d<sz*2;d+=g){ ctx.moveTo(x+d,y); ctx.lineTo(x+d-sz,y+sz); ctx.moveTo(x+d,y); ctx.lineTo(x+d+sz,y+sz); }},
    /*  9 H+V Bold         */ () => { ctx.lineWidth=2.5; for(let d=g/2;d<sz;d+=g){ ctx.moveTo(x,y+d); ctx.lineTo(x+sz,y+d); ctx.moveTo(x+d,y); ctx.lineTo(x+d,y+sz); }},
    /* 10 H+V Fine         */ () => { ctx.lineWidth=0.8; for(let d=0;d<sz;d+=g){ ctx.moveTo(x,y+d); ctx.lineTo(x+sz,y+d); ctx.moveTo(x+d,y); ctx.lineTo(x+d,y+sz); }},
    /* 11 Diags Bold       */ () => { ctx.lineWidth=3;   for(let d=-sz;d<sz*2;d+=g){ ctx.moveTo(x+d,y); ctx.lineTo(x+d-sz,y+sz); }},
    /* 12 Diag-back Bold   */ () => { ctx.lineWidth=3;   for(let d=-sz;d<sz*2;d+=g){ ctx.moveTo(x+d,y); ctx.lineTo(x+d+sz,y+sz); }},
    /* 13 Bars Bold        */ () => { ctx.lineWidth=3;   for(let d=g/2;d<sz;d+=g){ ctx.moveTo(x,y+d); ctx.lineTo(x+sz,y+d); }},
    /* 14 Columns Bold     */ () => { ctx.lineWidth=3;   for(let d=g/2;d<sz;d+=g){ ctx.moveTo(x+d,y); ctx.lineTo(x+d,y+sz); }},
    /* 15 Dots Offset      */ () => { const r=sz<=24?1:1.5; const h=g/2; for(let dy=r;dy<sz;dy+=g) for(let dx=r;dx<sz;dx+=g){ ctx.beginPath(); ctx.arc(x+dx,y+dy,r,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+dx+h,y+dy+h,r,0,Math.PI*2); ctx.fill(); }},
  ];
  const draw = patterns[idx] || patterns[0];
  const fillOnly = idx === 4 || idx === 6 || idx === 15;
  ctx.beginPath();
  draw();
  if (!fillOnly) ctx.stroke();
  ctx.restore();
}

// Renders the solved board to a canvas image suitable for sharing. Unlike the
// emoji grid, this supports Double mode natively and does not spoil the answer
// in a copy-pasteable way.
function renderShareBadge(){
  const n = state.n;
  const rotate = !!(state.lvl && state.lvl.cfg.boxRotate);
  const { bw, bh } = boxDims(n, rotate);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);

  const cellSz = n <= 4 ? 48 : n <= 9 ? 36 : 24;
  const cGap = n <= 4 ? 4 : n <= 9 ? 2 : 1;
  const bGap = state.latin ? cGap : (n <= 4 ? 10 : n <= 9 ? 7 : 4);
  const pad = 20;
  const headerH = 56, footerH = 32;

  // Board pixel dimensions
  let boardW, boardH;
  if (state.latin){
    boardW = n * cellSz + (n - 1) * cGap;
    boardH = boardW;
  } else {
    const bpr = n / bw, bpc = n / bh;
    boardW = bpr * (bw * cellSz + (bw - 1) * cGap) + (bpr - 1) * bGap;
    boardH = bpc * (bh * cellSz + (bh - 1) * cGap) + (bpc - 1) * bGap;
  }

  const W = boardW + pad * 2;
  const H = headerH + boardH + footerH + pad;
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  // Detect theme
  const dark = document.documentElement.getAttribute("data-theme") === "dark"
    || (!document.documentElement.getAttribute("data-theme")
        && window.matchMedia("(prefers-color-scheme:dark)").matches);
  const bg = dark ? "#14141f" : "#f7f7f8";
  const cellBg = dark ? "#252537" : "#ffffff";
  const ink = dark ? "#ececf4" : "#17172b";
  const dim = dark ? "#9a9ab2" : "#63637a";
  const givenBg = dark ? "#32324a" : "#e9e9f0";

  // Background
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(0, 0, W, H, 14); ctx.fill();

  // Header
  ctx.fillStyle = ink;
  ctx.font = "bold 17px system-ui,-apple-system,sans-serif";
  ctx.textAlign = "center";
  const title = state.mode === "levels"
    ? SHARE_NAME + " · Level " + state.lvl.cfg.level
    : SHARE_NAME + " #" + state.day;
  ctx.fillText(title, W / 2, pad + 20);
  ctx.fillStyle = dim;
  ctx.font = "12px ui-monospace,monospace";
  const st = load(LS_STATS, blankStats());
  const streakStr = state.mode !== "levels" && st.streak > 1
    ? " · 🔥" + st.streak : "";
  const sub = state.mode === "levels"
    ? state.lvl.cfg.theme.name + " · " + fmtTime(elapsedMs())
    : (state.latin ? "Latin " : "") + sizeOf(state.size).label + " " + diffOf2(state.diff, state.n).label
      + (state.dbl ? " · Double" : "") + (state.scramble ? " · Scramble" : "")
      + " · " + fmtTime(elapsedMs()) + streakStr;
  ctx.fillText(sub, W / 2, pad + 38);

  // Draw each cell
  const bx = pad, by = headerH;
  const rounded = load(LS_ROUND, true);
  for (let r = 0; r < n; r++){
    for (let c = 0; c < n; c++){
      const i = r * n + c;
      let x, y;
      if (state.latin){
        x = bx + c * (cellSz + cGap);
        y = by + r * (cellSz + cGap);
      } else {
        const br = Math.floor(r / bh), bc = Math.floor(c / bw);
        const ir = r % bh, ic = c % bw;
        x = bx + bc * (bw * cellSz + (bw - 1) * cGap + bGap) + ic * (cellSz + cGap);
        y = by + br * (bh * cellSz + (bh - 1) * cGap + bGap) + ir * (cellSz + cGap);
      }
      const isGiven = state.layers[0].givens[i];
      // Cell bg
      ctx.fillStyle = isGiven ? givenBg : cellBg;
      ctx.beginPath(); ctx.roundRect(x, y, cellSz, cellSz, 3); ctx.fill();

      // Outer fill — shapes get clipped, patterns get hatched, colours get a
      // solid rounded rect. Scramble overlays the same Stroop interference
      // that was on screen so the badge is faithful to what the player saw.
      const v0 = state.layers[0].grid[i];
      if (v0 !== null && v0 !== undefined){
        const mk = MARKS[v0];
        const fx = x + 1, fy = y + 1, fs = cellSz - 2;
        const fillRad = isGiven ? 1 : (rounded ? 6 : 1);
        const useScramble = state.scramble && activePalette !== "ink";
        if (mk && mk.kind === "pattern"){
          // Draw pattern hatches inside the cell
          drawBadgePattern(ctx, v0, fx, fy, fs, ink, cellBg, fillRad);
        } else if (useScramble && activePalette === "shapes"){
          // Shape is truth; colour is noise — draw real shape, fake colour
          const fakeIdx = scrambleDecoy(i, v0, Math.min(n, HUES.length));
          const fakeHex = HUES[fakeIdx].hex;
          ctx.save();
          if (mk && mk.clip){
            drawClipPath(ctx, mk.clip, fx, fy, fs);
          } else {
            ctx.beginPath(); ctx.roundRect(fx, fy, fs, fs, fillRad);
          }
          ctx.fillStyle = fakeHex;
          ctx.fill();
          ctx.restore();
        } else if (useScramble){
          // Colour is truth; shape is noise — draw real colour, fake shape
          const fakeIdx = scrambleDecoy(i, v0, Math.min(n, SHAPES.length));
          const fakeClip = SHAPES[fakeIdx].clip;
          ctx.save();
          drawClipPath(ctx, fakeClip, fx, fy, fs);
          ctx.fillStyle = mk ? (mk.hex || ink) : ink;
          ctx.fill();
          ctx.restore();
        } else if (mk && mk.clip){
          // Shape mark — draw the colour clipped to the shape
          ctx.save();
          drawClipPath(ctx, mk.clip, fx, fy, fs);
          ctx.fillStyle = mk.hex || ink;
          ctx.fill();
          ctx.restore();
        } else {
          ctx.fillStyle = mk ? (mk.hex || ink) : ink;
          ctx.beginPath(); ctx.roundRect(fx, fy, fs, fs, fillRad); ctx.fill();
        }
      }
      // Inner dot(s)
      for (let L = 1; L < state.layers.length; L++){
        const v = state.layers[L].grid[i];
        if (v === null || v === undefined) continue;
        const im = INNER[v];
        const dotSz = Math.round(cellSz * 0.42);
        const dx = x + (cellSz - dotSz) / 2, dy = y + (cellSz - dotSz) / 2;
        const innerGiven = state.layers[L].givens[i];
        ctx.fillStyle = givenBg;
        ctx.beginPath(); ctx.roundRect(dx - 2, dy - 2, dotSz + 4, dotSz + 4, 4); ctx.fill();
        ctx.fillStyle = im ? (im.hex || ink) : ink;
        const dotRad = innerGiven ? 0 : (rounded ? 4 : 0);
        ctx.beginPath(); ctx.roundRect(dx, dy, dotSz, dotSz, dotRad); ctx.fill();
      }
    }
  }

  // Hints disclosure
  const hintsUsed = totalHints();
  if (hintsUsed > 0){
    ctx.fillStyle = dim;
    ctx.font = "10px ui-monospace,monospace";
    ctx.textAlign = "center";
    ctx.fillText("💡×" + hintsUsed, W / 2, H - 10);
  }

  return canvas;
}

async function shareAsImage(){
  const canvas = renderShareBadge();
  try {
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const file = new File([blob], "chromoku.png", { type:"image/png" });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:SHARE_NAME });
      return;
    }
    // Fallback: copy image to clipboard
    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
    toast("Image copied!");
  } catch {
    // Last resort: copy the text version
    copyShare();
  }
}

function showTutorialHint(){
  if (!state.lvl || !state.lvl.cfg.tutorial) return;

  // Find first empty cell
  let emptyCell = null;
  for (let i = 0; i < state.layers[0].grid.length; i++){
    if (state.layers[0].grid[i] === null && !state.layers[0].givens[i]){
      emptyCell = i;
      break;
    }
  }

  if (emptyCell === null) return;  // Puzzle complete

  // Flash the empty cell
  const cell = document.querySelector(`[data-i="${emptyCell}"]`);
  if (cell){
    cell.classList.add("hint-flash");
    setTimeout(() => cell.classList.remove("hint-flash"), 600);
  }

  toast("💡 Try placing a mark in an empty square!");
}

// The finished board as one grid with every layer nested in place, rather than
// a stack of separate grids. This is the thing worth showing off.
function miniBoard(){
  const n = state.n;
  const rotate = !!(state.lvl && state.lvl.cfg.boxRotate);
  const { bw, bh } = boxDims(n, rotate);
  let html = "";
  const marksAt = i => {
    let out = '<div class="fill' + (isPattern() ? " pat" : "")
            + '" style="' + styleFor(0, state.layers[0].grid[i]) + '"></div>';
    for (let L = 1; L < state.layers.length; L++)
      out += '<div class="dot given" style="' + styleFor(L, state.layers[L].grid[i]) + '"></div>';
    return out;
  };
  if (state.latin){
    for (let i = 0; i < n * n; i++) html += '<div class="cell">' + marksAt(i) + "</div>";
    return '<div class="board mini done" style="grid-template-columns:repeat(' + n
         + ",1fr);grid-template-rows:repeat(" + n + ',1fr)">' + html + "</div>";
  }
  for (let b = 0; b < n; b++){
    const r0 = ((b / (n / bw)) | 0) * bh, c0 = (b % (n / bw)) * bw;
    let inner = "";
    for (let r = r0; r < r0 + bh; r++)
      for (let c = c0; c < c0 + bw; c++){
        const i = r * n + c;
        let marks = '<div class="fill' + (isPattern() ? " pat" : "")
                  + '" style="' + styleFor(0, state.layers[0].grid[i]) + '"></div>';
        for (let L = 1; L < state.layers.length; L++)
          marks += '<div class="dot given" style="' + styleFor(L, state.layers[L].grid[i]) + '"></div>';
        inner += '<div class="cell">' + marks + "</div>";
      }
    html += '<div class="box" style="grid-template-columns:repeat(' + bw + ',1fr);'
          + "grid-template-rows:repeat(" + bh + ',1fr)">' + inner + "</div>";
  }
  return '<div class="board mini done" style="grid-template-columns:repeat(' + (n / bw)
       + ",1fr);grid-template-rows:repeat(" + (n / bh) + ',1fr)">' + html + "</div>";
}

  const p = progress(), st = load(LS_STATS, blankStats());
  const cleared = Object.keys(p.stars).length;
  const lines = [
    "Chromoku stats",
    "level reached: " + p.level,
    "levels cleared: " + cleared,
    "stars: " + Object.values(p.stars).reduce((a, b) => a + b, 0) + " of " + cleared * 3,
    "daily solved: " + st.played + ", streak " + st.streak + " (best " + st.maxStreak + ")",
    "",
    "per level (level: seconds, stars)",
  ];
  Object.keys(p.best).map(Number).sort((a, b) => a - b).forEach(L => {
    lines.push("  " + L + ": " + p.best[L] + "s, " + (p.stars[L] || 0) + "\u2605");
  });
  copyText(lines.join("\n"));
}
