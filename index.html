    <div class="field"><label>Serve with</label><input id="f-pair" value="${esc(w.pairings)}" placeholder="e.g. Braised lamb, hard cheeses"></div>
    <div class="row2">
      <div class="field"><label>Source</label>
        <select id="f-source-pick">
          <option value="">— pick or type below —</option>
          <option value="cb">CB (Charlie's Burgers)</option>
          <option value="wineclub">Wine club (monthly)</option>
          <option value="saq">SAQ</option>
          <option value="lcbo">LCBO</option>
          <option value="gift">Gift</option>
          <option value="winery">Winery / cellar door</option>
        </select>
        <input id="f-source" value="${esc(_srcForInput)}" placeholder="e.g. SAQ / CB / gift">
        <div class="cb-date-row" id="cb-date-row" style="display:${_isCB?'flex':'none'}">
          <span>CB date:</span>
          <input id="f-cb-mm" inputmode="numeric" maxlength="2" placeholder="mm" value="${_cbMM}">
          <span>/</span>
          <input id="f-cb-yy" inputmode="numeric" maxlength="2" placeholder="yy" value="${_cbYY}">
        </div>
        <div class="gift-detail-row" id="gift-detail-row" style="display:${_isGift?'flex':'none'}">
          <span>From:</span>
          <input id="f-gift-name" class="gift-name" placeholder="Name" value="${esc(_giftParsed.name)}">
          <input id="f-gift-mm" inputmode="numeric" maxlength="2" placeholder="mm" value="${_giftParsed.mm}">
          <span>/</span>
          <input id="f-gift-yy" inputmode="numeric" maxlength="2" placeholder="yy" value="${_giftParsed.yy}">
        </div>
      </div>
      <div class="field"><label>Price</label><input id="f-price" value="${esc(w.price)}" placeholder="e.g. $42 CAD"></div>
    </div>
    <div class="field"><label>Bin / rack location</label><input id="f-loc" value="${esc(w.location)}" placeholder="e.g. A3"></div>
    <div class="field"><label>Notes</label><textarea id="f-notes" placeholder="Tasting notes, occasion, who recommended it…">${esc(w.notes)}</textarea></div>
    <button class="btn btn-primary" id="save">${editingId?"Save changes":"Add to cellar"}</button>
    ${editingId?`<button class="btn btn-ghost" id="cancel">Cancel</button>`:""}
  </div>`;

  document.getElementById("suggest-bin").onclick = ()=>{
    const section = document.getElementById("f-shelf").value;
    if(!section){ document.getElementById("ai-st").textContent = ""; return; }
    document.getElementById("f-bincode").value = suggestBinCode(section);
  };

  /* qty +/- buttons */
  document.getElementById("fq-minus").addEventListener("click", ()=>{
    const el = document.getElementById("f-qty");
    el.value = Math.max(0, (parseInt(el.value)||1) - 1);
  });
  document.getElementById("fq-plus").addEventListener("click", ()=>{
    const el = document.getElementById("f-qty");
    el.value = (parseInt(el.value)||1) + 1;
  });

  /* fire tier picker */
  let _fireTier = fireLevel(w);
  document.getElementById("f-fire-picker").querySelectorAll(".fire-tier-btn").forEach(btn=>{
    btn.onclick = ()=>{
      _fireTier = parseInt(btn.dataset.tier);
      document.getElementById("f-fire-picker").querySelectorAll(".fire-tier-btn").forEach(b=>b.classList.toggle("on", parseInt(b.dataset.tier)===_fireTier));
    };
  });

  /* source quick-pick */
  const cbDateRow = document.getElementById("cb-date-row");
  const giftDetailRow = document.getElementById("gift-detail-row");
  const srcInput = document.getElementById("f-source");
  const showSourceRows = () => {
    cbDateRow.style.display = srcInput.value.startsWith("CB") ? "flex" : "none";
    giftDetailRow.style.display = srcInput.value === "Gift" ? "flex" : "none";
  };
  srcInput.addEventListener("input", showSourceRows);

  /* auto-capitalize gift name */
  const giftNameInput = document.getElementById("f-gift-name");
  giftNameInput.addEventListener("input", ()=>{
    const v = giftNameInput.value;
    if(v.length === 1) giftNameInput.value = v.charAt(0).toUpperCase();
  });

  document.getElementById("f-source-pick").addEventListener("change", (e)=>{
    const v = e.target.value;
    const now = new Date();
    const mm = String(now.getMonth()+1).padStart(2,"0");
    const yy = String(now.getFullYear()).slice(2);
    cbDateRow.style.display = "none";
    giftDetailRow.style.display = "none";
    if(v === "cb"){
      srcInput.value = "CB";
      document.getElementById("f-cb-mm").value = mm;
      document.getElementById("f-cb-yy").value = yy;
      cbDateRow.style.display = "flex";
    } else if(v === "gift"){
      srcInput.value = "Gift";
      document.getElementById("f-gift-mm").value = mm;
      document.getElementById("f-gift-yy").value = yy;
      giftDetailRow.style.display = "flex";
    } else {
      const map = {
        wineclub: "Wine club (" + mm + "/" + yy + ")",
        saq: "SAQ", lcbo: "LCBO", winery: "Winery"
      };
      if(map[v]) srcInput.value = map[v];
    }
    e.target.selectedIndex = 0;
  });

  const pv = document.getElementById("pv");
  const handlePhoto = async (input)=>{
    if(!input.files[0]) return;
    pendingImage = await resizeImage(input.files[0]);
    pv.src = pendingImage; pv.style.display="block";
  };
  document.getElementById("cam").addEventListener("change", e=>handlePhoto(e.target));
  document.getElementById("gal").addEventListener("change", e=>handlePhoto(e.target));
  document.getElementById("identify").onclick = async ()=>{
    const st = document.getElementById("ai-st");
    if(!cfg.gkey){ st.textContent = "Add a free Gemini API key in the Sync tab first (aistudio.google.com)."; return; }
    if(!pendingImage){ st.textContent = "Take or choose a label photo first."; return; }
    st.textContent = "Reading label…";
    try{
      const body = {contents:[{parts:[
        {inline_data:{mime_type:"image/jpeg", data:pendingImage.split(",")[1]}},
        {text: AI_PROMPT}
      ]}]};
      const {r, model} = await callGemini(body, cfg.gkey, st);
      const j = await r.json();
      const text = ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
      const rec = JSON.parse(text.replace(/```json|```/g,"").trim());
      const set = (id,v)=>{ if(v) document.getElementById(id).value = v; };
      set("f-producer", rec.producer); set("f-name", rec.name); set("f-vintage", rec.vintage);
      if(rec.type){ const t = rec.type==="Rose" ? "Rosé" : rec.type; document.getElementById("f-type").value = t; }
      set("f-region", rec.region); set("f-from", rec.drinkFrom); set("f-to", rec.drinkTo);
      set("f-pair", rec.pairings); set("f-price", rec.price);
      const n = document.getElementById("f-notes"); if(rec.notes && !n.value.trim()) n.value = rec.notes;

      /* highlight fields the AI couldn't fill */
      document.querySelectorAll(".needs-att").forEach(el=>el.classList.remove("needs-att"));
      document.querySelectorAll(".att-dot").forEach(el=>el.remove());
      const check = [
        ["f-producer",rec.producer], ["f-name",rec.name], ["f-vintage",rec.vintage],
        ["f-region",rec.region], ["f-from",rec.drinkFrom], ["f-to",rec.drinkTo],
        ["f-price",rec.price]
      ];
      let missing = 0;
      check.forEach(([id, val])=>{
        const el = document.getElementById(id);
        if(!val || !val.trim()){
          el.classList.add("needs-att");
          const lbl = el.closest(".field")?.querySelector("label");
          if(lbl && !lbl.querySelector(".att-dot")) lbl.insertAdjacentHTML("beforeend",'<span class="att-dot"></span>');
          missing++;
          el.addEventListener("input", function once(){ el.classList.remove("needs-att"); const dot = el.closest(".field")?.querySelector(".att-dot"); if(dot) dot.remove(); el.removeEventListener("input", once); }, {once:true});
        }
      });

      const missMsg = missing ? ` (${missing} field${missing>1?"s":""} need${missing>1?"":"s"} attention)` : "";
      st.textContent = "✓ " + [rec.producer, rec.name, rec.vintage].filter(Boolean).join(" ") + missMsg + " — check the fields; if it misread, retake the photo or tap Identify again.";

      /* duplicate detection — check if this wine already exists */
      if(!editingId && rec.producer){
        const _ap = (rec.producer||"").toLowerCase().trim();
        const _an = (rec.name||"").toLowerCase().trim();
        const _av = (rec.vintage||"").trim();
        const dupes = wines.filter(w => {
          const pMatch = (w.producer||"").toLowerCase().trim() === _ap;
          const nMatch = !_an || (w.name||"").toLowerCase().trim() === _an;
          const vMatch = !_av || (w.vintage||"").trim() === _av;
          return pMatch && nMatch && (vMatch || !_av);
        });
        if(dupes.length){
          const dupe = dupes[0];
          const dupeLabel = [dupe.producer, dupe.name, dupe.vintage].filter(Boolean).join(" ");
          st.innerHTML = esc(st.textContent) +
            `<br><br>⚠️ <b>Already in cellar:</b> ${esc(dupeLabel)} (qty: ${qtyOf(dupe)})` +
            `<br><button type="button" id="dupe-add" style="margin-top:8px;padding:8px 14px;background:var(--panel);border:1px solid var(--ok);border-radius:4px;color:var(--ok);cursor:pointer;font-size:13px">+ Add another bottle (qty → ${qtyOf(dupe)+1})</button>` +
            `<span style="margin-left:8px;font-size:12px;color:var(--ink-faint)">or fill in the form above to add as a separate entry</span>`;
          const dupeBtn = document.getElementById("dupe-add");
          if(dupeBtn) dupeBtn.onclick = ()=>{
            dupe.qty = qtyOf(dupe) + 1;
            if(pendingImage && !dupe.imageData){ dupe.imageData = pendingImage; dupe.imageDirty = true; }
            saveWines(); editingId = null; tab = "detail"; detailId = dupe.id;
            history.pushState({tab:"detail", id:detailId}, "");
            render(); window.scrollTo(0,0);
          };
        }
      }
    }catch(e){ st.textContent = "✗ " + e.message + " — tap Identify to try again."; }
  };
  document.getElementById("save").onclick = ()=>{
    const g = id => document.getElementById(id).value.trim();
    /* combine CB source with date fields */
    let sourceVal = g("f-source");
    if(sourceVal === "CB" || sourceVal.startsWith("CB (")){
      const cbMM = g("f-cb-mm").padStart(2,"0");
      const cbYY = g("f-cb-yy");
      if(cbMM && cbYY) sourceVal = `CB (${cbMM}/${cbYY})`;
      else sourceVal = "CB";
    }
    /* combine Gift source with name + date fields */
    if(sourceVal === "Gift"){
      let giftName = g("f-gift-name");
      if(giftName) giftName = giftName.charAt(0).toUpperCase() + giftName.slice(1);
      const giftMM = g("f-gift-mm").padStart(2,"0");
      const giftYY = g("f-gift-yy");
      let base = "Gift";
      if(giftName) base = "Gift - " + giftName;
      if(giftMM && giftYY && giftMM !== "00") base += ` (${giftMM}/${giftYY})`;
      sourceVal = base;
    }
    const rec = editingId ? wines.find(x=>x.id===editingId) : {id:uid(), added:new Date().toISOString().slice(0,10)};
    Object.assign(rec, {
      producer:g("f-producer"), name:g("f-name"), vintage:g("f-vintage"),
      type:document.getElementById("f-type").value, qty:(() => { const q = parseInt(g("f-qty")); return isNaN(q) ? 1 : q; })(),
      region:g("f-region"), drinkFrom:g("f-from"), drinkTo:g("f-to"),
      shelfSection:document.getElementById("f-shelf").value, binCode:g("f-bincode"),
      titi:document.getElementById("f-titi").checked,
      fire:_fireTier,
      pairings:g("f-pair"), source:sourceVal, price:g("f-price"),
      location:g("f-loc"), notes:g("f-notes")
    });
    if(pendingImage){ rec.imageData = pendingImage; rec.imagePath = rec.imagePath || null; rec.imageDirty = true; }
    if(!editingId) wines.push(rec);
    saveWines(); editingId=null; tab="cellar"; setTab("cellar");
  };
  const c = document.getElementById("cancel");
  if(c) c.onclick = ()=>{ editingId=null; tab="detail"; render(); };
  const cbBtn = document.getElementById("cb-box-btn");
  if(cbBtn) cbBtn.onclick = ()=>{
    const now = new Date();
    cbBoxMode = true; cbBoxStep = 1;
    cbBoxMonth = String(now.getMonth()+1).padStart(2,"0");
    cbBoxYear = String(now.getFullYear()).slice(2);
    cbBoxCount = 0; cbBoxWines = []; cbBoxSheetImage = null;
    cbBoxLabels = []; cbBoxAudit = [];
    render();
  };
}

/* ================= CB box loader wizard ================= */
function renderCBBox(){
  const stepNames = ["Setup","Scan sheet","Review & labels"];
  const dotsHTML = [1,2,3].map(s => `<span class="dot${s < cbBoxStep ? " done" : ""}${s === cbBoxStep ? " active" : ""}"></span>`).join("");

  if(cbBoxStep === 1){
    /* Step 1: Setup — month/year + bottle count */
    view.innerHTML = `<div class="cb-wizard">
      <h2 class="serif">📦 CB Box Loader</h2>
      <div class="cb-step-label">Step 1 — ${stepNames[0]}</div>
      <div class="cb-step-dots">${dotsHTML}</div>
      <div class="cb-setup-row">
        <div class="field narrow"><label>Month</label><input id="cb-mm" inputmode="numeric" maxlength="2" value="${cbBoxMonth}" placeholder="mm"></div>
        <div class="field narrow"><label>Year</label><input id="cb-yy" inputmode="numeric" maxlength="2" value="${cbBoxYear}" placeholder="yy"></div>
      </div>
      <div class="field cb-count-field">
        <label>How many bottles in this box?</label>
        <input id="cb-count" inputmode="numeric" value="${cbBoxCount||""}" placeholder="3–5" autofocus>
      </div>
      <button class="btn btn-primary" id="cb-next1">Next →</button>
      <button class="btn btn-ghost" id="cb-cancel">Cancel</button>
    </div>`;
    document.getElementById("cb-count").focus();
    document.getElementById("cb-next1").onclick = ()=>{
      cbBoxMonth = document.getElementById("cb-mm").value.trim().padStart(2,"0");
      cbBoxYear = document.getElementById("cb-yy").value.trim();
      cbBoxCount = parseInt(document.getElementById("cb-count").value) || 0;
      if(!cbBoxCount || cbBoxCount < 1 || cbBoxCount > 12){
        document.getElementById("cb-count").style.borderColor = "var(--urgent)";
        return;
      }
      cbBoxStep = 2; render();
    };
    document.getElementById("cb-cancel").onclick = ()=>{ cbBoxMode = false; render(); };
    return;
  }

  if(cbBoxStep === 2){
    /* Step 2: Scan info sheet */
    view.innerHTML = `<div class="cb-wizard">
      <h2 class="serif">📦 CB Box Loader</h2>
      <div class="cb-step-label">Step 2 — ${stepNames[1]}</div>
      <div class="cb-step-dots">${dotsHTML}</div>
      <p style="color:var(--ink-dim);font-size:13px;margin-bottom:14px">
        Photograph or upload the CB info sheet — the one-pager with all the wine names, vintages, prices, and tasting notes.
      </p>
      <div class="photo-zone" id="cb-sheet-zone">
        ${cbBoxSheetImage ? `<img id="cb-sheet-pv" src="${cbBoxSheetImage}" alt="Info sheet" class="cb-sheet-preview">` : `<img id="cb-sheet-pv" style="display:none" class="cb-sheet-preview">`}
        <label class="photo-btn">📷 Take photo of info sheet
          <input type="file" id="cb-sheet-cam" accept="image/*" capture="environment">
        </label>
        <label class="photo-btn ghost">🖼 Choose from gallery
          <input type="file" id="cb-sheet-gal" accept="image/*">
        </label>
      </div>
      <button type="button" class="btn" id="cb-read-sheet" style="border:1px solid var(--gold);color:var(--gold);background:var(--panel);margin-top:10px">✨ Read wines from sheet</button>
      <div class="note" id="cb-sheet-st"></div>
      <div class="cb-btn-row">
        <button class="btn btn-ghost" id="cb-back2">← Back</button>
        <button class="btn btn-ghost" id="cb-skip-sheet">Skip — enter manually</button>
      </div>
    </div>`;
    const pvEl = document.getElementById("cb-sheet-pv");
    const handleSheetPhoto = async (input)=>{
      if(!input.files[0]) return;
      cbBoxSheetImage = await resizeImage(input.files[0]);
      pvEl.src = cbBoxSheetImage; pvEl.style.display = "block";
    };
    document.getElementById("cb-sheet-cam").addEventListener("change", e => handleSheetPhoto(e.target));
    document.getElementById("cb-sheet-gal").addEventListener("change", e => handleSheetPhoto(e.target));

    document.getElementById("cb-read-sheet").onclick = async ()=>{
      const st = document.getElementById("cb-sheet-st");
      if(!cfg.gkey){ st.textContent = "Add a free Gemini API key in the Sync tab first (aistudio.google.com)."; return; }
      if(!cbBoxSheetImage){ st.textContent = "Take or choose a photo of the info sheet first."; return; }
      st.textContent = "Reading info sheet…";
      try{
        const b64 = cbBoxSheetImage.split(",")[1];
        const body = {contents:[{parts:[
          {inline_data:{mime_type:"image/jpeg", data:b64}},
          {text: CB_SHEET_PROMPT + ` I expect approximately ${cbBoxCount} wines on this sheet.`}
        ]}]};
        const {r} = await callGemini(body, cfg.gkey, st);
        const j = await r.json();
        const text = ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
        const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
        const arr = Array.isArray(parsed) ? parsed : [parsed];
        cbBoxWines = arr.map(w => ({
          producer: w.producer || "",
          name: w.name || "",
          vintage: w.vintage || "",
          type: (w.type === "Rose" ? "Rosé" : w.type) || "",
          region: w.region || "",
          drinkFrom: w.drinkFrom || "",
          drinkTo: w.drinkTo || "",
          pairings: w.pairings || "",
          price: w.price || "",
          fire: parseInt(w.fire) || 0,
          notes: w.notes || "",
          shelfSection: "",
          binCode: "",
          location: ""
        }));
        cbBoxLabels = new Array(cbBoxWines.length).fill(null);
        cbBoxAudit = new Array(cbBoxWines.length).fill(null);
        st.textContent = "✓ Found " + cbBoxWines.length + " wine" + (cbBoxWines.length !== 1 ? "s" : "") + "!";
        if(cbBoxWines.length !== cbBoxCount){
          st.textContent += ` (expected ${cbBoxCount} — you can adjust on the next screen)`;
        }
        setTimeout(()=>{ cbBoxStep = 3; render(); }, 1200);
      }catch(e){ st.textContent = "✗ " + e.message + " — try again or tap Skip."; }
    };

    document.getElementById("cb-back2").onclick = ()=>{ cbBoxStep = 1; render(); };
    document.getElementById("cb-skip-sheet").onclick = ()=>{
      /* create empty wine slots */

      }
      cbBoxLabels = new Array(cbBoxCount).fill(null);
      cbBoxAudit = new Array(cbBoxCount).fill(null);
      cbBoxStep = 3; render();
    };
    return;
  }

  if(cbBoxStep === 3){
    /* Step 3: Review wines + label photos */
    const sourceStr = `CB (${cbBoxMonth}/${cbBoxYear})`;
    const allHaveData = cbBoxWines.every(w => w.producer || w.name);

              : `<div class="audit-status warn">⚠ ${esc(auditInfo.notes||"Label differs from sheet")}${auditInfo.corrections ? "<br>Corrections: " + esc(Object.entries(auditInfo.corrections).map(([k,v])=>k+": "+v).join(", ")) : ""}</div>`)
            : "";
          return `<div class="cb-wine-card${hasLabel ? " has-label" : ""}" data-idx="${i}">
            <div class="wine-idx">Bottle ${i+1}</div>
            <div class="wine-name serif">${esc(w.producer||"?") + " " + esc(w.name||"")}</div>
            <div class="wine-detail">

              ${w.type ? `<span>${esc(w.type)}</span>` : ""}

              ${hasLabel ? `<img src="${cbBoxLabels[i]}" alt="label">` : ""}

                <input type="file" class="cb-label-gal" data-idx="${i}" accept="image/*">

              <div class="field"><label>🔥 Fire tier</label>
                <div class="fire-tier-picker" id="cb-fire-${i}">
                  ${[0,1,2,3].map(t=>`<button type="button" class="fire-tier-btn cb-fire-btn" data-idx="${i}" data-tier="${t}"${w.fire===t?' style="color:var(--ink);border-color:var(--gold)"':""}>${t===0?"— None":("🔥".repeat(t)+" "+["","Notable","Prestige","Icon"][t])}</button>`).join("")}
                </div>
              </div>
            </div>
          </div>`;
        }).join("")}
      </div>
      <button class="btn btn-primary" id="cb-save-all" style="margin-top:16px${!allHaveData ? ";opacity:.5" : ""}"${!allHaveData ? " disabled" : ""}>✓ Add all ${cbBoxWines.length} bottles to cellar</button>
      <button class="btn btn-ghost" id="cb-back3">← Back to sheet</button>
      <button class="btn btn-ghost" id="cb-cancel3" style="color:var(--urgent)">Cancel</button>
    </div>`;

    /* bind default shelf controls */
    document.getElementById("cb-def-shelf").addEventListener("change", (e)=>{
      cbBoxShelf = e.target.value;
    });
    document.getElementById("cb-def-loc").addEventListener("change", (e)=>{
      cbBoxLocation = e.target.value.trim();
    });
    document.getElementById("cb-suggest-bin").onclick = ()=>{
      const section = document.getElementById("cb-def-shelf").value;
      if(!section) return;
      const suggested = suggestBinCode(section);
      document.getElementById("cb-def-loc").value = suggested;
      cbBoxLocation = suggested;
    };

    /* bind inline field edits */
    document.querySelectorAll(".edit-toggle").forEach(btn=>{
      btn.onclick = ()=>{
        const idx = btn.dataset.idx;
        const el = document.getElementById("cb-edit-" + idx);
        const showing = el.style.display !== "none";
        el.style.display = showing ? "none" : "block";
        btn.textContent = showing ? "✏️ Edit fields" : "✏️ Close editor";
      };
    });
    document.querySelectorAll(".cb-f").forEach(input=>{
      input.addEventListener("change", ()=>{
        const i = parseInt(input.dataset.idx);
        const f = input.dataset.field;
        cbBoxWines[i][f] = input.value.trim();
      });
    });
    document.querySelectorAll(".cb-f-sel").forEach(sel=>{
      sel.addEventListener("change", ()=>{
        const i = parseInt(sel.dataset.idx);
        cbBoxWines[i][sel.dataset.field] = sel.value;
      });
    });
    document.querySelectorAll(".cb-fire-btn").forEach(btn=>{
      btn.onclick = ()=>{
        const i = parseInt(btn.dataset.idx);
        const tier = parseInt(btn.dataset.tier);
        cbBoxWines[i].fire = tier;
        document.querySelectorAll(`#cb-fire-${i} .cb-fire-btn`).forEach(b=>{
          const on = parseInt(b.dataset.tier) === tier;
          b.style.color = on ? "var(--ink)" : "";
          b.style.borderColor = on ? "var(--gold)" : "";
        });
      };
    });

    /* bind label photo uploads */
    const handleLabelPhoto = async (input)=>{
      if(!input.files[0]) return;
      const idx = parseInt(input.dataset.idx);
      cbBoxLabels[idx] = await resizeImage(input.files[0]);
      /* trigger AI audit in background */
      auditLabel(idx);
      render(); /* refresh to show thumb */
    };
    document.querySelectorAll(".cb-label-input, .cb-label-gal").forEach(input=>{
      input.addEventListener("change", ()=> handleLabelPhoto(input));
    });

    /* save all */
    document.getElementById("cb-save-all").onclick = ()=>{
      const added = [];
      cbBoxWines.forEach((w, i)=>{
        /* collect any unsaved inline edits */
        document.querySelectorAll(`.cb-f[data-idx="${i}"]`).forEach(input=>{
          w[input.dataset.field] = input.value.trim();
        });
        document.querySelectorAll(`.cb-f-sel[data-idx="${i}"]`).forEach(sel=>{
          w[sel.dataset.field] = sel.value;
        });
        /* apply audit corrections if user hasn't edited manually */
        const audit = cbBoxAudit[i];
        if(audit && !audit.match && audit.corrections){
          Object.entries(audit.corrections).forEach(([k,v])=>{
            if(v && !document.querySelector(`.cb-f[data-idx="${i}"][data-field="${k}"]`)?.dataset.userEdited){
              w[k] = v;
            }
          });
        }
        const rec = {
          id: uid(),
          added: new Date().toISOString().slice(0,10),
          producer: w.producer,
          name: w.name,
          vintage: w.vintage,
          type: w.type,
          qty: 1,
          region: w.region,
          drinkFrom: w.drinkFrom,
          drinkTo: w.drinkTo,
          shelfSection: w.shelfSection || cbBoxShelf || "",
          binCode: w.binCode || "",
          titi: false,
          fire: w.fire || 0,
          pairings: w.pairings,
          source: `CB (${cbBoxMonth}/${cbBoxYear})`,
          price: w.price,
          location: w.location || cbBoxLocation || "",
          notes: w.notes,
          drankDate: null,
          rating: null,
          drinkNotes: null,
          buyAgain: null,
          giftedTo: null,
          marketValue: null,
          lastValueCheck: null,
          tastingHistory: [],
          imagePath: null
        };
        if(cbBoxLabels[i]){ rec.imageData = cbBoxLabels[i]; rec.imageDirty = true; }
        wines.push(rec);
        added.push(rec);
      });
      saveWines();
      cbBoxMode = false; cbBoxStep = 1;
      cbBoxWines = []; cbBoxLabels = []; cbBoxAudit = []; cbBoxSheetImage = null;
      cbBoxShelf = ""; cbBoxLocation = "";
      tab = "cellar"; setTab("cellar");
    };

    document.getElementById("cb-back3").onclick = ()=>{ cbBoxStep = 2; render(); };
    document.getElementById("cb-cancel3").onclick = ()=>{
      if(confirm("Cancel CB Box import? You'll lose the extracted data.")){
        cbBoxMode = false; render();
      }
    };
    return;
  }
}

/* label audit via Gemini — runs in background */
async function auditLabel(idx){
  if(!cfg.gkey || !cbBoxLabels[idx] || !cbBoxWines[idx]) return;
  cbBoxAudit[idx] = {loading:true};
  render();
  try{
    const w = cbBoxWines[idx];
    const desc = [w.producer, w.name, w.vintage, w.type, w.region].filter(Boolean).join(", ");
    const b64 = cbBoxLabels[idx].split(",")[1];
    const body = {contents:[{parts:[
      {inline_data:{mime_type:"image/jpeg", data:b64}},
      {text: CB_LABEL_AUDIT_PROMPT + desc}
    ]}]};
    const st = document.createElement("span"); /* dummy status el for callGemini */
    const {r} = await callGemini(body, cfg.gkey, st);
    const j = await r.json();
    const text = ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
    const result = JSON.parse(text.replace(/```json|```/g,"").trim());
    cbBoxAudit[idx] = {
      match: !!result.match,
      corrections: result.corrections || {},
      confidence: result.confidence || "medium",
      notes: result.notes || ""
    };
    /* if corrections found, auto-apply them to cbBoxWines */
    if(!result.match && result.corrections){
      Object.entries(result.corrections).forEach(([k,v])=>{
        if(v && cbBoxWines[idx].hasOwnProperty(k)){
          cbBoxWines[idx][k] = v;
        }
      });
    }
  }catch(e){
    cbBoxAudit[idx] = {match:false, notes:"Audit failed: " + e.message, corrections:{}};
  }
  render();
}

/* ================= stats page ================= */
function renderStats(){
  const inCave = wines.filter(w=>!isDrank(w));
  const drankWines = wines.filter(w => isDrank(w) && !isGifted(w));
  const giftedWines = wines.filter(w => isDrank(w) && isGifted(w));
  const totalW = inCave.length;
  const totalB = inCave.reduce((n,w)=>n+(qtyOf(w)),0);
  const drankCount = drankWines.length;
  const giftedCount = giftedWines.length;

  /* estimated value — in cave only */
  let totalVal = 0, priced = 0;
  inCave.forEach(w=>{
    const m = (w.price||"").match(/\$(\d+(?:\.\d+)?)/);
    if(m){ totalVal += parseFloat(m[1]) * (qtyOf(w)); priced++; }
  });
  const valStr = totalVal ? `~$${Math.round(totalVal).toLocaleString()} CAD` : "—";

  /* drank value + bottle count — count individual bottles from tasting history across ALL wines */
  let drankVal = 0, drankBottleCount = 0;
  wines.forEach(w=>{
    const th = w.tastingHistory || [];
    let consumed = th.length;
    /* wines fully gone with no history — count as 1 */
    if(isDrank(w) && !isGifted(w) && !consumed) consumed = 1;
    if(consumed){
      drankBottleCount += consumed;
      const m = (w.price||"").match(/\$(\d+(?:\.\d+)?)/);
      if(m) drankVal += parseFloat(m[1]) * consumed;
    }
  });
  const drankValStr = drankVal ? `~$${Math.round(drankVal).toLocaleString()} CAD` : "";

  /* by type — in cave */
  const byType = {};
  inCave.forEach(w=>{ const t = w.type||"Unknown"; byType[t] = (byType[t]||0) + (qtyOf(w)); });
  const typeOrder = ["Red","White","Sparkling","Rosé","Dessert","Unknown"];
  const typeColors = {Red:"var(--claret-soft)",White:"var(--gold)",Sparkling:"#a8c0c9","Rosé":"var(--rose)",Dessert:"#c9a8e0",Unknown:"var(--ink-faint)"};
  const typeSorted = typeOrder.filter(t=>byType[t]).map(t=>({type:t,count:byType[t]}));
  const maxType = Math.max(...typeSorted.map(t=>t.count),1);

  /* bottle SVG */
  function bottleSVG(count, color, maxH){
    const h = Math.max(20, Math.round((count/maxH)*100));
    const bw = 36;
    const bodyH = h;
    const neckH = 18;
    const capH = 6;
    const tH = bodyH + neckH + capH + 4;
    return `<svg width="${bw}" height="${tH+16}" viewBox="0 0 ${bw} ${tH+16}">
      <rect x="13" y="0" width="10" height="${capH}" rx="2" fill="${color}" opacity=".7"/>
      <rect x="14" y="${capH}" width="8" height="${neckH}" rx="1" fill="${color}" opacity=".5"/>
      <path d="M14 ${capH+neckH} Q14 ${capH+neckH+6} 6 ${capH+neckH+10} L6 ${tH-6} Q6 ${tH} 10 ${tH} L${bw-10} ${tH} Q${bw-6} ${tH} ${bw-6} ${tH-6} L${bw-6} ${capH+neckH+10} Q${bw-14} ${capH+neckH+6} ${bw-14} ${capH+neckH} Z" fill="${color}"/>
    </svg>`;
  }

  const bottlesHTML = typeSorted.map(t =>
    `<div class="bottle-item">
      ${bottleSVG(t.count, typeColors[t.type]||"var(--ink-faint)", maxType)}
      <div class="bottle-label">${esc(t.type)}</div>
      <div class="bottle-label" style="color:var(--ink)">${t.count}</div>
    </div>`
  ).join("");

  /* vintage spread — in cave */
  const byVintage = {};
  inCave.forEach(w=>{ if(w.vintage){ const v = w.vintage; byVintage[v] = (byVintage[v]||0) + (qtyOf(w)); } });
  const vintages = Object.keys(byVintage).sort();
  const maxVint = Math.max(...Object.values(byVintage),1);
  const vintHTML = vintages.map(v=>{
    const pct = Math.round((byVintage[v]/maxVint)*100);
    return `<div class="bar-row">
      <span class="bar-label">${esc(v)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--claret-soft)"></div></div>
      <span class="bar-val">${byVintage[v]}</span>
    </div>`;
  }).join("");

  /* price distribution — in cave */
  const priceBuckets = {"$0–20":0,"$20–40":0,"$40–60":0,"$60–100":0,"$100+":0};
  const bucketColors = ["var(--ok)","var(--gold)","var(--claret-soft)","var(--rose)","var(--titi)"];
  inCave.forEach(w=>{
    const m = (w.price||"").match(/\$(\d+(?:\.\d+)?)/);
    if(m){
      const p = parseFloat(m[1]);
      const qty = qtyOf(w);
      if(p<20) priceBuckets["$0–20"]+=qty;
      else if(p<40) priceBuckets["$20–40"]+=qty;
      else if(p<60) priceBuckets["$40–60"]+=qty;
      else if(p<100) priceBuckets["$60–100"]+=qty;
      else priceBuckets["$100+"]+=qty;
    }
  });
  const maxPrice = Math.max(...Object.values(priceBuckets),1);
  const priceHTML = Object.entries(priceBuckets).map(([label,cnt],i)=>{
    const pct = Math.round((cnt/maxPrice)*100);
    return `<div class="bar-row">
      <span class="bar-label">${esc(label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${bucketColors[i]}"></div></div>
      <span class="bar-val">${cnt}</span>
    </div>`;
  }).join("");

  /* origin breakdown — all wines */
  const byOrigin = {};
  wines.forEach(w=>{
    const o = getOrigin(w);
    byOrigin[o] = (byOrigin[o]||0) + Math.max(qtyOf(w), 1);
  });
  const originSorted = Object.entries(byOrigin).sort((a,b)=>b[1]-a[1]);
  const maxOrigin = Math.max(...originSorted.map(s=>s[1]),1);
  const originColors = {CB:"var(--ok)",Titi:"var(--titi)",SAQ:"var(--claret-soft)",LCBO:"var(--gold)","Wine club":"var(--rose)"};
  const originHTML = originSorted.map(([label,cnt])=>{
    const pct = Math.round((cnt/maxOrigin)*100);
    const color = originColors[label]||"var(--ink-dim)";
    return `<div class="bar-row">
      <span class="bar-label" style="width:80px">${esc(label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <span class="bar-val">${cnt}</span>
    </div>`;
  }).join("");

  /* CB by shipment — grouped by year, collapsible */
  const cbByYearMonth = {};
  wines.forEach(w=>{
    if(!(w.source||"").startsWith("CB")) return;
    const cm = (w.source||"").match(/\((\d{2})\/(\d{2})\)/);
    if(!cm){
      if(!cbByYearMonth["undated"]) cbByYearMonth["undated"] = {};
      cbByYearMonth["undated"]["undated"] = (cbByYearMonth["undated"]["undated"]||0) + Math.max(qtyOf(w), 1);
      return;
    }
    const yearKey = "20" + cm[2];
    const monthKey = SMONTHS[parseInt(cm[1])-1] + " '" + cm[2];
    if(!cbByYearMonth[yearKey]) cbByYearMonth[yearKey] = {};
    cbByYearMonth[yearKey][monthKey] = (cbByYearMonth[yearKey][monthKey]||0) + Math.max(qtyOf(w), 1);
  });
  const cbYears = Object.keys(cbByYearMonth).sort().reverse();
  const currentYearStr = String(YEAR);
  const cbHTML = cbYears.length ? cbYears.map(year => {
    const months = cbByYearMonth[year];
    const monthsSorted = Object.entries(months).sort((a,b)=>{
      /* sort by mm/yy descending */
      const ma = a[0].match(/'(\d{2})$/), mb = b[0].match(/'(\d{2})$/);
      if(!ma || !mb) return b[0].localeCompare(a[0]);
      const mmA = SMONTHS.indexOf(a[0].split(" ")[0]), mmB = SMONTHS.indexOf(b[0].split(" ")[0]);
      return mmB - mmA;
    });
    const yearTotal = monthsSorted.reduce((sum,[,cnt])=>sum+cnt,0);
    const maxMonth = Math.max(...monthsSorted.map(s=>s[1]),1);
    const isOpen = year === currentYearStr;
    const barsHTML = monthsSorted.map(([label,cnt])=>{
      const pct = Math.round((cnt/maxMonth)*100);
      return `<div class="bar-row">
        <span class="bar-label" style="width:80px">${esc(label)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--ok)"></div></div>
        <span class="bar-val">${cnt}</span>
      </div>`;
    }).join("");
    return `<details class="collapse"${isOpen?" open":""}>
      <summary>${year === "undated" ? "Undated" : year} · ${yearTotal} bottle${yearTotal!==1?"s":""}</summary>
      <div class="collapse-body">${barsHTML}</div>
    </details>`;
  }).join("") : "";

  /* fire wines — prestige */
  const fireWines = inCave.filter(isFire);
  const fireCount = fireWines.reduce((n,w)=>n+(qtyOf(w)),0);
  const fire3 = inCave.filter(w=>fireLevel(w)===3).length;
  const fire2 = inCave.filter(w=>fireLevel(w)===2).length;
  const fire1 = inCave.filter(w=>fireLevel(w)===1).length;

  /* peak wines — approaching/past window */
  const peakWines = inCave.filter(isPeak);
  const peakCount = peakWines.reduce((n,w)=>n+(qtyOf(w)),0);

  /* random picker — only from in-cave wines */
  const drinkable = inCave.filter(w=>{
    const st = windowStatus(w);
    return st.cls==="window" || st.cls==="overdue" || st.cls==="urgent" || st.cls==="soon" || st.cls==="" ;
  });

  view.innerHTML = `<div class="sheet">
    <h2 class="serif">Cellar Stats</h2>

    <div class="stats-row" style="justify-content:center;gap:12px">
      <span class="stat-pill"><span class="n">${totalW}</span> wines</span>
      <span class="stat-pill"><span class="n">${totalB}</span> bottles</span>
      <span class="stat-pill" style="border-color:var(--gold)"><span class="n" style="color:var(--gold)">${valStr}</span></span>
    </div>
    <div class="stats-row" style="justify-content:center;gap:12px;margin-top:4px">
      ${fire3?`<span class="stat-pill" style="border-color:#e8a020"><span class="n" style="color:#e8a020">🔥🔥🔥 ${fire3}</span> icon</span>`:""}
      ${fire2?`<span class="stat-pill" style="border-color:#e8a020"><span class="n" style="color:#e8a020">🔥🔥 ${fire2}</span> prestige</span>`:""}
      ${fire1?`<span class="stat-pill" style="border-color:#e8a020"><span class="n" style="color:#e8a020">🔥 ${fire1}</span> notable</span>`:""}
      ${peakCount?`<span class="stat-pill" style="border-color:var(--warn)"><span class="n" style="color:var(--warn)">⛰️ ${peakCount}</span> peak</span>`:""}
      <span class="stat-pill"><span class="n">${priced}</span> priced</span>
    </div>
    ${drankBottleCount || giftedCount ? `<div class="stats-row" style="justify-content:center;gap:12px;margin-top:4px">
      ${drankBottleCount?`<span class="stat-pill" id="stats-drank-pill" style="cursor:pointer"><span class="n">${drankBottleCount}</span> drank</span>`:""}
      ${giftedCount?`<span class="stat-pill" style="border-color:var(--rose)"><span class="n" style="color:var(--rose)">🎁 ${giftedCount}</span> gifted</span>`:""}
      ${drankValStr?`<span class="stat-pill"><span class="n">${drankValStr}</span> consumed</span>`:""}
    </div>` : ""}

    <div class="stat-section-label">🎲 What should I drink tonight?</div>
    <div id="random-area">
      <button class="btn btn-ghost" id="random-btn" style="border-color:var(--gold);color:var(--gold)">🎲 Pick a random bottle</button>
    </div>

    <div class="stat-section-label">Bottles by type</div>
    <div class="bottles-row">${bottlesHTML}</div>

    <div class="stat-section-label">Bottles by origin</div>
    ${originHTML}

    <div class="stat-section-label">Price range (CAD)</div>
    ${priceHTML}

    <div class="stat-section-label">Vintage spread</div>
    <div class="vbar-wrap">${vintHTML}</div>

    ${cbHTML ? `<div class="stat-section-label">CB by shipment</div>${cbHTML}` : ""}
  </div>`;

  /* random picker handler */
  const bindRandom = () => {
    const btn = document.getElementById("random-btn");
    if(!btn) return;
    btn.onclick = ()=>{
      if(!drinkable.length){ document.getElementById("random-area").innerHTML = `<div class="note">No bottles to pick from!</div>`; return; }
      const pick = drinkable[Math.floor(Math.random()*drinkable.length)];
      const src = imgSrc(pick);
      const st = windowStatus(pick);
      document.getElementById("random-area").innerHTML = `
        <div class="random-card" id="random-card">
          <div style="display:flex;gap:12px;align-items:center">
            ${src?`<img src="${esc(src)}" style="width:48px;height:64px;object-fit:cover;border-radius:3px" alt="">`:`<div class="thumb empty" style="width:48px;height:64px;font-size:22px">?</div>`}
            <div>
              <div class="wine-name serif" style="font-size:18px">${isFire(pick)?fireEmoji(pick)+" ":""}${esc(pick.producer||"")} ${esc(pick.name||"")}</div>
              <div class="wine-sub">${esc([pick.vintage,pick.type,pick.region].filter(Boolean).join(" · "))}</div>
              ${st.label?`<div style="margin-top:4px"><span class="chip ${st.cls}" style="font-size:10px">${esc(st.label)}${st.countdown ? " · " + esc(st.countdown) : ""}</span></div>`:""}
            </div>
          </div>
        </div>
        <button class="btn btn-ghost" id="random-btn" style="border-color:var(--gold);color:var(--gold)">🎲 Pick another</button>`;
      document.getElementById("random-card").onclick = ()=>{
        cellarScrollY = 0; detailId = pick.id; tab="detail";
        history.pushState({tab:"detail", id:detailId}, "");
        render(); window.scrollTo(0,0);
      };
      bindRandom();
    };
  };
  bindRandom();

  /* drank pill → jump to cellar Drank view */
  const drankPill = document.getElementById("stats-drank-pill");
  if(drankPill) drankPill.onclick = ()=>{ cellarView = "drank"; setTab("cellar"); };
}

/* ================= value / appreciation tab ================= */
function parsePrice(p){
  if(!p) return null;
  const m = p.match(/\$(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : null;
}
function fmtCardPrice(p){
  const v = parsePrice(p);
  return v !== null ? "$" + Math.round(v) : "";

function renderValue(){
  const inCave = wines.filter(w=>!isDrank(w));
  const drankWines = wines.filter(w=>isDrank(w) && !isGifted(w));

  /* calculate values */
  let cellarOriginal = 0, cellarCurrent = 0, cellarPriced = 0;
  let drankTotal = 0, drankCurrent = 0;

  const tickerItems = [];
  inCave.forEach(w=>{
    const origP = parsePrice(w.price);
    const curP = parsePrice(w.marketValue);
    const qty = qtyOf(w);
    if(origP) { cellarOriginal += origP * qty; cellarPriced++; }
    if(curP) cellarCurrent += curP * qty;
    if(origP || curP){
      const orig = origP || 0;
      const cur = curP || origP || 0;
      const change = orig ? ((cur - orig) / orig * 100) : 0;
      tickerItems.push({w, orig, cur, change, qty, drank:false});
    }
  });
  drankWines.forEach(w=>{
    const origP = parsePrice(w.price);
    const curP = parsePrice(w.marketValue);
    if(origP) drankTotal += origP;
    if(curP) drankCurrent += curP;
    if(origP || curP){
      const orig = origP || 0;
      const cur = curP || origP || 0;
      const change = orig ? ((cur - orig) / orig * 100) : 0;
      tickerItems.push({w, orig, cur, change, qty:1, drank:true});
    }
  });

  /* filter past-peak wines if toggle is on */
  const hiddenCount = valueHidePastPeak ? tickerItems.filter(t => {
    const ws = windowStatus(t.w);
    return ws.cls === "overdue" && !t.drank;
  }).length : 0;
  if(valueHidePastPeak){
    const filtered = tickerItems.filter(t => {
      if(t.drank) return true; /* always show drank wines */
      const ws = windowStatus(t.w);
      return ws.cls !== "overdue";
    });
    tickerItems.length = 0;
    tickerItems.push(...filtered);
  }

  /* sort ticker */
  if(valueSort === "change-desc") tickerItems.sort((a,b) => b.change - a.change);
  else if(valueSort === "change-asc") tickerItems.sort((a,b) => a.change - b.change);
  else if(valueSort === "name") tickerItems.sort((a,b) => (a.w.producer||"").localeCompare(b.w.producer||""));
  else if(valueSort === "value-desc") tickerItems.sort((a,b) => (b.cur*b.qty) - (a.cur*a.qty));

  /* appreciation */
  const hasCurrentVals = cellarCurrent > 0;
  const totalAppreciation = cellarOriginal ? ((cellarCurrent - cellarOriginal) / cellarOriginal * 100) : 0;
  const appCls = totalAppreciation > 0.5 ? "up" : (totalAppreciation < -0.5 ? "down" : "flat");
  const appStr = (totalAppreciation >= 0 ? "+" : "") + totalAppreciation.toFixed(1) + "%";

  /* ticker rows */
  const tickerHTML = tickerItems.map(t => {
    const chgCls = t.change > 0.5 ? "up" : (t.change < -0.5 ? "down" : "flat");
    const arrow = t.change > 0.5 ? "▲" : (t.change < -0.5 ? "▼" : "—");
    const chgStr = (t.change >= 0 ? "+" : "") + t.change.toFixed(0) + "%";
    const curStr = t.cur ? "$" + Math.round(t.cur) : "—";
    const origStr = t.orig ? "$" + Math.round(t.orig) : "—";
    const fire = isFire(t.w);
    return `<div class="ticker-row${t.drank?" drank":""}" data-id="${t.w.id}">
      <div class="ticker-info">
        <div class="ticker-name">${fire?fireEmoji(t.w)+" ":""}${esc(t.w.producer||"")} ${esc(t.w.name||"")}</div>
        <div class="ticker-sub">${esc([t.w.vintage, t.w.type].filter(Boolean).join(" · "))}${t.qty>1?" × "+t.qty:""}${t.drank?" · <em>drank</em>":""}</div>
      </div>
      <div class="ticker-vals">
        <div>${curStr} <span style="color:var(--ink-faint);font-size:10px">now</span></div>
        <div class="ticker-change ${chgCls}">${arrow} ${chgStr} <span style="font-size:10px;font-weight:400">from ${origStr}</span></div>
      </div>
    </div>`;
  }).join("");

  const noMarketData = !tickerItems.some(t => parsePrice(t.w.marketValue));

  view.innerHTML = `<div class="sheet">
    <h2 class="serif">📈 Cellar Value</h2>

    <div class="val-summary">
      <div class="val-pill"><span class="n">${cellarOriginal ? "~$"+Math.round(cellarOriginal).toLocaleString()+" CAD" : "—"}</span>acquisition cost</div>
      ${hasCurrentVals ? `<div class="val-pill"><span class="n ${appCls}">${cellarCurrent ? "~$"+Math.round(cellarCurrent).toLocaleString()+" CAD" : "—"}</span>current value</div>
      <div class="val-pill"><span class="n ${appCls}">${appStr}</span>appreciation</div>` : ""}
    </div>

    ${drankTotal ? `<div class="val-summary" style="margin-top:4px">
      <div class="val-pill"><span class="n">${"~$"+Math.round(drankTotal).toLocaleString()}</span>consumed (cost)</div>
      ${drankCurrent ? `<div class="val-pill"><span class="n">${"~$"+Math.round(drankCurrent).toLocaleString()}</span>consumed (current)</div>` : ""}
    </div>` : ""}

    ${noMarketData ? `<div style="text-align:center;padding:16px;margin:12px 0;border:1px dashed var(--gold);border-radius:6px;color:var(--gold)">
      <div style="font-size:15px;margin-bottom:6px">No market values yet</div>
      <div style="font-size:12px;color:var(--ink-dim)">Tap the button below to run an AI value check — it estimates current retail prices and compares against what you paid.</div>
    </div>` : ""}

    <button class="btn btn-ghost" id="value-recheck" style="border-color:var(--gold);color:var(--gold)">✨ Update market values (AI)</button>
    <div class="note">Uses Gemini to estimate current market values in CAD. Compares against your purchase prices to show appreciation.</div>
    <div class="sync-status" id="value-st" style="display:none"></div>

    ${tickerItems.length ? `
    <div class="stat-section-label" style="display:flex;align-items:center;justify-content:space-between">
      <span>Wine ticker</span>
      <label style="display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:0;text-transform:none;cursor:pointer;color:var(--ink-faint)">
        <input type="checkbox" id="hide-past-peak" ${valueHidePastPeak?"checked":""}> Hide past peak${hiddenCount ? " ("+hiddenCount+")" : ""}
      </label>
    </div>
    <div class="ticker-sort">
      <button type="button" class="${valueSort==="change-desc"?"on":""}" data-vs="change-desc">▲ Gainers</button>
      <button type="button" class="${valueSort==="change-asc"?"on":""}" data-vs="change-asc">▼ Losers</button>
      <button type="button" class="${valueSort==="value-desc"?"on":""}" data-vs="value-desc">$ Value</button>
      <button type="button" class="${valueSort==="name"?"on":""}" data-vs="name">A–Z</button>
    </div>
    <div class="ticker-list">${tickerHTML}</div>` : ""}
  </div>`;

  /* sort toggle */
  view.querySelectorAll(".ticker-sort button").forEach(btn=>{
    btn.onclick = ()=>{ valueSort = btn.dataset.vs; renderValue(); };
  });

  /* hide past peak toggle */
  const hidePeakEl = document.getElementById("hide-past-peak");
  if(hidePeakEl) hidePeakEl.onchange = ()=>{ valueHidePastPeak = hidePeakEl.checked; renderValue(); };

  /* tap to detail */
  view.querySelectorAll(".ticker-row").forEach(row=>{
    row.onclick = ()=>{
      detailId = row.dataset.id; tab = "detail";
      history.pushState({tab:"detail", id:detailId}, "");
      render(); window.scrollTo(0,0);
    };
  });

  /* AI market value recheck */
  let valueAbort = false;
  document.getElementById("value-recheck").onclick = async ()=>{
    const stEl = document.getElementById("value-st");
    stEl.style.display = "block";
    if(!cfg.gkey){ stEl.textContent = "Add a Gemini API key in Sync → Settings first."; return; }
    valueAbort = false;
    const btn = document.getElementById("value-recheck");
    btn.textContent = "⏹ Stop"; btn.onclick = ()=>{ valueAbort = true; };
    const allWines = wines.filter(w => !isGifted(w));
    let updated = 0;
    for(let i = 0; i < allWines.length; i++){
      if(valueAbort){ stEl.textContent = `Stopped. Updated ${updated}/${i} wines checked.`; break; }
      const w = allWines[i];
      const desc = [w.producer, w.name, w.vintage, w.type, w.region].filter(Boolean).join(", ");
      if(!desc) continue;
      stEl.textContent = `Checking ${i+1}/${allWines.length}: ${w.producer||""} ${w.name||""}…`;
      try{
        const prompt = `You are a wine market analyst. Estimate the CURRENT retail market value in CANADIAN DOLLARS for this wine: ${desc}. Consider the current vintage age, producer reputation, and market demand. Return ONLY a JSON object: {"marketValue":"~$XX CAD (est.)"}. Be accurate — use secondary-market pricing for collectible wines.`;
        const body = {contents:[{parts:[{text:prompt}]}]};
        const {r} = await callGemini(body, cfg.gkey, stEl);
        const j = await r.json();
        const text = ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
        const rec = JSON.parse(text.replace(/```json|```/g,"").trim());
        if(rec.marketValue){
          w.marketValue = rec.marketValue;
          w.lastValueCheck = new Date().toISOString().slice(0,10);
          updated++;
        }
      }catch(e){
        stEl.textContent += " ✗ " + e.message;
        await new Promise(ok=>setTimeout(ok,2000));
      }
    }
    if(!valueAbort) stEl.textContent = `✓ Done. Updated ${updated} of ${allWines.length} market values.`;
    saveWines();
    btn.textContent = "✨ Update market values (AI)";
    btn.onclick = null;
    renderValue();
  };
}

const GH = "https://api.github.com";
function ghHeaders(){ return {"Authorization":"Bearer "+cfg.token, "Accept":"application/vnd.github+json"}; }
async function ghGetSha(path){
  try{
    const r = await fetch(`${GH}/repos/${cfg.owner}/${cfg.repo}/contents/${path}?ref=${cfg.branch||"main"}`, {headers:ghHeaders()});
    if(r.status===404) return null;
    if(!r.ok) return null; /* file likely doesn't exist; let PUT handle auth errors */
    return (await r.json()).sha;
  }catch(e){ return null; }
}
async function ghPut(path, base64Content, message){
  const sha = await ghGetSha(path);
  const body = {message, content:base64Content, branch:cfg.branch||"main"};
  if(sha) body.sha = sha;
  const r = await fetch(`${GH}/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, {
    method:"PUT", headers:{...ghHeaders(),"Content-Type":"application/json"}, body:JSON.stringify(body)
  });
  if(r.status===401) throw new Error(`Auth failed — check your token in Settings (PUT ${path})`);
  if(r.status===409 && !sha){
    /* file exists but we missed the SHA — retry with SHA */
    const sha2 = await ghGetSha(path);
    if(sha2){
      body.sha = sha2;
      const r2 = await fetch(`${GH}/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, {
        method:"PUT", headers:{...ghHeaders(),"Content-Type":"application/json"}, body:JSON.stringify(body)
      });
      if(!r2.ok) throw new Error(`PUT ${path}: ${r2.status} ${(await r2.text()).slice(0,120)}`);
      return;
    }
  }
  if(!r.ok) throw new Error(`PUT ${path}: ${r.status} ${(await r.text()).slice(0,120)}`);
}
function b64EncodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
async function pushAll(statusEl){
  if(!cfg.owner||!cfg.repo||!cfg.token) throw new Error("Fill in owner, repo, and token first.");
  const dirty = wines.filter(w=>w.imageData && w.imageDirty!==false);
  let i=0;
  for(const w of dirty){
    i++;
    statusEl.textContent = `Uploading photo ${i}/${dirty.length}…`;
    const path = `images/${w.id}.jpg`;
    const b64 = w.imageData.split(",")[1];
    await ghPut(path, b64, `Add label photo ${w.producer||""} ${w.vintage||""}`.trim());
    w.imagePath = path; w.imageDirty = false;
  }
  statusEl.textContent = "Writing wines.json…";
  const clean = wines.map(({imageData, imageDirty, ...rest})=>rest);
  await ghPut("data/wines.json", b64EncodeUnicode(JSON.stringify(clean,null,2)), `Update cellar (${clean.length} wines)`);
  wines.forEach(w=>{ if(w.imagePath){ delete w.imageData; delete w.imageDirty; } });
  saveWines();
  cfg.lastSync = new Date().toLocaleString(); saveCfg();
  logSync("push", `${clean.length} wines, ${dirty.length} photo${dirty.length!==1?"s":""}`);
  statusEl.textContent = `✓ Synced ${clean.length} wines at ${cfg.lastSync}`;
}
async function pullAll(statusEl){
  if(!cfg.owner||!cfg.repo) throw new Error("Fill in owner and repo first.");
  statusEl.textContent = "Fetching wines.json…";
  const url = `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch||"main"}/data/wines.json?t=${Date.now()}`;
  const r = await fetch(url);
  if(!r.ok) throw new Error("Could not read data/wines.json ("+r.status+"). Has the cellar been pushed yet?");
  const remote = await r.json();
  if(!Array.isArray(remote)) throw new Error("wines.json is not a list.");
  if(wines.length && !confirm(`Replace the ${wines.length} local wines with ${remote.length} from GitHub?`)){
    statusEl.textContent = "Pull cancelled."; return;
  }
  wines = remote; saveWines();
  cfg.lastSync = new Date().toLocaleString(); saveCfg();
  logSync("pull", `${wines.length} wines loaded`);
  statusEl.textContent = `✓ Loaded ${wines.length} wines from GitHub.`;
  render();
}

        </div>
        <div class="field"><label>Gemini API key (label scanning)</label><input id="c-gkey" type="password" value="${esc(cfg.gkey)}" autocapitalize="off">
          <div class="note">Free key from <b>aistudio.google.com</b>. Enables the &#x2728; Identify button on the add-bottle form. Currently: ${cfg.gkey?"a key is saved":notSet}</div>
        </div>
        <button class="btn btn-ghost" id="savecfg">Save settings</button>
      </div>
    </details>
  </div>`;
  const st = document.getElementById("st");
  document.getElementById("savecfg").onclick = ()=>{
    cfg.owner=document.getElementById("c-owner").value.trim();
    cfg.repo=document.getElementById("c-repo").value.trim();
    cfg.branch=document.getElementById("c-branch").value.trim()||"main";
    cfg.token=document.getElementById("c-token").value.trim();
    cfg.gkey=document.getElementById("c-gkey").value.trim();
    saveCfg(); st.textContent="Settings saved."; renderSync();
  };
  document.getElementById("push").onclick = async ()=>{
    document.getElementById("savecfg").click();
    try{ await pushAll(document.getElementById("st")); } catch(e){ document.getElementById("st").textContent = "X " + e.message; }
  };
  document.getElementById("pull").onclick = async ()=>{
    document.getElementById("savecfg").click();
    try{ await pullAll(document.getElementById("st")); } catch(e){ document.getElementById("st").textContent = "X " + e.message; }
  };
  /* bulk price re-check */
  let recheckAbort = false;
  document.getElementById("recheck-all").onclick = async ()=>{
    const rst = document.getElementById("recheck-all-st");
    rst.style.display = "block";
    if(!cfg.gkey){ rst.textContent = "Add a Gemini API key in Settings below first."; return; }
    recheckAbort = false;
    const btn = document.getElementById("recheck-all");
    btn.textContent = "⏹ Stop"; btn.onclick = ()=>{ recheckAbort = true; };
    let updated = 0;
    for(let i = 0; i < wines.length; i++){
      if(recheckAbort){ rst.textContent = `Stopped. Updated ${updated}/${i} wines checked.`; break; }
      const w = wines[i];
      const desc = [w.producer, w.name, w.vintage, w.type, w.region].filter(Boolean).join(", ");
      if(!desc) continue;
      rst.textContent = `Checking ${i+1}/${wines.length}: ${w.producer||""} ${w.name||""}…`;
      try{
        const prompt = `You are a wine pricing expert. Estimate the current retail market value in CANADIAN DOLLARS for: ${desc}. Return ONLY a JSON object: {"price":"~$XX CAD (est.)"}. Be research-grade accurate.`;
        const body = {contents:[{parts:[{text:prompt}]}]};
        const {r} = await callGemini(body, cfg.gkey, rst);
        const j = await r.json();
        const text = ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
        const rec = JSON.parse(text.replace(/```json|```/g,"").trim());
        if(rec.price && rec.price !== w.price){ w.price = rec.price; updated++; }
      }catch(e){ rst.textContent += " ✗ " + e.message; await new Promise(ok=>setTimeout(ok,2000)); }
    }
    if(!recheckAbort) rst.textContent = `✓ Done. Updated ${updated} of ${wines.length} prices.`;
    saveWines(); render();
    btn.textContent = "✨ Re-check all prices (AI)";
    btn.onclick = null; renderSync();
  };

  /* populate stats */
  const statsBody = document.getElementById("stats-body");
  if(statsBody){
    const _ic = wines.filter(w=>!isDrank(w));
    const _totalW = _ic.length;
    const _totalB = _ic.reduce((n,w)=>n+(qtyOf(w)),0);
    const _drk = wines.filter(w => isDrank(w) && !isGifted(w)).length;
    const _gift = wines.filter(w => isDrank(w) && isGifted(w)).length;
    const byType = {}; _ic.forEach(w=>{ const t=w.type||"Unknown"; byType[t]=(byType[t]||0)+1; });
    const titiCount = _ic.filter(w=>w.titi).length;
    const fireCount = _ic.filter(isFire).length;
    const peakCount = _ic.filter(isPeak).length;
    statsBody.innerHTML = `
      <div class="stats-row">
        <span class="stat-pill"><span class="n">${_totalW}</span> wines</span>
        <span class="stat-pill"><span class="n">${_totalB}</span> bottles</span>
        ${titiCount?`<span class="stat-pill" style="border-color:var(--titi)"><span class="n" style="color:var(--titi)">${titiCount}</span> Titi</span>`:""}
        ${fireCount?`<span class="stat-pill" style="border-color:#e8a020"><span class="n" style="color:#e8a020">${fireCount}</span> 🔥</span>`:""}
      </div>
      <div class="stats-row">
        ${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`<span class="stat-pill"><span class="n">${c}</span> ${esc(t)}</span>`).join("")}
      </div>
      ${peakCount||_drk||_gift ? `<div class="stats-row">
        ${peakCount?`<span class="stat-pill" style="border-color:var(--warn)"><span class="n" style="color:var(--warn)">${peakCount}</span> ⛰️ peak</span>`:""}
        ${_drk?`<span class="stat-pill"><span class="n">${_drk}</span> drank</span>`:""}
        ${_gift?`<span class="stat-pill" style="border-color:var(--rose)"><span class="n" style="color:var(--rose)">${_gift}</span> 🎁 gifted</span>`:""}
      </div>` : ""}`;
  }
}

function setTab(t, restoreScroll){
  tab = t;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===t));
  render();
  if(restoreScroll !== undefined) window.scrollTo(0, restoreScroll);
  else window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click", ()=>{
  editingId = null;
  if(b.dataset.tab !== "add") cbBoxMode = false;
  setTab(b.dataset.tab);
}));

/* browser back/forward button support */
window.addEventListener("popstate", (e)=>{
  if(e.state && e.state.tab==="detail"){
    detailId = e.state.id; tab="detail"; render(); window.scrollTo(0,0);
  } else {
    tab="cellar"; setTab("cellar", cellarScrollY);
  }
});

(async ()=>{
  render();
  if(!wines.length && cfg.owner && cfg.repo){
    try{
      const r = await fetch(`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch||"main"}/data/wines.json?t=${Date.now()}`);
      if(r.ok){ wines = await r.json(); saveWines(); render(); }
    }catch(e){}
  }
})();
