<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>La Cave — Cellar Book</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1518">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1518; --panel:#261c20; --panel2:#2e2227;
  --ink:#efe6d8; --ink-dim:#b8aa9a; --ink-faint:#8a7d70;
  --claret:#a03040; --claret-soft:#c05060;
  --gold:#c9a227; --rose:#c98a8a;
  --line:rgba(239,230,216,.14);
  --ok:#7da87b; --warn:#c9a227; --urgent:#c05060;
  --titi:#8a7dc9;
  --orange:#d4842a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; min-height:100vh;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
.mono{font-family:"IBM Plex Mono",monospace}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.tbd{color:var(--ink-faint); font-style:italic}

/* ---------- header ---------- */
header{
  padding:18px 16px 12px; border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
}
header h1{
  font-family:"Cormorant Garamond",serif; font-weight:600; font-size:26px;
  letter-spacing:.01em;
}
header h1 em{font-style:italic; color:var(--claret-soft)}
.bottle-count{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-faint)}

/* ---------- tab bar ---------- */
nav{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:var(--panel); border-top:1px solid var(--line);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; background:none; border:none; color:var(--ink-faint);
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; padding:14px 4px 12px; cursor:pointer;
}
nav button.active{color:var(--ink)}
nav button.active span{border-bottom:2px solid var(--claret); padding-bottom:4px}
nav button:focus-visible{outline:2px solid var(--claret); outline-offset:-2px}

/* ---------- controls ---------- */
.toolbar{padding:12px 16px; display:flex; gap:8px; flex-wrap:wrap}
.toolbar input[type=search]{
  flex:1 1 100%; background:var(--panel); border:1px solid var(--line); border-radius:4px;
  color:var(--ink); padding:9px 12px; font-size:15px;
}
.toolbar select{
  flex:1; background:var(--panel); border:1px solid var(--line); border-radius:4px;
  color:var(--ink-dim); padding:9px 8px; font-size:13px; min-width:0;
}
.toolbar .toggle-btn{
  flex:none; background:var(--panel); border:1px solid var(--line); border-radius:4px;
  color:var(--ink-dim); padding:9px 12px; font-size:12.5px; font-family:"IBM Plex Mono",monospace;
  cursor:pointer;
}
.toolbar .toggle-btn.on{color:var(--titi); border-color:var(--titi)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--claret); outline-offset:1px;
}

/* ---------- compact filter bar ---------- */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0}
.filter-trigger{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;
  padding:5px 10px;border:1px solid var(--line);border-radius:14px;
  color:var(--ink-faint);cursor:pointer;white-space:nowrap;background:none;
  transition:all .15s;display:inline-flex;align-items:center;gap:4px;
}
.filter-trigger.active{color:var(--ink);border-color:var(--ink);background:rgba(255,255,255,.06)}
.filter-trigger .ft-badge{
  font-size:9px;background:var(--claret);color:#fff;border-radius:6px;
  min-width:14px;height:14px;display:inline-flex;align-items:center;
  justify-content:center;padding:0 3px;
}

/* ---------- filter popup ---------- */
.filter-popup-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fpFadeIn .15s ease;
}
@keyframes fpFadeIn{from{opacity:0}to{opacity:1}}
.filter-popup{
  background:var(--panel);border:1px solid var(--line);
  border-radius:12px 12px 0 0;padding:16px 16px 24px;
  width:100%;max-width:420px;max-height:60vh;overflow-y:auto;
}
.filter-popup h3{
  font-family:"IBM Plex Mono",monospace;font-size:11px;
  text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);
  margin:0 0 12px;
}
.fp-grid{display:flex;flex-wrap:wrap;gap:8px}
.fp-opt{
  font-family:"IBM Plex Mono",monospace;font-size:12px;
  padding:8px 14px;border:1px solid var(--line);border-radius:6px;
  color:var(--ink-faint);cursor:pointer;background:none;
  transition:all .15s;white-space:nowrap;
}
.fp-opt.on{color:var(--ink);border-color:var(--ink);background:rgba(255,255,255,.08)}
.fp-opt .fp-count{font-size:9px;opacity:.6;margin-left:4px}

/* ---------- wine cards ---------- */
.list{padding:0 16px}
.list-heading{
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-faint); padding:14px 0 8px;
}
.list-heading.overdue{color:var(--urgent)}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:6px;
  margin-bottom:12px; overflow:hidden; cursor:pointer;
}
.card-top{display:flex; gap:12px; padding:12px}
.thumb{
  width:64px; height:84px; flex:none; border-radius:3px; object-fit:cover;
  background:var(--panel2); border:1px solid var(--line);
}
.thumb.empty{
  display:flex; align-items:center; justify-content:center;
  font-family:"Cormorant Garamond",serif; font-size:28px; font-style:italic; color:var(--ink-faint);
}
.card-info{flex:1; min-width:0}
.wine-name{
  font-family:"Cormorant Garamond",serif; font-weight:600; font-size:19px; line-height:1.2;
}
.wine-sub{font-size:12.5px; color:var(--ink-dim); margin-top:2px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
.chip{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.04em;
  padding:2px 7px; border:1px solid var(--line); border-radius:3px; color:var(--ink-dim);
}
.chip.vintage{color:var(--ink); border-color:var(--ink-faint)}
.chip.red{color:var(--claret-soft)}
.chip.white{color:var(--gold)}
.chip.rose{color:var(--rose)}
.chip.sparkling{color:#a8c0c9}
.chip.bin{color:var(--gold);border-color:var(--gold);font-weight:600}
.chip.titi{color:var(--titi); border-color:var(--titi)}

/* ---------- maturity band (the signature) ---------- */
.band-wrap{padding:0 12px 11px}
.band-labels{
  display:flex; justify-content:space-between;
  font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-faint);
  margin-bottom:4px;
}
.band-status{text-transform:uppercase; letter-spacing:.08em}
.band-status.hold{color:var(--ink-faint)}
.band-status.window{color:var(--ok)}
.band-status.soon{color:var(--warn)}
.band-status.now{color:var(--urgent)}
.band-status.urgent{color:var(--orange)}
.band-status.overdue{color:var(--urgent)}
.band{
  position:relative; height:6px; border-radius:3px; background:var(--panel2);
  overflow:visible;
}
.band-fill{
  position:absolute; top:0; bottom:0; border-radius:3px;
  background:linear-gradient(90deg, #5a6e59 0%, #7da87b 35%, #c9a227 75%, #c05060 100%);
  opacity:.85;
}
.band-now{
  position:absolute; top:-3px; width:2px; height:12px; background:var(--ink);
  border-radius:1px;
}

/* ---------- empty state ---------- */
.empty-state{
  text-align:center; padding:56px 32px; color:var(--ink-dim);
}
.empty-state .serif{font-size:22px; font-style:italic; margin-bottom:8px; color:var(--ink)}

/* ---------- forms ---------- */
.sheet{padding:16px}
.sheet h2{
  font-family:"Cormorant Garamond",serif; font-weight:600; font-size:24px; margin-bottom:16px;
}
.field{margin-bottom:14px}
.field label{
  display:block; font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); margin-bottom:5px;
}
.field input,.field select,.field textarea{
  width:100%; background:var(--panel); border:1px solid var(--line); border-radius:4px;
  color:var(--ink); padding:10px 12px; font-size:15px; font-family:inherit;
}
.field select+input{margin-top:6px}
@keyframes needs-attention{
  0%,100%{border-color:var(--gold); box-shadow:0 0 0 0 rgba(201,162,39,.0)}
  50%{border-color:var(--gold); box-shadow:0 0 8px 2px rgba(201,162,39,.25)}
}
.field input.needs-att,.field select.needs-att,.field textarea.needs-att{
  animation:needs-attention 2s ease-in-out 3;
  border-color:var(--gold);
}
.field .att-dot{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--gold); margin-left:6px; vertical-align:middle;
}
.field textarea{min-height:64px; resize:vertical}
.field.checkrow{display:flex; align-items:center; gap:8px}
.field.checkrow input{width:auto}
.field.checkrow label{margin:0; text-transform:none; font-size:14px; color:var(--ink)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
.bincode-row{display:flex; gap:8px; align-items:flex-end}
.bincode-row .field{flex:1; margin-bottom:0}
.bincode-row button{
  flex:none; background:var(--panel2); border:1px solid var(--ink-faint); border-radius:4px;
  color:var(--ink-dim); padding:10px 12px; font-size:12.5px; cursor:pointer;
}

.photo-zone{
  border:1px dashed var(--ink-faint); border-radius:6px; padding:18px;
  text-align:center; color:var(--ink-dim); cursor:pointer; margin-bottom:14px;
  background:var(--panel);
}
.photo-zone{cursor:default}
.photo-zone img{max-width:120px; max-height:160px; border-radius:4px; display:block; margin:0 auto 10px}
.photo-btn{
  display:block; position:relative; padding:11px; margin:8px auto 0; max-width:280px;
  background:var(--panel2); border:1px solid var(--ink-faint); border-radius:5px;
  color:var(--ink); font-size:14px; cursor:pointer; text-align:center; overflow:hidden;
}
.photo-btn.ghost{background:none; color:var(--ink-dim); border-color:var(--line)}
.photo-btn input{
  position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:0;
}

.btn{
  display:block; width:100%; padding:13px; border-radius:5px; border:none;
  font-size:15px; font-weight:600; cursor:pointer; margin-bottom:10px;
}
.btn-primary{background:var(--claret); color:#fff}
.btn-ghost{background:none; border:1px solid var(--line); color:var(--ink-dim)}
.btn-danger{background:none; border:1px solid var(--urgent); color:var(--urgent)}

/* ---------- detail view ---------- */
.detail-photo{width:100%; max-height:320px; object-fit:contain; background:var(--panel); border-radius:6px; margin-bottom:14px}
.detail-name{font-family:"Cormorant Garamond",serif; font-weight:700; font-size:28px; line-height:1.15}
.detail-sub{color:var(--ink-dim); margin:4px 0 14px}
.spec{
  display:grid; grid-template-columns:110px 1fr; gap:6px 14px;
  padding:14px 0; border-top:1px solid var(--line); font-size:14px;
}
.spec dt{font-family:"IBM Plex Mono",monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); padding-top:2px}
.spec dd{color:var(--ink)}

/* ---------- settings / sync ---------- */
.note{font-size:12.5px; color:var(--ink-faint); margin-top:5px; line-height:1.5}
.sync-status{
  font-family:"IBM Plex Mono",monospace; font-size:12px; padding:10px 12px;
  border:1px solid var(--line); border-radius:4px; color:var(--ink-dim);
  margin-bottom:14px; white-space:pre-wrap; word-break:break-word;
}
.section-rule{border:none; border-top:1px solid var(--line); margin:22px 0}

details.collapse{margin:18px 0}
details.collapse summary{
  font-family:"IBM Plex Mono",monospace; font-size:11px; text-transform:uppercase;
  letter-spacing:.08em; color:var(--ink-faint); cursor:pointer; padding:10px 0;
  list-style:none; display:flex; align-items:center; gap:6px;
}
details.collapse summary::-webkit-details-marker{display:none}
details.collapse summary::before{content:"▸"; font-size:10px; transition:transform .15s}
details.collapse[open] summary::before{transform:rotate(90deg)}
details.collapse .collapse-body{padding:12px 0 0}

.history-last{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  padding:6px 0; font-size:13px;
}
.history-list{list-style:none; padding:0; margin:0}
.history-list li{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;
}
.history-list li:last-child{border-bottom:none}
.hist-type{
  font-family:"IBM Plex Mono",monospace; font-size:10px; text-transform:uppercase;
  letter-spacing:.06em; padding:2px 6px; border-radius:3px; flex:none;
}
.hist-type.pull{background:rgba(125,168,123,.15); color:var(--ok)}
.hist-type.push{background:rgba(192,80,96,.15); color:var(--urgent)}
.hist-detail{color:var(--ink-dim); flex:1; min-width:0}
.hist-time{color:var(--ink-faint); font-size:11px; font-family:"IBM Plex Mono",monospace; flex:none; text-align:right}

.changelog{list-style:none; padding:0; margin:0}
.changelog li{padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; line-height:1.5}
.changelog li:last-child{border-bottom:none}
.cl-ver{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--gold); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:3px}
.cl-title{color:var(--ink); font-weight:600}
.cl-desc{color:var(--ink-dim); font-size:12.5px}

/* ---------- detail back & qty controls ---------- */
.back-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.back-row button{background:none;border:none;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:13px;cursor:pointer;padding:4px 0}
.back-row button:hover{color:var(--ink)}
.qty-row{display:flex;align-items:center;gap:12px;margin:14px 0}
.qty-btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;color:var(--ink);width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-btn:active{background:var(--claret);border-color:var(--claret)}
.qty-display{font-family:"IBM Plex Mono",monospace;font-size:18px;min-width:32px;text-align:center}
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat-pill{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:12px;color:var(--ink-dim)}
.stat-pill .n{color:var(--ink);font-weight:500}
.tab-badge{font-size:9px;background:var(--claret);color:#fff;border-radius:8px;padding:1px 5px;margin-left:3px;vertical-align:top}
.toolbar select.sort{flex:1 1 100%;font-size:12px;color:var(--ink-faint)}
.cb-date-row,.gift-detail-row{display:flex;gap:8px;align-items:center;margin-top:6px}
.cb-date-row input,.gift-detail-row input{width:70px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:13px}
.gift-detail-row input.gift-name{width:auto;flex:1;text-align:left}
.cb-date-row span{font-size:12px;color:var(--ink-faint)}
.qty-mini{display:inline-flex;align-items:center;gap:4px;margin-left:8px;vertical-align:middle}
.qty-mini button{background:var(--panel2);border:1px solid var(--line);border-radius:3px;color:var(--ink);width:28px;height:28px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.qty-mini button:active{background:var(--claret);border-color:var(--claret)}
.inline-price{display:flex;align-items:center;gap:8px}
.inline-price input{background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:6px 10px;font-size:14px;width:140px}
.inline-price button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;color:var(--ink-dim);padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.inline-price button:active{background:var(--claret);color:#fff}
.recheck-bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.recheck-bar button{flex:1;min-width:0}
.chip.fire{color:#e8a020;border-color:#e8a020;text-shadow:0 0 6px rgba(232,160,32,.4)}
.fire-tier-picker{display:flex;gap:0;flex-wrap:wrap}
.fire-tier-btn{background:var(--panel);border:1px solid var(--line);color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:11px;padding:8px 10px;cursor:pointer;white-space:nowrap}
.fire-tier-btn:first-child{border-radius:4px 0 0 4px}
.fire-tier-btn:last-child{border-radius:0 4px 4px 0}
.fire-tier-btn:not(:first-child){border-left:none}
.fire-tier-btn.on{color:#e8a020;background:var(--panel2);border-color:#e8a020}
.fire-tier-btn.on:first-child{color:var(--ink);border-color:var(--ink-faint)}
.chip.cb{color:var(--ok);border-color:var(--ok)}
.chip.peak{color:var(--warn);border-color:var(--warn)}
.card.drank{opacity:.45}
.card.drank .thumb{filter:grayscale(.6)}
.view-toggle{display:flex;gap:0;margin:0 0 0 auto;flex:none}
.view-toggle button{background:var(--panel);border:1px solid var(--line);color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:7px 10px;cursor:pointer;letter-spacing:.04em}
.view-toggle button:first-child{border-radius:4px 0 0 4px}
.view-toggle button:last-child{border-radius:0 4px 4px 0}
.view-toggle button:not(:first-child){border-left:none}
.view-toggle button.on{color:var(--ink);background:var(--panel2);border-color:var(--ink-faint)}
.stat-section{margin:24px 0 8px}
.stat-section-label{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.bottles-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px 0 8px}
.bottle-item{text-align:center;flex:0 0 auto}
.bottle-label{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.bar-label{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);width:60px;text-align:right;flex:none}
.bar-track{flex:1;height:20px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;min-width:2px}
.bar-val{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-dim);width:28px;flex:none}
.vbar-wrap{overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch}
.random-card{background:var(--panel);border:1px solid var(--gold);border-radius:6px;padding:14px;margin:10px 0;cursor:pointer}
.random-card:active{border-color:var(--claret)}

/* ---------- graduated peak countdown chips ---------- */
.chip.overdue{color:var(--urgent);border-color:var(--urgent)}
.chip.last-call{color:var(--orange);border-color:var(--orange)}
.chip.countdown{font-size:9.5px;color:var(--ink-faint);border:none;padding:2px 4px}
.chip.flag{border:none;padding:1px 2px;font-size:13px;line-height:1}
.chip.peak-icon{border:none;padding:1px 3px;line-height:1;display:inline-flex;align-items:center}
.chip.peak-icon svg{display:block}
.chip.price{color:var(--ink-dim);border-color:var(--line);font-size:10px}

/* ---------- review sheet ---------- */
.review-sheet{
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:18px;margin:16px 0;
}
.review-sheet h3{
  font-family:"Cormorant Garamond",serif;font-weight:600;font-size:20px;margin-bottom:14px;
}
.review-choice{display:flex;gap:10px;margin-bottom:16px}
.review-choice button{
  flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  color:var(--ink-dim);padding:14px 10px;font-size:14px;cursor:pointer;text-align:center;
  transition:border-color .15s,color .15s;
}
.review-choice button.selected{color:var(--ink);border-color:var(--claret)}
.review-choice button:hover{border-color:var(--ink-faint)}
.star-rating{display:flex;gap:6px;margin:8px 0 12px}
.star-rating .star{
  font-size:28px;cursor:pointer;color:var(--ink-faint);transition:color .1s;
  background:none;border:none;padding:2px;line-height:1;
}
.star-rating .star.active{color:var(--gold)}
.star-rating .star:hover{color:var(--gold)}

/* ---------- value / appreciation tab ---------- */
.val-summary{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}

}

.ticker-sort button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:7px 8px;cursor:pointer}

/* ---------- CB box loader wizard ---------- */

@media (prefers-reduced-motion: no-preference){
  .card{transition:border-color .15s}

}

<body>

<header>
  <h1>La <em>Cave</em></h1>
  <span class="bottle-count" id="count"></span>
</header>

<main id="view"></main>

<nav>
  <button data-tab="cellar" class="active"><span>Cellar</span></button>
  <button data-tab="soon"><span>Drink Soon</span></button>
  <button data-tab="add"><span>+ Bottle</span></button>
  <button data-tab="stats"><span>Stats</span></button>
  <button data-tab="value"><span>📈 Value</span></button>
  <button data-tab="sync"><span>Sync</span></button>
</nav>

<script>
"use strict";

/* ================= state ================= */
const LS_WINES = "cave.wines.v1";
const LS_CFG   = "cave.config.v1";
const LS_HIST  = "cave.synchistory.v1";
let wines = JSON.parse(localStorage.getItem(LS_WINES) || "[]");
let cfg   = JSON.parse(localStorage.getItem(LS_CFG)   || "{}");
let tab = "cellar";
let editingId = null;
let detailId = null;
let cellarScrollY = 0;
let searchQ = "", typeFilter = "", sortBy = "producer", cellarView = "cave";
let filters = {fire:false, titi:false, cb:false, peak:false, soon:false, past:false};
let shelfFilters = new Set();
let reviewPending = null; /* wine id when review sheet is open */
let valueSort = "change-desc"; /* ticker sort: change-desc, change-asc, name, value-desc */
let valueHidePastPeak = false; /* hide wines well past their maturity on value tab */
/* CB box loader state */
let cbBoxMode = false;   /* true when CB box wizard is active */
let cbBoxStep = 1;       /* wizard step: 1=setup, 2=scan sheet, 3=review/labels */
let cbBoxMonth = "";
let cbBoxYear = "";
let cbBoxCount = 0;
let cbBoxWines = [];     /* extracted wines from info sheet */
let cbBoxSheetImage = null; /* info sheet photo data URL */
let cbBoxLabels = [];    /* label photo data URLs, indexed by wine */
let cbBoxAudit = [];     /* audit results per wine */
let cbBoxShelf = "";     /* default shelf section for the box */
let cbBoxLocation = "";  /* default location/rack for the box */

const saveWines = () => localStorage.setItem(LS_WINES, JSON.stringify(wines));
let syncHistory = JSON.parse(localStorage.getItem(LS_HIST) || "[]");
function logSync(type, detail){
  syncHistory.unshift({type, detail, time: new Date().toLocaleString()});
  if(syncHistory.length > 30) syncHistory.length = 30;
  localStorage.setItem(LS_HIST, JSON.stringify(syncHistory));
}
const saveCfg   = () => localStorage.setItem(LS_CFG, JSON.stringify(cfg));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => (s??"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const YEAR = new Date().getFullYear();
const MONTH = new Date().getMonth() + 1; /* 1-12 */
const tbd = v => (v===undefined||v===null||v==="") ? `<span class="tbd">TBD</span>` : esc(v);

/* ================= shelf sections ================= */
const SHELF_SECTIONS = ["Keep","Soon","White","Sparkling"];
const SHELF_PREFIX = {Keep:"K", Soon:"S", White:"W", Sparkling:"B"};
function suggestBinCode(section){
  const prefix = SHELF_PREFIX[section] || "X";
  const used = wines
    .filter(w => (w.binCode||"").toUpperCase().startsWith(prefix))
    .map(w => parseInt((w.binCode||"").slice(1),10))
    .filter(n => !isNaN(n));
  const next = (used.length ? Math.max(...used) : 0) + 1;
  return prefix + String(next).padStart(2,"0");
}

/* ================= drink-window logic (graduated) ================= */
function monthsRemaining(w){
  const to = parseInt(w.drinkTo);
  if(!to) return null;
  return (to - YEAR) * 12 - MONTH + 6; /* assuming mid-year for drinkTo */
}
function countdownText(mo){
  if(mo === null) return "";
  if(mo > 24) return Math.round(mo/12) + " yr left";
  if(mo >= 1) return mo + " mo left";
  if(mo <= -24) return Math.round(Math.abs(mo)/12) + " yr over";
  if(mo < 0) return Math.abs(mo) + " mo over";
  return "now";
}

function windowStatus(w){
  const from = parseInt(w.drinkFrom), to = parseInt(w.drinkTo);
  if(!from && !to) return {cls:"", label:"", countdown:""};
  if(from && YEAR < from) return {cls:"hold", label:"Hold · from " + from, countdown:""};
  const mo = monthsRemaining(w);
  if(to && mo !== null){
    const cd = countdownText(mo);
    if(mo < 0) return {cls:"overdue", label:"Past peak", countdown:cd};
    if(mo <= 3) return {cls:"urgent", label:"Last call", countdown:cd};
    if(mo <= 12) return {cls:"soon", label:"Drink soon", countdown:cd};
    return {cls:"window", label:"In window", countdown:cd};
  }
  /* has from but no to, and we're past from */
  return {cls:"window", label:"In window", countdown:""};
}
function isOverdue(w){ const to = parseInt(w.drinkTo); return !!to && YEAR > to; }
function bandHTML(w){
  const from = parseInt(w.drinkFrom), to = parseInt(w.drinkTo);
  if(!from || !to || to <= from) return "";
  const span = to - from;
  const pos = Math.min(Math.max((YEAR - from) / span, 0), 1);
  const st = windowStatus(w);
  return `<div class="band-wrap">
    <div class="band-labels">
      <span>${from}</span>
      <span class="band-status ${st.cls}">${st.label}${st.countdown ? " · " + st.countdown : ""}</span>
      <span>${to}</span>
    </div>
    <div class="band"><div class="band-fill" style="left:0;right:0"></div>
      <div class="band-now" style="left:calc(${(pos*100).toFixed(1)}% - 1px)"></div>
    </div>
  </div>`;
}

/* ================= display helpers ================= */
const SMONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtSource(s){
  if(!s) return s;
  const m = s.match(/^CB \((\d{2})\/(\d{2})\)$/);
  if(m){ const mo=parseInt(m[1]); return "CB · " + (mo ? SMONTHS[mo-1]+" '" : "'") + m[2]; }
  const gm = s.match(/^(Gift - .+?)\s*\((\d{2})\/(\d{2})\)$/);
  if(gm){ const mo=parseInt(gm[2]); return gm[1] + " · " + (mo ? SMONTHS[mo-1]+" '" : "'") + gm[3]; }
  return s;
}
function parseGiftSource(s){
  if(!s || !s.startsWith("Gift")) return {name:"",mm:"",yy:""};
  let rest = s.replace(/^Gift\s*-?\s*/,"").trim();
  const dm = rest.match(/\((\d{2})\/(\d{2})\)\s*$/);
  if(dm) return {name:rest.replace(dm[0],"").trim(), mm:dm[1], yy:dm[2]};
  return {name:rest, mm:"", yy:""};
}
const COUNTRY_FLAGS = {france:"🇫🇷",italy:"🇮🇹",spain:"🇪🇸",portugal:"🇵🇹",germany:"🇩🇪",austria:"🇦🇹",greece:"🇬🇷",hungary:"🇭🇺",georgia:"🇬🇪",usa:"🇺🇸",canada:"🇨🇦",argentina:"🇦🇷",chile:"🇨🇱",australia:"🇦🇺",southafrica:"🇿🇦"};
function countryFlag(w){
  const r = (w.region||"").trim();
  if(!r) return "";
  const parts = r.split(",");
  let c = parts[parts.length-1].trim().toLowerCase().replace(/\s+/g,"");
  if(c==="southaustralia") c="australia";
  return COUNTRY_FLAGS[c]||"";
}
function fireLevel(w){ const f = w.fire; if(f === true) return 1; return parseInt(f)||0; }
function isFire(w){ return fireLevel(w) > 0; }
function fireEmoji(w){ return "🔥".repeat(fireLevel(w)); }
function fireLabel(w){ return ["","Notable","Prestige","Icon"][fireLevel(w)]||""; }
function isPeak(w){ const st = windowStatus(w); return st.cls==="overdue" || st.cls==="urgent" || st.cls==="soon"; }
function isCB(w){ return (w.source||"").startsWith("CB"); }
function qtyOf(w){ const q = parseInt(w.qty); return isNaN(q) ? 1 : q; }
function isDrank(w){ return qtyOf(w) <= 0; }
function isGifted(w){ return !!w.giftedTo; }
function getOrigin(w){
  if(w.titi) return "Titi";
  const s = w.source||"";
  if(s.startsWith("CB")) return "CB";
  if(s.startsWith("SAQ")) return "SAQ";
  if(s.startsWith("LCBO")) return "LCBO";
  if(s.startsWith("Wine club")) return "Wine club";
  if(s.startsWith("Gift")) return "Gift";
  if(s.startsWith("Winery")) return "Winery";
  if(s) return s.split(/[( ]/)[0];
  return "Unknown";
}

/* star display helpers */
function starsHTML(rating, size){
  if(!rating) return "";
  const sz = size || 12;
  let s = "";
  for(let i=1;i<=5;i++) s += (i<=rating) ? "★" : "☆";
  return `<span class="card-stars" style="font-size:${sz}px">${s}</span>`;
}

/* ================= images ================= */
function resizeImage(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = () => {
      const MAX = 800;
      let {width:w, height:h} = img;
      if(w > MAX || h > MAX){ const r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
function imgSrc(w){
  if(w.imageData) return w.imageData;
  if(w.imagePath && cfg.owner && cfg.repo)
    return `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch||"main"}/${w.imagePath}`;
  return null;
}

/* ================= filter count helpers ================= */
function filterCounts(baseItems){
  /* count how many wines in baseItems match each filter */
  return {
    fire: baseItems.filter(w => isFire(w)).length,
    titi: baseItems.filter(w => !!w.titi).length,
    cb: baseItems.filter(w => isCB(w)).length,
    peak: baseItems.filter(w => isPeak(w)).length,
    soon: baseItems.filter(w => { const st = windowStatus(w); return st.cls==="soon" || st.cls==="urgent"; }).length,
    past: baseItems.filter(w => { const st = windowStatus(w); return st.cls==="overdue"; }).length,
  };
}
function shelfCounts(baseItems){
  const counts = {};
  baseItems.forEach(w => {
    const loc = (w.location||"").trim();
    if(loc && loc.length <= 2){
      counts[loc.toUpperCase()] = (counts[loc.toUpperCase()]||0) + 1;
    }
  });
  return counts;
}

/* ================= rendering ================= */
const view = document.getElementById("view");
const countEl = document.getElementById("count");

function render(){
  const _inCave = wines.filter(w=>!isDrank(w));
  const _wc = _inCave.length, _bc = _inCave.reduce((n,w)=>n+(qtyOf(w)),0);
  /* count individual bottles drank (from tasting history) + fully-consumed wines with no history */
  let _drankBottles = 0;
  let _giftedCount = 0;
  wines.forEach(w => {
    if(isDrank(w) && isGifted(w)) _giftedCount++;
    const th = w.tastingHistory || [];
    _drankBottles += th.length;
    /* wines fully consumed (qty 0) but no tasting history — count as 1 bottle drank */
    if(isDrank(w) && !isGifted(w) && !th.length) _drankBottles++;
  });
  let countParts = _wc === _bc ? `${_bc} bottles` : `${_wc} wines · ${_bc} bottles`;
  if(_drankBottles) countParts += ` · ${_drankBottles} drank`;
  if(_giftedCount) countParts += ` · ${_giftedCount} gifted`;
  countEl.textContent = countParts;
  /* update drink-soon badge — count wines that are urgent/soon/overdue */
  const _urgentCount = wines.filter(w => {
    if(isDrank(w)) return false;
    const st = windowStatus(w);
    return st.cls==="overdue" || st.cls==="urgent" || st.cls==="soon";
  }).length;
  const soonBtn = document.querySelector('nav button[data-tab="soon"]');
  if(soonBtn) soonBtn.innerHTML = `<span>Drink Soon${_urgentCount ? ` <span class="tab-badge">${_urgentCount}</span>` : ""}</span>`;
  if(tab==="cellar") renderList(false);
  else if(tab==="soon") renderList(true);
  else if(tab==="add") renderForm();
  else if(tab==="detail") renderDetail();
  else if(tab==="stats") renderStats();
  else if(tab==="value") renderValue();
  else if(tab==="sync") renderSync();
}

/* mountain SVG for peak icon — colored by status */
const PEAK_COLORS = {hold:"#7b9a7b", window:"#7da87b", soon:"#c9a227", urgent:"#d4842a", overdue:"#c05060"};
function peakMtnSVG(cls){
  const c = PEAK_COLORS[cls]||PEAK_COLORS.window;
  return `<svg viewBox="0 0 16 11" width="14" height="10"><path d="M0 11L5.5 1L11 11z" fill="${c}"/><path d="M7 11L11 4L16 11z" fill="${c}" opacity=".5"/></svg>`;
}
function peakIconHTML(w){
  const st = windowStatus(w);
  if(!st.cls || st.cls==="hold") return "";
  const tip = st.label + (st.countdown ? " · " + st.countdown : "");
  return `<span class="chip peak-icon" title="${esc(tip)}">${peakMtnSVG(st.cls)}</span>`;
}
/* verbose version for detail view */
function peakChipHTML(w){
  const st = windowStatus(w);
  if(!st.cls || st.cls==="hold" || st.cls==="window") {
    if(st.cls==="window" && st.countdown) return `<span class="chip window" style="color:var(--ok);border-color:var(--ok)">In window</span><span class="chip countdown">${esc(st.countdown)}</span>`;
    return "";
  }
  if(st.cls==="soon") return `<span class="chip peak">${esc(st.label)}</span><span class="chip countdown">${esc(st.countdown)}</span>`;
  if(st.cls==="urgent") return `<span class="chip last-call">${esc(st.label)}</span><span class="chip countdown">${esc(st.countdown)}</span>`;
  if(st.cls==="overdue") return `<span class="chip overdue">${esc(st.label)}</span><span class="chip countdown">${esc(st.countdown)}</span>`;
  return "";
}

function cardHTML(w){
  const src = imgSrc(w);
  const thumb = src ? `<img class="thumb" src="${esc(src)}" alt="" loading="lazy">`
                    : `<div class="thumb empty">?</div>`;
  const tcls = (w.type||"").toLowerCase();
  const flag = countryFlag(w);
  const subLine = [w.region, fmtSource(w.source)].filter(Boolean).join(" · ");
  const fire = isFire(w);
  const drank = isDrank(w);
  const gifted = isGifted(w);
  const cardCls = gifted ? "gifted" : (drank ? "drank" : "");
  const drankLabel = gifted
    ? ` <span style="font-size:12px;color:var(--rose);font-family:var(--mono)">· 🎁 gift${w.giftedTo ? " to " + esc(w.giftedTo) : ""}</span>`
    : (drank ? ` <span style="font-size:12px;color:var(--ink-faint);font-family:var(--mono)">· drank</span>` : "");
  return `<div class="card${cardCls ? " "+cardCls : ""}" data-id="${w.id}">
    <div class="card-top">
      ${thumb}
      <div class="card-info">
        <div class="wine-name serif">${fire?fireEmoji(w)+" ":""}${esc(w.producer||"")} ${esc(w.name||"")}${drankLabel}</div>
        <div class="wine-sub">${subLine ? esc(subLine) : `<span class="tbd">TBD</span>`}</div>
        <div class="chips">
          ${w.vintage?`<span class="chip vintage">${esc(w.vintage)}</span>`:""}
          ${w.location?`<span class="chip bin">${esc(w.location)}</span>`:""}
          ${w.type?`<span class="chip ${tcls}">${esc(w.type)}</span>`:""}
          ${flag?`<span class="chip flag">${flag}</span>`:""}
          ${!drank && w.qty>1?`<span class="chip">×${esc(w.qty)}</span>`:""}

          ${fire?`<span class="chip fire">${fireEmoji(w)}</span>`:""}
          ${!drank ? peakIconHTML(w) : ""}
          ${w.price?`<span class="chip price">${fmtCardPrice(w.price)}</span>`:""}
          ${w.titi?`<span class="chip titi">Titi</span>`:""}
          ${isCB(w)?`<span class="chip cb">CB</span>`:""}
          ${gifted?`<span class="chip gift">🎁</span>`:""}
        </div>
        ${drank && !gifted && w.rating ? starsHTML(w.rating) : ""}
      </div>
    </div>
    ${drank?"":bandHTML(w)}
  </div>`;
}

function renderList(soonMode){
  let items = wines.slice();
  /* view filter: cave (default) hides drank, drank shows only drank, all shows everything */
  if(!soonMode){
    if(cellarView==="cave") items = items.filter(w=>!isDrank(w));
    else if(cellarView==="drank") items = items.filter(w=>isDrank(w));
  } else {
    items = items.filter(w=>!isDrank(w)); /* drink-soon never shows drank */
  }
  if(searchQ){
    const q = searchQ.toLowerCase();
    items = items.filter(w => [w.producer,w.name,w.region,w.vintage,w.source,w.pairings,w.location,w.binCode,w.notes]
      .some(f => (f||"").toString().toLowerCase().includes(q)));
  }
  if(typeFilter) items = items.filter(w => w.type===typeFilter);

  /* compute counts for chips BEFORE applying chip filters (so counts reflect the base set) */
  const fCounts = filterCounts(items);
  const sCounts = shelfCounts(items);
  const usedShelves = Object.keys(sCounts).sort();

  const drankExists = wines.some(isDrank);

  /* chip config: key, label, active color */
  const chipDefs = [
    {key:"fire", label:"🔥 Fire", color:"#e8a020"},
    {key:"titi", label:"Titi", color:"var(--titi)"},
    {key:"cb", label:"CB", color:"var(--ok)"},
    {key:"peak", label:"⛰️ Peak", color:"var(--warn)"},
    {key:"soon", label:"⏰ Soon", color:"var(--orange)"},
    {key:"past", label:"🔴 Past", color:"var(--urgent)"},
  ];

  const activeFilterCount = chipDefs.filter(d => filters[d.key]).length;
  const activeShelfCount = shelfFilters.size;

  const anyActive = activeShelfCount || activeFilterCount || typeFilter || searchQ;
  const filterBarHTML = `<div class="filter-bar">
    ${usedShelves.length ? `<button type="button" class="filter-trigger${activeShelfCount?" active":""}" id="shelf-trigger">Shelf${activeShelfCount?` <span class="ft-badge">${activeShelfCount}</span>`:""}</button>` : ""}
    <button type="button" class="filter-trigger${activeFilterCount?" active":""}" id="filter-trigger">Filters${activeFilterCount?` <span class="ft-badge">${activeFilterCount}</span>`:""}</button>
    ${anyActive?`<button type="button" class="filter-trigger" id="clear-filters" style="color:var(--urgent);border-color:var(--urgent)">✕ Clear</button>`:""}
  </div>`;

  const toolbar = `<div class="toolbar">
    <input type="search" id="q" placeholder="Search the cellar…" value="${esc(searchQ)}">
    <select id="tf">
      <option value="">All types</option>
      ${["Red","White","Rosé","Sparkling","Dessert"].map(t=>`<option ${typeFilter===t?"selected":""}>${t}</option>`).join("")}
    </select>
    ${filterBarHTML}
    ${!soonMode && drankExists ? `<div class="view-toggle">
      <button type="button" class="${cellarView==="cave"?"on":""}" data-cv="cave">In cave</button>
      <button type="button" class="${cellarView==="drank"?"on":""}" data-cv="drank">Drank</button>
      <button type="button" class="${cellarView==="all"?"on":""}" data-cv="all">All</button>
    </div>` : ""}
    ${!soonMode ? `<select id="sort" class="sort">
      <option value="producer" ${sortBy==="producer"?"selected":""}>Sort: Producer A–Z</option>
      <option value="vintage-desc" ${sortBy==="vintage-desc"?"selected":""}>Sort: Newest vintage</option>
      <option value="vintage-asc" ${sortBy==="vintage-asc"?"selected":""}>Sort: Oldest vintage</option>
      <option value="added" ${sortBy==="added"?"selected":""}>Sort: Recently added</option>
      <option value="window" ${sortBy==="window"?"selected":""}>Sort: Drink window ↑</option>
    </select>` : ""}
  </div>`;

  view.innerHTML = toolbar + `<div id="card-list"></div>`;

  const qEl = document.getElementById("q");
  /* search input only updates the card list — toolbar stays in the DOM so mobile keyboard keeps compose state */
  qEl.addEventListener("input", e=>{ searchQ=e.target.value; renderCards(soonMode); });
  /* select-all on focus — delay for mobile Safari which cancels immediate select() */
  qEl.addEventListener("focus", ()=> setTimeout(()=> qEl.select(), 10));
  document.getElementById("tf").addEventListener("change", e=>{ typeFilter=e.target.value; renderListOnly(soonMode); });
  /* clear all filters */
  const clearBtn = document.getElementById("clear-filters");
  if(clearBtn) clearBtn.addEventListener("click", ()=>{
    searchQ=""; typeFilter=""; shelfFilters.clear();
    Object.keys(filters).forEach(k=> filters[k]=false);
    renderListOnly(soonMode);
  });

  /* popup filter bindings */
  function openPopup(titleText, items, onToggle, onClose){
    const overlay = document.createElement("div");
    overlay.className = "filter-popup-overlay";
    const popup = document.createElement("div");
    popup.className = "filter-popup";
    popup.innerHTML = `<h3>${titleText}</h3><div class="fp-grid">${items.map(it =>
      `<button type="button" class="fp-opt${it.on?" on":""}" data-key="${esc(it.key)}" ${it.style?`style="${it.style}"`:""}>` +
      `${it.label}${it.count!=null?`<span class="fp-count">${it.count}</span>`:""}</button>`
    ).join("")}</div>`;
    overlay.appendChild(popup);
    document.body.appendChild(overlay);
    popup.querySelectorAll(".fp-opt").forEach(btn => btn.addEventListener("click", ()=>{
      onToggle(btn.dataset.key);
      btn.classList.toggle("on");
    }));
    overlay.addEventListener("click", e=>{ if(e.target===overlay){ overlay.remove(); onClose(); } });
  }
  const shelfTrigger = document.getElementById("shelf-trigger");
  if(shelfTrigger) shelfTrigger.addEventListener("click", ()=>{
    const items = usedShelves.map(l => ({key:l, label:l, count:sCounts[l], on:shelfFilters.has(l)}));
    openPopup("Shelf", items, key=>{
      if(shelfFilters.has(key)) shelfFilters.delete(key); else shelfFilters.add(key);
    }, ()=> renderListOnly(soonMode));
  });
  const filterTrigger = document.getElementById("filter-trigger");
  if(filterTrigger) filterTrigger.addEventListener("click", ()=>{
    const items = chipDefs.map(d => ({key:d.key, label:d.label, count:fCounts[d.key], on:filters[d.key],
      style:filters[d.key]?`color:${d.color};border-color:${d.color}`:""}));
    openPopup("Filters", items, key=>{
      filters[key] = !filters[key];
    }, ()=> renderListOnly(soonMode));
  });

  document.querySelectorAll(".view-toggle button").forEach(b=>b.addEventListener("click", ()=>{ cellarView=b.dataset.cv; renderListOnly(soonMode); }));
  const sortEl = document.getElementById("sort");
  if(sortEl) sortEl.addEventListener("change", e=>{ sortBy=e.target.value; renderListOnly(soonMode); });
  renderCards(soonMode);
}
/* Update only the card list — toolbar stays untouched so search input keeps focus on mobile */
function renderCards(soonMode){
  let items = wines.slice();
  if(!soonMode){
    if(cellarView==="cave") items = items.filter(w=>!isDrank(w));
    else if(cellarView==="drank") items = items.filter(w=>isDrank(w));
  } else {
    items = items.filter(w=>!isDrank(w));
  }
  if(searchQ){
    const q = searchQ.toLowerCase();
    items = items.filter(w => [w.producer,w.name,w.region,w.vintage,w.source,w.pairings,w.location,w.binCode,w.notes]
      .some(f => (f||"").toString().toLowerCase().includes(q)));
  }
  if(typeFilter) items = items.filter(w => w.type===typeFilter);
  if(filters.fire) items = items.filter(w => isFire(w));
  if(filters.titi) items = items.filter(w => !!w.titi);
  if(filters.cb) items = items.filter(w => isCB(w));
  if(filters.peak) items = items.filter(w => isPeak(w));
  if(filters.soon) items = items.filter(w => { const st = windowStatus(w); return st.cls==="soon" || st.cls==="urgent"; });
  if(filters.past) items = items.filter(w => { const st = windowStatus(w); return st.cls==="overdue"; });
  if(shelfFilters.size) items = items.filter(w => { const loc=(w.location||"").trim().toUpperCase(); return loc && shelfFilters.has(loc); });

  /* unrated bottles nudge (drank view only, not soonMode) */
  let unratedHTML = "";
  if(!soonMode && cellarView==="drank"){
    const unrated = wines.filter(w => isDrank(w) && w.drankDate && !w.rating && !isGifted(w))
      .sort((a,b) => (b.drankDate||"").localeCompare(a.drankDate||""));
    if(unrated.length){
      const unratedCards = unrated.map(w => {
        const src = imgSrc(w);
        const thumbH = src
          ? `<img src="${esc(src)}" style="width:36px;height:48px;object-fit:cover;border-radius:3px" alt="">`
          : `<div class="thumb empty" style="width:36px;height:48px;font-size:16px">?</div>`;
        return `<div class="unrated-card" data-id="${w.id}">
          ${thumbH}
          <div style="flex:1;min-width:0">
            <div class="wine-name serif">${esc(w.producer||"")} ${esc(w.name||"")}</div>
            <div class="wine-sub">${esc([w.vintage, w.drankDate].filter(Boolean).join(" · "))}</div>
          </div>
          <span style="font-size:18px;color:var(--gold)">☆</span>
        </div>`;
      }).join("");
      unratedHTML = `<details class="unrated-section" open>
        <summary>🍷 Rate these bottles (${unrated.length})</summary>
        ${unratedCards}
      </details>`;
    }
  }

  let body;
  if(soonMode){
    const withWindow = items.filter(w => w.drinkTo);
    withWindow.sort((a,b) => {
      const ma = monthsRemaining(a) ?? 9999;
      const mb = monthsRemaining(b) ?? 9999;
      return ma - mb;
    });
    const overdue = withWindow.filter(w => { const st = windowStatus(w); return st.cls==="overdue"; });
    const urgent = withWindow.filter(w => { const st = windowStatus(w); return st.cls==="urgent"; });
    const soon = withWindow.filter(w => { const st = windowStatus(w); return st.cls==="soon"; });
    const inWindow = withWindow.filter(w => { const st = windowStatus(w); return st.cls==="window"; });
    if(!withWindow.length){
      body = `<div class="empty-state"><div class="serif">Nothing with a drink-by window yet.</div>
        Set a "Drink by" year on a bottle and it will show up here.</div>`;
    } else {
      body = "";
      if(overdue.length) body += `<div class="list"><div class="list-heading overdue">Past peak — drink or gift these (${overdue.length})</div>${overdue.map(cardHTML).join("")}</div>`;
      if(urgent.length) body += `<div class="list"><div class="list-heading" style="color:var(--orange)">Last call — 1–3 months (${urgent.length})</div>${urgent.map(cardHTML).join("")}</div>`;
      if(soon.length) body += `<div class="list"><div class="list-heading" style="color:var(--warn)">Drink soon — 3–12 months (${soon.length})</div>${soon.map(cardHTML).join("")}</div>`;
      if(inWindow.length) body += `<div class="list"><div class="list-heading">In window (${inWindow.length})</div>${inWindow.map(cardHTML).join("")}</div>`;
    }
  } else {
    if(sortBy==="vintage-desc") items.sort((a,b)=>(parseInt(b.vintage)||0)-(parseInt(a.vintage)||0));
    else if(sortBy==="vintage-asc") items.sort((a,b)=>(parseInt(a.vintage)||0)-(parseInt(b.vintage)||0));
    else if(sortBy==="added") items.sort((a,b)=>(b.added||"").localeCompare(a.added||""));
    else if(sortBy==="window") items.sort((a,b)=>(parseInt(a.drinkTo)||9999)-(parseInt(b.drinkTo)||9999));
    else items.sort((a,b)=>(a.producer||"").localeCompare(b.producer||""));
    body = items.length
      ? `<div class="list">${items.map(cardHTML).join("")}</div>`
      : `<div class="empty-state"><div class="serif">The cellar book is empty.</div>
         Tap <b>+ Bottle</b> below and photograph your first label.</div>`;
  }

  const container = document.getElementById("card-list");
  container.innerHTML = unratedHTML + body;
  /* bind unrated cards */
  container.querySelectorAll(".unrated-card").forEach(c => c.addEventListener("click", ()=>{
    cellarScrollY = window.scrollY;
    detailId = c.dataset.id; tab="detail";
    history.pushState({tab:"detail", id:detailId}, "");
    render(); window.scrollTo(0,0);
  }));
  bindCards();
}
/* Full re-render — used by filter/sort/view-toggle clicks (not during search typing) */
function renderListOnly(soonMode){
  renderList(soonMode);
}
function bindCards(){
  view.querySelectorAll(".card").forEach(c => c.addEventListener("click", ()=>{
    cellarScrollY = window.scrollY;
    detailId = c.dataset.id; tab="detail";
    history.pushState({tab:"detail", id:detailId}, "");
    render(); window.scrollTo(0,0);
  }));
}

/* ================= review sheet (drink/gift flow) ================= */
function addTastingEntry(w, rating, notes, buyAgain){
  if(!w.tastingHistory) w.tastingHistory = [];
  const entry = { date: new Date().toISOString().slice(0,10) };
  if(rating) entry.rating = rating;
  if(notes) entry.notes = notes;
  if(buyAgain !== null && buyAgain !== undefined) entry.buyAgain = buyAgain;
  entry.bottleNum = (w.tastingHistory.length || 0) + 1;
  w.tastingHistory.push(entry);
}

function showReviewSheet(w, isLastBottle){
  reviewPending = w.id;
  const reviewArea = document.getElementById("review-area");
  if(!reviewArea) return;
  const hasHistory = w.tastingHistory && w.tastingHistory.length;
  const today = new Date().toISOString().slice(0,10);
  const heading = isLastBottle ? "Last bottle — what happened?" : `Opening bottle ${(hasHistory ? w.tastingHistory.length : 0) + 1} — how is it?`;
  const dateFieldHTML = `<div class="field"><label>Date</label><input type="date" id="rev-date" value="${today}" style="background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:10px 12px;font-size:14px;width:100%"></div>`;
  reviewArea.innerHTML = `<div class="review-sheet">
    <h3 class="serif">${heading}</h3>
    ${isLastBottle ? `<div class="review-choice">
      <button type="button" id="rev-drank">🍷 Drank it</button>
      <button type="button" id="rev-gift">🎁 Gave as gift</button>
    </div>` : ""}
    <div id="rev-body">${isLastBottle ? "" : `
      ${dateFieldHTML}
      <div class="field"><label>Rating</label>
        <div class="star-rating" id="star-row">
          ${[1,2,3,4,5].map(i=>`<button type="button" class="star" data-v="${i}">☆</button>`).join("")}
        </div>
      </div>
      <div class="field"><label>How is it evolving?</label>
        <textarea id="rev-notes" placeholder="Tasting notes — compare to previous bottles…" style="background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:10px 12px;font-size:14px;min-height:56px;resize:vertical;width:100%"></textarea>
      </div>
      <div class="field"><label>Would buy again?</label>
        <div class="buy-again-row">
          <button type="button" class="ba-btn" data-v="yes">👍 Yes</button>
          <button type="button" class="ba-btn" data-v="no">👎 No</button>
        </div>
      </div>
      <button class="btn btn-primary" id="rev-save">Save tasting note</button>
      <button class="btn btn-ghost" id="rev-skip">Skip — rate later</button>
    `}</div>
  </div>`;

  /* bind star/buy-again for both multi-bottle and last-bottle drank modes */
  function bindDrankControls(saveCallback, skipCallback){
    let rating = 0, buyAgain = null;
    document.querySelectorAll("#star-row .star").forEach(s => {
      s.onclick = ()=>{
        rating = parseInt(s.dataset.v);
        document.querySelectorAll("#star-row .star").forEach((ss,i)=>{
          ss.textContent = i < rating ? "★" : "☆";
          ss.classList.toggle("active", i < rating);
        });
      };
    });
    document.querySelectorAll(".ba-btn").forEach(b => {
      b.onclick = ()=>{
        buyAgain = b.dataset.v === "yes";
        document.querySelectorAll(".ba-btn").forEach(bb=>bb.classList.remove("selected"));
        b.classList.add("selected");
      };
    });
    const saveBtn = document.getElementById("rev-save");
    if(saveBtn) saveBtn.onclick = ()=> saveCallback(rating, buyAgain);
    const skipBtn = document.getElementById("rev-skip");
    if(skipBtn) skipBtn.onclick = skipCallback;
  }

  if(!isLastBottle){
    /* multi-bottle: save tasting note, decrement qty */
    bindDrankControls(
      (rating, buyAgain) => {
        const notes = (document.getElementById("rev-notes").value||"").trim() || null;
        addTastingEntry(w, rating, notes, buyAgain);
        w.qty = qtyOf(w) - 1;
        reviewPending = null;
        saveWines(); render();
      },
      () => {
        addTastingEntry(w, 0, null, null); /* placeholder — rate later */
        w.qty = qtyOf(w) - 1;
        reviewPending = null;
        saveWines(); render();
      }
    );
    return;
  }

  /* last bottle — drank or gift choice */
  document.getElementById("rev-drank").onclick = ()=>{
    document.getElementById("rev-drank").classList.add("selected");
    document.getElementById("rev-gift").classList.remove("selected");
    document.getElementById("rev-body").innerHTML = `
      ${dateFieldHTML}
      <div class="field"><label>Rating</label>
        <div class="star-rating" id="star-row">
          ${[1,2,3,4,5].map(i=>`<button type="button" class="star" data-v="${i}">☆</button>`).join("")}
        </div>
      </div>
      <div class="field"><label>How was it?</label>
        <textarea id="rev-notes" placeholder="Tasting notes, occasion…" style="background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:10px 12px;font-size:14px;min-height:56px;resize:vertical;width:100%"></textarea>
      </div>
      <div class="field"><label>Would buy again?</label>
        <div class="buy-again-row">
          <button type="button" class="ba-btn" data-v="yes">👍 Yes</button>
          <button type="button" class="ba-btn" data-v="no">👎 No</button>
        </div>
      </div>
      <button class="btn btn-primary" id="rev-save">Save review</button>
      <button class="btn btn-ghost" id="rev-skip">Skip — rate later</button>`;
    bindDrankControls(
      (rating, buyAgain) => {
        const notes = (document.getElementById("rev-notes").value||"").trim() || null;
        addTastingEntry(w, rating, notes, buyAgain);
        w.qty = 0;
        w.drankDate = (document.getElementById("rev-date")||{}).value || new Date().toISOString().slice(0,10);
        if(rating) w.rating = rating;
        w.drinkNotes = notes;
        w.buyAgain = buyAgain;
        w.giftedTo = null;
        reviewPending = null;
        saveWines(); render();
      },
      () => {
        addTastingEntry(w, 0, null, null); /* placeholder — rate later */
        w.qty = 0;
        w.drankDate = (document.getElementById("rev-date")||{}).value || new Date().toISOString().slice(0,10);
        reviewPending = null;
        saveWines(); render();
      }
    );
  };

  document.getElementById("rev-gift").onclick = ()=>{
    document.getElementById("rev-gift").classList.add("selected");
    document.getElementById("rev-drank").classList.remove("selected");
    document.getElementById("rev-body").innerHTML = `
      ${dateFieldHTML}
      <div class="field"><label>To whom / occasion (optional)</label>
        <input id="rev-giftee" placeholder="e.g. Mom's birthday" style="background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:10px 12px;font-size:14px;width:100%">
      </div>
      <button class="btn btn-primary" id="rev-save-gift">Save</button>
      <button class="btn btn-ghost" id="rev-skip-gift">Skip — rate later</button>`;
    document.getElementById("rev-save-gift").onclick = ()=>{
      w.qty = 0;
      w.drankDate = (document.getElementById("rev-date")||{}).value || new Date().toISOString().slice(0,10);
      w.giftedTo = (document.getElementById("rev-giftee").value||"").trim() || "someone";
      reviewPending = null;
      saveWines(); render();
    };
    document.getElementById("rev-skip-gift").onclick = ()=>{
      w.qty = 0;
      w.drankDate = (document.getElementById("rev-date")||{}).value || new Date().toISOString().slice(0,10);
      reviewPending = null;
      saveWines(); render();
    };
  };
}

function renderDetail(){
  const w = wines.find(x=>x.id===detailId);
  if(!w){ tab="cellar"; return render(); }
  const src = imgSrc(w);
  const st = windowStatus(w);
  const drinkVal = (w.drinkFrom||w.drinkTo)
    ? `${w.drinkFrom||"—"} – ${w.drinkTo||"—"}${st.label?` <span class="band-status ${st.cls} mono" style="font-size:10px">· ${st.label}${st.countdown ? " · "+st.countdown : ""}</span>`:""}`
    : null;
  const drank = isDrank(w);
  const gifted = isGifted(w);
  const peak = isPeak(w);

  /* gift / review info for drank bottles */
  let drankInfoHTML = "";
  if(drank && gifted){
    drankInfoHTML = `<span class="chip gift">🎁 Gift${w.giftedTo && w.giftedTo !== "someone" ? " to " + esc(w.giftedTo) : ""}${w.drankDate ? " · " + w.drankDate : ""}</span>`;
  } else if(drank){
    drankInfoHTML = `<span class="chip" style="color:var(--ink-faint)">Drank${w.drankDate?" · "+w.drankDate:""}</span>`;
    if(w.rating) drankInfoHTML += ` ${starsHTML(w.rating, 14)}`;
  }

  /* review details for detail view */
  let reviewDetailHTML = "";
  if(drank && !gifted){
    const parts = [];
    if(w.rating) parts.push(`<dt>Rating</dt><dd>${starsHTML(w.rating, 16)}</dd>`);
    if(w.drinkNotes) parts.push(`<dt>Tasting notes</dt><dd>${esc(w.drinkNotes)}</dd>`);
    if(w.buyAgain !== null && w.buyAgain !== undefined) parts.push(`<dt>Buy again?</dt><dd>${w.buyAgain ? "👍 Yes" : "👎 No"}</dd>`);
    if(parts.length) reviewDetailHTML = `<dl class="spec">${parts.join("")}</dl>`;
  }

    const fullMode = !hasData && b64;
    stEl.textContent = fullMode ? "Identifying wine from label…" : "Checking price…";
    try{
      let body, prompt;
      if(fullMode){
        prompt = AI_PROMPT;
      } else {
        const desc = [w.producer, w.name, w.vintage, w.type, w.region].filter(Boolean).join(", ");
        prompt = `You are a wine pricing expert. Estimate the current retail market value in CANADIAN DOLLARS for this wine: ${desc}. Return ONLY a JSON object with one field: price (formatted like '~$XX CAD (est.)' for estimates, or '$XX CAD' if you're confident). Base on producer reputation, region, vintage quality, and current market data.`;
      }
      if(b64){
        body = {contents:[{parts:[{inline_data:{mime_type:"image/jpeg",data:b64}},{text:prompt}]}]};
        if(!fullMode) stEl.textContent = "Checking price with label photo…";
      } else {
        body = {contents:[{parts:[{text:prompt}]}]};
      }
      const {r} = await callGemini(body, cfg.gkey, stEl);
      const j = await r.json();
      const text = ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
      const rec = JSON.parse(text.replace(/```json|```/g,"").trim());
      if(fullMode){
        /* update all empty fields */
        const fields = ["producer","name","vintage","type","region","drinkFrom","drinkTo","pairings","price","notes"];
        let filled = 0;
        fields.forEach(f => {
          if(rec[f] && !w[f]){
            w[f] = (f==="type" && rec[f]==="Rose") ? "Rosé" : rec[f];
            filled++;
          }
        });
        if(rec.price) { w.price = rec.price; document.getElementById("price-edit").value = rec.price; }
        if(rec.fire) w.fire = parseInt(rec.fire)||0;
        saveWines();
        const _fl = parseInt(rec.fire)||0;
        stEl.textContent = "✓ Identified: " + [rec.producer,rec.name,rec.vintage].filter(Boolean).join(" ") + (_fl ? " " + "🔥".repeat(_fl) : "") + ` — filled ${filled} fields. Tap Edit to review.`;
        setTimeout(()=> render(), 1500);
      } else {
        if(rec.price){
          const oldPrice = w.price || "(none)";
          w.price = rec.price; saveWines();
          document.getElementById("price-edit").value = rec.price;
          stEl.textContent = "✓ Price updated: " + oldPrice + " → " + rec.price;
        } else { stEl.textContent = "✗ No price returned."; }
      }
    }catch(e){ stEl.textContent = "✗ " + e.message; }
  };
  document.getElementById("qty-minus").onclick = ()=>{
    const prev = qtyOf(w);
    const newQty = Math.max(0, prev - 1);
    if(newQty === 0){
      /* last bottle — show full review flow */
      w.qty = prev; /* keep qty for now; review sheet will set to 0 */
      showReviewSheet(w, true);
      return;
    }
    if(prev > 1){
      /* multi-bottle: offer tasting note for maturity tracking */
      w.qty = prev; /* keep qty; review sheet will decrement */
      showReviewSheet(w, false);
      return;
    }
    w.qty = newQty;
    saveWines(); render();
  };
  document.getElementById("qty-plus").onclick = ()=>{
    w.qty = (qtyOf(w))+1;
    saveWines(); render();
  };
  document.getElementById("del").onclick = ()=>{
    if(confirm("Remove this wine entirely?")){
      wines = wines.filter(x=>x.id!==w.id); saveWines(); history.back();
    }
  };
}

/* ================= Gemini AI ================= */
const GEMINI_MODELS = ["gemini-3.5-flash","gemini-2.5-flash","gemini-3.1-flash-lite-preview"];
async function callGemini(body, key, statusEl){
  for(let m = 0; m < GEMINI_MODELS.length; m++){
    const model = GEMINI_MODELS[m];
    for(let attempt = 0; attempt < 3; attempt++){
      const r = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,
        {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}
      );
      if(r.ok) return {r, model};
      if(r.status === 429 || r.status === 503){
        const wait = (attempt + 1) * 2;
        if(statusEl) statusEl.textContent = `Model ${model} busy — retry ${attempt+1}/3 in ${wait}s…`;
        await new Promise(ok => setTimeout(ok, wait * 1000));
        continue;
      }
      if(r.status === 404 && m < GEMINI_MODELS.length - 1) break;
      throw new Error("Gemini " + r.status + ": " + (await r.text()).slice(0,140));
    }
  }
  throw new Error("All models busy — try again in a minute.");
}

/* extract base64 from an <img> element via canvas */
function imgToBase64(imgEl){
  const c = document.createElement("canvas");
  c.width = imgEl.naturalWidth; c.height = imgEl.naturalHeight;
  c.getContext("2d").drawImage(imgEl, 0, 0);
  return c.toDataURL("image/jpeg", 0.82).split(",")[1];
}
