<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>La Cave — Cellar Book</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1518">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1518; --panel:#261c20; --panel2:#2e2227;
  --ink:#efe6d8; --ink-dim:#b8aa9a; --ink-faint:#8a7d70;
  --claret:#a03040; --claret-soft:#c05060;
  --gold:#c9a227; --rose:#c98a8a;
  --line:rgba(239,230,216,.14);
  --ok:#7da87b; --warn:#c9a227; --urgent:#c05060;
  --titi:#8a7dc9;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; min-height:100vh;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
.mono{font-family:"IBM Plex Mono",monospace}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.tbd{color:var(--ink-faint); font-style:italic}

/* ---------- header ---------- */
header{
  padding:18px 16px 12px; border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
}
header h1{
  font-family:"Cormorant Garamond",serif; font-weight:600; font-size:26px;
  letter-spacing:.01em;
}
header h1 em{font-style:italic; color:var(--claret-soft)}
.bottle-count{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-faint)}

/* ---------- tab bar ---------- */
nav{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:var(--panel); border-top:1px solid var(--line);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; background:none; border:none; color:var(--ink-faint);
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; padding:14px 4px 12px; cursor:pointer;
}
nav button.active{color:var(--ink)}
nav button.active span{border-bottom:2px solid var(--claret); padding-bottom:4px}
nav button:focus-visible{outline:2px solid var(--claret); outline-offset:-2px}

/* ---------- controls ---------- */
.toolbar{padding:12px 16px; display:flex; gap:8px; flex-wrap:wrap}
.toolbar input[type=search]{
  flex:1 1 100%; background:var(--panel); border:1px solid var(--line); border-radius:4px;
  color:var(--ink); padding:9px 12px; font-size:15px;
}
.toolbar select{
  flex:1; background:var(--panel); border:1px solid var(--line); border-radius:4px;
  color:var(--ink-dim); padding:9px 8px; font-size:13px; min-width:0;
}
.toolbar .toggle-btn{
  flex:none; background:var(--panel); border:1px solid var(--line); border-radius:4px;
  color:var(--ink-dim); padding:9px 12px; font-size:12.5px; font-family:"IBM Plex Mono",monospace;
  cursor:pointer;
}
.toolbar .toggle-btn.on{color:var(--titi); border-color:var(--titi)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--claret); outline-offset:1px;
}

/* ---------- wine cards ---------- */
.list{padding:0 16px}
.list-heading{
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-faint); padding:14px 0 8px;
}
.list-heading.overdue{color:var(--urgent)}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:6px;
  margin-bottom:12px; overflow:hidden; cursor:pointer;
}
.card-top{display:flex; gap:12px; padding:12px}
.thumb{
  width:64px; height:84px; flex:none; border-radius:3px; object-fit:cover;
  background:var(--panel2); border:1px solid var(--line);
}
.thumb.empty{
  display:flex; align-items:center; justify-content:center;
  font-family:"Cormorant Garamond",serif; font-size:28px; font-style:italic; color:var(--ink-faint);
}
.card-info{flex:1; min-width:0}
.wine-name{
  font-family:"Cormorant Garamond",serif; font-weight:600; font-size:19px; line-height:1.2;
}
.wine-sub{font-size:12.5px; color:var(--ink-dim); margin-top:2px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
.chip{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.04em;
  padding:2px 7px; border:1px solid var(--line); border-radius:3px; color:var(--ink-dim);
}
.chip.vintage{color:var(--ink); border-color:var(--ink-faint)}
.chip.red{color:var(--claret-soft)}
.chip.white{color:var(--gold)}
.chip.rose{color:var(--rose)}
.chip.sparkling{color:#a8c0c9}
.chip.bin{color:var(--ink)}
.chip.titi{color:var(--titi); border-color:var(--titi)}

/* ---------- maturity band (the signature) ---------- */
.band-wrap{padding:0 12px 11px}
.band-labels{
  display:flex; justify-content:space-between;
  font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-faint);
  margin-bottom:4px;
}
.band-status{text-transform:uppercase; letter-spacing:.08em}
.band-status.hold{color:var(--ink-faint)}
.band-status.window{color:var(--ok)}
.band-status.soon{color:var(--warn)}
.band-status.now{color:var(--urgent)}
.band{
  position:relative; height:6px; border-radius:3px; background:var(--panel2);
  overflow:visible;
}
.band-fill{
  position:absolute; top:0; bottom:0; border-radius:3px;
  background:linear-gradient(90deg, #5a6e59 0%, #7da87b 35%, #c9a227 75%, #c05060 100%);
  opacity:.85;
}
.band-now{
  position:absolute; top:-3px; width:2px; height:12px; background:var(--ink);
  border-radius:1px;
}

/* ---------- empty state ---------- */
.empty-state{
  text-align:center; padding:56px 32px; color:var(--ink-dim);
}
.empty-state .serif{font-size:22px; font-style:italic; margin-bottom:8px; color:var(--ink)}

/* ---------- forms ---------- */
.sheet{padding:16px}
.sheet h2{
  font-family:"Cormorant Garamond",serif; font-weight:600; font-size:24px; margin-bottom:16px;
}
.field{margin-bottom:14px}
.field label{
  display:block; font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); margin-bottom:5px;
}
.field input,.field select,.field textarea{
  width:100%; background:var(--panel); border:1px solid var(--line); border-radius:4px;
  color:var(--ink); padding:10px 12px; font-size:15px; font-family:inherit;
}
.field select+input{margin-top:6px}
@keyframes needs-attention{
  0%,100%{border-color:var(--gold); box-shadow:0 0 0 0 rgba(201,162,39,.0)}
  50%{border-color:var(--gold); box-shadow:0 0 8px 2px rgba(201,162,39,.25)}
}
.field input.needs-att,.field select.needs-att,.field textarea.needs-att{
  animation:needs-attention 2s ease-in-out 3;
  border-color:var(--gold);
}
.field .att-dot{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--gold); margin-left:6px; vertical-align:middle;
}
.field textarea{min-height:64px; resize:vertical}
.field.checkrow{display:flex; align-items:center; gap:8px}
.field.checkrow input{width:auto}
.field.checkrow label{margin:0; text-transform:none; font-size:14px; color:var(--ink)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
.bincode-row{display:flex; gap:8px; align-items:flex-end}
.bincode-row .field{flex:1; margin-bottom:0}
.bincode-row button{
  flex:none; background:var(--panel2); border:1px solid var(--ink-faint); border-radius:4px;
  color:var(--ink-dim); padding:10px 12px; font-size:12.5px; cursor:pointer;
}

.photo-zone{
  border:1px dashed var(--ink-faint); border-radius:6px; padding:18px;
  text-align:center; color:var(--ink-dim); cursor:pointer; margin-bottom:14px;
  background:var(--panel);
}
.photo-zone{cursor:default}
.photo-zone img{max-width:120px; max-height:160px; border-radius:4px; display:block; margin:0 auto 10px}
.photo-btn{
  display:block; position:relative; padding:11px; margin:8px auto 0; max-width:280px;
  background:var(--panel2); border:1px solid var(--ink-faint); border-radius:5px;
  color:var(--ink); font-size:14px; cursor:pointer; text-align:center; overflow:hidden;
}
.photo-btn.ghost{background:none; color:var(--ink-dim); border-color:var(--line)}
.photo-btn input{
  position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:0;
}

.btn{
  display:block; width:100%; padding:13px; border-radius:5px; border:none;
  font-size:15px; font-weight:600; cursor:pointer; margin-bottom:10px;
}
.btn-primary{background:var(--claret); color:#fff}
.btn-ghost{background:none; border:1px solid var(--line); color:var(--ink-dim)}
.btn-danger{background:none; border:1px solid var(--urgent); color:var(--urgent)}

/* ---------- detail view ---------- */
.detail-photo{width:100%; max-height:320px; object-fit:contain; background:var(--panel); border-radius:6px; margin-bottom:14px}
.detail-name{font-family:"Cormorant Garamond",serif; font-weight:700; font-size:28px; line-height:1.15}
.detail-sub{color:var(--ink-dim); margin:4px 0 14px}
.spec{
  display:grid; grid-template-columns:110px 1fr; gap:6px 14px;
  padding:14px 0; border-top:1px solid var(--line); font-size:14px;
}
.spec dt{font-family:"IBM Plex Mono",monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); padding-top:2px}
.spec dd{color:var(--ink)}

/* ---------- settings / sync ---------- */
.note{font-size:12.5px; color:var(--ink-faint); margin-top:5px; line-height:1.5}
.sync-status{
  font-family:"IBM Plex Mono",monospace; font-size:12px; padding:10px 12px;
  border:1px solid var(--line); border-radius:4px; color:var(--ink-dim);
  margin-bottom:14px; white-space:pre-wrap; word-break:break-word;
}
.section-rule{border:none; border-top:1px solid var(--line); margin:22px 0}

details.collapse{margin:18px 0}
details.collapse summary{
  font-family:"IBM Plex Mono",monospace; font-size:11px; text-transform:uppercase;
  letter-spacing:.08em; color:var(--ink-faint); cursor:pointer; padding:10px 0;
  list-style:none; display:flex; align-items:center; gap:6px;
}
details.collapse summary::-webkit-details-marker{display:none}
details.collapse summary::before{content:"▸"; font-size:10px; transition:transform .15s}
details.collapse[open] summary::before{transform:rotate(90deg)}
details.collapse .collapse-body{padding:12px 0 0}

.history-list{list-style:none; padding:0; margin:0}
.history-list li{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;
}
.history-list li:last-child{border-bottom:none}
.hist-type{
  font-family:"IBM Plex Mono",monospace; font-size:10px; text-transform:uppercase;
  letter-spacing:.06em; padding:2px 6px; border-radius:3px; flex:none;
}
.hist-type.pull{background:rgba(125,168,123,.15); color:var(--ok)}
.hist-type.push{background:rgba(192,80,96,.15); color:var(--urgent)}
.hist-detail{color:var(--ink-dim); flex:1; min-width:0}
.hist-time{color:var(--ink-faint); font-size:11px; font-family:"IBM Plex Mono",monospace; flex:none; text-align:right}

.changelog{list-style:none; padding:0; margin:0}
.changelog li{padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; line-height:1.5}
.changelog li:last-child{border-bottom:none}
.cl-ver{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--gold); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:3px}
.cl-title{color:var(--ink); font-weight:600}
.cl-desc{color:var(--ink-dim); font-size:12.5px}

/* ---------- detail back & qty controls ---------- */
.back-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.back-row button{background:none;border:none;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:13px;cursor:pointer;padding:4px 0}
.back-row button:hover{color:var(--ink)}
.qty-row{display:flex;align-items:center;gap:12px;margin:14px 0}
.qty-btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;color:var(--ink);width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-btn:active{background:var(--claret);border-color:var(--claret)}
.qty-display{font-family:"IBM Plex Mono",monospace;font-size:18px;min-width:32px;text-align:center}
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat-pill{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:12px;color:var(--ink-dim)}
.stat-pill .n{color:var(--ink);font-weight:500}
.tab-badge{font-size:9px;background:var(--claret);color:#fff;border-radius:8px;padding:1px 5px;margin-left:3px;vertical-align:top}
.toolbar select.sort{flex:1 1 100%;font-size:12px;color:var(--ink-faint)}
.cb-date-row{display:flex;gap:8px;align-items:center;margin-top:6px}
.cb-date-row input{width:70px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:13px}
.cb-date-row span{font-size:12px;color:var(--ink-faint)}
.qty-mini{display:inline-flex;align-items:center;gap:4px;margin-left:8px;vertical-align:middle}
.qty-mini button{background:var(--panel2);border:1px solid var(--line);border-radius:3px;color:var(--ink);width:28px;height:28px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.qty-mini button:active{background:var(--claret);border-color:var(--claret)}
.inline-price{display:flex;align-items:center;gap:8px}
.inline-price input{background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:6px 10px;font-size:14px;width:140px}
.inline-price button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;color:var(--ink-dim);padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.inline-price button:active{background:var(--claret);color:#fff}
.recheck-bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.recheck-bar button{flex:1;min-width:0}
.chip.fire{color:#e8a020;border-color:#e8a020;text-shadow:0 0 6px rgba(232,160,32,.4)}
.chip.cb{color:var(--ok);border-color:var(--ok)}
.chip.peak{color:var(--warn);border-color:var(--warn)}
.card.drank{opacity:.45}
.card.drank .thumb{filter:grayscale(.6)}
.view-toggle{display:flex;gap:0;margin:0 0 0 auto;flex:none}
.view-toggle button{background:var(--panel);border:1px solid var(--line);color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:7px 10px;cursor:pointer;letter-spacing:.04em}
.view-toggle button:first-child{border-radius:4px 0 0 4px}
.view-toggle button:last-child{border-radius:0 4px 4px 0}
.view-toggle button:not(:first-child){border-left:none}
.view-toggle button.on{color:var(--ink);background:var(--panel2);border-color:var(--ink-faint)}
.stat-section{margin:24px 0 8px}
.stat-section-label{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.bottles-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px 0 8px}
.bottle-item{text-align:center;flex:0 0 auto}
.bottle-label{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.bar-label{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);width:60px;text-align:right;flex:none}
.bar-track{flex:1;height:20px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;min-width:2px}
.bar-val{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-dim);width:28px;flex:none}
.vbar-wrap{overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch}
.random-card{background:var(--panel);border:1px solid var(--gold);border-radius:6px;padding:14px;margin:10px 0;cursor:pointer}
.random-card:active{border-color:var(--claret)}

@media (prefers-reduced-motion: no-preference){
  .card{transition:border-color .15s}
  .card:active{border-color:var(--claret)}
}
</style>
</head>
<body>

<header>
  <h1>La <em>Cave</em></h1>
  <span class="bottle-count" id="count"></span>
</header>

<main id="view"></main>

<nav>
  <button data-tab="cellar" class="active"><span>Cellar</span></button>
  <button data-tab="soon"><span>Drink Soon</span></button>
  <button data-tab="add"><span>+ Bottle</span></button>
  <button data-tab="stats"><span>Stats</span></button>
  <button data-tab="sync"><span>Sync</span></button>
</nav>

<script>
"use strict";

/* ================= state ================= */
const LS_WINES = "cave.wines.v1";
const LS_CFG   = "cave.config.v1";
const LS_HIST  = "cave.synchistory.v1";
let wines = JSON.parse(localStorage.getItem(LS_WINES) || "[]");
let cfg   = JSON.parse(localStorage.getItem(LS_CFG)   || "{}");
let tab = "cellar";
let editingId = null;
let detailId = null;
let cellarScrollY = 0;
let searchQ = "", typeFilter = "", shelfFilter = "", titiOnly = false, fireOnly = false, sortBy = "producer", cellarView = "cave";

const saveWines = () => localStorage.setItem(LS_WINES, JSON.stringify(wines));
let syncHistory = JSON.parse(localStorage.getItem(LS_HIST) || "[]");
function logSync(type, detail){
  syncHistory.unshift({type, detail, time: new Date().toLocaleString()});
  if(syncHistory.length > 30) syncHistory.length = 30;
  localStorage.setItem(LS_HIST, JSON.stringify(syncHistory));
}
const saveCfg   = () => localStorage.setItem(LS_CFG, JSON.stringify(cfg));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => (s??"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const YEAR = new Date().getFullYear();
const tbd = v => (v===undefined||v===null||v==="") ? `<span class="tbd">TBD</span>` : esc(v);

/* ================= shelf sections ================= */
const SHELF_SECTIONS = ["Keep","Soon","White","Sparkling"];
const SHELF_PREFIX = {Keep:"K", Soon:"S", White:"W", Sparkling:"B"};
function suggestBinCode(section){
  const prefix = SHELF_PREFIX[section] || "X";
  const used = wines
    .filter(w => (w.binCode||"").toUpperCase().startsWith(prefix))
    .map(w => parseInt((w.binCode||"").slice(1),10))
    .filter(n => !isNaN(n));
  const next = (used.length ? Math.max(...used) : 0) + 1;
  return prefix + String(next).padStart(2,"0");
}

/* ================= drink-window logic ================= */
function windowStatus(w){
  const from = parseInt(w.drinkFrom), to = parseInt(w.drinkTo);
  if(!from && !to) return {cls:"", label:""};
  if(from && YEAR < from) return {cls:"hold", label:"Hold · from " + from};
  if(to && YEAR > to)     return {cls:"now",  label:"Past window"};
  if(to && to - YEAR <= 1) return {cls:"now", label:"Drink now"};
  if(to && to - YEAR <= 3) return {cls:"soon",label:"Approaching peak"};
  return {cls:"window", label:"In window"};
}
function isOverdue(w){ const to = parseInt(w.drinkTo); return !!to && YEAR > to; }
function bandHTML(w){
  const from = parseInt(w.drinkFrom), to = parseInt(w.drinkTo);
  if(!from || !to || to <= from) return "";
  const span = to - from;
  const pos = Math.min(Math.max((YEAR - from) / span, 0), 1);
  const st = windowStatus(w);
  return `<div class="band-wrap">
    <div class="band-labels">
      <span>${from}</span>
      <span class="band-status ${st.cls}">${st.label}</span>
      <span>${to}</span>
    </div>
    <div class="band"><div class="band-fill" style="left:0;right:0"></div>
      <div class="band-now" style="left:calc(${(pos*100).toFixed(1)}% - 1px)"></div>
    </div>
  </div>`;
}

/* ================= display helpers ================= */
const SMONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtSource(s){
  if(!s) return s;
  const m = s.match(/^CB \((\d{2})\/(\d{2})\)$/);
  if(!m) return s;
  return "CB · " + SMONTHS[parseInt(m[1])-1] + " ’" + m[2];
}
function isFire(w){ return !!w.fire; }
function isPeak(w){ const st = windowStatus(w); return st.cls==="now" || st.cls==="soon"; }
function isCB(w){ return (w.source||"").startsWith("CB"); }
function isDrank(w){ return (parseInt(w.qty)||1) <= 0; }
function getOrigin(w){
  if(w.titi) return "Titi";
  const s = w.source||"";
  if(s.startsWith("CB")) return "CB";
  if(s.startsWith("SAQ")) return "SAQ";
  if(s.startsWith("LCBO")) return "LCBO";
  if(s.startsWith("Wine club")) return "Wine club";
  if(s.startsWith("Gift")) return "Gift";
  if(s.startsWith("Winery")) return "Winery";
  if(s) return s.split(/[( ]/)[0];
  return "Unknown";
}

/* ================= images ================= */
function resizeImage(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = () => {
      const MAX = 800;
      let {width:w, height:h} = img;
      if(w > MAX || h > MAX){ const r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
function imgSrc(w){
  if(w.imageData) return w.imageData;
  if(w.imagePath && cfg.owner && cfg.repo)
    return `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch||"main"}/${w.imagePath}`;
  return null;
}

  return `<div class="card${drank?" drank":""}" data-id="${w.id}">

/* ================= Gemini AI ================= */
const GEMINI_MODELS = ["gemini-3.5-flash","gemini-2.5-flash","gemini-3.1-flash-lite-preview"];
async function callGemini(body, key, statusEl){
  for(let m = 0; m < GEMINI_MODELS.length; m++){
    const model = GEMINI_MODELS[m];
    for(let attempt = 0; attempt < 3; attempt++){
      const r = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`,
        {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}
      );
      if(r.ok) return {r, model};
      if(r.status === 429 || r.status === 503){
        const wait = (attempt + 1) * 2;
        if(statusEl) statusEl.textContent = `Model ${model} busy — retry ${attempt+1}/3 in ${wait}s…`;
        await new Promise(ok => setTimeout(ok, wait * 1000));
        continue;
      }
      if(r.status === 404 && m < GEMINI_MODELS.length - 1) break;
      throw new Error("Gemini " + r.status + ": " + (await r.text()).slice(0,140));
    }
  }
  throw new Error("All models busy — try again in a minute.");
}

const AI_PROMPT = "You are a sommelier's assistant. Read this wine label photo and return ONLY a JSON object (no markdown fences, no prose) with these fields — all strings unless noted: producer, name (the cuvee or wine name, not the producer), vintage (4-digit year), type (one of: Red, White, Rose, Sparkling, Dessert), region (appellation and country), drinkFrom (4-digit year the wine enters its drinking window), drinkTo (4-digit year to drink by), pairings (comma-separated food pairings), price (estimated current market value in CANADIAN DOLLARS, formatted like '~$XX CAD (est.)' — research-grade estimate based on producer, region, vintage, and classification; for icon/collectible wines use secondary-market pricing), fire (boolean: true if this is an icon, prestigious, or collectible wine — e.g. classified Bordeaux, top Super Tuscans like Sassicaia, Grand Cru Burgundy, cult Napa, Penfolds Grange, etc.; false for everyday/mid-tier wines), notes (grape varieties plus a one-line style summary). Base drinkFrom, drinkTo, pairings and price on your knowledge of this producer, region and vintage; if the exact bottling is unknown, use typical ranges for the style and say so in notes. Use an empty string for anything unreadable.";

/* extract base64 from an <img> element via canvas */
function imgToBase64(imgEl){
  const c = document.createElement("canvas");
  c.width = imgEl.naturalWidth; c.height = imgEl.naturalHeight;
  c.getContext("2d").drawImage(imgEl, 0, 0);
  return c.toDataURL("image/jpeg", 0.82).split(",")[1];
}

/* ================= stats page ================= */
function renderStats(){
  const inCave = wines.filter(w=>!isDrank(w));
  const drankWines = wines.filter(isDrank);
  const totalW = inCave.length;
  const totalB = inCave.reduce((n,w)=>n+(parseInt(w.qty)||1),0);
  const drankCount = drankWines.length;

  /* estimated value — in cave only */
  let totalVal = 0, priced = 0;
  inCave.forEach(w=>{
    const m = (w.price||"").match(/\$(\d+(?:\.\d+)?)/);
    if(m){ totalVal += parseFloat(m[1]) * (parseInt(w.qty)||1); priced++; }
  });
  const valStr = totalVal ? `~$${Math.round(totalVal).toLocaleString()} CAD` : "—";

  /* drank value */
  let drankVal = 0;
  drankWines.forEach(w=>{
    const m = (w.price||"").match(/\$(\d+(?:\.\d+)?)/);
    if(m) drankVal += parseFloat(m[1]);
  });
  const drankValStr = drankVal ? `~$${Math.round(drankVal).toLocaleString()} CAD` : "";

  /* by type — in cave */
  const byType = {};
  inCave.forEach(w=>{ const t = w.type||"Unknown"; byType[t] = (byType[t]||0) + (parseInt(w.qty)||1); });
  const typeOrder = ["Red","White","Sparkling","Rosé","Dessert","Unknown"];
  const typeColors = {Red:"var(--claret-soft)",White:"var(--gold)",Sparkling:"#a8c0c9","Rosé":"var(--rose)",Dessert:"#c9a8e0",Unknown:"var(--ink-faint)"};
  const typeSorted = typeOrder.filter(t=>byType[t]).map(t=>({type:t,count:byType[t]}));
  const maxType = Math.max(...typeSorted.map(t=>t.count),1);

  /* bottle SVG */
  function bottleSVG(count, color, maxH){
    const h = Math.max(20, Math.round((count/maxH)*100));
    const bw = 36;
    const bodyH = h;
    const neckH = 18;
    const capH = 6;
    const tH = bodyH + neckH + capH + 4;
    return `<svg width="${bw}" height="${tH+16}" viewBox="0 0 ${bw} ${tH+16}">
      <rect x="13" y="0" width="10" height="${capH}" rx="2" fill="${color}" opacity=".7"/>
      <rect x="14" y="${capH}" width="8" height="${neckH}" rx="1" fill="${color}" opacity=".5"/>
      <path d="M14 ${capH+neckH} Q14 ${capH+neckH+6} 6 ${capH+neckH+10} L6 ${tH-6} Q6 ${tH} 10 ${tH} L${bw-10} ${tH} Q${bw-6} ${tH} ${bw-6} ${tH-6} L${bw-6} ${capH+neckH+10} Q${bw-14} ${capH+neckH+6} ${bw-14} ${capH+neckH} Z" fill="${color}"/>
    </svg>`;
  }

  const bottlesHTML = typeSorted.map(t =>
    `<div class="bottle-item">
      ${bottleSVG(t.count, typeColors[t.type]||"var(--ink-faint)", maxType)}
      <div class="bottle-label">${esc(t.type)}</div>
      <div class="bottle-label" style="color:var(--ink)">${t.count}</div>
    </div>`
  ).join("");

  /* vintage spread — in cave */
  const byVintage = {};
  inCave.forEach(w=>{ if(w.vintage){ const v = w.vintage; byVintage[v] = (byVintage[v]||0) + (parseInt(w.qty)||1); } });
  const vintages = Object.keys(byVintage).sort();
  const maxVint = Math.max(...Object.values(byVintage),1);
  const vintHTML = vintages.map(v=>{
    const pct = Math.round((byVintage[v]/maxVint)*100);
    return `<div class="bar-row">
      <span class="bar-label">${esc(v)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--claret-soft)"></div></div>
      <span class="bar-val">${byVintage[v]}</span>
    </div>`;
  }).join("");

  /* price distribution — in cave */
  const priceBuckets = {"$0–20":0,"$20–40":0,"$40–60":0,"$60–100":0,"$100+":0};
  const bucketColors = ["var(--ok)","var(--gold)","var(--claret-soft)","var(--rose)","var(--titi)"];
  inCave.forEach(w=>{
    const m = (w.price||"").match(/\$(\d+(?:\.\d+)?)/);
    if(m){
      const p = parseFloat(m[1]);
      const qty = parseInt(w.qty)||1;
      if(p<20) priceBuckets["$0–20"]+=qty;
      else if(p<40) priceBuckets["$20–40"]+=qty;
      else if(p<60) priceBuckets["$40–60"]+=qty;
      else if(p<100) priceBuckets["$60–100"]+=qty;
      else priceBuckets["$100+"]+=qty;
    }
  });
  const maxPrice = Math.max(...Object.values(priceBuckets),1);
  const priceHTML = Object.entries(priceBuckets).map(([label,cnt],i)=>{
    const pct = Math.round((cnt/maxPrice)*100);
    return `<div class="bar-row">
      <span class="bar-label">${esc(label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${bucketColors[i]}"></div></div>
      <span class="bar-val">${cnt}</span>
    </div>`;
  }).join("");

  /* origin breakdown — all wines */
  const byOrigin = {};
  wines.forEach(w=>{
    const o = getOrigin(w);
    byOrigin[o] = (byOrigin[o]||0) + Math.max(parseInt(w.qty)||1, 1);
  });
  const originSorted = Object.entries(byOrigin).sort((a,b)=>b[1]-a[1]);
  const maxOrigin = Math.max(...originSorted.map(s=>s[1]),1);
  const originColors = {CB:"var(--ok)",Titi:"var(--titi)",SAQ:"var(--claret-soft)",LCBO:"var(--gold)","Wine club":"var(--rose)"};
  const originHTML = originSorted.map(([label,cnt])=>{
    const pct = Math.round((cnt/maxOrigin)*100);
    const color = originColors[label]||"var(--ink-dim)";
    return `<div class="bar-row">
      <span class="bar-label" style="width:80px">${esc(label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <span class="bar-val">${cnt}</span>
    </div>`;
  }).join("");

  /* CB by month sub-breakdown */
  const cbByMonth = {};
  wines.forEach(w=>{
    if(!(w.source||"").startsWith("CB")) return;
    const cm = (w.source||"").match(/\((\d{2})\/(\d{2})\)/);
    const key = cm ? SMONTHS[parseInt(cm[1])-1] + " '" + cm[2] : "undated";
    cbByMonth[key] = (cbByMonth[key]||0) + Math.max(parseInt(w.qty)||1, 1);
  });
  const cbSorted = Object.entries(cbByMonth).sort((a,b)=>b[0].localeCompare(a[0]));
  const maxCb = Math.max(...cbSorted.map(s=>s[1]),1);
  const cbHTML = cbSorted.length ? cbSorted.map(([label,cnt])=>{
    const pct = Math.round((cnt/maxCb)*100);
    return `<div class="bar-row">
      <span class="bar-label" style="width:80px">${esc(label)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--ok)"></div></div>
      <span class="bar-val">${cnt}</span>
    </div>`;
  }).join("") : "";

  /* fire wines — prestige */
  const fireWines = inCave.filter(isFire);
  const fireCount = fireWines.reduce((n,w)=>n+(parseInt(w.qty)||1),0);

  /* peak wines — approaching/past window */
  const peakWines = inCave.filter(isPeak);
  const peakCount = peakWines.reduce((n,w)=>n+(parseInt(w.qty)||1),0);

  /* random picker — only from in-cave wines */
  const drinkable = inCave.filter(w=>{
    const st = windowStatus(w);
    return st.cls==="window" || st.cls==="now" || st.cls==="soon" || st.cls==="" ;
  });

  view.innerHTML = `<div class="sheet">
    <h2 class="serif">Cellar Stats</h2>

    <div class="stats-row" style="justify-content:center;gap:12px">
      <span class="stat-pill"><span class="n">${totalW}</span> wines</span>
      <span class="stat-pill"><span class="n">${totalB}</span> bottles</span>
      <span class="stat-pill" style="border-color:var(--gold)"><span class="n" style="color:var(--gold)">${valStr}</span></span>
    </div>
    <div class="stats-row" style="justify-content:center;gap:12px;margin-top:4px">
      ${fireCount?`<span class="stat-pill" style="border-color:#e8a020"><span class="n" style="color:#e8a020">🔥 ${fireCount}</span> fire</span>`:""}
      ${peakCount?`<span class="stat-pill" style="border-color:var(--warn)"><span class="n" style="color:var(--warn)">⛰️ ${peakCount}</span> peak</span>`:""}
      <span class="stat-pill"><span class="n">${priced}</span> priced</span>
    </div>
    ${drankCount ? `<div class="stats-row" style="justify-content:center;gap:12px;margin-top:4px">
      <span class="stat-pill"><span class="n">${drankCount}</span> drank</span>
      ${drankValStr?`<span class="stat-pill"><span class="n">${drankValStr}</span> consumed</span>`:""}
    </div>` : ""}

    <div class="stat-section-label">🎲 What should I drink tonight?</div>
    <div id="random-area">
      <button class="btn btn-ghost" id="random-btn" style="border-color:var(--gold);color:var(--gold)">🎲 Pick a random bottle</button>
    </div>

    <div class="stat-section-label">Bottles by type</div>
    <div class="bottles-row">${bottlesHTML}</div>

    <div class="stat-section-label">Origins</div>
    ${originHTML}

    ${cbHTML ? `<div class="stat-section-label">CB by shipment</div>${cbHTML}` : ""}

    <div class="stat-section-label">Price range (CAD)</div>
    ${priceHTML}

    <div class="stat-section-label">Vintage spread</div>
    <div class="vbar-wrap">${vintHTML}</div>
  </div>`;

  /* random picker handler */
  const bindRandom = () => {
    const btn = document.getElementById("random-btn");
    if(!btn) return;
    btn.onclick = ()=>{
      if(!drinkable.length){ document.getElementById("random-area").innerHTML = `<div class="note">No bottles to pick from!</div>`; return; }
      const pick = drinkable[Math.floor(Math.random()*drinkable.length)];
      const src = imgSrc(pick);
      const st = windowStatus(pick);
      document.getElementById("random-area").innerHTML = `
        <div class="random-card" id="random-card">
          <div style="display:flex;gap:12px;align-items:center">
            ${src?`<img src="${esc(src)}" style="width:48px;height:64px;object-fit:cover;border-radius:3px" alt="">`:`<div class="thumb empty" style="width:48px;height:64px;font-size:22px">?</div>`}
            <div>
              <div class="wine-name serif" style="font-size:18px">${pick.fire?"🔥 ":""}${esc(pick.producer||"")} ${esc(pick.name||"")}</div>
              <div class="wine-sub">${esc([pick.vintage,pick.type,pick.region].filter(Boolean).join(" · "))}</div>
              ${st.label?`<div style="margin-top:4px"><span class="chip ${st.cls}" style="font-size:10px">${esc(st.label)}</span></div>`:""}
            </div>
          </div>
        </div>
        <button class="btn btn-ghost" id="random-btn" style="border-color:var(--gold);color:var(--gold)">🎲 Pick another</button>`;
      document.getElementById("random-card").onclick = ()=>{
        cellarScrollY = 0; detailId = pick.id; tab="detail";
        history.pushState({tab:"detail", id:detailId}, "");
        render(); window.scrollTo(0,0);
      };
      bindRandom();
    };
  };
  bindRandom();
}

const GH = "https://api.github.com";
function ghHeaders(){ return {"Authorization":"Bearer "+cfg.token, "Accept":"application/vnd.github+json"}; }
async function ghGetSha(path){
  const r = await fetch(`${GH}/repos/${cfg.owner}/${cfg.repo}/contents/${path}?ref=${cfg.branch||"main"}`, {headers:ghHeaders()});
  if(r.status===404) return null;
  if(!r.ok) throw new Error(`GET ${path}: ${r.status}`);
  return (await r.json()).sha;
}
async function ghPut(path, base64Content, message){
  const sha = await ghGetSha(path);
  const body = {message, content:base64Content, branch:cfg.branch||"main"};
  if(sha) body.sha = sha;
  const r = await fetch(`${GH}/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, {
    method:"PUT", headers:{...ghHeaders(),"Content-Type":"application/json"}, body:JSON.stringify(body)
  });
  if(!r.ok) throw new Error(`PUT ${path}: ${r.status} ${(await r.text()).slice(0,120)}`);
}
function b64EncodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
async function pushAll(statusEl){
  if(!cfg.owner||!cfg.repo||!cfg.token) throw new Error("Fill in owner, repo, and token first.");
  const dirty = wines.filter(w=>w.imageData && w.imageDirty!==false);
  let i=0;
  for(const w of dirty){
    i++;
    statusEl.textContent = `Uploading photo ${i}/${dirty.length}…`;
    const path = `images/${w.id}.jpg`;
    const b64 = w.imageData.split(",")[1];
    await ghPut(path, b64, `Add label photo ${w.producer||""} ${w.vintage||""}`.trim());
    w.imagePath = path; w.imageDirty = false;
  }
  statusEl.textContent = "Writing wines.json…";
  const clean = wines.map(({imageData, imageDirty, ...rest})=>rest);
  await ghPut("data/wines.json", b64EncodeUnicode(JSON.stringify(clean,null,2)), `Update cellar (${clean.length} wines)`);
  wines.forEach(w=>{ if(w.imagePath){ delete w.imageData; delete w.imageDirty; } });
  saveWines();
  cfg.lastSync = new Date().toLocaleString(); saveCfg();
  logSync("push", `${clean.length} wines, ${dirty.length} photo${dirty.length!==1?"s":""}`);
  statusEl.textContent = `✓ Synced ${clean.length} wines at ${cfg.lastSync}`;
}
async function pullAll(statusEl){
  if(!cfg.owner||!cfg.repo) throw new Error("Fill in owner and repo first.");
  statusEl.textContent = "Fetching wines.json…";
  const url = `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch||"main"}/data/wines.json?t=${Date.now()}`;
  const r = await fetch(url);
  if(!r.ok) throw new Error("Could not read data/wines.json ("+r.status+"). Has the cellar been pushed yet?");
  const remote = await r.json();
  if(!Array.isArray(remote)) throw new Error("wines.json is not a list.");
  if(wines.length && !confirm(`Replace the ${wines.length} local wines with ${remote.length} from GitHub?`)){
    statusEl.textContent = "Pull cancelled."; return;
  }
  wines = remote; saveWines();
  cfg.lastSync = new Date().toLocaleString(); saveCfg();
  logSync("pull", `${wines.length} wines loaded`);
  statusEl.textContent = `✓ Loaded ${wines.length} wines from GitHub.`;
  render();
}

function renderSync(){
  const notSet = `<span class="tbd">not set</span>`;
  const histHTML = syncHistory.length
    ? `<ul class="history-list">${syncHistory.map(h =>
        `<li><span class="hist-type ${esc(h.type)}">${esc(h.type)}</span><span class="hist-detail">${esc(h.detail)}</span><span class="hist-time">${esc(h.time)}</span></li>`
      ).join("")}</ul>`
    : `<div class="note">No sync activity yet.</div>`;

  view.innerHTML = `<div class="sheet">
    <h2>Sync with GitHub</h2>
    <button class="btn btn-primary" id="pull">Pull cellar from GitHub</button>
    <div class="note">Pull replaces this device's list with the repo copy — use it when opening the site on a new device or to get the latest data.</div>
    <div class="sync-status" id="st">${cfg.lastSync? "Last sync: "+esc(cfg.lastSync) : "Not synced yet. Wines are saved on this device either way."}</div>
    <hr class="section-rule">
    <button class="btn btn-ghost" id="push">Push cellar to GitHub</button>
    <div class="note">Push uploads new label photos and writes <span class="mono">data/wines.json</span> — overwrites the repo with what's on this device.</div>

    <hr class="section-rule">
    <button class="btn btn-ghost" id="recheck-all" style="border-color:var(--gold);color:var(--gold)">✨ Re-check all prices (AI)</button>
    <div class="note">Uses Gemini to estimate prices in CAD for all wines. Processes ~1 wine/sec. You can stop anytime.</div>
    <div class="sync-status" id="recheck-all-st" style="display:none"></div>

    <details class="collapse"${syncHistory.length?" open":""}>
      <summary>Sync history</summary>
      <div class="collapse-body">${histHTML}</div>
    </details>

    <details class="collapse">
      <summary>Cellar stats</summary>
      <div class="collapse-body" id="stats-body"></div>
    </details>

    <details class="collapse">
      <summary>What's new</summary>
      <div class="collapse-body">
        <ul class="changelog">
          <li><span class="cl-ver">Aug 6, 2026</span>
            <span class="cl-title">🔥 Fire prestige, ⛰️ Peak window, drank history</span><br>
            <span class="cl-desc">🔥 Fire = icon/collectible wines (Sassicaia, Cheval Blanc…) — manual toggle + AI auto-detect. ⛰️ Peak chip for wines approaching or past their drink window. Drank history: bottles at qty 0 stay in your records with a date stamp; toggle In cave / Drank / All in the cellar. Stats page shows origins (CB, Titi, SAQ…), CB shipments by month, consumed value, and fire/peak counts.</span></li>
          <li><span class="cl-ver">Aug 6, 2026</span>
            <span class="cl-title">Stats page &amp; CB badge</span><br>
            <span class="cl-desc">New Stats tab with bottle-shaped type charts, vintage spread, price distribution, and 🎲 random bottle picker. CB badge on cards. CB source input cleaned up (no more duplicate dates).</span></li>
          <li><span class="cl-ver">Aug 6, 2026</span>
            <span class="cl-title">CB shorthand, price re-check &amp; qty controls</span><br>
            <span class="cl-desc">Charlie's Burgers → CB with separate mm/yy date field. Re-check price from detail view (uses label photo when available) or bulk re-check all prices on sync page. Inline price editing on detail view. +/− qty buttons on add/edit form. All prices now in CAD.</span></li>
          <li><span class="cl-ver">Aug 6, 2026</span>
            <span class="cl-title">Sort, search &amp; detail-view refinements</span><br>
            <span class="cl-desc">Cellar sort by producer, vintage, recently added, or drink window. Search now includes notes. Detail view has a back button at top, and +/− buttons for quantity. Drink-soon badge shows count. Cellar stats section added.</span></li>
          <li><span class="cl-ver">Aug 5, 2026</span>
            <span class="cl-title">Sync history &amp; collapsible settings</span><br>
            <span class="cl-desc">Push/pull activity is now logged with timestamps. API keys and settings tucked behind a collapsible section to prevent accidental edits.</span></li>
          <li><span class="cl-ver">Aug 5, 2026</span>
            <span class="cl-title">Empty field highlighting</span><br>
            <span class="cl-desc">After AI label identification, fields the model couldn't read get a gold pulse and dot so you know what to fill in manually.</span></li>
          <li><span class="cl-ver">Aug 5, 2026</span>
            <span class="cl-title">Gemini model retry &amp; fallback</span><br>
            <span class="cl-desc">Label scanning now retries on busy errors and falls back through gemini-3.5-flash → 2.5-flash → 3.1-flash-lite. Same free API key.</span></li>
          <li><span class="cl-ver">Aug 5, 2026</span>
            <span class="cl-title">Charlie's Burgers &amp; source quick-pick</span><br>
            <span class="cl-desc">New dropdown on the add/edit form with common sources: Charlie's Burgers (auto-stamps month/year), Wine club, SAQ, LCBO, Gift, Winery.</span></li>
          <li><span class="cl-ver">Aug 5, 2026</span>
            <span class="cl-title">Browser back button &amp; scroll restore</span><br>
            <span class="cl-desc">Tapping a wine pushes browser history — phone back button returns to the cellar. Scroll position is restored so you land where you left off.</span></li>
          <li><span class="cl-ver">Aug 5, 2026</span>
            <span class="cl-title">Sync page reordered</span><br>
            <span class="cl-desc">Pull button at the top, Push further down to prevent accidental overwrites.</span></li>
          <li><span class="cl-ver">Aug 5, 2026</span>
            <span class="cl-title">Price estimates for all wines</span><br>
            <span class="cl-desc">Estimated market prices added to all 39 wines that were missing them, from web research. Label scanning now returns a price estimate too.</span></li>
        </ul>
      </div>
    </details>

    <details class="collapse">
      <summary>Settings &amp; API keys</summary>
      <div class="collapse-body">
        <div class="field"><label>GitHub username (owner)</label><input id="c-owner" value="${esc(cfg.owner)}" placeholder="e.g. ronacul" autocapitalize="off">
          <div class="note">Currently: ${cfg.owner?esc(cfg.owner):notSet}</div></div>
        <div class="field"><label>Repository name</label><input id="c-repo" value="${esc(cfg.repo)}" placeholder="e.g. wine-cellar" autocapitalize="off">
          <div class="note">Currently: ${cfg.repo?esc(cfg.repo):notSet}</div></div>
        <div class="field"><label>Branch</label><input id="c-branch" value="${esc(cfg.branch||"main")}" placeholder="e.g. main" autocapitalize="off">
          <div class="note">Currently: ${esc(cfg.branch||"main")}</div></div>
        <div class="field"><label>Personal access token</label><input id="c-token" type="password" value="${esc(cfg.token)}" autocapitalize="off">
          <div class="note">Fine-grained token with <b>Contents: read &amp; write</b> on this one repo. Stored only in this browser. Currently: ${cfg.token?"a token is saved":notSet}</div>
        </div>
        <div class="field"><label>Gemini API key (label scanning)</label><input id="c-gkey" type="password" value="${esc(cfg.gkey)}" autocapitalize="off">
          <div class="note">Free key from <b>aistudio.google.com</b>. Enables the &#x2728; Identify button on the add-bottle form. Currently: ${cfg.gkey?"a key is saved":notSet}</div>
        </div>
        <button class="btn btn-ghost" id="savecfg">Save settings</button>
      </div>
    </details>
  </div>`;
  const st = document.getElementById("st");
  document.getElementById("savecfg").onclick = ()=>{
    cfg.owner=document.getElementById("c-owner").value.trim();
    cfg.repo=document.getElementById("c-repo").value.trim();
    cfg.branch=document.getElementById("c-branch").value.trim()||"main";
    cfg.token=document.getElementById("c-token").value.trim();
    cfg.gkey=document.getElementById("c-gkey").value.trim();
    saveCfg(); st.textContent="Settings saved."; renderSync();
  };
  document.getElementById("push").onclick = async ()=>{
    document.getElementById("savecfg").click();
    try{ await pushAll(document.getElementById("st")); } catch(e){ document.getElementById("st").textContent = "X " + e.message; }
  };
  document.getElementById("pull").onclick = async ()=>{
    document.getElementById("savecfg").click();
    try{ await pullAll(document.getElementById("st")); } catch(e){ document.getElementById("st").textContent = "X " + e.message; }
  };
  /* bulk price re-check */
  let recheckAbort = false;
  document.getElementById("recheck-all").onclick = async ()=>{
    const rst = document.getElementById("recheck-all-st");
    rst.style.display = "block";
    if(!cfg.gkey){ rst.textContent = "Add a Gemini API key in Settings below first."; return; }
    recheckAbort = false;
    const btn = document.getElementById("recheck-all");
    btn.textContent = "⏹ Stop"; btn.onclick = ()=>{ recheckAbort = true; };
    let updated = 0;
    for(let i = 0; i < wines.length; i++){
      if(recheckAbort){ rst.textContent = `Stopped. Updated ${updated}/${i} wines checked.`; break; }
      const w = wines[i];
      const desc = [w.producer, w.name, w.vintage, w.type, w.region].filter(Boolean).join(", ");
      if(!desc) continue;
      rst.textContent = `Checking ${i+1}/${wines.length}: ${w.producer||""} ${w.name||""}…`;
      try{
        const prompt = `You are a wine pricing expert. Estimate the current retail market value in CANADIAN DOLLARS for: ${desc}. Return ONLY a JSON object: {"price":"~$XX CAD (est.)"}. Be research-grade accurate.`;
        const body = {contents:[{parts:[{text:prompt}]}]};
        const {r} = await callGemini(body, cfg.gkey, rst);
        const j = await r.json();
        const text = ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
        const rec = JSON.parse(text.replace(/```json|```/g,"").trim());
        if(rec.price && rec.price !== w.price){ w.price = rec.price; updated++; }
      }catch(e){ rst.textContent += " ✗ " + e.message; await new Promise(ok=>setTimeout(ok,2000)); }
    }
    if(!recheckAbort) rst.textContent = `✓ Done. Updated ${updated} of ${wines.length} prices.`;
    saveWines(); render();
    btn.textContent = "✨ Re-check all prices (AI)";
    btn.onclick = null; renderSync();
  };

  /* populate stats */
  const statsBody = document.getElementById("stats-body");
  if(statsBody){
    const _ic = wines.filter(w=>!isDrank(w));
    const _totalW = _ic.length;
    const _totalB = _ic.reduce((n,w)=>n+(parseInt(w.qty)||1),0);
    const _drk = wines.filter(isDrank).length;
    const byType = {}; _ic.forEach(w=>{ const t=w.type||"Unknown"; byType[t]=(byType[t]||0)+1; });
    const titiCount = _ic.filter(w=>w.titi).length;
    const fireCount = _ic.filter(isFire).length;
    const peakCount = _ic.filter(isPeak).length;
    statsBody.innerHTML = `
      <div class="stats-row">
        <span class="stat-pill"><span class="n">${_totalW}</span> wines</span>
        <span class="stat-pill"><span class="n">${_totalB}</span> bottles</span>
        ${titiCount?`<span class="stat-pill" style="border-color:var(--titi)"><span class="n" style="color:var(--titi)">${titiCount}</span> Titi</span>`:""}
        ${fireCount?`<span class="stat-pill" style="border-color:#e8a020"><span class="n" style="color:#e8a020">${fireCount}</span> 🔥</span>`:""}
      </div>
      <div class="stats-row">
        ${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`<span class="stat-pill"><span class="n">${c}</span> ${esc(t)}</span>`).join("")}
      </div>
      ${peakCount||_drk ? `<div class="stats-row">
        ${peakCount?`<span class="stat-pill" style="border-color:var(--warn)"><span class="n" style="color:var(--warn)">${peakCount}</span> ⛰️ peak</span>`:""}
        ${_drk?`<span class="stat-pill"><span class="n">${_drk}</span> drank</span>`:""}
      </div>` : ""}`;
  }
}

const SEED = [{
  id:"sample-santalba-2019",
  added:"2026-07-12",
  producer:"Santalba",
  name:"Reserva",
  vintage:"2019",
  type:"Red",
  qty:1,
  region:"Rioja Alta (DOCa Rioja), Spain",
  drinkFrom:"2026",
  drinkTo:"2034",
  shelfSection:"Keep",
  binCode:"K01",
  titi:false,
  pairings:"Roast meats, grilled lamb, duck \u00e0 l'orange, pork, wild mushrooms, casseroles, Iberian ham, mature cheeses",
  source:"Wine club (monthly)",
  price:"$37.95 + HST",
  location:"",
  notes:"100% Tempranillo, hand-harvested (Gimileo & Haro). 18 months in medium-toast American oak, bottled unfiltered. Drinking now; will evolve gracefully for 8-12 years."
}];
if(!localStorage.getItem(LS_WINES)) { wines = SEED; saveWines(); }

function setTab(t, restoreScroll){
  tab = t;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===t));
  render();
  if(restoreScroll !== undefined) window.scrollTo(0, restoreScroll);
  else window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click", ()=>{
  editingId = null; setTab(b.dataset.tab);
}));

/* browser back/forward button support */
window.addEventListener("popstate", (e)=>{
  if(e.state && e.state.tab==="detail"){
    detailId = e.state.id; tab="detail"; render(); window.scrollTo(0,0);
  } else {
    tab="cellar"; setTab("cellar", cellarScrollY);
  }
});

(async ()=>{
  render();
  if(!wines.length && cfg.owner && cfg.repo){
    try{
      const r = await fetch(`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch||"main"}/data/wines.json?t=${Date.now()}`);
      if(r.ok){ wines = await r.json(); saveWines(); render(); }
    }catch(e){}
  }
})();
</script>
</body>
</html>
